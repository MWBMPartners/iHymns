; iHymns — PHP per-directory overrides (#1906)
; ---------------------------------------------------------------------------
; Suppress the X-Powered-By PHP version fingerprint at the SOURCE. mod_headers
; (`Header always unset X-Powered-By` in .htaccess) only strips it after PHP has
; already set it; expose_php=Off stops PHP emitting it at all.
;
; .user.ini is honoured by the CGI / FastCGI / FPM SAPIs (the shared-host norm);
; on mod_php it is silently ignored (the .htaccess unset still covers that case).
; Changes are picked up after user_ini.cache_ttl (default 300s).
expose_php = Off
