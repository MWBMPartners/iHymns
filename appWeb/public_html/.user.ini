; iHymns — PHP per-directory overrides (#1906)
; ---------------------------------------------------------------------------
; Suppress the X-Powered-By PHP version fingerprint at the SOURCE. This is the
; LEAK defence: expose_php=Off stops PHP emitting "PHP/8.x" at all, so the only
; X-Powered-By a client ever sees is the branded "iHymns/<version>" that
; index.php / api.php set explicitly (ihymns_emit_powered_by_header()). We
; advertise our own identity, not the runtime we're built on.
;
; .user.ini is honoured by the CGI / FastCGI / FPM SAPIs (the shared-host norm);
; on mod_php it is silently ignored — for that case the .htaccess mod_headers
; `edit X-Powered-By "^PHP/.*$" "iHymns"` rewrites a leaked runtime version to
; the bare brand (and, matching on value, leaves our "iHymns/<version>" alone).
; Changes are picked up after user_ini.cache_ttl (default 300s).
expose_php = Off
