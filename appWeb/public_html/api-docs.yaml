        Renaming cascades to every `tblSongs`/`tblWorks` row citing this
        tune via `TuneId` (their free-text `TuneName` mirror updates in
        the same statement) — there is no separate rename action, unlike
        `admin_musician_rename`; the FK makes the cascade precise.
        Omitting `aliases`/`credits` from the body leaves the existing
        list unchanged; posting an empty array clears it.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_tune_update] }
