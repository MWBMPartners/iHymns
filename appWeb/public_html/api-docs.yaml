openapi: 3.0.3

info:
  title: iHymns API
  version: "1.0.0"
  description: |
    The iHymns API provides programmatic access to the iHymns hymn and song
    database. It powers the iHymns Progressive Web App (PWA), enabling song
    search, songbook browsing, setlist management, user authentication,
    favorites sync, offline PWA caching, and administrative operations.

    Most endpoints are served from a single PHP entry point (`api.php`) and are
    routed via the `action` query parameter. Responses are JSON unless otherwise
    noted.

    **Response versioning — the v2 envelope (#1201/#1761).** By default every
    endpoint returns the bare payload documented on it (v1). A client that sends
    the request header `X-API-Version: 2` (or `?v=2` for curl / this page's
    "Try it out") instead receives a UNIFORM envelope: success →
    `{ "ok": true, "data": <the documented payload> }` (`ApiEnvelope`), and any
    error → `{ "ok": false, "error": { "code", "message", … } }` (`ApiError`)
    with a meaningful HTTP status. Clients branch on the HTTP status and the
    stable `error.code`, never the human message. v2 is **opt-in** so
    already-deployed and offline-cached clients keep getting v1 byte-for-byte —
    it is a versioned migration, not a flag day. The web PWA (`apiFetchJson`)
    and the Apple client transport send the header and transparently unwrap
    `data`, so the payloads documented per-endpoint below are what a caller sees
    under either version. (The handful of non-JSON responses — streaming/CSV
    exports, the `health` probe — are outside the envelope by nature.)

    Three further surfaces share the action-query pattern:

    - The legacy admin **Editor API** (`/manage/editor/api.php`) — gated by the
      `/manage/` PHP session. `/manage/editor/` no longer routes here by
      default (see the v2 entry below); this API is still live and NOT
      retired, reachable directly or via the v2 shell's `?legacy=1` escape
      hatch, while the #1601 v1→v2 migration completes. 14 of its ~37 actions
      have individual path items below (the **Editor API** tag); the
      remaining ~23 (`load_index`/`load_song`/`load_songs`,
      `bulk_import_*` ×8, `song_media_*` ×5, the v1 song-link family, and
      `easyworship_export`) are internal-only and deliberately NOT written up
      as individual paths — see the note at the top of the **Editor API**
      section below.
    - The granular **Editor API v2** (`/manage/editor/api2.php`, #1200) — a
      purpose-built, per-edit atomic editor backend that replaces the
      whole-song `save_song` race (#1178), and, as of **#1601 scope item 2**,
      the backend behind the DEFAULT song editor: `/manage/editor/index.php`
      is now a 302 redirect to the v2 shell, forwarding the query string
      verbatim so every existing deep link (`?song=`/`?open=`, `?tab=`,
      `?songbook=`/`#number=`) keeps working. Two escape hatches revert to
      v1: `?legacy=1` per-visit, or `tblAppSettings.editor_v2_default='0'`
      fleet-wide (no migration needed — an absent key means v2). v1 itself is
      deliberately **not retired** — both editor APIs run side by side until
      v2 has been exercised on alpha. Requires `isAuthenticated()` AND
      the `editor` role (`401`/`403` otherwise); every POST additionally
      requires the `X-Requested-With: XMLHttpRequest` same-origin header
      (NOT a session-token field — chosen to survive the cross-subdomain
      adopted-token admin session, #1307; **#1677**, P0, fixed the v2 CLIENT
      to actually send it — every v2 write returned `403` until then, since
      only the GET helper sent the header). `action` travels via query string
      on GET reads or JSON body on POST writes; two endpoints
      (`media_upload`, `import_file`/`import_zip`) are `multipart/form-data`.
      Every response is `{ok: bool, …}`; an unknown `action` is `400`; an
      uncaught error is `500 {ok:false,error,error_detail}` (`error_detail`
      admin-only). Actions added to close v1/v2 parity gaps ahead of the
      cutover: `arrangement_update` (writes `tblSongs.ArrangementJson`,
      validated by the shared `includes/arrangement.php` rule, #1627),
      `bulk_tag_detach` (the remove half of bulk tagging, v1's `bulk_tag`
      already took `add`/`remove`, #1628), `easyworship_export` (#1678),
      `user_search` / `org_search` (ported verbatim from v1 for the Content
      Restrictions picker, which was never actually an editor feature,
      #1629), and the cross-book **counterpart** family ported from v1
      (**#1608**): `song_links` (GET — list a song's linked counterparts),
      `song_link_add` / `song_link_remove` (POST — manual link/unlink;
      `edit_songs`), and `song_link_suggestions` / `song_link_suggestion_dismiss`
      (GET/POST — the fuzzy scored suggestions from `tblSongLinkSuggestions`,
      scored by the shared `includes/song_similarity.php`; dismissals write
      `tblSongLinkSuggestionsDismissed`). Two further contract changes made in
      the same wave: **`credit_upsert`** (#960) now accepts a structured credit
      shape `{name, first?, surname?, suffix?}` in addition to the legacy
      `{name}`, and its response echoes the AUTHORITATIVE registry parts
      (`{ok, creditId, name, first, surname, suffix, registryPersonId}`) — NOT
      the caller's input, because the `tblMusicians` backfill never
      overwrites an existing non-empty part, so echoing the input would mask a
      refused write; and **`import_file`** (#882) now content-sniffs a single
      `.xml` between OpenLyrics and OpenSong via the shared
      `_bulkImport_processXmlAuto()` router (formats `opensong` and the
      auto-routing `xmlauto`, plus `chordpro`), and — a corrected status
      contract — returns **`400`** (not the former unconditional `200`) when a
      submitted file fails to parse. **Not yet broken out into individual paths
      below** (#1472 — the `Editor API v2` tag was removed from the tag list as
      declared-but-unused; this paragraph is its only documentation until
      the per-action paths are added; the full per-action breakout is #1201).
    - **Service Mode** (congregation Live-Follow, #1323/#1335) — the
      `service_*` action family on `api.php`. See the **Service Mode** tag.

    One non-action route exists: the gated media stream `GET /song-media/<id>`
    (#853, `<id>` = `tblSongMedia.Id`). As of **#1860** `<id>` also accepts
    the media row's permanent internal id (`ILD` + up to 10 digits, no
    separator) — resolved to the numeric `Id` before either gate below runs,
    gated on `tblSongMedia.IlId` existing; a non-IL / un-migrated `<id>` falls
    through to the plain `(int)` cast unchanged. Access is evaluated via **two gates**,
    both `403` on denial: (1) the entity gate, `checkContentAccess('song',
    <parent SongId>, …)` — an anonymous request degrades gracefully (gating
    applies as anonymous, never a hard `401`); and (2) as of **#1388**, a
    tier-capability gate, `contentGatingMediaAllowed($kind, $userId,
    $presenceToken)`, which stops a caller whose tier lacks the matching cap
    (`play_audio` / `download_midi` / `download_pdf`) from fetching the bytes
    directly even if the link were never shown to them. The tier gate's `403`
    body is deliberately generic ("Access restricted: gated content.") so it
    never discloses which tier would be sufficient. Both gates are **no-ops**
    while `content_gating_enabled='0'` (the default on every live env today),
    so this route is byte-identical to its pre-#1388 behaviour until an
    operator flips the flag. Supports HTTP `Range` / `206 Partial Content` for
    seekable audio. Kinds: `audio` (streamed inline), `sheet-music` (PDF),
    `midi`, `musicxml` (the last three served as downloads). **Not yet a
    documented path below** (#1472 — the `Media` tag was removed from the tag
    list as declared-but-unused; this paragraph is its only documentation
    until a path is added).

    ## Authentication

    Endpoints that require authentication accept either a Bearer token or the
    cross-subdomain session cookie:

    ```
    Authorization: Bearer <64-character hex token>
    ```

    or

    ```
    Cookie: ihymns_auth=<64-character hex token>
    ```

    The cookie is `Domain=.ihymns.app; HttpOnly; SameSite=Lax; Secure` so a
    single sign-in persists across `ihymns.app`, `dev.ihymns.app`, and
    `beta.ihymns.app`. Tokens are issued by `auth_login`,
    `auth_email_login_verify`, or `auth_register`, and carry a **sliding
    30-day expiry** — every authenticated request bumps the expiry by one
    day (at most once per 24h per token).

    Magic-link email sign-in (`auth_email_login_request` →
    `auth_email_login_verify`) is the primary path surfaced in the UI;
    username/password (`auth_login`) is the fallback.

    ## Entitlements

    Admin and editor endpoints are gated by **capabilities**, not just roles.
    The default mapping lives in `includes/entitlements.php` and can be
    overridden at runtime via `/manage/entitlements`. The `role` field on a
    user is still returned for compatibility, but authorisation uses the
    capability check internally.

    Separately, **access-tier gating capabilities** (the content caps that
    drive `access_tiers` + content gating) are registered in the `TIER_CAPS`
    map in `includes/access_tier_validation.php` (#1352). The 7 original caps
    (`CanViewLyrics`, `CanViewCopyrighted`, `CanPlayAudio`, `CanDownloadMidi`,
    `CanDownloadPdf`, `CanOfflineSave`, `RequiresCcli`) stay column-backed
    because their camelCase keys are the frozen native-app API contract. Every
    **new** gateable cap is a single line in `TIER_CAPS` with `storage 'json'` —
    stored as a named key inside the one `tblAccessTiers.Capabilities` JSON
    column, with **no schema change / no new column**. (Earlier docs said to
    "add a capability column" — that is now only true of the 7 grandfathered
    caps.)

    ## Rate Limiting

    **Write / auth throttle.** Song-request submissions, login, and the
    Service-Mode operator endpoints are throttled by
    `includes/rate_limit.php::checkRateLimit`, keyed by client IP or
    authenticated user ID. Song requests default to a configurable max per IP
    per day (default 5).

    **Read throttle (#1354).** The heavy public read endpoints are throttled by
    a separate fixed-window limiter, `includes/read_rate_limit.php::enforceReadRateLimit`.
    Each is keyed **per token-or-IP**: a `Bearer`/`ihymns_auth` 64-hex token
    hashes to its own bucket (`tok:<sha256>`), otherwise the bucket is the
    client `REMOTE_ADDR` (`ip:<addr>` — never `X-Forwarded-For`). Limits are
    deliberately generous (≈2–4 req/s sustained per device):

    | Action(s) | Limit |
    | --- | --- |
    | `search` | 120 / minute |
    | `songs_index` | 120 / minute |
    | `song_detail` / `song_data` | 240 / minute |
    | `related_songs` | 240 / minute |
    | `songbook_export` + `bulk_songs` + `bulk_audio` (shared `bulk` bucket) | 60 / minute combined |
    | `work` / `musician` | 120 / minute (or a per-key budget with a `catalogue:read` API key) |

    On exceed, the endpoint returns **429** with `Retry-After`,
    `X-RateLimit-Limit`, and `X-RateLimit-Window` headers (see the shared
    `RateLimited` response). The read limiter is **fail-open** — on an
    un-migrated install (no `tblReadRateLimit`) or any DB error, no limit is
    enforced. The token bucket is NOT validated against the sessions table
    (low-overhead, per-device), so a NAT-shared congregation is not collapsed
    to one bucket.

    ## Content gating (#1353)

    Content gating is **dormant by default** (`content_gating_enabled='0'`).
    When an operator turns it on, `song_data` / `song_detail` (and random-song)
    responses are filtered by the caller's access-tier capabilities: when the
    tier may not view the lyric body (or it is copyrighted and the tier lacks
    that capability) the `components` / `translations` / `annotations` /
    `vocalParts` are stripped and the song object gains `contentRestricted: true`
    + a `restrictionReason`. Disallowed `media` rows are dropped and
    `hasAudio` / `hasSheetMusic` forced false; `offlineAllowed` reflects the
    `offline_save` capability. With the flag off, the song object is returned
    byte-identical (no extra fields). See the `Song` schema's gated fields.

    ## Cross-platform consumers

    The API is the single contract for every iHymns client — the web/PWA
    today, plus the planned Apple (iOS / iPadOS / tvOS), Android (incl.
    FireOS), and smart-TV native apps. Native clients should:

    - Treat the schemas in this file as the canonical request / response
      shape; if the docs and the live API disagree, that is a bug — please
      raise it.
    - Send `Accept: application/json` and `Content-Type: application/json`
      on POST bodies. The server is forgiving about both, but explicit is
      cheaper to debug.
    - Carry the Bearer token (`Authorization: Bearer <token>`) rather than
      relying on cookies — cookies require running inside a WebView with
      cross-domain trust which native shells generally don't have.
    - Persist the token returned by `auth_login` /
      `auth_email_login_verify` / `auth_register` and refresh by re-issuing
      a login if it returns 401. The sliding 30-day expiry means an active
      user effectively never has to sign in again.
    - Cache the read-mostly payloads (`songs_json`, `songbooks`,
      `languages`, `tags`, `access_tiers`) and respect their `ETag` /
      `Last-Modified` if present; they change rarely but are large.

    ## Admin / curator surface — current API coverage

    Every read-side admin function (listing users / orgs / requests /
    revisions / restrictions / activity / songbook health) is exposed via
    the `admin_*` endpoints documented below. The mutation-side admin
    flows surface as concrete actions where it makes sense (e.g.
    `admin_song_request_update`, `admin_restriction_create`,
    `admin_set_user_tier`).

    The following **admin CRUD** flows are currently driven directly by
    the `/manage/*.php` PHP pages and are not yet exposed as standalone
    API endpoints — native admin clients that want feature parity with
    the web manage area will need them:

    - Songbook CRUD (create / update / delete / reorder) — driven by
      `manage/songbooks.php`.
    - Credit-people CRUD (add / edit / rename / merge / delete / view
      songs) — driven by `manage/musicians.php`.
    - Access-tier CRUD (create / update / delete a tier definition) —
      driven by `manage/tiers.php`. (The `access_tiers` read-list and
      `admin_set_user_tier` write-assignment endpoints are exposed.)
    - Entitlement override management — driven by
      `manage/entitlements.php`.
    - User CRUD beyond role / tier assignment (create user, full profile
      edit, delete) — driven by `manage/users.php`.
    - User-group CRUD — driven by `manage/groups.php`.
    - Organisation CRUD beyond create / list — driven by
      `manage/organisations.php`. (`organisation_create`, `organisation`,
      `my_organisations`, `admin_organisations` are exposed.)

    These will be added to the API as native admin clients are built; the
    PHP page handlers are the design reference.
  contact:
    name: iHymns Support
    url: https://ihymns.app
  license:
    name: Proprietary
    url: https://ihymns.app/terms

servers:
  - url: https://ihymns.app
    description: Production
  - url: https://dev.ihymns.app
    description: Alpha channel (gated by `access_alpha` entitlement)
  - url: https://beta.ihymns.app
    description: Beta channel (gated by `access_beta` entitlement)
  # Kept (#1472 audit): still a real, live reference, not dead — the
  # cross-domain storage bridge's origin allow-list actively accepts
  # postMessage from any *.ihymns.net origin (appWeb/public_html/bridge.html
  # ALLOWED_ORIGINS regex `ihymns\.(app|net)`), and storage-bridge.js /
  # subdomain-sync.js both name ihymns.net alongside ihymns.app in their
  # cross-domain-sync comments.
  - url: https://beta.ihymns.net
    description: Legacy beta / dev

tags:
  - name: Songs
    description: Search, retrieve, and browse songs and songbooks
  - name: Languages
    description: Language metadata and song translations
  - name: Setlists
    description: Create, retrieve, and sync personal setlists
  - name: Setlists — Scheduling
    description: Schedule setlists for a date and list upcoming events (#398)
  - name: Setlists — Collaboration
    description: Invite collaborators, manage permissions, list shared setlists (#398)
  - name: Song Requests
    description: Submit and view community song requests
  - name: Favorites
    description: Server-synced user favorites
  - name: Authentication
    description: User registration, login, logout, and profile management
  - name: User Access
    description: Group-based access control and app status
  - name: Preferences
    description: Server-side preference sync across devices
  - name: Offline / PWA
    description: Bulk-fetch endpoints used by the service worker for offline caching
  - name: Discovery
    description: Tags, suggestions, related songs, popular songs
  - name: System
    description: |
      Unauthenticated operational endpoints intended for infrastructure
      (uptime monitors, load balancers) — distinct from the authenticated,
      curator-facing **Admin — Diagnostics** surface below.
  - name: Push
    description: Push-notification subscription endpoints
  - name: Notifications
    description: In-app notification delivery (#289) — list, mark read, header-bell badge count
  - name: Organisations
    description: Multi-tenant organisation membership and administration
  - name: Content Access
    description: Content-licence + restriction evaluation for gated songs / audio / sheet music
  - name: Licences
    description: Multi-licence, inheritance-aware resolution (#462) — effective-licence lookups for admin audit and self-service capability checks
  - name: Song Metadata
    description: Per-song data surfaces — history, key, writers, revisions
  - name: Lyrics
    description: Timed-lyrics (TTML) ingestion into the normalized lyric-line schema, for external pushers such as MeedyaDL
  - name: Pages
    description: |
      Rendered HTML fragments for SPA page-fragment hydration, routed via
      the `?page=<name>` query parameter (a separate dispatch from the
      `?action=<name>` JSON endpoints elsewhere in this file). The
      alternate-format bulk exports (CSV / XML / JSON / OpenSong /
      VideoPsalm) live under `?action=admin_export` (Admin — Maintenance
      tag) — see that tag's #1472 note.
  - name: Admin
    description: Administrative endpoints for user, group, and content management
  - name: Admin — Restrictions
    description: Content-restriction rule engine (tier / org / platform / licence)
  - name: Admin — Songbooks
    description: |
      Songbook curation surface (#719 PR 2a). CRUD parity with
      `/manage/songbooks` so native clients (iOS / iPadOS / tvOS / Android
      / FireOS) can manage hymnals without a webview. Validation is
      shared with the web admin via `includes/songbook_validation.php`,
      so a tweak to the abbreviation / colour / IETF BCP 47 grammar
      lands on both surfaces in one go.
  - name: Admin — Users
    description: |
      User CRUD parity (#719 PR 2b). Mirrors `/manage/users` so native
      clients can create / update / rename / role-change / activate /
      reset-password / delete user accounts. Mutations route through
      the helpers in `manage/includes/auth.php`, which write the
      canonical activity-log rows under `user.create`,
      `auth.role_change`, `auth.username_change`, `user.activate`,
      `user.deactivate`. Hierarchy gates mirror the web admin: an
      admin can never act on a peer or superior unless they're
      `global_admin`, never promote above their own level, never
      delete or deactivate their own account.
  - name: Admin — Groups
    description: |
      User-group CRUD parity (#719 PR 2b). Mirrors `/manage/groups`.
      Each user belongs to at most one group via `tblUsers.GroupId`;
      the `admin_group_member_*` endpoints toggle that FK.
  - name: Admin — Tiers
    description: |
      Access-tier CRUD parity (#719 PR 2b). Mirrors `/manage/tiers`.
      The capability registry (`TIER_CAPS`) lives in
      `includes/access_tier_validation.php` (#1352). A new gateable
      capability is a single `TIER_CAPS` line with `storage 'json'` —
      stored as a named key in the one `tblAccessTiers.Capabilities`
      JSON column, **no schema change / no new column** (the 7
      grandfathered caps remain column-backed as the frozen native-app
      contract). All four surfaces — web admin, `admin_tier_create` /
      `admin_tier_update`, the public `access_tiers` emit, and content
      gating — derive their cap list from `TIER_CAPS`.
  - name: Admin — Organisations
    description: |
      System-admin organisation CRUD parity (#719 PR 2c). Mirrors
      `/manage/organisations`. Existing `organisation_create` covers
      creation from any authenticated user (creator becomes owner);
      these endpoints add update / delete / member curation to
      complete the surface.
  - name: Org-admin
    description: |
      Org-admin endpoints (#719 PR 2c, #707, #726). Authenticated
      users who hold an `admin` or `owner` row in
      `tblOrganisationMembers` can manage their own org's members
      and licences without needing system-admin role. Row-level gate
      via `userCanActOnOrg()` in
      `includes/organisation_validation.php` — every endpoint
      refuses cross-org POSTs at the server side regardless of how
      the caller mounted the request.
  - name: Editor API v2
    description: |
      The INTERNAL admin Song-Editor v2 backend (`/manage/editor/api2.php`,
      #1200) — a granular, atomic, CSRF-guarded, audited editor API consumed
      by the in-app editor client (`manage/editor/v2/*`). This is NOT a
      3rd-party / native-app public contract like the `?action=` surface on
      `api.php` elsewhere in this document — it exists purely to serve
      iHymns' own web admin UI and is documented here for completeness /
      internal-consumer reference, per **#1201** (Part A of the #1200 v2
      rollout's doc debt).

      **Auth**: every action requires `isAuthenticated()` (`401` otherwise)
      AND the `editor` role (`hasRole($role,'editor')` — i.e. `editor`,
      `admin`, or `global_admin`; `403` otherwise). A handful of actions
      layer a further **entitlement** check via `userHasEntitlement()` on
      top of that role gate (`403` with a named-entitlement message when
      missing): `delete_song` → `delete_songs`; `song_link_add` /
      `song_link_remove` / `song_link_suggestion_dismiss` → `edit_songs`;
      `bulk_verify` / `bulk_tag_attach` / `bulk_tag_detach` →
      `bulk_edit_songs`. Every other action — including
      `song_external_id_add`/`song_external_id_delete` and
      `song_alt_title_add`/`song_alt_title_delete` — rides the
      file-level editor-role gate only (curation, not a destructive class).

      **CSRF**: every POST requires the `X-Requested-With: XMLHttpRequest`
      header (`403` "Cross-site POST blocked" otherwise) — the same
      same-origin AJAX defence as the public `api.php` (#293), chosen over a
      baked per-form session token because that token goes stale under a
      long-lived editor tab / cross-subdomain adopted session (#1307). GET
      reads do not need it.

      **Wire format**: `action` always travels in the query string
      (`?action=<name>`, hence the distinct path per action below); POST
      bodies are JSON (`application/json`) EXCEPT `media_upload`,
      `import_file` and `import_zip`, which are `multipart/form-data`. Every
      response is the envelope `{ ok: true, ... }` on success or
      `{ ok: false, error: "..." }` on failure, with a MEANINGFUL HTTP
      STATUS the client branches on (never the error sentence, rule #35):
      `400` bad/missing params, `401`/`403` auth or CSRF/entitlement, `404`
      not found, `409` conflict / un-migrated table or column, `422`
      unprocessable / unknown value, `500` server error (with `error_detail`
      for `admin`/`global_admin` callers). An unknown `action` is `400`.

      Full per-action breakout below is **#1201**; the narrative summary
      lives in this file's top-level `description` (search "Editor API v2").
  - name: Admin — Credit People
    description: |
      Credit-people CRUD parity (#719 PR 2d, #545). Catalogue-wide
      management of the people credited on songs across
      `tblSongWriters` / `tblSongComposers` / `tblSongArrangers` /
      `tblSongAdaptors` / `tblSongTranslators`. Helpers (link-type
      catalogue, IPI normaliser, flag-columns probe) live in
      `includes/musician_helpers.php` and are shared with
      `/manage/musicians`.
  - name: Admin — Tunes
    description: |
      Tune-registry CRUD (#1748) — `tblTunes` + its aliases/credits/
      external-links child tables. Mirrors `/manage/tunes` (both surfaces
      call the SAME shared cores in `includes/tune_admin.php`, so there is
      nothing for the two to drift on). External-link editing is
      page-only for now — these four actions cover scalar fields,
      aliases, credits, merge and delete.
  - name: Admin — Licence Types
    description: |
      Licence-vocabulary CRUD (#459 / #1769 P4) — `tblLicenceTypes`: the
      tokens every licence store writes, what each legally covers, and any
      access tier it confers. Mirrors `/manage/licence-types` (both surfaces
      call the SAME shared core in `includes/licence_type_admin.php`). Gated
      on `manage_licence_types`.
  - name: Analytics
    description: |
      First-party, anonymous, consent-gated client analytics event
      ingestion (#1448, `analytics_ingest`). Distinct from **Admin —
      Analytics** below (which is curator-facing reporting reads) — this
      is the public write side the Apple app's analytics sink posts to.
  - name: Telemetry
    description: |
      Crash / error surfacing (#1582, `client_error_report`) — NOT
      consent-gated analytics. `js/modules/error-monitor.js` beacons a
      small, scrubbed JSON payload for every uncaught client-side
      exception or unhandled promise rejection, unconditionally (no
      opt-in), the same way a native crash reporter would. There is no
      new table and no new PII surface: the endpoint reuses the existing
      `logActivity()` write path and lands as `Action=client.jserror`
      rows in `tblActivityLog`, the same audit trail every other
      server-side action already writes to.
  - name: Admin — Analytics
    description: |
      Read-only analytics endpoints. Two of the three
      `/manage/analytics` panels are already covered by
      `popular_songs` (top_songs + top_books); this surface adds
      the search-query reporting needed for parity.
  - name: Admin — Diagnostics
    description: |
      Operational diagnostic read endpoints (#719 PR 2d). Mirror the
      payloads `/manage/data-health`, `/manage/schema-audit`, and
      `/manage/setup-database` render. Designed for tooling clients
      (CI, monitoring, dashboards) — pure read paths with no
      mutations. Schema-audit + migrations-status reuse the parser
      / scanner / comparer in `includes/schema_audit.php`.
  - name: Admin — Revisions
    description: Review pending song revisions
  - name: Admin — Maintenance
    description: Cleanup, export, and songbook-health utilities
  - name: Editor API
    description: |
      Admin-only endpoints under `/manage/editor/api.php`, protected by the
      /manage/ PHP session rather than a Bearer token. Used by the LEGACY
      (v1) song editor SPA for per-song save, bulk tag, and revision
      history. As of #1601, `/manage/editor/` serves the v2 editor (backed
      by `api2.php`, described in prose above the tag list — #1472) by
      default; this v1 API is still live and not retired, reachable
      directly or via v2's `?legacy=1` link.
  - name: Live Follow
    description: |
      Host-led real-time multi-device follow (#1268) — the `live_follow_*`
      action family on `api.php`. A signed-in host starts a session and
      gets a short, human-typeable code; anonymous followers join with
      that code and short-poll for the host's current song/section/state.
      DB-relayed (`tblLiveFollowSessions`, `SessionKind='host'` implicitly
      — no `Channel`/venue scoping, unlike Service Mode below), short-poll
      over `StateRevision` rather than SSE/WebSockets (shared hosting
      can't hold a worker per follower). Host endpoints
      (`live_follow_create`, `_update`, `_heartbeat`, `_leave`) require
      auth + ownership (`HostUserId` match); `live_follow_join` /
      `live_follow_poll` are anonymous, gated only by the unguessable
      session code. Sessions auto-expire 4 hours after the last host
      heartbeat/update. Shares its `tblLiveFollowSessions` spine table
      with Service Mode, but is a separate, non-venue, non-anonymous-host
      feature — a native worship-leader "follow me" flow rather than a
      congregation-wide venue broadcast.
  - name: Service Mode
    description: |
      Congregation Live-Follow (#1323 / #1335) — congregants join a live
      service via a venue-displayed **rotating code** and follow the broadcast
      song in sync. The `service_*` action family on `api.php`.

      **Two audiences.** Operator endpoints (`service_session_start`,
      `service_code_rotate`, `service_code_current`, `service_session_end`,
      `service_broadcast`) require an authenticated org-operator
      (`global_admin` / `admin` / the session host / an org-admin of the
      session's org) — else `401` / `403`. Congregant endpoints
      (`service_join`, `service_poll`, `service_leave`) are **anonymous** —
      gated only by knowing the unguessable rotating code (join) or holding
      the opaque presence token (poll/leave).

      **Presence-token model.** The client mints a `presenceDeviceId`; on
      `service_join` the server mints an opaque 43-char `PresenceToken` (the
      hard-revocable gate key, hashed for rate-limit bucketing) bound to the
      session and expiring at the venue-local occurrence end (UTC). Anonymous
      polling is rate-limited **per presence token** (`tok:<hash>`, 40/min),
      not per IP, so a whole congregation behind one church-wifi IP each gets
      their own budget. Every query filters the `Channel` env discriminator
      (`alpha`/`beta`/`production`).

      **Dormancy.** The endpoints are always live, but the Phase-3 CCLI
      content-unlock they exist to drive has **no effect** until both
      `content_gating_enabled='1'` AND `require_licence:ccli` restriction rows
      exist — so the family is effectively dormant by default. (The older
      host-led `live_follow_*` family shares the spine tables but is a
      separate, non-anonymous, non-venue feature — #1268.)

paths:
  # ===========================================================================
  # SONGS
  # ===========================================================================

  /api.php?action=search:
    get:
      operationId: searchSongs
      tags: [Songs]
      summary: Search songs
      description: |
        Live MySQL full-text search across song titles, lyrics, writers, and
        composers. Queries of 3+ characters use FULLTEXT BOOLEAN mode with each
        term prefix-matched and required (e.g. `+amaz* +grac*`), broadening to
        ANY-term then writer/composer LIKE then SOUNDEX when a pass is empty;
        shorter queries use a LIKE scan. Curator-priority matches (alternative
        titles, scripture-reference tags) are prepended on the first page.
        Results are lightweight summaries; pass `offset` to page with the
        returned `hasMore` flag.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [search]
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
            minLength: 1
            example: amazing grace
        - name: songbook
          in: query
          required: false
          description: Filter results to a specific songbook abbreviation
          schema:
            type: string
            example: CP
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return per page
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Pagination offset; combine with the returned hasMore flag
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: lyrics
          in: query
          required: false
          description: |
            Search (and snippet) song bodies as well as titles — mirrors the
            public "search within lyrics" toggle. Defaults ON for direct API
            callers. Accepts 1/true/yes (on) or 0/false (off).
          schema:
            type: string
            enum: ["1", "0", "true", "false", "yes"]
            default: "1"
        - name: sort
          in: query
          required: false
          description: |
            #1786 Option B — multi-level result order as a comma-separated
            list of `key.dir` tokens, e.g. `sort=title.asc,number.desc`. Each
            key may appear once (a repeat's first occurrence wins) and at
            most 3 tokens are honoured; `dir` is `asc` or `desc` (anything
            else is treated as `asc`). Unknown/malformed tokens are DROPPED
            silently, never a 4xx — an unrecognised sort key degrades to the
            default rather than failing the whole search, so a client on a
            different build than the API never breaks over this parameter
            (rule #33: honour it or don't emit it; this endpoint honours it).
            Omit entirely (the default) for the unchanged relevance-ranked
            order. `relevance` is only meaningful on the FULLTEXT pass
            (3+ character queries) — it is accepted but has no effect on the
            sub-3-character LIKE fallback, which has no relevance score.
          schema:
            type: string
            example: title.asc,number.desc
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SongSummary"
                  total:
                    type: integer
                    description: Number of results on this page
                    example: 3
                  hasMore:
                    type: boolean
                    description: True when another page is available (use offset)
                    example: false
                  offset:
                    type: integer
                    description: The offset this page was served from
                    example: 0
                  query:
                    type: string
                    description: The search query that was executed
                    example: amazing grace
              example:
                results:
                  - id: CP-0202
                    number: 202
                    title: Amazing Grace
                    songbook: CP
                    songbookName: Christian Praise
                    writers: ["John Newton"]
                    hasAudio: false
                    hasSheetMusic: true
                total: 1
                hasMore: false
                offset: 0
                query: amazing grace
        "429":
          $ref: "#/components/responses/RateLimited"

  /api.php?action=search_num:
    get:
      operationId: searchByNumber
      tags: [Songs]
      summary: Search songs by number
      description: Search for songs by their number within a specific songbook.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [search_num]
        - name: songbook
          in: query
          required: true
          description: Songbook abbreviation
          schema:
            type: string
            example: MP
        - name: number
          in: query
          required: true
          description: Song number to search for
          schema:
            type: string
            example: "42"
      responses:
        "200":
          description: Matching songs
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SongSummary"
                  total:
                    type: integer

  /api.php?action=song_data:
    get:
      operationId: getSongData
      tags: [Songs]
      summary: Get full song data
      description: |
        Retrieve the complete data for a single song by its ID. Includes
        lyrics components (verses, choruses), writers, composers, and metadata.
        Supports flexible ID formats: `MP-1`, `MP-01`, `MP-001`, and `MP-0001`
        all resolve to the same song.

        PERMALINK REDIRECTS (#1343 / #1679). `song_data` and `song_detail` are
        ONE handler in api.php (`case 'song_detail': case 'song_data':`), so this
        behaviour is identical on both — it is documented twice because a client
        reading only this path would otherwise not know it exists. If `id` names
        a song that has since been merged, deleted or MOVED to another songbook
        (a move re-keys the SongId to the new book's prefix), this endpoint
        follows the redirect chain instead of 404-ing: it returns the CURRENT
        record plus `redirectedFrom` set to the id you asked for. Persist the new
        `song.id` — the old one keeps working, but only via this hop. A song
        removed with no replacement answers **410 Gone** (as opposed to 404
        "never existed"), which is the signal to prune it from a local cache.
        `redirectedFrom` is OMITTED on a normal read, so the happy-path shape is
        unchanged.

        **Content gating (#1353).** When `content_gating_enabled='1'` and the
        caller's access tier lacks the relevant capability, the returned `song`
        is filtered: `components` / `translations` / `annotations` /
        `vocalParts` stripped, `contentRestricted: true` + `restrictionReason`
        added, disallowed media dropped, `hasAudio` / `hasSheetMusic` forced
        false. With the flag off (default) the payload is unchanged. See the
        `Song` schema's gated fields.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [song_data]
        - name: id
          in: query
          required: true
          description: |
            Song ID in BOOK-NUMBER format (e.g., CP-0001). As of **#1860**
            also accepts the song's permanent internal id (`ILS` + up to 10
            digits, no separator — e.g. `ILS0000012345`; the leading zeros are
            optional on input) — `SongData::getSongById()` tries this form
            first for any hyphen-less token, resolving it to the current
            `SongId` via `tblSongs.IlId`. Gated on that column existing
            (`_hasIlIdColumn()`); on an un-migrated install a hyphen-less
            token simply falls through to the existing PublicId/legacy
            lookups, unchanged.
          schema:
            type: string
            example: CP-0001
        - name: include
          in: query
          required: false
          description: |
            (#1099) Opt-in comma-separated enrichment blocks for native/casting
            clients. Omitted = the base payload (back-compatible). Unknown blocks
            are ignored; a block is present only when the song actually has that
            data. Allow-list: `tune`, `media`, `arrangements`, `royaltyIds`,
            `scriptureRefs`, `vocalParts`, `translations`, `annotations`,
            `externalIds` (#1750 — recording/release external-ID rows;
            never exposes the internal `SourceRef` idempotency column).
          schema:
            type: string
            example: tune,media,vocalParts,scriptureRefs
      responses:
        "200":
          description: Full song data (plus any requested + available include blocks)
          content:
            application/json:
              schema:
                type: object
                properties:
                  song:
                    $ref: "#/components/schemas/Song"
                  redirectedFrom:
                    type: string
                    description: >-
                      Present ONLY when the requested id was a dead permalink
                      that resolved to this song (#1343/#1679). Holds the id
                      that was requested; `song.id` is the current one.
                    example: MP-1008
        "400":
          description: Missing song ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Song ID is required.
        "404":
          description: Song not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Song not found.
        "410":
          description: >-
            Song removed — the id resolved to a redirect tombstone (merged or
            deleted with no replacement). Prune it locally (#1343/#1679). The
            body carries `gone: true` alongside `error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongGone"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api.php?action=song_by_identifier:
    get:
      operationId: getSongByIdentifier
      tags: [Songs]
      summary: Resolve songs by an industry identifier (#1103)
      description: |
        Look up songs by an industry identifier. `type` is allow-listed and maps
        to a fixed column; `value` is always bound.

        Dormant: undocumented-as-such API-parity spillover — no web/Apple/Android
        client calls this today (orphan inventory §2.5, remediation X7). The
        endpoint is live and correct; it simply has no first-party caller yet.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_by_identifier] }
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [iswc, isrc, upc, ccli] }
        - name: value
          in: query
          required: true
          schema: { type: string, example: "T-034.524.680-C" }
      responses:
        "200":
          description: Matching songs (may be empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  value: { type: string }
                  songs:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: CP-0001 }
                        number: { type: integer, nullable: true }
                        title: { type: string }
                        songbook: { type: string }
                        songbookName: { type: string }
        "400":
          description: Missing/invalid type or value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api.php?action=person_by_identifier:
    get:
      operationId: getPersonByIdentifier
      tags: [Songs]
      deprecated: true
      summary: (DEPRECATED — use musician_by_identifier) Resolve musicians by an industry identifier (#1103)
      description: |
        **Deprecated by #1741 P2-B — use `musician_by_identifier` instead.**
        Kept indefinitely: this is the shipped Apple client's contract
        (action-determines-shape — the response envelope stays the
        byte-identical `people` key forever). Both action names call the
        SAME internal lookup; only the envelope key differs.

        Look up musicians by an industry identifier (IPI / ISNI / CAE / …).
        Both `type` and `value` are bound.

        Dormant: undocumented-as-such API-parity spillover — no web/Apple/Android
        client calls this today (orphan inventory §2.5, remediation X7). The
        endpoint is live and correct; it simply has no first-party caller yet.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [person_by_identifier] }
        - name: type
          in: query
          required: true
          schema: { type: string, example: ipi }
        - name: value
          in: query
          required: true
          schema: { type: string, example: "00052210040" }
      responses:
        "200":
          description: Matching musicians (may be empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  value: { type: string }
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string, nullable: true }
                        identifierType: { type: string }
                        identifierValue: { type: string }
        "400":
          description: Missing type or value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api.php?action=musician_by_identifier:
    get:
      operationId: getMusicianByIdentifier
      tags: [Songs]
      summary: Resolve musicians by an industry identifier (#1103, canonical name since #1741 P2-B)
      description: |
        Look up musicians by an industry identifier (IPI / ISNI / CAE / …).
        Both `type` and `value` are bound. Canonical name for the endpoint
        documented above as `person_by_identifier` (kept as a deprecated
        alias — shipped Apple client contract, byte-identical old envelope).

        Dormant: undocumented-as-such API-parity spillover — no web/Apple/Android
        client calls this today (orphan inventory §2.5, remediation X7). The
        endpoint is live and correct; it simply has no first-party caller yet.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [musician_by_identifier] }
        - name: type
          in: query
          required: true
          schema: { type: string, example: ipi }
        - name: value
          in: query
          required: true
          schema: { type: string, example: "00052210040" }
      responses:
        "200":
          description: Matching musicians (may be empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string }
                  value: { type: string }
                  musicians:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string, nullable: true }
                        identifierType: { type: string }
                        identifierValue: { type: string }
        "400":
          description: Missing type or value
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api.php?action=songs:
    get:
      operationId: listSongs
      tags: [Songs]
      summary: List songs
      description: |
        Get all songs as lightweight summaries, optionally filtered by songbook.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [songs]
        - name: songbook
          in: query
          required: false
          description: Filter by songbook abbreviation
          schema:
            type: string
            example: CP
      responses:
        "200":
          description: Song list
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items:
                      $ref: "#/components/schemas/SongSummary"
                  total:
                    type: integer

  /api.php?action=songbook_export:
    get:
      operationId: songbookExport
      tags: [Songs]
      summary: Export one songbook's full song records (#1166)
      description: |
        Public, DB-direct export of every song in ONE songbook — full
        importable records, the same response shape as the admin twin
        `/manage/editor/api.php?action=songbook_export`. Backs the
        end-user "export my songbook" UI (`js/modules/export-ui.js`).
        Deliberately scoped to a single songbook, never the whole corpus
        (rule #17). Shares the `bulk` read-rate-limit budget with
        `bulk_songs` / `bulk_audio` (60 requests/minute combined,
        fail-open — see the Rate Limiting section above).

        **Export gating (#1120/#1141), dormant by default.** When
        `content_gating_enabled` is on, songs the caller may not EXPORT
        (a restriction whose `AppliesToAction` is `export` or `all`) are
        silently dropped from the `songs` list rather than erroring. With
        the flag off (the default) every song in the songbook is
        returned unfiltered.

        **Tier gating (#1388), also dormant by default, layered on top of the
        export gate above.** When `content_gating_enabled` is on, each
        surviving song is additionally passed through `contentGatingApply()`
        — the SAME registry-backed resolver `song_detail` uses — which strips
        fields the caller's tier may not view (lyric body / `components`,
        per-line and whole-song translations/annotations, gated media links)
        rather than removing the song from the response. This closed the
        widest lyric leak the API had: before #1388 this endpoint carried only
        the entity (restriction-row) gate above, so a single request handed
        back every surviving song's full lyric body regardless of the
        caller's tier — the same content `song_detail` carefully strips for
        that caller one song at a time. Fails open per song on any error, so
        a malformed row degrades to unchanged rather than emptying the export.
        Never returns `403` for a tier denial — the response stays `200` with
        the affected song's gated fields removed/emptied.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [songbook_export] }
        - name: abbr
          in: query
          required: true
          description: Songbook abbreviation. Uppercased server-side; must match `^[A-Z0-9]{1,20}$`.
          schema: { type: string, example: CP }
        - name: platform
          in: query
          required: false
          description: Caller platform, consulted only by export-gating evaluation when content gating is enabled.
          schema: { type: string, default: PWA, example: PWA }
      responses:
        "200":
          description: Songbook bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items: { $ref: "#/components/schemas/Song" }
                  songbook:
                    type: object
                    nullable: true
        "400":
          description: Missing or invalid abbr
        "429":
          $ref: "#/components/responses/RateLimited"

  /api.php?action=songbooks:
    get:
      operationId: listSongbooks
      tags: [Songs]
      summary: List all songbooks
      description: Retrieve the list of all available songbooks with their song counts.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [songbooks]
      responses:
        "200":
          description: Songbook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  songbooks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Songbook"
              example:
                songbooks:
                  - id: CP
                    name: Christian Praise
                    songCount: 650
                  - id: MP
                    name: Mission Praise
                    songCount: 1200

  /api.php?action=random:
    get:
      operationId: getRandomSong
      tags: [Songs]
      summary: Get a random song
      description: Returns a random song, optionally restricted to a specific songbook.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [random]
        - name: songbook
          in: query
          required: false
          description: Restrict random selection to a songbook
          schema:
            type: string
            example: CP
      responses:
        "200":
          description: Random song data
          content:
            application/json:
              schema:
                type: object
                properties:
                  song:
                    $ref: "#/components/schemas/Song"
        "404":
          description: No songs available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: No songs available.

  /api.php?action=song_of_the_day:
    get:
      operationId: songOfTheDay
      tags: [Discovery]
      summary: Song of the Day
      description: |
        Deterministic per-day song pick via a live MySQL query (#1015).
        Everyone sees the same song on the same calendar day; on key dates
        in the Christian calendar (Advent, Christmas, Lent, Holy Week,
        Easter, Pentecost, …) a themed song is chosen by keyword matching.
        The selection is a bounded query — it never materialises the corpus.
        Language filtering follows the standard rules (untagged songs pass;
        empty filter = no filter), resolved from `lang` / the
        X-Preferred-Languages header / the authenticated user.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [song_of_the_day]
        - name: lang
          in: query
          required: false
          description: |
            Comma-separated preferred-language primary subtags (e.g. en,es).
            Overrides the X-Preferred-Languages header / user preference.
          schema:
            type: string
            example: en
        - name: date
          in: query
          required: false
          description: |
            YYYY-MM-DD. The client passes its LOCAL date so liturgical
            themes align to the user's calendar. Malformed/absent → the
            server's current date.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: "2026-12-25"
      responses:
        "200":
          description: The chosen song (song is null only if the catalogue is empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  song:
                    type: object
                    nullable: true
                    description: |
                      Minimal card payload — exactly the fields the home
                      card renders (not the shared SongSummary shape).
                    properties:
                      id:           { type: string, example: CP-0202 }
                      number:       { type: integer, nullable: true, example: 202 }
                      title:        { type: string, example: Amazing Grace }
                      songbook:     { type: string, example: CP }
                      songbookName: { type: string, example: Christian Praise }
                      verified:     { type: boolean, example: true }
                  themeLabel:
                    type: string
                    description: Card heading, e.g. "Easter Song of the Day"
                    example: Christmas Song of the Day
                  firstLine:
                    type: string
                    description: >-
                      A short single-line lyric preview shown as a teaser. The
                      opening sung lines are joined into one flowing
                      "complete thought" phrase (a hymn's first line alone is
                      often just the title), for the client to display on one
                      line and truncate to the viewport with an ellipsis.
                    example: "Amazing grace! how sweet the sound that saved a wretch like me!"
              example:
                song:
                  id: CP-0202
                  number: 202
                  title: Amazing Grace
                  songbook: CP
                  songbookName: Christian Praise
                  verified: true
                themeLabel: Song of the Day
                firstLine: "Amazing grace! how sweet the sound that saved a wretch like me!"

