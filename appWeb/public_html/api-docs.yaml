  # ===========================================================================
  # ADMIN — CREDIT PEOPLE  (#719 PR 2d, #545)
  # Catalogue-wide CRUD over the people credited on songs across the
  # five song-credit tables + the tblCreditPeople registry.
  # ===========================================================================

  /api.php?action=admin_credit_person_add:
    post:
      operationId: adminCreditPersonAdd
      tags: [Admin — Credit People]
      summary: Add a registry entry (with optional links + IPI rows)
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_credit_person_add] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreditPersonInput"
      responses:
        "201":
          description: Person added
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:   { type: boolean, example: true }
                  id:   { type: integer }
                  name: { type: string }
        "400":
          description: Validation error (missing name, name too long, bad birth/death date)
        "403":
          description: Admin access required
        "409":
          description: A person with that name is already registered

  /api.php?action=admin_credit_person_update:
    post:
      operationId: adminCreditPersonUpdate
      tags: [Admin — Credit People]
      summary: Update biographical metadata + replace child rows
      description: |
        The Name column is NOT changed by this endpoint — renames have
        their own endpoint (`admin_credit_person_rename`) because their
        blast radius is cross-table. If the body's `name` field differs
        from the stored name we reject with **400**.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_credit_person_update] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AdminCreditPersonInput"
                - type: object
                  required: [id]
                  properties:
                    id: { type: integer }
      responses:
        "200":
          description: Person updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:             { type: boolean, example: true }
                  id:             { type: integer }
                  name:           { type: string }
                  fields_changed:
                    type: array
                    items: { type: string }
        "400":
          description: Validation error or name field doesn't match (use rename instead)
        "403":
          description: Admin access required
        "404":
          description: Person not found

  /api.php?action=admin_credit_person_rename:
    post:
      operationId: adminCreditPersonRename
      tags: [Admin — Credit People]
      summary: Rename a credit person — cascades across all 5 song-credit tables
      description: |
        Cascades the new name across `tblSongWriters` /
        `tblSongComposers` / `tblSongArrangers` / `tblSongAdaptors` /
        `tblSongTranslators` AND the registry row inside one
        transaction. Refuses with **409** if the new name already
        belongs to a different registry row (caller should use
        `admin_credit_person_merge`).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_credit_person_rename] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, new_name]
              properties:
                id:       { type: integer }
                new_name: { type: string, maxLength: 255 }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:                   { type: boolean, example: true }
                  id:                   { type: integer }
                  old_name:             { type: string }
                  new_name:             { type: string }
                  song_credit_renames:  { type: integer, description: Total rows updated across the 5 song-credit tables }
        "400":
          description: Missing fields, name too long, or new_name same as old
        "403":
          description: Admin access required
        "404":
          description: Person not found
        "409":
          description: Another registry row already uses that name (use merge)

  /api.php?action=admin_credit_person_merge:
    post:
      operationId: adminCreditPersonMerge
      tags: [Admin — Credit People]
      summary: Collapse two registry entries into one
      description: |
        Re-points every song-credit row from the source name to the
        target name across all five song-credit tables, migrates the
        chosen child rows from source → target, then deletes the
        source registry row. The FK ON DELETE CASCADE on
        `tblCreditPersonLinks` / `tblCreditPersonIPI` drops any
        child rows the caller chose not to migrate.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_credit_person_merge] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, target_id]
              properties:
                source_id:
                  type: integer
                  description: Registry row to absorb. Must be different from target_id.
                target_id:
                  type: integer
                  description: Surviving registry row. The target's name + biographical fields are preserved.
                keep_link_ids:
                  type: array
                  items: { type: integer }
                  description: tblCreditPersonLinks.Id values from the source side to migrate. Anything not listed gets dropped via the cascade.
                keep_ipi_ids:
                  type: array
                  items: { type: integer }
                  description: tblCreditPersonIdentifiers.Id values (IPI and/or ISNI rows) from the source side to migrate. Kept for backwards-compat naming after the IPI/ISNI unification.
      responses:
        "200":
          description: Merge completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:                  { type: boolean, example: true }
                  source_id:           { type: integer }
                  target_id:           { type: integer }
                  source_name:         { type: string }
                  target_name:         { type: string }
                  song_credit_renames: { type: integer }
                  links_kept:          { type: integer }
                  links_dropped:       { type: integer }
                  ipi_kept:            { type: integer }
                  ipi_dropped:         { type: integer }
        "400":
          description: Missing source_id / target_id, or they're equal
        "403":
          description: Admin access required
        "404":
          description: Source or target person not found

  /api.php?action=admin_credit_person_delete:
    post:
      operationId: adminCreditPersonDelete
      tags: [Admin — Credit People]
      summary: Remove a registry row (force flag for in-use names)
      description: |
        Refuses with **422** + `usage_count` if any song-credit table
        still cites the name AND `force` is not set. With `force=true`
        the registry row is removed even when song credits still
        reference the name — the credits stay; only the registry
        row goes.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_credit_person_delete] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:    { type: integer }
                force:
                  type: boolean
                  default: false
                  description: When true, deletes the registry row even if song credits still cite the name.
      responses:
        "200":
          description: Person deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:           { type: boolean, example: true }
                  id:           { type: integer }
                  name:         { type: string }
                  usage_count:  { type: integer }
                  forced:       { type: boolean }
        "400":
          description: Missing id
        "403":
          description: Admin access required
        "404":
          description: Person not found
        "422":
          description: |
            Refused — song credits still cite the name and `force` is
            not set. Response includes `usage_count`, `name`, `hint`.

  # ===========================================================================
  # ADMIN — ANALYTICS  (#719 PR 2d)
  # ===========================================================================

  /api.php?action=admin_analytics_searches:
    get:
      operationId: adminAnalyticsSearches
      tags: [Admin — Analytics]
      summary: Top + zero-result search queries
      description: |
        Mirrors the search-query panel on `/manage/analytics`. Two
        lists in one response: the most-frequent queries (`top`) and
        the most-frequent zero-result queries (`zero`). Returns
        **503** when `tblSearchQueries` doesn't exist yet (pre-#404
        deployment).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_analytics_searches] }
        - name: range
          in: query
          required: false
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Search-query analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  range_days: { type: integer }
                  since:      { type: string, format: date-time }
                  top:
                    type: array
                    items:
                      type: object
                      properties:
                        query:     { type: string }
                        hits:      { type: integer }
                        top_count: { type: integer, description: Highest ResultCount seen for this query in the window }
                  zero:
                    type: array
                    items:
                      type: object
                      properties:
                        query: { type: string }
                        hits:  { type: integer }
        "403":
          description: Admin access required
        "503":
          description: tblSearchQueries not yet created — run /manage/setup-database

  # ===========================================================================
  # ADMIN — DIAGNOSTICS  (#719 PR 2d)
  # Pure read endpoints designed for tooling clients (CI, monitoring,
  # dashboards). Mirror the payloads /manage/data-health,
  # /manage/schema-audit, and /manage/setup-database render.
  # ===========================================================================

  /api.php?action=admin_data_health:
    get:
      operationId: adminDataHealth
      tags: [Admin — Diagnostics]
      summary: Table-row counts + legacy-fallback state
      description: |
        Mirrors the `/manage/data-health` panel. Returns counts for
        the canonical tables, the SongData JSON-fallback flag, the
        share-directory file count vs DB row count, and whether the
        legacy SQLite database is still on disk.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_data_health] }
      responses:
        "200":
          description: Data-health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataHealthResponse"
        "403":
          description: Admin access required
        "503":
          description: Database unreachable (response includes detail)

  /api.php?action=admin_schema_audit:
    get:
      operationId: adminSchemaAudit
      tags: [Admin — Diagnostics]
      summary: schema.sql vs live DB drift report
      description: |
        Mirrors `/manage/schema-audit`. Compares schema.sql declarations
        against `INFORMATION_SCHEMA.COLUMNS` and the migration
        coverage discovered by walking every `migrate-*.php` under
        `appWeb/.sql/`. Per-column status enum: `ok` | `missing` |
        `uncovered` | `orphan`.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_schema_audit] }
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSchemaAuditResponse"
        "403":
          description: Admin access required

  /api.php?action=admin_migrations_status:
    get:
      operationId: adminMigrationsStatus
      tags: [Admin — Diagnostics]
      summary: Per-migration applied/partial/pending status
      description: |
        Walks every `migrate-*.php` under `appWeb/.sql/`, derives the
        set of (table, column) declarations each one is responsible
        for (literal ALTER, CREATE TABLE blocks, `@migration-adds`
        doctags), and reports an `applied|partial|pending` status
        per file by checking each declared column against the live
        `INFORMATION_SCHEMA`. No central registry — state is derived
        from the schema.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_migrations_status] }
      responses:
        "200":
          description: Status report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMigrationsStatusResponse"
        "403":
          description: Admin access required

  /api.php?action=admin_songbook_health:
    get:
      operationId: adminSongbookHealth
      tags: [Admin — Maintenance]
      summary: Integrity check across every songbook
      description: |
        Returns orphan components, songs missing writers, duplicate
        numbers, and NULL-number counts per songbook. Drives the
        "Songbook health" panel on the admin dashboard.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_songbook_health] }
      responses:
        "200":
          description: Health summary per songbook

  # ===========================================================================
  # PAGES  (HTML renderers for SPA page-fragment hydration)
  #
  # All ten pre-existing entries below were documented pre-#1472 as
  # `?action=<name>` with an `action` parameter — factually wrong. The page
  # router (`if ($page !== null)` at api.php:353, switching on `$_GET['page']`
  # set at api.php:329) is a SEPARATE dispatch from the action switch
  # (`if ($action !== null)` at api.php:534). Verified per name against
  # `case '<name>':` inside the page-router switch (api.php:376-510):
  #   home/help/terms/privacy/settings — genuine `case` blocks there, fixed
  #   below to `?page=<name>`.
  #   json/xml/csv/opensong/videopsalm — NOT page-router cases and NOT
  #   top-level actions either; the only occurrence of these five case labels
  #   in api.php is nested inside the single action `admin_export`
  #   (api.php:7243-7401), switching on `$_GET['format']`, not `$_GET['page']`
  #   or `$_GET['action']`. Flipping them to `?page=` would have been a second
  #   wrong fix, so the five entries were removed; the real behaviour (bulk,
  #   editor+-gated, all-songs export) is now documented once under
  #   `?action=admin_export` (Admin — Maintenance tag) instead of five times
  #   under a fictional single-song-by-id public route.
  # ===========================================================================

  /api.php?page=home:
    get:
      operationId: pageHome
      tags: [Pages]
      summary: Rendered home-page HTML fragment
      description: |
        Used by the router when hydrating `/` during offline startup.
        Cacheable fragment (ETag) — `home` is in the same-for-everyone
        cacheable-pages allow-list.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [home] }
      responses:
        "200":
          description: HTML fragment
          content:
            text/html: { schema: { type: string } }

  /api.php?page=help:
    get:
      operationId: pageHelp
      tags: [Pages]
      summary: Rendered in-app help page
      description: Cacheable fragment (ETag) — same-for-everyone content.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [help] }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  /api.php?page=terms:
    get:
      operationId: pageTerms
      tags: [Pages]
      summary: Rendered Terms of Use page
      description: Cacheable fragment (ETag) — same-for-everyone content.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [terms] }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  /api.php?page=privacy:
    get:
      operationId: pagePrivacy
      tags: [Pages]
      summary: Rendered Privacy Policy page
      description: Cacheable fragment (ETag) — same-for-everyone content.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [privacy] }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  /api.php?page=whats-new:
    get:
      operationId: pageWhatsNew
      tags: [Pages]
      summary: Rendered What's New page (#1583)
      description: |
        Renders a deploy-time excerpt of `CHANGELOG.md` (extracted into
        `data/whats-new.md` by `.github/workflows/deploy.yml`, absent on
        a fresh checkout) through the escape-first `markdown_lite.php`
        renderer. No parameters, no database access. A missing/empty/
        unreadable source file, or one that renders to an empty string
        (e.g. a byte-truncated deploy excerpt cut mid-UTF-8-character),
        degrades to a themed "no data yet" fallback card rather than an
        error — this page never fails. Cacheable fragment (ETag) — `whats-new`
        is in the same-for-everyone cacheable-pages allow-list, alongside
        `help`/`terms`/`privacy`.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [whats-new] }
      responses:
        "200":
          description: HTML fragment (fallback alert markup when no excerpt is available)
          content: { text/html: { schema: { type: string } } }

  /api.php?page=settings:
    get:
      operationId: pageSettings
      tags: [Pages]
      summary: Rendered Settings modal HTML
      description: |
        NOT in the cacheable-pages allow-list — renders fresh per request
        since the settings panel reflects user-specific state.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [settings] }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  /api.php?page=person:
    get:
      operationId: pagePerson
      tags: [Pages]
      summary: Credit-person public page HTML fragment (#588)
      description: |
        Renders the `/people/<slug>` page's bio + discography-by-role for
        SPA hydration. `slug` is the canonical `tblCreditPeople.Slug`
        lookup; the renderer falls back to a name-based search when the
        slug migration hasn't been applied yet. Cacheable fragment (ETag).
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [person] }
        - name: slug
          in: query
          required: true
          schema: { type: string, example: john-newton }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Missing person slug

  /api.php?page=work:
    get:
      operationId: pageWork
      tags: [Pages]
      summary: Work public page HTML fragment (#840)
      description: |
        Renders the `/work/<slug>` page — slug-keyed lookup via
        `SongData::getWork()` (the same function backing `?action=work`'s
        JSON twin). 404 body when the Works schema isn't migrated or the
        slug is unknown. Cacheable fragment (ETag).
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [work] }
        - name: slug
          in: query
          required: true
          schema: { type: string, example: amazing-grace }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Missing work slug

  /api.php?page=tune:
    get:
      operationId: pageTune
      tags: [Pages]
      summary: Tune public page HTML fragment (#940)
      description: |
        Renders `/tune/<slug>`, listing every song that uses the named
        tune. An empty/missing slug renders a friendly empty state rather
        than a 400. Cacheable fragment (ETag) — `tune` is NOT in the
        cacheable-pages allow-list, so this always renders fresh per request.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [tune] }
        - name: slug
          in: query
          required: false
          schema: { type: string, example: new-britain }
      responses:
        "200":
          description: HTML fragment (empty-state markup when slug is absent/unknown)
          content: { text/html: { schema: { type: string } } }

  /api.php?page=iswc:
    get:
      operationId: pageIswc
      tags: [Pages]
      summary: ISWC public page HTML fragment (#940)
      description: |
        Renders `/iswc/<code>`, listing every song sharing the given ISWC
        (`T-NNN.NNN.NNN-N`). The renderer defensively normalises the code
        (strips non-`T`/digit characters, uppercases the leading `T`). An
        empty/missing/unmatched code renders a friendly empty state rather
        than a 400. `iswc` is NOT in the cacheable-pages allow-list.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [iswc] }
        - name: code
          in: query
          required: false
          schema: { type: string, example: "T-345.246.800-1" }
      responses:
        "200":
          description: HTML fragment (empty-state markup when code is absent/unmatched)
          content: { text/html: { schema: { type: string } } }

  /api.php?page=request:
    get:
      operationId: pageRequest
      tags: [Pages]
      summary: Request-a-song / suggest-a-correction form HTML fragment (#658)
      description: |
        Renders the public request form that POSTs to
        `?action=song_request_submit`. `page=request` is canonical;
        `page=request-a-song` is retained as an alias (older bookmarks /
        shared links / offline-queue replays) rendering the identical
        fragment. Cacheable fragment (ETag) EXCEPT when any of
        `submitted`/`id`/`error` are present (the no-JS form-submit
        redirect target — see `song_request_submit`), which carry a
        one-time flash banner and should not be cached.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [request, request-a-song] }
        - name: songbook
          in: query
          required: false
          description: Prefills the songbook field (deep-link from a songbook page).
          schema: { type: string, example: CP }
        - name: number
          in: query
          required: false
          description: Prefills the song-number field.
          schema: { type: string, example: "42" }
        - name: submitted
          in: query
          required: false
          description: "`1` when arriving via the no-JS form's post-submit redirect."
          schema: { type: string, enum: ["1"] }
        - name: id
          in: query
          required: false
          description: The tracking id from a successful no-JS submission (paired with `submitted=1`).
          schema: { type: string, example: "512" }
        - name: error
          in: query
          required: false
          description: An error message from a failed no-JS submission (paired with a redirect, not `submitted`).
          schema: { type: string }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  # ===========================================================================
  # ANALYTICS  (#1448 — anonymous, consent-gated client event ingestion)
  # ===========================================================================

  /api.php?action=analytics_ingest:
    post:
      operationId: analyticsIngest
      tags: [Analytics]
      summary: Ingest a batch of first-party, anonymous analytics events
      description: |
        Accepts a consent-gated batch of client analytics events from the
        Apple app's `IHAnalyticsSink` (#189/#1448). Anonymous — no auth, no
        CSRF token — protected by the mandatory `X-Requested-With`
        same-origin header plus a per-IP rate limit (20 calls / 60s; a
        batching client makes few CALLS even with many queued events, so
        this budgets calls, not individual events).

        **PII / retention stance (load-bearing):** `tblAppAnalyticsEvents`
        stores NO user id, NO device/install id, and NO IP address — a row
        can never be traced back to a person or device. The caller's IP is
        read only to key the rate-limit counter, never written to the
        analytics table.

        Every event is validated INDEPENDENTLY against a CLOSED allow-list
        of event names — a malformed/unknown event is dropped and counted
        in `rejected`, never failing the whole batch. `parameters` must be
        a flat `string => string` map (matching the client's Swift shape
        exactly); nested values reject that one event. `clientTimestamp`
        is clamped to a plausible window (1 day ahead .. 30 days behind)
        and silently omitted (not rejected) when implausible.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [analytics_ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                platform:
                  type: string
                  description: Reporting client. Unrecognised/absent is stored as `unknown` (informational only, not a security boundary).
                  enum: [apple, android, web]
                events:
                  type: array
                  maxItems: 50
                  description: Batch of events (max 50 per call).
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: Closed allow-list — an unrecognised name rejects that one event.
                        enum: [screen_view, song_opened, search_performed, offline_save]
                      parameters:
                        type: object
                        additionalProperties: { type: string }
                        description: Flat string=>string map, max 10 keys (key <=40 chars, value <=200 chars). Any non-string value rejects the whole event.
                      clientTimestamp:
                        type: string
                        format: date-time
                        description: ISO 8601. Clamped to a plausible window; implausible/malformed values are silently dropped (event still stored, minus its timestamp).
            example:
              platform: apple
              events:
                - name: song_opened
                  parameters: { song_id: "MP-1008" }
                  clientTimestamp: "2026-07-06T12:34:56Z"
      responses:
        "200":
          description: |
            Always 200 for a well-formed request body — per-event
            rejects are reported in `rejected`, never a batch failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  accepted: { type: integer, example: 1 }
                  rejected: { type: integer, example: 0 }
        "400":
          description: Body is not valid JSON, `events` is missing/empty, or the batch exceeds 50 events
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "413":
          description: Request body exceeds the 256 KiB inner cap
        "429":
          description: Rate limit exceeded (20 calls / 60s per IP)
        "500":
          description: Could not record events

  # ===========================================================================
  # TELEMETRY  (#1582 — crash / error surfacing, NOT consent-gated analytics)
  # ===========================================================================

  /api.php?action=client_error_report:
    post:
      operationId: clientErrorReport
      tags: [Telemetry]
      summary: Report an uncaught client-side JS error or unhandled rejection
      description: |
        Fire-and-forget beacon target for `js/modules/error-monitor.js`'s
        `bootErrorMonitor()` — every uncaught `window.onerror` /
        `unhandledrejection` turns into one small JSON POST here.
        Anonymous — no auth, no CSRF token.

        **Transport / same-origin gate.** The primary transport is
        `navigator.sendBeacon()` (survives page unload), falling back to
        `fetch(…, {keepalive:true})`; the Beacon API is defined as a
        "simple request" that can NEVER carry a custom header, so unlike
        every other state-changing POST on this API this action is
        exempted from the mandatory `X-Requested-With` same-origin gate
        and instead allow-listed for an `Origin`/`Referer` host-match
        check (api.php's top-of-file CSRF guard, #1582 note) — the same
        no-JS fallback mechanism `song_request_submit` uses, for a
        different reason.

        **Limits.** Rate-limited to 10 calls / 60s per IP (tight —
        this is a rare "something broke" signal, not a batching
        client). Request body capped at 8 KB (a real report — message
        + up to 3 short capped stack frames — fits well under 1 KB).

        **Validation is independent-per-field**, via
        `clientErrorValidate()` (`includes/client_error_report.php`):
        only `k` (kind — closed allow-list `error` | `rejection`) and
        `m` (message — required, non-empty) can reject the whole
        payload; every other field (`s`/`r` source/current-page paths,
        `l`/`c` line/column, `v`/`c` version/channel labels, `st` stack
        frames) degrades to a safe default (empty string / `null` /
        capped list) rather than failing the report. Every string field
        is independently scrubbed of secret-shaped substrings (a
        `Bearer <token>` value, a 64-hex-char digest, or a
        `?token=`/`&password=`-shaped query-string parameter) before
        it is stored anywhere.

        **A malformed/rejected/invalid-JSON body is silently dropped**
        — `sendBeacon()`'s caller has no way to read a response body
        (especially during page unload), so there is nothing useful an
        error reply could communicate; the handler always answers
        `{ok:true}` for any body that at least parses past the method
        and size checks.

        **Server-side dedupe.** On top of the client's own 10-minute
        `sessionStorage` throttle, the server independently dedupes by
        a 16-hex-char fingerprint (`clientErrorFingerprint()`, hashing
        `{env}|message|source|line`) against `tblActivityLog` for the
        last 15 minutes — a second tab, a different device, or a
        client that cleared `sessionStorage` hitting the same bug
        within the window doesn't double-log. The dedupe check
        **fails open**: if the lookup itself throws, the report is
        logged anyway rather than silently lost.

        **No new table** (rule #19/#20) — writes through the existing
        `logActivity()` path as `Action=client.jserror`,
        `EntityType=client`, `EntityId=<fingerprint>` rows in
        `tblActivityLog`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [client_error_report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [k, m]
              properties:
                k:
                  type: string
                  description: Kind — closed 2-value allow-list. Anything else rejects the whole report.
                  enum: [error, rejection]
                m:
                  type: string
                  description: Error message. Required, non-empty; scrubbed and capped to 300 chars server-side.
                s:
                  type: string
                  description: Source file path/URL. Query string and fragment are stripped server-side; capped to 255 chars.
                l:
                  type: integer
                  nullable: true
                  description: Source line number. Non-numeric/negative/absurdly large values degrade to null rather than rejecting the report.
                c:
                  type: integer
                  nullable: true
                  description: Source column number. Same clamping as `l`.
                r:
                  type: string
                  description: Current-page path at the time of the error. Same query/fragment stripping and cap as `s`.
                v:
                  type: string
                  description: App/build version label. Capped to 32 chars.
                ch:
                  type: string
                  description: Deploy channel label (e.g. `Alpha`). Capped to 32 chars.
                st:
                  type: array
                  description: Stack frames (`"path:line"` strings). Capped to the top 3, each independently scrubbed and capped to 120 chars.
                  items: { type: string }
            example:
              k: error
              m: "TypeError: x is not a function"
              s: /js/app.js
              l: 1204
              c: 7
              r: /song/MP-1008
              v: 3.4.0
              ch: Alpha
              st: ["/js/app.js:1204"]
      responses:
        "200":
          description: |
            Always `{ok:true}` for any body that passes the method/size
            checks — a rejected/deduped/malformed payload is silently
            dropped rather than surfaced as an error the `sendBeacon()`
            caller has no way to act on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "405":
          description: POST method required
        "413":
          description: Request body exceeds the 8 KB cap
        "429":
          description: Rate limit exceeded (10 calls / 60s per IP)

  # ===========================================================================
  # LICENCES (#462) — multi-licence, inheritance-aware resolution
  # ===========================================================================

  /api.php?action=user_effective_licences:
    get:
      operationId: getUserEffectiveLicences
      tags: [Licences]
      summary: Resolve a user's effective licence set (admin-only)
      description: |
        Returns every licence the given user holds, either directly on
        their own row, via their CCLI number on `tblUsers`, or inherited
        from any ancestor organisation in the `tblOrganisations.ParentOrgId`
        chain (bounded at 10 levels to defend against cycles).

        Intended for admin debugging — the same resolver also drives the
        evaluator inside `content_access.php::checkContentAccess()`, so
        this endpoint lets a curator understand why a given user is
        passing or failing a `require_licence` rule.

        Requires the `view_licence_audit` entitlement (default:
        `admin`, `global_admin`).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_effective_licences] }
        - name: user_id
          in: query
          required: true
          description: Target user's numeric ID
          schema: { type: integer, minimum: 1, example: 42 }
      responses:
        "200":
          description: Resolved licence set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer, example: 42 }
                  licences:
                    type: array
                    items: { $ref: "#/components/schemas/EffectiveLicence" }
        "400":
          description: Missing or invalid user_id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Caller lacks `view_licence_audit` entitlement
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=licence_check:
    get:
      operationId: checkOwnLicence
      tags: [Licences]
      summary: Does the caller hold a licence of the given type?
      description: |
        Convenience boolean check against the caller's own effective
        licence set. Same resolver as `user_effective_licences` but
        scoped to the authenticated user, so any logged-in client can
        ask "do I hold a `ccli` licence?" without being an admin.

        Use this from the frontend to show/hide copyrighted-content
        features without hard-coding role strings.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [licence_check] }
        - name: type
          in: query
          required: true
          description: Licence type key to check (e.g. `ccli`, `ihymns_pro`).
          schema: { type: string, example: ccli }
      responses:
        "200":
          description: Result of the check
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, example: ccli }
                  has:  { type: boolean, example: true }
        "400":
          description: Missing type query parameter
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ===========================================================================
  # NOTIFICATIONS (#289) — in-app delivery surface for tblNotifications
  # ===========================================================================

  /api.php?action=notifications_list:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List notifications for the authenticated user
      description: |
        Returns up to 50 notifications for the caller, ordered unread
        first and then newest-first. Used by the header bell in the
        PWA shell to populate the dropdown panel and the unread-count
        badge.

        Each row carries `action_url` when a notification deep-links
        somewhere specific (e.g. `/song/CP-0001` after a song-request
        resolution). The UI marks rows as read via
        `notifications_mark_read`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [notifications_list] }
      responses:
        "200":
          description: Notification list (empty array when no rows)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=notifications_mark_read:
    post:
      operationId: markNotificationsRead
      tags: [Notifications]
      summary: Mark one or more notifications as read
      description: |
        Accepts either a list of specific IDs or a flag to clear the
        entire unread queue. Scoped to the authenticated user — a
        caller cannot modify another user's notifications even if
        they supply IDs from elsewhere.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [notifications_mark_read] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ids]
                  properties:
                    ids:
                      type: array
                      description: Notification IDs to mark as read.
                      items: { type: integer, minimum: 1 }
                      example: [101, 102]
                - type: object
                  required: [all]
                  properties:
                    all:
                      type: boolean
                      description: When true, marks every unread row for the caller.
                      example: true
      responses:
        "200":
          description: Mark-read result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean, example: true }
                  affected:
                    type: integer
                    description: Number of rows that changed from unread to read.
                    example: 3
        "400":
          description: "Neither `ids` nor `all: true` supplied"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: Wrong HTTP method (POST required)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ===========================================================================
  # USER PREFERENCES + ACCOUNT
  # ===========================================================================

  /api.php?action=user_settings:
    get:
      operationId: getUserSettings
      tags: [Preferences]
      summary: Get the authenticated user's stored settings blob
      description: |
        Returns the JSON settings object stored on `tblUsers.Settings`
        for the caller — used by the PWA to sync per-user banner state,
        theme preferences, and other client-side flags across devices.
        Empty object when nothing has been stored yet.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_settings] }
      responses:
        "200":
          description: Settings blob
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:         { type: boolean, example: true }
                  settings:   { type: object, description: Free-form preference object }
                  updated_at: { type: string, format: date-time, nullable: true }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      operationId: setUserSettings
      tags: [Preferences]
      summary: Replace the authenticated user's stored settings blob
      description: |
        Persists the supplied JSON object to `tblUsers.Settings`. The
        PWA writes the whole object on every change (small payload,
        no diff), so subsequent GETs return what was last POSTed.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_settings] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: object
                  description: Free-form preference object to persist.
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400":
          description: settings object missing or not an object
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=auth_change_username:
    post:
      operationId: changeUsername
      tags: [Authentication]
      summary: Change the authenticated user's username
      description: |
        Self-service username change. Requires the caller's current
        password as a re-confirmation step so a stolen session can't
        silently rename the account. Username constraints match
        registration: 3-100 characters, lowercase, `[a-z0-9_.-]` only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [auth_change_username] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_username, current_password]
              properties:
                new_username:
                  type: string
                  description: Desired new username (3-100 chars, lowercase).
                  example: alice2
                current_password:
                  type: string
                  format: password
                  description: Caller's current password (re-auth).
      responses:
        "200":
          description: Username changed
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400":
          description: Invalid new username or already in use
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated, or current password wrong
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=account_delete:
    post:
      operationId: deleteAccount
      tags: [Authentication]
      summary: Permanently delete the authenticated account (#1403)
      description: |
        Self-service, irreversible account deletion (App Review 5.1.1(v)).
        The account is ALWAYS the current bearer — there is no id/username
        selector, so this can never delete a different account. Requires
        the custom `X-Requested-With` header (a browser cannot set it
        cross-origin without a CORS preflight this server never grants) —
        see the CSRF note below — PLUS exactly one fresh re-authentication
        proof:
          - `password` — accounts with a password set.
          - `identityToken` + `nonce` (+ optional `authorizationCode`) — a
            FRESH Sign-in-with-Apple assertion, for accounts with an Apple
            link. The verified `sub` must match this account's own linked
            Apple identity.
          - `email_code` — a 6-digit code from `auth_email_login_request`,
            for passwordless email accounts.
          - `confirm: "DELETE"` — degenerate accounts only (no password, no
            email, no Apple link).

        Deletes/anonymises every per-user row (favourites, setlists,
        provider links, …), revokes ALL bearer tokens, best-effort revokes
        the Apple grant (never blocks deletion — see `apple_revoke` in the
        audit log), and clears the `ihymns_auth` cookie. A repeat call with
        an already-invalidated token returns 401 (terminal); a narrow
        double-tap race returns the SAME `{"ok":true,"deleted":true}` both
        times (idempotent).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [account_delete] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:          { type: string, format: password }
                identityToken:     { type: string }
                nonce:             { type: string }
                authorizationCode: { type: string }
                email_code:        { type: string, example: "123456" }
                confirm:           { type: string, enum: [DELETE] }
      responses:
        "200":
          description: Account deleted (or already gone — idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  deleted: { type: boolean }
        "400":
          description: No re-authentication proof supplied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated, or the supplied re-auth proof is wrong
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Caller is the last active global_admin — transfer first
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: Too many re-auth attempts from this IP
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ===========================================================================
  # CARD LAYOUT (#516) — admin / user reorder + hide on dashboard surfaces
  # ===========================================================================

  /api.php?action=card_layout_get:
    get:
      operationId: getCardLayout
      tags: [Preferences]
      summary: Resolve card-layout for a dashboard surface
      description: |
        Returns the default card order for a named surface (the system
        baseline), the caller's per-user override (if any), and two
        capability flags the UI consults to decide what to enable:
        `canCustomiseOwn` for personal reorder/hide, `canSetDefault`
        for the admin "save as default" action.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [card_layout_get] }
        - name: surface
          in: query
          required: true
          description: Layout surface key (e.g. `home_admin`, `home_user`).
          schema: { type: string }
      responses:
        "200":
          description: Layout state
          content:
            application/json:
              schema:
                type: object
                properties:
                  surface:  { type: string }
                  default:  { type: object, description: Baseline layout (order + hidden array). }
                  override: { type: object, description: Per-user layout if any (order + hidden array). }
                  canCustomiseOwn: { type: boolean }
                  canSetDefault:   { type: boolean }
        "400":
          description: Invalid surface
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=card_layout_save_user:
    post:
      operationId: saveUserCardLayout
      tags: [Preferences]
      summary: Save the caller's per-user card-layout override
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [card_layout_save_user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surface]
              properties:
                surface: { type: string }
                order:   { type: array, items: { type: string } }
                hidden:  { type: array, items: { type: string } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid surface, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Customisation not permitted for this account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api.php?action=card_layout_reset_user:
    post:
      operationId: resetUserCardLayout
      tags: [Preferences]
      summary: Discard the caller's per-user card-layout override
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [card_layout_reset_user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surface]
              properties:
                surface: { type: string }
      responses:
        "200":
          description: Override cleared
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid surface, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api.php?action=card_layout_save_default:
    post:
      operationId: saveDefaultCardLayout
      tags: [Admin]
      summary: Save the system default card layout for a surface (admin)
      description: |
        Updates the baseline `order` + `hidden` arrays for a surface
        so every user without a personal override sees the new layout.
        Requires the `manage_default_card_layout` entitlement.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [card_layout_save_default] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surface]
              properties:
                surface: { type: string }
                order:   { type: array, items: { type: string } }
                hidden:  { type: array, items: { type: string } }
      responses:
        "200":
          description: Default updated
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid surface, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Caller lacks `manage_default_card_layout` entitlement, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ===========================================================================
  # LIVE FOLLOW  (#1268 — host-led real-time multi-device follow)
  # See the "Live Follow" tag description above for the shared model.
  # ===========================================================================

  /api.php?action=live_follow_create:
    post:
      operationId: liveFollowCreate
      tags: [Live Follow]
      summary: Start a new Live Follow host session
      description: |
        Supersedes (deactivates) any prior active session for this host —
        one active session per host. Mints a 6-character Crockford-ish
        base32 code (no ambiguous glyphs). Sessions expire 4 hours after
        the last heartbeat/update. Rate-limited to 20 new sessions / hour
        / user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_create] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                setlistId:
                  type: string
                  nullable: true
                  description: Optional setlist context (org scoping deferred to a future version).
                songId:
                  type: string
                  nullable: true
                  example: CP-0202
                componentIndex:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 9999
                state:
                  $ref: "#/components/schemas/LiveSessionState"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string, example: "7K3PXM" }
                  revision: { type: integer, example: 0 }
        "400":
          description: Unknown songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Could not allocate a session code after 6 attempts — retry

  /api.php?action=live_follow_update:
    post:
      operationId: liveFollowUpdate
      tags: [Live Follow]
      summary: Broadcast the host's current song/section/state
      description: |
        The host broadcasts its FULL current context on every update
        (not a delta). Bumps `StateRevision` so followers' polls see the
        change. Also refreshes the session's 4-hour expiry. Rate-limited
        to 600 / minute / user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_update] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, songId]
              properties:
                code:
                  type: string
                  description: The session code from `live_follow_create` (4-12 alphanumeric).
                  example: "7K3PXM"
                songId:
                  type: string
                  example: CP-0202
                componentIndex:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 9999
                state:
                  $ref: "#/components/schemas/LiveSessionState"
      responses:
        "200":
          description: Broadcast applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revision: { type: integer, example: 4 }
        "400":
          description: Invalid session code, missing songId, or unknown songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "409":
          description: Session not found, not owned by this user, or ended
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=live_follow_heartbeat:
    post:
      operationId: liveFollowHeartbeat
      tags: [Live Follow]
      summary: Keep a host session alive without changing its broadcast state
      description: |
        Keepalive only — refreshes `LastHeartbeatAt` + the 4-hour expiry
        but does NOT bump `StateRevision` (nothing changed for followers).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_heartbeat] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "7K3PXM" }
      responses:
        "200":
          description: '`ok` reflects whether the session is still active and owned by this user.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Invalid session code
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  /api.php?action=live_follow_leave:
    post:
      operationId: liveFollowLeave
      tags: [Live Follow]
      summary: End the host's own Live Follow session
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_leave] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "7K3PXM" }
      responses:
        "200":
          description: '`ok: true` regardless of whether a matching session existed (idempotent).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Invalid session code
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  /api.php?action=live_follow_join:
    get:
      operationId: liveFollowJoin
      tags: [Live Follow]
      summary: Join a Live Follow session by its code (anonymous)
      description: |
        Anonymous — access control is the unguessable session code.
        Mints a STATELESS per-follower token (nothing persisted
        server-side) purely so `live_follow_poll` can bucket its rate
        limiter per follower instead of per shared NAT IP; the session
        CODE remains the real access control. Rate-limited to 120 / 60s
        per IP (generous — a whole congregation joins over a minute or
        two behind one church-wifi IP). Missing/expired/wrong code all
        return the SAME 404 message (anti-probe).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_join] }
        - name: code
          in: query
          required: true
          schema: { type: string, example: "7K3PXM" }
      responses:
        "200":
          description: Joined — includes the host's current broadcast state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string }
                  followToken:
                    type: string
                    description: Stateless per-follower token — pass as `token` to `live_follow_poll`.
                  hostDisplayName: { type: string }
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }
        "400":
          description: Invalid session code
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }
        "404":
          description: Session not found, expired, or the code is wrong (identical message for all three)
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }

  /api.php?action=live_follow_poll:
    get:
      operationId: liveFollowPoll
      tags: [Live Follow]
      summary: Short-poll a Live Follow session for changes (anonymous)
      description: |
        Anonymous. Pass `since` (the last seen `revision`) to get a
        near-free `{changed: false}` until the host advances it. A
        session is only "active" while its host has heartbeated/updated
        within the last 180 seconds. When `token` (from `live_follow_join`)
        is supplied, rate limiting buckets PER TOKEN (40 / 60s, ~2.5s
        polling); without it, falls back to a per-IP bucket (600 / 60s) —
        the IP path exists only for old clients and is intentionally
        loose so it isn't a code-existence oracle by itself.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_poll] }
        - name: code
          in: query
          required: true
          schema: { type: string, example: "7K3PXM" }
        - name: since
          in: query
          required: false
          description: Last-seen `revision`; omit or send 0 on the first poll.
          schema: { type: integer, default: 0 }
        - name: token
          in: query
          required: false
          description: The `followToken` from `live_follow_join` (up to 40 hex chars). Buckets the rate limiter per follower.
          schema: { type: string }
      responses:
        "200":
          description: |
            `{active: false}` when the session is missing/inactive/stale;
            otherwise `{changed: false, revision}` when nothing is new,
            or `{changed: true, currentSongId, componentIndex, state,
            revision}` when the host has advanced past `since`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  changed: { type: boolean }
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }
        "400":
          description: "Invalid session code (returned as `{active: false}`)"
          content: { application/json: { schema: { type: object, properties: { active: { type: boolean, example: false } } } } }

  # ===========================================================================
  # SERVICE MODE  (#1323 / #1335 — congregation Live-Follow)
  # See the "Service Mode" tag description above for the channel/presence-
  # token model shared by every endpoint below.
  # ===========================================================================

  /api.php?action=service_session_start:
    post:
      operationId: serviceSessionStart
      tags: [Service Mode]
      summary: Start a venue service session (operator)
      description: |
        Operator = `global_admin` / `admin`, or an org-admin/owner of the
        venue's organisation. Supersedes any prior active session for the
        same venue + occurrence date + schedule + channel. Mints the
        first rotating join code. Rate-limited to 30 new sessions / hour
        / user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_session_start] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, occurrenceDate]
              properties:
                venueId:
                  type: integer
                  description: '`tblOrgVenues.Id`. Must be active.'
                scheduleId:
                  type: integer
                  description: Optional `tblOrgServiceSchedules.Id` (must belong to the venue) — supplies start time/duration/timezone for computing the occurrence's expiry.
                occurrenceDate:
                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  example: "2026-07-12"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  sessionId: { type: integer }
                  code:
                    type: string
                    description: The current rotating join code (`SVC` + 8 base32 chars).
                    example: "SVC7K3PXM4H"
                  occurrenceEnd:
                    type: string
                    format: date-time
                    description: Resolved UTC end of this occurrence — the session's ExpiresAt / the presence tokens' expiry ceiling.
        "400":
          description: Missing venueId or a malformed occurrenceDate
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised for this organisation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown venue, or unknown schedule for this venue
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Could not start the session (session-code collision after 6 attempts) — retry

  /api.php?action=service_code_rotate:
    post:
      operationId: serviceCodeRotate
      tags: [Service Mode]
      summary: Rotate the current join code (operator)
      description: |
        Mints a fresh rotating code, superseding the previous one. Doubles
        as a heartbeat (refreshes `LastHeartbeatAt`). Operator-gated
        (`global_admin`/`admin`, the session's host, or an org-admin of
        the session's org) and channel-scoped. Rate-limited to 600 / min
        / user (shared `service_operator` bucket with the other operator
        endpoints below).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_code_rotate] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string }
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Session is not active
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=service_code_current:
    get:
      operationId: serviceCodeCurrent
      tags: [Service Mode]
      summary: Resume the current join code after a reload (operator)
      description: |
        For the projection/leader UI to recover its code after a page
        reload or a background-tab wake. Also heartbeats when the
        session is active (#1386 — keeps a backgrounded broadcaster tab's
        session alive on wake). Mints a fresh code if the current one has
        expired (e.g. the tab slept through a rotation) and the session
        is still active. Same operator gate + rate limit as
        `service_code_rotate`.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_code_current] }
        - name: sessionId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current (or freshly re-minted) code
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string }
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Session is not active (and no current code could be minted)
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }

  /api.php?action=service_session_end:
    post:
      operationId: serviceSessionEnd
      tags: [Service Mode]
      summary: End a service session (operator)
      description: |
        Deactivates the session AND revokes every congregant presence row
        for it (immediate gate revocation — any in-flight CCLI unlock
        ends at once). Same operator gate + rate limit as
        `service_code_rotate`.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_session_end] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  /api.php?action=service_broadcast:
    post:
      operationId: serviceBroadcast
      tags: [Service Mode]
      summary: Broadcast the current song/section/state to a service session (operator)
      description: |
        Serves BOTH broadcaster mechanisms — the projection laptop or a
        separate leader device — either just needs the `sessionId` +
        operator auth. Bumps `StateRevision` so congregant polls see the
        change; also refreshes the heartbeat. Rate-limited to 600 / min /
        user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_broadcast] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
                songId:
                  type: string
                  nullable: true
                  example: CP-0202
                componentIndex:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 9999
                state:
                  $ref: "#/components/schemas/LiveSessionState"
      responses:
        "200":
          description: Broadcast applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revision: { type: integer }
        "400":
          description: Missing sessionId, or an unknown songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown or ended session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  /api.php?action=service_join:
    post:
      operationId: serviceJoin
      tags: [Service Mode]
      summary: Join a service session by its rotating code (anonymous congregant)
      description: |
        Anonymous — gated only by knowing the unguessable rotating code.
        The client mints `presenceDeviceId` (any stable per-device string,
        up to 64 chars); the server mints an opaque 43-char
        `presenceToken` bound to the session, expiring at the venue-local
        occurrence end. Re-joining the same (session, device) pair
        reactivates + re-mints the token rather than duplicating. Missing
        / expired / unknown codes all return the SAME 404 (anti-probe).
        Rate-limited to 300 / min per IP (deliberately generous — a whole
        congregation joins at once behind one church-wifi IP).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_join] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, presenceDeviceId]
              properties:
                code:
                  type: string
                  description: The rotating code shown on the venue screen.
                venueId:
                  type: integer
                  description: Optional — 0/absent resolves by code + channel alone (the congregant typed the code off the screen with no venue context).
                presenceDeviceId:
                  type: string
                  maxLength: 64
                  description: Client-minted stable per-device id.
      responses:
        "200":
          description: Joined — includes the session's current broadcast state for an immediate follow
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  presenceToken:
                    type: string
                    description: Opaque 43-char token — the gate key for `service_poll` / `service_leave` (and, when present as a cookie, the Phase-3 CCLI content unlock).
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }
        "400":
          description: Missing/invalid code or presenceDeviceId
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }
        "404":
          description: Code not active — expired, unknown, or wrong (identical message for all three)
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }
        "405":
          description: POST method required

  /api.php?action=service_poll:
    get:
      operationId: servicePoll
      tags: [Service Mode]
      summary: Short-poll a service session for changes (anonymous congregant)
      description: |
        Anonymous, gated by the opaque `presenceToken` from `service_join`.
        Rate-limited PER TOKEN (40 / 60s, ~2.5s polling) rather than per
        IP, so a whole congregation behind one NAT IP each gets its own
        budget. A session is only "active" while its host/operator has
        heartbeated within the shared live-session freshness window
        (180s). A malformed token returns `{active: false}` rather than
        an error (never an existence oracle).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_poll] }
        - name: presenceToken
          in: query
          required: true
          description: 43-char opaque token from `service_join`.
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: Last-seen `revision`; omit or send 0 on the first poll.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: |
            `{active: false}` when the token is malformed/expired/inactive
            or the session has gone stale; otherwise `{active: true,
            changed: false, revision}` when nothing is new, or
            `{active: true, changed: true, currentSongId, componentIndex,
            state, revision}` when the operator has advanced past `since`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  changed: { type: boolean }
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }

  /api.php?action=service_leave:
    post:
      operationId: serviceLeave
      tags: [Service Mode]
      summary: Leave a service session (anonymous congregant)
      description: |
        Revokes the presence token (`IsActive = 0`) — immediate gate
        revocation for any Phase-3 CCLI content unlock riding this
        presence. Idempotent and deliberately silent: a malformed/unknown
        token still returns `{ok: true}` rather than an error (never an
        existence oracle).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_leave] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presenceToken]
              properties:
                presenceToken: { type: string }
      responses:
        "200":
          description: '`ok: true` regardless of whether the token matched anything.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "405":
          description: POST method required

  # ---------------------------------------------------------------------------
  # SESSION CONTROL TOKENS (#1408, Apple Phase-2 PR-9) — delegated remote
  # control of ONE live/service session without sharing the operator's login.
  # `tblSessionControlTokens` shipped live-dormant (#1511); every action
  # below is sessionControlTokensTableExists()-gated. `service_broadcast`
  # (above) is the mechanism that CONSUMES a minted token (an operator-auth
  # OR a valid controlToken both authorise a broadcast) — but as of this
  # writing NOTHING in this repository (no web JS, no `appApple/` code) ever
  # calls `service_control_token_mint` to obtain one in the first place.
  #
  # RESERVED: no shipped client uses this yet. The leader-device flow that
  # ships today drives a session with the operator's own bearer token via
  # the `service_code_*` actions plus `service_broadcast` directly; a
  # delegated co-leader device that never signs in (the scenario this pair
  # of endpoints exists for) has no UI anywhere that calls them.
  # ---------------------------------------------------------------------------

  /api.php?action=service_control_token_mint:
    post:
      operationId: serviceControlTokenMint
      tags: [Service Mode]
      summary: Mint a delegated, revocable control token for a service session (#1408)
      description: |
        **Reserved: no shipped client uses this yet** — see this section's
        header note. When used, it would let an operator hand a
        `broadcast`-scoped token to a co-leader's device (e.g. a phone at
        the back of the room) that can then call `service_broadcast`
        without ever signing in, by presenting `controlToken` in that
        call's body instead of a bearer/cookie session.

        Requires an authenticated operator (`serviceMode_userCanOperate()`
        — global/org admin, the session's host, or an org-admin of the
        session's org) plus the same-origin CSRF check
        (`validateCsrfRequest()`, rule #29). Rate-limited to 30 mints /
        hour per user. The minted token's expiry is capped to the
        session's own `ExpiresAt`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_control_token_mint] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  token:
                    type: string
                    description: The delegated control token — pass as `controlToken` to `service_broadcast`.
                  scope: { type: string, example: broadcast }
                  sessionId: { type: integer }
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate), or not authorised to operate this session
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown or ended `service`-kind session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Session control tokens are not available yet (tblSessionControlTokens not migrated), or the mint failed — retry
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=service_control_token_revoke:
    post:
      operationId: serviceControlTokenRevoke
      tags: [Service Mode]
      summary: Revoke every delegated control token for a service session (#1408)
      description: |
        **Reserved: no shipped client uses this yet** — see the
        `service_control_token_mint` header note above; a co-leader
        control token is never minted in the first place today, so there
        is nothing shipped that would call this either.

        Requires the same operator authorisation and CSRF gate as
        `service_control_token_mint`. Rate-limited to 60 revokes / hour
        per user. Revokes ALL outstanding tokens for the session at once
        (there is no per-token id in the request) — the response reports
        how many rows were revoked.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_control_token_revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revoked:
                    type: integer
                    description: Number of tokens revoked.
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate), or not authorised to operate this session
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown `service`-kind session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Session control tokens are not available yet (tblSessionControlTokens not migrated)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

# =============================================================================
# COMPONENTS
# =============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        64-character hex token obtained from `auth_register`, `auth_login`,
        or `auth_email_login_verify`. Tokens expire after 30 days with a
        sliding renewal (every authenticated request bumps the expiry by
        one day, at most once per 24h).
    cookieAuth:
      type: apiKey
      in: cookie
      name: ihymns_auth
      description: |
        Cross-subdomain session cookie (`Domain=.ihymns.app; HttpOnly;
        SameSite=Lax; Secure`) carrying the same token as the Bearer
        header. Set on successful login; consumed by
        `getAuthenticatedUser()` when no `Authorization` header is
        present. Either scheme is accepted wherever security is
        declared with both entries.
    ingestApiKey:
      type: http
      scheme: bearer
      description: |
        Machine-to-machine API key (#1064) for external services (e.g.
        MeedyaDL) — NOT a user token. A global admin mints it at
        `/manage/api-keys`; it is stored only as a SHA-256 hash + a short
        prefix (`tblApiKeys`) and carries a space-separated scope. Scopes:
        `lyrics:ingest` (write — the lyrics-ingest endpoint) and
        `catalogue:read` (read — the public catalogue reads at the key's own
        per-key rate limit instead of the anonymous IP limit; it does NOT
        unlock gated/copyrighted content), and `content:gated` (a SEPARATE,
        deliberately-granted scope to read gated/copyrighted content unstripped —
        dormant unless content gating is enabled; issuing it is a per-partner
        licensing decision). Per-key limits + usage are managed at
        `/manage/api-keys`. Send it as `Authorization: Bearer ihk_live_…`
        or, equivalently, the `X-API-Key` header.
    ingestApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Alternative to the Bearer header for the same machine-to-machine
        key — `X-API-Key: ihk_live_…`.

  responses:
    RateLimited:
      description: |
        Too Many Requests — the per-window read rate limit was exceeded
        (#1354). See the **Read rate limiting** section in the API
        description for the per-action limits and the bucket key. Limits
        are generous (2–4 req/s sustained per device); a normal client
        never trips them. The limiter is **fail-open** — on an install
        where the backing table hasn't been migrated, or on any DB error,
        no limit applies.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (60 for the minute window).
          schema: { type: integer, example: 60 }
        X-RateLimit-Limit:
          description: The per-window request ceiling that was exceeded.
          schema: { type: integer, example: 120 }
        X-RateLimit-Window:
          description: The window TYPE word (not a number) — `minute` (read endpoints) or `day`.
          schema: { type: string, enum: [minute, day], example: minute }
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Rate limit exceeded (120 per minute). Please slow down and retry shortly."
              retryAfter:
                type: integer
                description: Mirrors the `Retry-After` header.
                example: 60

  schemas:
    # -------------------------------------------------------------------------
    # Core domain models
    # -------------------------------------------------------------------------

    Song:
      type: object
      description: Complete song object with lyrics components
      properties:
        id:
          type: string
          description: "Unique song ID in BOOK-NUMBER format"
          example: CP-0202
        number:
          type: integer
          description: Song number within the songbook
          example: 202
        title:
          type: string
          description: Song title
          example: Amazing Grace
        songbook:
          type: string
          description: Songbook abbreviation
          example: CP
        songbookName:
          type: string
          description: Full songbook name
          example: Christian Praise
        language:
          type: string
          description: Language code
          example: en
        copyright:
          type: string
          nullable: true
          description: Copyright information
        ccli:
          type: string
          nullable: true
          description: CCLI license number
        verified:
          type: boolean
          description: Whether the song lyrics have been verified
        lyricsPublicDomain:
          type: boolean
          description: Whether the lyrics are in the public domain
        musicPublicDomain:
          type: boolean
          description: Whether the music is in the public domain
        hasAudio:
          type: boolean
          description: Whether an audio recording is available
        hasSheetMusic:
          type: boolean
          description: Whether sheet music is available
        writers:
          type: array
          items:
            type: string
          description: Lyricist / writer names
          example: ["John Newton"]
        composers:
          type: array
          items:
            type: string
          description: Composer / tune names
          example: ["Virginia Harmony"]
        artists:
          type: array
          items:
            type: string
          description: Recording / release artist names (#587). Most useful for contemporary worship songs; traditional hymns leave this blank.
          example: ["Hillsong Worship"]
        components:
          type: array
          description: Ordered song components (verses, choruses, etc.)
          items:
            $ref: "#/components/schemas/SongComponent"
        links:
          type: array
          description: |
            External links attached to this song (#833). Categorised,
            with optional curator notes and a verified flag. Empty
            array on pre-migration deployments.
          items:
            $ref: "#/components/schemas/ExternalLink"
        works:
          type: array
          description: |
            Works (#840) this song belongs to. Each entry surfaces its
            sibling members + Work-level external links, so a UI can
            render "Other versions of this work" without an extra
            round-trip. Empty on pre-migration deployments.
          items:
            $ref: "#/components/schemas/Work"
        contentRestricted:
          type: boolean
          description: |
            Content gating (#1353). Present and `true` only when
            `content_gating_enabled='1'` AND the caller's access tier may
            not view this song's lyric body — `components` /
            `translations` / `annotations` / `vocalParts` are then
            stripped from the payload. Absent entirely when gating is off
            (the default) or the caller is allowed to view the lyrics.
        restrictionReason:
          type: string
          nullable: true
          enum: [lyrics_not_available_on_tier, copyrighted_requires_higher_tier]
          description: |
            Present only alongside `contentRestricted: true`. Distinguishes
            "this tier never sees lyrics" from "this song is copyrighted
            and needs a higher tier" so the client can render a tailored
            upgrade prompt.
        offlineAllowed:
          type: boolean
          description: |
            Content gating (#1353). Whether the caller's access tier may
            save this song for offline use — mirrors the `offline_save`
            capability. Only present when `content_gating_enabled='1'`;
            absent when gating is off (the default no-op path).

    SongComponent:
      type: object
      description: A single verse, chorus, or other song section
      properties:
        type:
          type: string
          description: "Component type (e.g., verse, chorus, bridge)"
          example: verse
        number:
          type: integer
          description: Component number (e.g., verse 1, verse 2)
          example: 1
        lines:
          type: array
          items:
            type: string
          description: Lines of text in this component
          example:
            - Amazing grace how sweet the sound
            - That saved a wretch like me
            - I once was lost but now am found
            - Was blind but now I see

    SongSummary:
      type: object
      description: Lightweight song summary for list views (no lyrics)
      properties:
        id:
          type: string
          example: CP-0202
        number:
          type: integer
          example: 202
        title:
          type: string
          example: Amazing Grace
        songbook:
          type: string
          example: CP
        songbookName:
          type: string
          example: Christian Praise
        writers:
          type: array
          items:
            type: string
          example: ["John Newton"]
        hasAudio:
          type: boolean
        hasSheetMusic:
          type: boolean
        lyricsSnippet:
          type: string
          description: |
            First body line containing a query term — present only on
            search hits driven by a lyrics match (lyrics search on).
          example: "Through many dangers, toils and snares"
        matchedVia:
          type: object
          description: |
            Why a curated result was surfaced — present only when the hit
            came from an alternative-title match (#832).
          properties:
            alternativeTitle:
              type: string
              example: "Faith's Review and Expectation"

    Songbook:
      type: object
      description: |
        A songbook / hymnal. The bibliographic + authority-control
        fields (`websiteUrl` … `lcClass`) and `language` were added
        across #672 / #673 / #681. They appear on every read path
        whose backing `tblSongbooks` deployment has run the matching
        migrations (`migrate-songbook-bibliographic` and
        `migrate-songbook-language`); pre-migration deployments
        simply omit the fields rather than returning nulls.
      properties:
        id:
          type: string
          description: Songbook abbreviation
          example: CP
        name:
          type: string
          description: Full songbook name
          example: Christian Praise
        songCount:
          type: integer
          description: Number of songs in the songbook
          example: 650
        colour:
          type: string
          nullable: true
          description: 6-digit hex tile colour (#677). NULL means "use the auto-picked theme tone".
          example: "#264a26"
        isOfficial:
          type: boolean
          description: Whether this songbook is recognised as an official publication of an Adventist organisation (#502 / #670).
          example: true
        publisher:
          type: string
          nullable: true
          description: Issuing publisher (free-text)
          example: Pacific Press Publishing Association
        publicationYear:
          type: integer
          nullable: true
          description: Year of publication (4-digit Gregorian)
          example: 1985
        copyright:
          type: string
          nullable: true
          description: Copyright statement
          example: "© 1985 Review and Herald"
        affiliation:
          type: string
          nullable: true
          description: |
            Issuing organisation, drawn from the curated registry
            `tblSongbookAffiliations` (#670). Free-text fallback if
            the registry doesn't carry the publisher yet.
          example: General Conference of Seventh-day Adventists
        language:
          type: string
          nullable: true
          description: |
            IETF BCP 47 tag for the songbook's primary language (#673
            / #681). Composite — language[-script][-region]. May be
            null if unknown / mixed.
          example: en-GB
        websiteUrl:
          type: string
          nullable: true
          description: Official website (#672)
          example: https://www.adventistmusic.org
        internetArchiveUrl:
          type: string
          nullable: true
          description: Internet Archive landing page for a digitised copy (#672)
        wikipediaUrl:
          type: string
          nullable: true
          description: Wikipedia article URL (#672)
        wikidataId:
          type: string
          nullable: true
          description: Wikidata QID (#672)
          example: Q123456
        oclcNumber:
          type: string
          nullable: true
          description: OCLC WorldCat record number (#672)
        ocnNumber:
          type: string
          nullable: true
          description: OCLC OCN identifier (#672)
        lcpNumber:
          type: string
          nullable: true
          description: Library of Congress Permalink number (#672)
        isbn:
          type: string
          nullable: true
          description: ISBN-10 or ISBN-13 (#672)
        arkId:
          type: string
          nullable: true
          description: Archival Resource Key (ARK) (#672)
        isniId:
          type: string
          nullable: true
          description: International Standard Name Identifier (#672)
        viafId:
          type: string
          nullable: true
          description: Virtual International Authority File ID (#672)
        lccn:
          type: string
          nullable: true
          description: Library of Congress Control Number (#672)
        lcClass:
          type: string
          nullable: true
          description: Library of Congress Classification (#672)
          example: M2117

    SongbookWriteInput:
      type: object
      description: |
        Input shape for `admin_songbook_create` and the metadata half
        of `admin_songbook_update` (#719 PR 2a). Snake_case JSON keys
        map onto the same column set the web admin writes; validators
        live in `includes/songbook_validation.php` and are shared with
        `/manage/songbooks` so a tweak to the grammar lands on both
        surfaces in one go.

        - `abbreviation`: required on create, ignored on update (use
          `new_abbreviation` for renames).
        - `colour`: optional. Empty triggers the auto-pick palette
          (#677); the resolved hex is echoed back on the response.
        - `language`: optional IETF BCP 47 tag (#681). Format:
          `lang[-Script][-Region]`, max 35 chars.
        - All bibliographic identifier fields are nullable; an empty
          string normalises to NULL on the server.
      required: [abbreviation, name]
      properties:
        abbreviation:
          type: string
          maxLength: 10
          pattern: "^[A-Za-z0-9]+$"
          description: ASCII-alphanumeric natural key. Used by tblSongs.SongbookAbbr.
          example: CP
        name:
          type: string
          example: Christian Praise
        display_order:
          type: integer
          default: 0
          description: Sort key used by the songbook list UI.
        colour:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          nullable: true
          description: 7-char `#RRGGBB` hex. Empty/missing triggers the auto-pick palette (#677).
          example: "#3B82F6"
        is_official:
          type: boolean
          default: false
          description: Recognised as an official Adventist publication (#502 / #670).
        publisher:
          type: string
          nullable: true
          example: Pacific Press Publishing Association
        publication_year:
          type: string
          nullable: true
          description: Year of publication. Stored as VARCHAR so non-numeric strings (e.g. "1985 / 2002 reprint") survive.
          example: "1985"
        copyright:
          type: string
          nullable: true
          example: "© 1985 Review and Herald"
        affiliation:
          type: string
          nullable: true
          description: |
            Issuing organisation. Free-text; the API also INSERT-IGNOREs
            the value into `tblSongbookAffiliations` so the typeahead
            surfaces it on the next save (#670).
        language:
          type: string
          nullable: true
          maxLength: 35
          pattern: "^[a-z]{2,3}(-[A-Z][a-z]{3})?(-[A-Z]{2}|-[0-9]{3})?$"
          description: IETF BCP 47 tag (#681). lang[-Script][-Region].
          example: en-GB
        website_url:
          type: string
          nullable: true
          description: Official website (#672)
        internet_archive_url:
          type: string
          nullable: true
          description: Internet Archive landing page (#672)
        wikipedia_url:
          type: string
          nullable: true
          description: Wikipedia article URL (#672)
        wikidata_id:
          type: string
          nullable: true
          description: Wikidata QID (#672)
        oclc_number:
          type: string
          nullable: true
          description: OCLC WorldCat record number (#672)
        ocn_number:
          type: string
          nullable: true
          description: OCLC OCN identifier (#672)
        lcp_number:
          type: string
          nullable: true
          description: Library of Congress Permalink number (#672)
        isbn:
          type: string
          nullable: true
          description: ISBN-10 or ISBN-13 (#672)
        ark_id:
          type: string
          nullable: true
          description: Archival Resource Key (ARK) (#672)
        isni_id:
          type: string
          nullable: true
          description: International Standard Name Identifier (#672)
        viaf_id:
          type: string
          nullable: true
          description: Virtual International Authority File ID (#672)
        lccn:
          type: string
          nullable: true
          description: Library of Congress Control Number (#672)
        lc_class:
          type: string
          nullable: true
          description: Library of Congress Classification (#672)

    Stats:
      type: object
      description: Aggregate collection statistics
      properties:
        totalSongs:
          type: integer
          example: 4500
        totalSongbooks:
          type: integer
          example: 6
        songbooks:
          type: array
          items:
            $ref: "#/components/schemas/Songbook"

    # -------------------------------------------------------------------------
    # Language & translation models
    # -------------------------------------------------------------------------

    Language:
      type: object
      properties:
        code:
          type: string
          description: ISO language code
          example: en
        name:
          type: string
          description: Language name in English
          example: English
        nativeName:
          type: string
          description: Language name in the native language
          example: English
        textDirection:
          type: string
          description: Text direction
          enum: [ltr, rtl]
          example: ltr

    Script:
      type: object
      description: |
        One row from `tblScripts` (ISO 15924). The `code` is the
        canonical 4-letter Title Case identifier the IETF BCP 47
        spec uses (#681).
      properties:
        code:
          type: string
          description: ISO 15924 script code (Title Case, 4 letters)
          example: Latn
        name:
          type: string
          description: Script name in English
          example: Latin
        nativeName:
          type: string
          description: Script name in its own writing system
          example: Latin

    Region:
      type: object
      description: |
        One row from `tblRegions`. `code` is either the ISO 3166-1
        alpha-2 country code (uppercase, 2 letters — e.g. `GB`) or a
        UN M.49 numeric area code (3 digits — e.g. `419` = Latin
        America & Caribbean). Either form is valid as the region
        subtag of an IETF BCP 47 tag.
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code or 3-digit M.49 area code
          example: GB
        name:
          type: string
          description: Region name in English
          example: United Kingdom

    SongTranslation:
      type: object
      description: |
        One related-language version of a song, as returned by
        `song_translations` (#281). Unions outward, inward, and sibling
        relationships, so `songId` may point at the original, a
        translation, or another-language sibling depending on which
        direction it was reached from.
      properties:
        songId:
          type: string
          description: Related song's ID
          example: FR-0202
        title:
          type: string
          description: Title of the related song
          example: "Comme la rosée"
        number:
          type: integer
          description: Song number within its songbook
          example: 202
        language:
          type: string
          description: ISO 639-1 code of the related language
          example: fr
        languageName:
          type: string
          description: English name of the language
          example: French
        languageNativeName:
          type: string
          description: Native name of the language
          example: "Fran\u00E7ais"
        translator:
          type: string
          description: Translator credit; empty for the inward link back to the source.
        verified:
          type: boolean
          description: Whether the translation has been curator-verified

    # -------------------------------------------------------------------------
    # Setlist models
    # -------------------------------------------------------------------------

    SharedSetlist:
      type: object
      description: A publicly shared setlist (owner UUID excluded)
      properties:
        id:
          type: string
          description: 8-character hex share ID
          example: "1a2b3c4d"
        name:
          type: string
          example: Sunday Morning Service
        songs:
          type: array
          items:
            type: string
          example: ["CP-0202", "MP-0042"]
        created:
          type: string
          format: date-time
          nullable: true
        updated:
          type: string
          format: date-time
          nullable: true
        arrangements:
          type: object
          description: Optional per-song arrangements (only present if set)
          additionalProperties:
            type: array
            items:
              type: integer

    UserSetlist:
      type: object
      description: A user-owned setlist stored server-side
      properties:
        id:
          type: string
          description: Client-generated setlist ID
        name:
          type: string
          example: Evening Worship
        songs:
          type: array
          items:
            $ref: "#/components/schemas/SetlistSongEntry"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SetlistSongEntry:
      type: object
      description: A song entry within a user setlist
      properties:
        id:
          type: string
          description: Song ID
          example: CP-0202
        title:
          type: string
          maxLength: 300
          example: Amazing Grace
        songbook:
          type: string
          maxLength: 20
          example: CP
        number:
          type: integer
          example: 202
        arrangement:
          type: array
          description: Optional custom component arrangement (array of component indices)
          items:
            type: integer
            minimum: 0
          example: [0, 1, 2, 1, 3]

    FavoriteEntry:
      type: object
      description: A user favourite with its per-song tags (WS-G #1019)
      required: [id]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z]+-\\d+$"
          example: CP-0202
        tags:
          type: array
          description: Per-favourite user tags (empty if none)
          items:
            type: string
            maxLength: 50
          example: ["Easter", "Communion"]

    # -------------------------------------------------------------------------
    # Song request models
    # -------------------------------------------------------------------------

    SongRequest:
      type: object
      description: A user's own song request
      properties:
        id:
          type: integer
          example: 42
        title:
          type: string
          example: How Great Thou Art
        songbook:
          type: string
          nullable: true
        songNumber:
          type: string
          nullable: true
        language:
          type: string
          example: en
        details:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, reviewed, added, declined]
          example: pending
        resolvedSongId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    AdminSongRequest:
      type: object
      description: Song request with admin-visible fields
      properties:
        id:
          type: integer
        title:
          type: string
        songbook:
          type: string
          nullable: true
        songNumber:
          type: string
          nullable: true
        language:
          type: string
        details:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, reviewed, added, declined]
        adminNotes:
          type: string
          nullable: true
        resolvedSongId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        submittedBy:
          type: string
          nullable: true
          description: Username of the submitter (null if anonymous)

    SongRequestSubmitInput:
      type: object
      description: |
        Shared body shape for `song_request_submit` (#1472), accepted as
        either `application/json` or `application/x-www-form-urlencoded`.
        `website` is a honeypot — hidden from real users via CSS; any
        non-empty value silently short-circuits to a fake success without
        writing a row.
      required: [title]
      properties:
        title:
          type: string
          maxLength: 500
          example: "Great Is Thy Faithfulness"
        songbook:
          type: string
          maxLength: 100
          description: Free-text songbook name/abbreviation the requester typed in
          example: Christian Praise
        details:
          type: string
          maxLength: 2000
          description: Why the user wants this song added, or any identifying detail
        email:
          type: string
          format: email
          maxLength: 255
          description: Optional reply-to address
        website:
          type: string
          description: Honeypot — MUST be left empty by real clients

    # -------------------------------------------------------------------------
    # User & auth models
    # -------------------------------------------------------------------------

    User:
      type: object
      description: Public user profile
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john.doe
        display_name:
          type: string
          example: John Doe
        role:
          type: string
          enum: [user, editor, admin, global_admin]
          example: user

    UserWithEmail:
      type: object
      description: User profile including email (returned after profile update)
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john.doe
        display_name:
          type: string
          example: John Doe
        email:
          type: string
          example: john@example.com
        role:
          type: string
          enum: [user, editor, admin, global_admin]

    AuthResponse:
      type: object
      description: Authentication response with token and user info
      properties:
        token:
          type: string
          description: 64-character hex bearer token (valid for 30 days)
          example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
        user:
          $ref: "#/components/schemas/User"

    LinkedProvider:
      type: object
      description: >-
        One external-identity provider linked to the caller's account
        (#1479 W3) — returned by `auth_providers_list` and
        `auth_provider_unlink`. NEVER exposes the Apple `sub` (Subject)
        or `RefreshToken` (see `_authProviderListForUser()`'s docblock).
      properties:
        provider:
          type: string
          example: apple
        email_masked:
          type: string
          description: >-
            Masked form of the email captured at link time (e.g.
            `a****@e****.com`); empty string when no email was
            captured.
          example: a****@e****.com
        is_private_relay:
          type: boolean
          description: >-
            True when `email_masked` is derived from an Apple
            private-relay alias (`@privaterelay.appleid.com`).
        linked_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-09T12:34:56+00:00"

    # -------------------------------------------------------------------------
    # Access & group models
    # -------------------------------------------------------------------------

    UserGroup:
      type: object
      description: A user group with version access flags
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Beta Testers
        accessAlpha:
          type: boolean
          description: Access to alpha builds
        accessBeta:
          type: boolean
          description: Access to beta builds
        accessRc:
          type: boolean
          description: Access to release candidate builds
        accessRtw:
          type: boolean
          description: Access to release-to-web builds

    # -------------------------------------------------------------------------
    # Admin models
    # -------------------------------------------------------------------------

    AdminUser:
      type: object
      description: User record visible to administrators
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john.doe
        email:
          type: string
          nullable: true
        display_name:
          type: string
          example: John Doe
        role:
          type: string
          enum: [user, editor, admin, global_admin]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        group_name:
          type: string
          nullable: true
          description: Name of the user's primary group

    AdminGroup:
      type: object
      description: User group record for administration
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        accessAlpha:
          type: boolean
        accessBeta:
          type: boolean
        accessRc:
          type: boolean
        accessRtw:
          type: boolean

    ActivityLogEntry:
      type: object
      description: A single activity log entry
      properties:
        id:
          type: integer
        action:
          type: string
          description: Action type identifier
        entityType:
          type: string
          nullable: true
          description: Type of entity affected
        entityId:
          type: string
          nullable: true
          description: ID of the entity affected
        details:
          type: object
          nullable: true
          description: Additional structured details (JSON)
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        username:
          type: string
          nullable: true
          description: Username of the actor

    # -------------------------------------------------------------------------
    # Admin write-input shapes (#719 PR 2b)
    # -------------------------------------------------------------------------

    AdminUserCreateInput:
      type: object
      description: |
        Input for `admin_user_create`. The mutation routes through
        `createUser()` in `manage/includes/auth.php`, which hashes
        the password with bcrypt before insert and writes the
        canonical `user.create` activity-log row.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          description: Case preserved on disk; uniqueness check is case-insensitive (utf8mb4_unicode_ci).
        password:
          type: string
          minLength: 8
          format: password
        display_name:
          type: string
          description: Defaults to `username` when blank.
        role:
          type: string
          enum: [user, editor, admin, global_admin]
          default: editor
          description: |
            Hierarchy gate: can never exceed the acting user's role
            level; only `global_admin` can assign `global_admin`.
        email:
          type: string
          format: email

    AdminUserProfileInput:
      type: object
      description: Input for `admin_user_update` (display name + email only).
      required: [user_id, display_name]
      properties:
        user_id:    { type: integer }
        display_name: { type: string }
        email:      { type: string, format: email }

    AdminGroupWriteInput:
      type: object
      description: |
        Input for `admin_group_create` and the metadata half of
        `admin_group_update`. Add `id` (required) for the latter.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        access_alpha: { type: boolean, default: false }
        access_beta:  { type: boolean, default: false }
        access_rc:    { type: boolean, default: false }
        access_rtw:   { type: boolean, default: false }

    AdminTierCapabilities:
      type: object
      description: |
        Capability flags keyed by exact `tblAccessTiers` column
        name. Unknown keys are ignored; missing keys default to
        false. The list mirrors `TIER_CAPS` in
        `includes/access_tier_validation.php` so a new capability
        is a one-line schema + const change.
      properties:
        CanViewLyrics:      { type: boolean, default: false }
        CanViewCopyrighted: { type: boolean, default: false }
        CanPlayAudio:       { type: boolean, default: false }
        CanDownloadMidi:    { type: boolean, default: false }
        CanDownloadPdf:     { type: boolean, default: false }
        CanOfflineSave:     { type: boolean, default: false }
        RequiresCcli:       { type: boolean, default: false }

    AdminTierCreateInput:
      type: object
      description: Input for `admin_tier_create`.
      required: [name, display_name, level]
      properties:
        name:
          type: string
          maxLength: 30
          pattern: "^[A-Za-z0-9_-]+$"
          description: Machine key. Letters / digits / hyphen / underscore. Case preserved.
          example: mwbm-insiders
        display_name:
          type: string
          example: MWBM Insiders
        level:
          type: integer
          minimum: 0
          maximum: 1000
          description: Higher level = more permissions. Bounded so a typo can't elevate one tier above the rest.
        description:
          type: string
        caps:
          $ref: "#/components/schemas/AdminTierCapabilities"

    AdminTierUpdateInput:
      type: object
      description: |
        Input for `admin_tier_update`. The machine `name` is
        intentionally immutable — too many `tblUsers.AccessTier`
        rows reference it for a casual rename. Use a manual SQL
        migration if a rename is genuinely needed.
      required: [id, display_name, level]
      properties:
        id:
          type: integer
        display_name:
          type: string
        level:
          type: integer
          minimum: 0
          maximum: 1000
        description:
          type: string
        caps:
          $ref: "#/components/schemas/AdminTierCapabilities"

    # -------------------------------------------------------------------------
    # Organisation write-input shapes (#719 PR 2c)
    # -------------------------------------------------------------------------

    AdminOrganisationUpdateInput:
      type: object
      description: |
        Input for `admin_organisation_update`. Mirrors the system
        admin's update form on `/manage/organisations`.
        `additional_licences` REPLACES the current
        `tblOrganisationLicences` set for the org; the primary
        `licence_type` is folded in automatically so the two
        surfaces stay coherent.
      required: [id, name, licence_type]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          description: |
            Optional override. When omitted the API derives one
            from `name` via the same lowercase + non-alphanum-→hyphen
            transform `/manage/organisations` uses.
        parent_org_id:
          type: integer
          nullable: true
          description: Cannot equal `id` (an organisation cannot be its own parent).
        description:
          type: string
        licence_type:
          type: string
          enum: [none, ihymns_basic, ihymns_pro, ccli]
          default: none
        licence_number:
          type: string
        is_active:
          type: boolean
          default: false
        additional_licences:
          type: array
          items:
            type: string
            enum: [ihymns_basic, ihymns_pro, ccli]
          description: |
            Replaces the current `tblOrganisationLicences` set for
            this org. The primary `licence_type` is folded in
            automatically — no need to repeat it here.

    AdminOrgMemberInput:
      type: object
      description: |
        Shared input shape for `admin_organisation_member_add`,
        `admin_organisation_member_role_change`, and
        `org_admin_member_role_change`. The org-admin variant uses
        the same body shape with the row-level
        `userCanActOnOrg()` gate applied at the server.
      required: [org_id, user_id]
      properties:
        org_id:
          type: integer
        user_id:
          type: integer
        member_role:
          type: string
          enum: [member, admin, owner]
          default: member

    OrgAdminLicenceAddInput:
      type: object
      description: |
        Input for `org_admin_licence_add`. Per-row licence shape;
        a separate row is created for each licence type the org
        holds. Distinct from the system-admin update path which
        uses the 4-key primary set with `none` sentinel — the
        per-row surface accepts `mrl` and `custom` but not `none`.
      required: [org_id, licence_type]
      properties:
        org_id:
          type: integer
        licence_type:
          type: string
          enum: [ccli, mrl, ihymns_basic, ihymns_pro, custom]
        licence_number:
          type: string
        expires_at:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
          default: false
        notes:
          type: string
          nullable: true

    OrgAdminLicenceChangeInput:
      type: object
      description: Input for `org_admin_licence_change`. licence_type is immutable on a row — to switch types, remove and re-add.
      required: [org_id, licence_id]
      properties:
        org_id:
          type: integer
        licence_id:
          type: integer
        licence_number:
          type: string
        expires_at:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
          default: false
        notes:
          type: string
          nullable: true

    # -------------------------------------------------------------------------
    # Credit-people write-input + diagnostics shapes (#719 PR 2d)
    # -------------------------------------------------------------------------

    CreditPersonLink:
      type: object
      description: |
        One row of the per-person external-link sub-form. Unknown
        `type` keys are silently coerced to `other` server-side —
        keeps the API forward-compatible with future picker
        categories.
      required: [url]
      properties:
        type:
          type: string
          description: Link type key from CREDIT_PERSON_LINK_TYPE_CATALOGUE (e.g. `wikipedia`, `spotify`, `youtube`). Unknown keys → `other`.
          default: other
        url:
          type: string
        label:
          type: string
          nullable: true
        sort_order:
          type: integer
          default: 0

    CreditPersonIpi:
      type: object
      description: One row of the per-person IPI Name Number sub-form.
      required: [number]
      properties:
        number:
          type: string
          description: IPI Name Number (CISAC).
        name_used:
          type: string
          nullable: true
          description: Name variant the IPI is registered under, if it differs from the canonical name.
        notes:
          type: string
          nullable: true

    AdminCreditPersonInput:
      type: object
      description: |
        Shared input for `admin_credit_person_add` and the metadata
        half of `admin_credit_person_update`. Add `id` (required)
        for the latter via `allOf` composition.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        notes:
          type: string
          nullable: true
        birth_place:
          type: string
          nullable: true
        birth_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: YYYY-MM-DD if supplied.
        death_place:
          type: string
          nullable: true
        death_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
        is_special_case:
          type: boolean
          default: false
          description: Mutually exclusive with `is_group`. If both arrive, `is_special_case` wins.
        is_group:
          type: boolean
          default: false
        links:
          type: array
          items:
            $ref: "#/components/schemas/CreditPersonLink"
        ipi:
          type: array
          items:
            $ref: "#/components/schemas/CreditPersonIpi"

    AdminDataHealthResponse:
      type: object
      description: Snapshot returned by `admin_data_health`. Mirrors the panel `/manage/data-health` renders.
      properties:
        database_up:
          type: boolean
        table_counts:
          type: object
          description: |
            Map of canonical table name → row count. `null` when the
            table doesn't exist on this deployment (fresh install
            before migrations).
          additionalProperties:
            type: integer
            nullable: true
        share_dir:
          type: object
          properties:
            configured:        { type: boolean, description: True when APP_SETLIST_SHARE_DIR is defined. }
            present:           { type: boolean, description: True when the directory actually exists on disk. }
            file_count:        { type: integer, nullable: true }
            unimported_count:  { type: integer, description: Files on disk that don't have a matching tblSharedSetlists row. }
            unimported_ids:
              type: array
              items: { type: string }
        legacy_sqlite:
          type: object
          properties:
            present:    { type: boolean }
            size_bytes: { type: integer }

    AdminSchemaAuditRow:
      type: object
      properties:
        col:
          type: string
          description: Column name.
        status:
          type: string
          enum: [ok, missing, uncovered, orphan]
          description: |
            - `ok` — declared in schema.sql AND present in DB.
            - `missing` — in schema.sql, not in DB, but a migration would add it.
            - `uncovered` — in schema.sql, not in DB, no migration adds it (latent bomb).
            - `orphan` — in DB, not in schema.sql.
        migration:
          type: string
          nullable: true
          description: Filename(s) of migrate-*.php that would add this column (set on `missing` rows only).

    AdminSchemaAuditResponse:
      type: object
      description: Result of `admin_schema_audit`. Mirrors `/manage/schema-audit`.
      properties:
        summary:
          type: object
          properties:
            ok:        { type: integer }
            missing:   { type: integer }
            uncovered: { type: integer }
            orphan:    { type: integer }
        by_table:
          type: object
          description: Map of table name → list of per-column audit rows.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AdminSchemaAuditRow"

    AdminMigrationsStatusResponse:
      type: object
      description: Result of `admin_migrations_status`. Per-migration applied / partial / pending status derived from `INFORMATION_SCHEMA`.
      properties:
        summary:
          type: object
          properties:
            pending: { type: integer }
            partial: { type: integer }
            applied: { type: integer }
        migrations:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
                description: Migration script filename (basename only).
              declared_columns:
                type: integer
                description: Total (table, column) pairs this migration is responsible for, derived from ALTER ADD COLUMN statements + CREATE TABLE blocks + `@migration-adds` doctags.
              applied_columns:
                type: integer
                description: How many of those columns currently exist in INFORMATION_SCHEMA.COLUMNS.
              status:
                type: string
                enum: [pending, partial, applied]

    # -------------------------------------------------------------------------
    # Editor-API shared shapes (#719 PR 3)
    # -------------------------------------------------------------------------

    EditorSongInput:
      type: object
      description: |
        One song row in the editor's full-corpus payload (`save`).
        Same shape `save_song` accepts for a single-song UPSERT —
        `save` runs the array straight through. Empty / missing
        `tuneName` and `iswc` (#497) normalise to NULL on the
        server. `language` (#681) accepts the v1 IETF BCP 47 grammar
        (`lang[-Script][-Region]`); malformed tags fall back to `en`
        on the bulk path.
      required: [id, title]
      properties:
        id:
          type: string
          description: SongId, e.g. CP-0202.
        number:
          type: integer
          nullable: true
          description: Null for `Misc` songs or when empty (#392).
        title:        { type: string }
        songbook:     { type: string, description: Songbook abbreviation. }
        songbookName: { type: string }
        language:     { type: string, example: en }
        copyright:    { type: string }
        tuneName:
          type: string
          nullable: true
          description: Optional tune name (#497). Empty / whitespace-only normalises to NULL on the server.
        ccli:         { type: string }
        iswc:
          type: string
          nullable: true
          description: International Standard Musical Work Code (#497).
        verified:           { type: boolean }
        lyricsPublicDomain: { type: boolean }
        musicPublicDomain:  { type: boolean }
        hasAudio:           { type: boolean }
        hasSheetMusic:      { type: boolean }
        writers:     { type: array, items: { type: string } }
        composers:   { type: array, items: { type: string } }
        arrangers:   { type: array, items: { type: string } }
        adaptors:    { type: array, items: { type: string } }
        translators: { type: array, items: { type: string } }
        artists:
          type: array
          items: { type: string }
          description: |
            Performance-recording artists (#587). Silently skipped on
            partly-migrated installs without `tblSongArtists`.
        components:
          type: array
          items:
            type: object
            properties:
              type:  { type: string, example: verse }
              cNum:  { type: integer }
              lines: { type: array, items: { type: string } }
        translations:
          type: array
          description: Translation links for the legacy bulk save path. Each entry adds a tblSongTranslations row.
          items:
            type: object
            properties:
              songId:   { type: string, description: TranslatedSongId. }
              language: { type: string }

    EditorBulkImportSummary:
      type: object
      description: |
        Synchronous-fallback response from `bulk_import_zip` on
        deployments without `tblBulkImportJobs`. Mirrors the same
        counter shape the async job exposes via `bulk_import_status`,
        minus the per-row tracking fields.
      properties:
        songs_created:           { type: integer }
        songs_skipped_existing:  { type: integer, description: Existing rows are NEVER overwritten. }
        songs_failed:            { type: integer }
        songbooks_created:       { type: array, items: { type: string } }
        songbooks_existing:      { type: array, items: { type: string } }
        errors:
          type: array
          items:
            type: object
            properties:
              entry: { type: string }
              error: { type: string }

    EditorBulkImportJob:
      type: object
      description: |
        One row of `tblBulkImportJobs` (#676) as returned by
        `bulk_import_status`. Job rows are scoped per user — a
        curator can only poll their own.
      properties:
        id:                      { type: integer }
        status:
          type: string
          enum: [queued, running, completed, failed]
        filename:                { type: string }
        size_bytes:              { type: integer }
        total_entries:           { type: integer }
        processed_entries:       { type: integer }
        percent:
          type: number
          format: float
          description: Rounded to one decimal place. Zero before the worker starts.
        songs_created:           { type: integer }
        songs_skipped_existing:  { type: integer }
        songs_failed:            { type: integer }
        songbooks_created:       { type: array, items: { type: string } }
        songbooks_existing:      { type: array, items: { type: string } }
        errors:
          type: array
          items:
            type: object
            properties:
              entry: { type: string }
              error: { type: string }
        started_at:    { type: string, nullable: true, format: date-time }
        completed_at:  { type: string, nullable: true, format: date-time }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # Generic response models
    # -------------------------------------------------------------------------

    Error:
      type: object
      description: Error response
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: Something went wrong.

    SuccessResponse:
      type: object
      description: Generic success response
      properties:
        ok:
          type: boolean
          example: true

    # -------------------------------------------------------------------------
    # Licences (#462) — inheritance-aware resolution
    # -------------------------------------------------------------------------

    EffectiveLicence:
      type: object
      description: |
        One row in a user's effective licence set. Produced by
        `getUserEffectiveLicences()` in `includes/licences.php`.
        Same shape whether the licence was held directly, inherited
        from a direct org membership, or inherited via an ancestor
        org walked through `tblOrganisations.ParentOrgId`.
      properties:
        type:
          type: string
          description: Licence type key (e.g. `ccli`, `ihymns_pro`).
          example: ccli
        key:
          type: string
          description: Licence number / key on the licence row (CCLI
            number, iHymns subscription key, or empty when the legacy
            column didn't record one).
          example: "1234567"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiry timestamp in UTC; null = evergreen.
        source:
          type: string
          enum: [user, org]
          description: Which table the row came from.
        source_id:
          type: integer
          description: User ID or org ID the row belongs to.
          example: 17
        inherited:
          type: boolean
          description: True if reached via the ancestor-org walk
            rather than a direct membership / user row.

    # -------------------------------------------------------------------------
    # Notifications (#289)
    # -------------------------------------------------------------------------

    Notification:
      type: object
      description: |
        In-app notification for the authenticated user. Rendered in
        the header bell + dropdown by `js/modules/notifications.js`.
      properties:
        id:
          type: integer
          format: int64
          example: 101
        type:
          type: string
          description: Free-form category (e.g. `song_added`,
            `request_update`, `announcement`) set by whichever
            server-side trigger created the row.
          example: request_update
        title:
          type: string
          example: Your song request has been added
        body:
          type: string
          description: Optional longer text; may be empty.
          example: '"Great Is Thy Faithfulness" is now in Mission Praise.'
        action_url:
          type: string
          description: Deep link to open when the row is clicked.
            Empty string means "no navigation".
          example: /song/MP-0100
        is_read:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: 2026-04-24T14:37:49Z

    # -------------------------------------------------------------------------
    # External Links (#833) and Works (#840)
    # -------------------------------------------------------------------------

    ExternalLink:
      type: object
      description: |
        One curated external link attached to a song / songbook /
        person / work via the per-entity tblXxxExternalLinks tables.
        Joined to tblExternalLinkTypes for the rendering metadata
        (slug, name, category, iconClass) — IsActive=0 link types
        are silently filtered out.
      properties:
        slug:
          type: string
          description: Stable registry slug (e.g. `wikipedia`, `spotify`,
            `imslp`, `musicbrainz-work`).
          example: wikipedia
        name:
          type: string
          description: Display name shown in the public-page button.
          example: Wikipedia
        category:
          type: string
          enum: [official, information, listen, watch, read, sheet-music, purchase, authority, social, other]
          description: Drives which header the link appears under in
            the "Find this … elsewhere" panel.
          example: information
        iconClass:
          type: string
          description: Bootstrap-icons class for the link's button.
          example: bi-wikipedia
        url:
          type: string
          format: uri
          example: https://en.wikipedia.org/wiki/Amazing_Grace
        note:
          type: string
          nullable: true
          description: Optional curator-supplied context (e.g. "1779
            first edition", "sung by King's College Cambridge").
        verified:
          type: boolean
          description: True when a curator has personally checked the
            URL still resolves to the right resource.
        sortOrder:
          type: integer
          description: Within-category ordering hint.

    WorkMember:
      type: object
      description: One song's membership in a Work (#840).
      properties:
        songId:
          type: string
          example: CP-0202
        title:
          type: string
          example: Amazing Grace
        number:
          type: integer
          nullable: true
          example: 202
        songbook:
          type: string
          example: CP
        songbookName:
          type: string
          example: Christian Praise
        isCanonical:
          type: boolean
          description: Curator-marked "preferred" version of the Work.
            Typically zero or one row per Work has this set.
        memberNote:
          type: string
          nullable: true
          description: Optional context for this specific membership
            (e.g. "1779 original", "Hindi translation").

    Work:
      type: object
      description: |
        A composition grouping (#840). Mirrors the MusicBrainz Work
        entity: one Work groups multiple `tblSongs` rows representing
        the same underlying composition across different songbooks /
        arrangements / translations. Works can be nested without
        limit via `parentId`.
      properties:
        id:
          type: integer
          example: 17
        parentId:
          type: integer
          nullable: true
          description: Self-FK enabling unlimited nesting (parent →
            child → grandchild …). Server enforces no cycles at update
            time.
          example: 4
        title:
          type: string
          example: Amazing Grace
        slug:
          type: string
          description: URL-safe identifier used by `/work/<slug>`.
          example: amazing-grace
        iswc:
          type: string
          nullable: true
          description: International Standard Musical Work Code,
            shape `T-NNN.NNN.NNN-C` (15 chars). Optional — many
            traditional / public-domain hymns have no formal ISWC.
          example: T-345.246.800-1
        notes:
          type: string
          nullable: true
        parent:
          type: object
          nullable: true
          description: Header summary of the parent Work (when set).
          properties:
            id:
              type: integer
            title:
              type: string
            slug:
              type: string
            iswc:
              type: string
              nullable: true
        children:
          type: array
          description: Direct children only (one level). Render
            recursively client-side if a deeper tree is needed.
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              slug:
                type: string
              iswc:
                type: string
                nullable: true
        members:
          type: array
          description: Every song that belongs to this Work, ordered
            by IsCanonical DESC then SongbookAbbr / Number.
          items:
            $ref: "#/components/schemas/WorkMember"
        links:
          type: array
          description: External links attached to this Work — same
            categorisation + verification model as Song / Songbook /
            Person links (#833).
          items:
            $ref: "#/components/schemas/ExternalLink"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreditPerson:
      type: object
      description: |
        A person/group credited on one or more songs (writer, composer,
        arranger, adaptor, translator, or artist), returned by
        `?action=credit_person` (#1443/#1444) — the JSON twin of the
        public `/people/<slug>` page's own query logic. `id`/`slug` and
        the bio fields are `null` when no curated `tblCreditPeople` row
        exists yet for this name (a plain writer/composer string tapped
        from a song still returns a usable discography).
      properties:
        id:
          type: integer
          nullable: true
          example: 8
        slug:
          type: string
          nullable: true
          description: URL-safe identifier used by `/people/<slug>`.
          example: john-newton
        name:
          type: string
          example: John Newton
        notes:
          type: string
          nullable: true
        birthPlace:
          type: string
          nullable: true
        birthDate:
          type: string
          nullable: true
          description: Free-text (partial dates, e.g. a year only, are stored as given).
        deathPlace:
          type: string
          nullable: true
        deathDate:
          type: string
          nullable: true
        isSpecialCase:
          type: boolean
          description: Curator flag for names needing special display handling (e.g. "Traditional", "Unknown").
        isGroup:
          type: boolean
          description: True when this credit represents a group/ensemble rather than an individual.
        discography:
          type: array
          description: One entry per role this person has ANY credited songs under (roles with zero matches are omitted).
          items:
            $ref: "#/components/schemas/CreditPersonDiscographyGroup"
        links:
          type: array
          description: External links attached to this person (#833). Empty when no registry row exists, or on a pre-migration deployment.
          items:
            $ref: "#/components/schemas/ExternalLink"
        totalSongs:
          type: integer
          description: Count of distinct songs across every role.
          example: 6

    CreditPersonDiscographyGroup:
      type: object
      description: One role's worth of songs in a CreditPerson's discography.
      properties:
        role:
          type: string
          enum: [writer, composer, arranger, adaptor, translator, artist]
        label:
          type: string
          description: Display label for the role.
          example: As Writer
        songs:
          type: array
          items:
            type: object
            properties:
              songId: { type: string, example: CP-0202 }
              title: { type: string, example: Amazing Grace }
              number: { type: integer, nullable: true, example: 202 }
              songbook: { type: string, example: CP }
              songbookName: { type: string, example: Christian Praise }

    LiveSessionState:
      type: object
      nullable: true
      description: |
        The whitelisted broadcast state hint shared by `live_follow_create`
        / `live_follow_update` / `service_broadcast` (and echoed back by
        their poll/join counterparts). NEVER raw client JSON — only these
        three keys survive server-side validation, each clamped to a safe
        range; an empty/all-invalid input is stored as `null`.
      properties:
        blank:
          type: boolean
          description: Presenter screen is intentionally blanked.
        scrollPct:
          type: number
          minimum: 0
          maximum: 1
          description: Scroll position within the current song, clamped to [0, 1].
        transposeOffset:
          type: integer
          minimum: -12
          maximum: 12
          description: Semitone transpose offset, clamped to [-12, 12].

