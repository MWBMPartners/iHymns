  /api.php?action=print_usage_context:
    get:
      operationId: getPrintUsageContext
      tags: [Songs]
      summary: Should the print/download flow prompt for a CCLI copy count? (#1767 remainder P5)
      description: |
        Server-resolved (never a client claim): `requiresCcli`/`promptCopies`
        are true only when the signed-in caller holds a qualifying CCLI
        licence (`includes/print_usage.php::printUsageResolveCcliLicence()`)
        **and** the requested song carries a non-empty CCLI number to report
        a copy against. Anonymous callers, callers with no CCLI licence, and
        songs with no CCLI number all answer `false` — the print/download
        flow then behaves exactly as it did before this feature existed.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [print_usage_context] }
        - name: song_id
          in: query
          required: false
          description: The song about to be printed/downloaded.
          schema: { type: string, example: MP-0004 }
      responses:
        "200":
          description: Always 200, for any caller (including anonymous).
          content:
            application/json:
              schema:
                type: object
                properties:
                  requiresCcli: { type: boolean }
                  promptCopies: { type: boolean }
                  licenceKey:
                    type: string
                    nullable: true
                    description: The caller's qualifying CCLI licence key, present only when promptCopies is true.

  /api.php?action=print_usage_log:
    post:
      operationId: logPrintUsage
      tags: [Songs]
      summary: Log a CCLI print-usage event (#1767 remainder P5)
      description: |
        Writes one `tblSongUsageEvents` row (`UsageContext='printed'`) via
        the ONE writer, `includes/print_usage.php::printUsageLog()` —
        **only** when the authenticated caller holds a qualifying CCLI
        licence, RE-RESOLVED server-side regardless of what the client
        believes (a prior `print_usage_context` read is advisory only). The
        browser-Print flow calls this action directly; the server-PDF flow
        (`manage/print-pdf.php`) logs in the SAME request that builds the
        file instead, via a `copies` field on that POST — never through this
        action. Best-effort: a failed log never implies the print itself
        failed.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [print_usage_log] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [song_id, copies]
              properties:
                song_id: { type: string, example: MP-0004 }
                copies:
                  type: integer
                  minimum: 1
                  maximum: 10000
                  example: 20
                  description: The count the user was PROMPTED for (owner decision — never inferred from page/click counts).
                surface:
                  type: string
                  enum: [browser, pdf]
                  default: browser
                template_id:
                  type: integer
                  nullable: true
                  description: The curated (`db:<id>`) template used, if any.
                setlist_id:
                  type: string
                  nullable: true
                  description: The set-list this print was made FOR, if any (#1897 W3 — the batch set-list PDF path sends it; a single-song print correctly omits it). Sanitised + clamped to 100 chars server-side; stored on the usage row for report drill-down.
      responses:
        "200":
          description: |
            Always 200 for an authenticated caller — `ok:false` (not an
            error status) covers every reason nothing was written (no
            qualifying licence, un-migrated install, bad input), matching
            this endpoint's fire-and-forget, never-block-the-print posture.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "401":
          description: Authentication required.
        "405":
          description: POST method required.

  /api.php?action=lyrics_ingest:
    post:
      operationId: lyricsIngest
      tags: [Lyrics]
      summary: Ingest timed lyrics (TTML with word + syllable timing)
      description: |
        Accept Apple-Music-style **TTML** (line / word / syllable timing) for a
        song and store it in the normalized lyrics schema (`tblLyrics` →
        `tblLyricLines` → `tblLyricWords` → `tblLyricSyllables`, #1047 / #141).
        Intended for an external pusher such as MeedyaDL (#907).

        - **Auth:** an API key with scope `lyrics:ingest` (mint at
          `/manage/api-keys`). Send `Authorization: Bearer ihk_live_…` or
          `X-API-Key: …`.
        - Ingested lyrics default to `status: pending_review` — a curator
          approves before they go live.
        - Re-ingesting the same `(songId, source)` **replaces** its rows
          (no duplication).
        - Body is JSON `{ songId|title, ttml, … }`, or raw TTML with `?songId=`.

        **Song resolution (#1064):** when `songId` is omitted, the backend
        resolves the song from the metadata — explicit `songId` → exact `isrc`
        → normalized `title` (with an `artist` tiebreak) → else it **creates a
        provisional song** in the `Misc` songbook (`Verified=0`, surfaced at
        `/manage/duplicate-songs` for moderator review). The payload's external
        IDs (`isrc`/`upc`) + artists + provider URLs (`appleMusicUrl`,
        `crossPlatform`) are stored on the song (idempotent add-if-absent) so
        future matches get stronger. The response reports `matched`/`created`.

        **#1749 full unification:** the exact-`isrc` resolve step now ALSO
        matches a song whose ISRC is recorded ONLY in the `tblSongExternalIds`
        store (e.g. a manually-added second recording) — not just
        `tblSongs.Isrc` — so a store-only ISRC resolves here too instead of
        silently falling through to the fuzzy title match. The payload value
        is canonicalised (uppercased, separators stripped) before comparison,
        and ties (two songs legitimately sharing one ISRC) resolve
        deterministically to the lowest `SongId`.
      security:
        - ingestApiKey: []
        - ingestApiKeyHeader: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [lyrics_ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ttml]
              properties:
                songId:
                  type: string
                  description: Explicit tblSongs.SongId. Omit to resolve/create by metadata.
                  example: CP-0271
                ttml:
                  type: string
                  description: The TTML document (Apple-Music word/syllable timing).
                title:
                  type: string
                  description: Song title — the primary match key when songId is absent.
                artist:
                  type: string
                  description: Artist(s) — tiebreak when several titles match; stored on the song.
                album:
                  type: string
                isrc:
                  type: string
                  description: Recording ISRC — exact-match key + stored on tblSongs.Isrc.
                upc:
                  type: string
                durationMs:
                  type: integer
                appleMusicUrl:
                  type: string
                crossPlatform:
                  type: object
                  additionalProperties: { type: string }
                  description: Provider→URL map (spotify, youtubeMusic, genius, musicbrainzRecording, …) stored as song external links.
                source:
                  type: string
                  default: applemusic-ttml
                  description: Provenance label; unique per song with the lyrics record.
                sourceUrl:
                  type: string
                isPrimary:
                  type: boolean
                  description: Make these the canonical lyrics (demotes any other primary).
                isExplicit:
                  type: boolean
                status:
                  type: string
                  enum: [draft, pending_review, approved, rejected, archived]
                  default: pending_review
          application/xml:
            schema:
              type: string
              description: Raw TTML body (use ?songId=… &source=… in the query).
      responses:
        "200":
          description: Lyrics ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  songId: { type: string }
                  matched: { type: boolean, description: matched an existing song }
                  created: { type: boolean, description: a provisional song was created }
                  lyricsId: { type: integer }
                  lines: { type: integer }
                  words: { type: integer }
                  syllables: { type: integer }
                  idsAdded: { type: integer, description: external IDs/URLs added to the song }
                  hasTiming: { type: boolean }
                  hasWordTiming: { type: boolean }
                  hasSyllableTiming: { type: boolean }
                  language: { type: string, nullable: true }
                  status: { type: string }
              example:
                ok: true
                songId: CP-0271
                matched: true
                created: false
                lyricsId: 42
                lines: 24
                words: 180
                syllables: 96
                idsAdded: 3
                hasTiming: true
                hasWordTiming: true
                hasSyllableTiming: true
                language: en
                status: pending_review
        "400":
          description: Missing songId/ttml or bad request
        "401":
          description: Missing / invalid / unscoped API key
        "405":
          description: POST required
        "413":
          description: Payload exceeds the 4 MiB limit
        "422":
          description: TTML parse / write failure (e.g. not a TTML document, unknown song)

