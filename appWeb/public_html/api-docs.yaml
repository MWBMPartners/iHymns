  # ===========================================================================
  # SYSTEM
  # ===========================================================================

  /api.php?action=health:
    get:
      operationId: health
      tags: [System]
      summary: Unauthenticated liveness probe (#1022)
      description: |
        Answers "can this node actually serve?" for an uptime monitor or load
        balancer. Answered ABOVE the normal action dispatch — there is
        deliberately no `case 'health':` in the switch — because
        `new SongData()` opens the MySQL connection in its constructor, and
        this app's mysqli runs under `MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT`
        (`includes/db_mysql.php`), so a failed connect THROWS rather than
        returning falsy. A DB-down probe answered inside the normal dispatch
        would therefore land in the global exception handler instead, which
        on Alpha/Beta discloses the exception message/class/file:line — the
        exact disclosure an unauthenticated endpoint must never make.

        Runs `SELECT 1` — the cheapest round-trip that proves the connection
        is usable end-to-end (connect + prepare/execute + read a row back) —
        and returns `200 {"status":"ok"}` on success or `503
        {"status":"unavailable"}` on any failure (connection error,
        unexpected result, or the app's own maintenance-mode intercept, which
        is NOT bypassed here). Deliberately returns no app version, no
        environment name, no hostname, no schema/table names, no row counts,
        no query timings and no exception text — a two-value enum is the
        entire signal, and `SELECT 1` touches no table so the probe can't be
        turned into a data or schema oracle. Rate-limited to 60/min per
        requester (`enforceReadRateLimit('health', 60)`, fail-open) so it
        can't be used as a free "make the origin touch MySQL" amplifier.
        Responses carry `Cache-Control: no-store` so an intermediary can never
        serve a stale "ok" from a node that has since died.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [health] }
      responses:
        "200":
          description: The node is healthy — the database answered `SELECT 1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
              example:
                status: ok
        "503":
          description: |
            Unhealthy — the database connection failed, answered unexpectedly,
            or the environment is in admin-triggered maintenance mode. A
            `Retry-After` header is included when the failure looks transient
            (connection/availability class) rather than a hard application
            error.
          headers:
            Retry-After:
              description: Present only for a transient (likely-recoverable) failure.
              schema: { type: integer, example: 30 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }
              example:
                status: unavailable
        "405":
          description: Method not allowed — only `GET` and `HEAD` are accepted.
          headers:
            Allow:
              schema: { type: string, example: "GET, HEAD" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }

  # ===========================================================================
  # PUSH NOTIFICATIONS
  # ===========================================================================

  /api.php?action=push_subscribe:
    post:
      operationId: pushSubscribe
      tags: [Push]
      summary: Register a Web Push subscription for the current user
      description: |
        Dormant: no web client subscribes yet and the service worker
        (`service-worker.js.php`) has no `push` event handler yet either,
        so a stored subscription is never sent to. Relates to #1435; the
        endpoint itself is live and writes to `tblPushSubscriptions`, it
        simply has no caller.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [push_subscribe] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string }
                    auth:   { type: string }
      responses:
        "200":
          description: Subscription stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /api.php?action=push_unsubscribe:
    post:
      operationId: pushUnsubscribe
      tags: [Push]
      summary: Remove a Web Push subscription
      description: |
        Dormant: no web client subscribes yet and the service worker
        has no `push` event handler yet either (same #1435 gap as
        `push_subscribe`) — the endpoint itself is live and idempotent,
        it simply has no caller.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [push_unsubscribe] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "200":
          description: Removed (idempotent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  # ===========================================================================
  # APNs BRIDGE (#1410, Apple Phase-2 PR-13) — push-TOKEN REGISTRATION ONLY.
  # Entirely dormant: nothing in this codebase calls includes/apns.php's
  # apnsSend() yet, and even a future caller gets a guaranteed
  # `not_configured` no-op until an owner provisions a real Apple APNs Auth
  # Key. `tblApnsTokens` shipped live-dormant (#1511); every action below is
  # apnsTokensTableExists()-gated.
  # ===========================================================================

  /api.php?action=apns_register:
    post:
      operationId: apnsRegister
      tags: [Push]
      summary: Register (or refresh) an APNs device/Live-Activity push token (#1410)
      description: |
        Requires authentication plus the same-origin CSRF check
        (`validateCsrfRequest()`, rule #29). Rate-limited to 30 / hour per
        user. Upserts on the token's unique key (`ON DUPLICATE KEY
        UPDATE`), so re-registering the same token just refreshes its
        row.

        `kind: liveActivity` tokens are additionally SESSION-SCOPED: the
        referenced `sessionId` must be an active `SessionKind='service'`
        row in the caller's channel, AND the caller must be authorised to
        OPERATE that session (`serviceMode_userCanOperate()` — global/org
        admin, the session's host, or an org-admin of the session's org)
        — otherwise `403`. This closes a gap where any authenticated user
        could otherwise register a token against any active session by
        guessing its numeric id. Ordinary `kind: device` tokens are not
        session-scoped and skip this check entirely.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [apns_register] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties:
                pushToken:
                  type: string
                  description: Hex-encoded APNs device token, 32-200 chars, even length.
                apnsEnv:
                  type: string
                  enum: [sandbox, production]
                  default: production
                  description: An unrecognised value silently falls back to `production` rather than rejecting the request.
                kind:
                  type: string
                  enum: [device, liveActivity]
                  default: device
                  description: An unrecognised value silently falls back to `device`.
                sessionId:
                  type: integer
                  description: Required (and validated) only when `kind` is `liveActivity`.
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Invalid/missing pushToken, or missing sessionId for kind=liveActivity
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate), or (for kind=liveActivity) not authorised to operate the referenced session
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: kind=liveActivity referenced an unknown or ended session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Push registration is not available yet (tblApnsTokens not migrated), or the upsert failed — retry
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=apns_unregister:
    post:
      operationId: apnsUnregister
      tags: [Push]
      summary: Remove an APNs push token (#1410)
      description: |
        Requires authentication plus the same-origin CSRF check
        (`validateCsrfRequest()`, rule #29). Rate-limited to 30 / hour per
        user. Own-only (`WHERE UserId = ?`). On an un-migrated install
        (no `tblApnsTokens`) returns `{ok: true}` — nothing to unregister
        — rather than a `503`, since this is a cleanup call a client may
        fire during sign-out regardless of migration state.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [apns_unregister] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties:
                pushToken:
                  type: string
                  description: Hex-encoded APNs device token, 32-200 chars, even length.
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Removed (idempotent — `ok:true` whether or not a matching token existed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Invalid/missing pushToken
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  # ===========================================================================
  # EDITOR API  (separate entry point — /manage/editor/api.php)
  # ===========================================================================

  /manage/editor/api.php?action=songbook_export:
    get:
      operationId: editorSongbookExport
      tags: [Editor API]
      summary: Export one songbook's songs as a JSON bundle (WS-J #1020)
      description: |
        DB-direct per-songbook export used by /manage/songbooks.php. Returns
        only the requested songbook's songs (the full importable shape) plus
        its songbook record for the export filename. Replaces the old
        whole-corpus ?action=load. Auth is the `/manage/` PHP session.
      parameters:
        - name: abbr
          in: query
          required: true
          schema: { type: string, example: CP }
      responses:
        "200":
          description: Songbook bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items: { $ref: "#/components/schemas/Song" }
                  songbook:
                    type: object
                    nullable: true
        "400":
          description: Missing or invalid abbr
        "401":
          description: Not authenticated (redirect the user to /manage/login)
        "403":
          description: Authenticated but not an editor

  /manage/editor/api.php?action=save_song:
    post:
      operationId: editorSaveSong
      tags: [Editor API]
      summary: Transactional UPSERT of one song (#394)
      description: |
        Writes `tblSongs` + children in a transaction and records one row
        in `tblSongRevisions` with `PreviousData` / `NewData` snapshots.
        The editor calls this per modified song — much cheaper than the
        legacy full-corpus `save`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, title]
              properties:
                id:              { type: string, example: CP-0202 }
                title:           { type: string }
                number:
                  type: integer
                  nullable: true
                  description: Null for `Misc` songs or when empty (#392)
                songbook:        { type: string }
                songbookName:    { type: string }
                language:        { type: string, example: en }
                copyright:       { type: string }
                ccli:            { type: string }
                verified:            { type: boolean }
                lyricsPublicDomain:  { type: boolean }
                musicPublicDomain:   { type: boolean }
                hasAudio:            { type: boolean }
                hasSheetMusic:       { type: boolean }
                components:
                  type: array
                  items:
                    type: object
                    properties:
                      type:  { type: string, example: verse }
                      cNum:  { type: integer }
                      lines: { type: array, items: { type: string } }
      responses:
        "200":
          description: Saved; revision logged
        "400":
          description: Missing required id/title
        "500":
          description: Save failed; details in server log

  /manage/editor/api.php?action=bulk_tag:
    post:
      operationId: editorBulkTag
      tags: [Editor API]
      summary: Add and/or remove tags across a list of songs (#399)
      description: |
        Transactional. ADDs upsert `tblSongTags` (with slug) and
        INSERT-IGNORE into `tblSongTagMap`. REMOVEs resolve by tag name
        and delete matching mapping rows. Unknown tag names on remove
        are silently ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songIds]
              properties:
                songIds:
                  type: array
                  items: { type: string, example: CP-0202 }
                add:
                  type: array
                  items: { type: string, example: Easter }
                remove:
                  type: array
                  items: { type: string, example: Funeral }
      responses:
        "200":
          description: Summary of what changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  songsAffected: { type: integer }
                  added:         { type: integer, description: Rows actually inserted }
                  removed:       { type: integer, description: Rows actually deleted }
        "400":
          description: No valid songIds or no tag changes supplied

  /manage/editor/api.php?action=list_revisions:
    get:
      operationId: editorListRevisions
      tags: [Editor API]
      summary: List revisions for one song (#400)
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [list_revisions] }
        - name: songId
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Revision list, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:           { type: integer }
                        action:       { type: string, enum: [create, edit, restore, delete] }
                        createdAt:    { type: string, format: date-time }
                        userId:       { type: integer, nullable: true }
                        username:     { type: string, nullable: true }
                        previousData: { type: object, nullable: true }
                        newData:      { type: object, nullable: true }

  /manage/editor/api.php?action=restore_revision:
    post:
      operationId: editorRestoreRevision
      tags: [Editor API]
      summary: Restore a song to the state BEFORE a given revision (#400)
      description: |
        Rewrites the core `tblSongs` row from the chosen revision's
        `PreviousData` and records a new revision with `Action='restore'`
        whose `PreviousData` captures the state just-overwritten.
        Transactional — rolls back on any failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionId]
              properties:
                revisionId: { type: integer, example: 4712 }
      responses:
        "200":
          description: Restored; new revision row's id is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:            { type: boolean }
                  songId:        { type: string }
                  newRevisionId: { type: integer }
        "404":
          description: Revision id not found
        "409":
          description: This revision has no prior state (it's the initial create)

  /manage/editor/api.php?action=save:
    post:
      operationId: editorSaveAll
      tags: [Editor API]
      summary: Legacy full-corpus save — TRUNCATE + bulk INSERT
      description: |
        TRUNCATEs `tblSongs` / `tblSongbooks` and the five song-credit
        tables, then re-inserts everything from the posted JSON. Used
        by the bulk-import paths and the editor's "save all" button.
        Per-song validation is soft on this path — a malformed IETF
        BCP 47 tag (#681) falls back to `en` rather than aborting the
        whole corpus save. Use `save_song` for the per-song
        UPSERT-with-revision flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meta, songbooks, songs]
              properties:
                meta:
                  type: object
                  description: Free-form metadata block (version, generated_at, …).
                songbooks:
                  type: array
                  items:
                    type: object
                    required: [id, name]
                    properties:
                      id:        { type: string, description: Songbook abbreviation. }
                      name:      { type: string }
                      songCount: { type: integer }
                songs:
                  type: array
                  items:
                    $ref: "#/components/schemas/EditorSongInput"
      responses:
        "200":
          description: Save succeeded; counts echoed back
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:   { type: boolean, example: true }
                  songs:     { type: integer }
                  songbooks: { type: integer }
        "400":
          description: Invalid JSON, missing top-level keys, or empty body
        "405":
          description: GET issued — POST required
        "500":
          description: Save failed (transaction rolled back). Details in server log.

  /manage/editor/api.php?action=get_translations:
    get:
      operationId: editorGetTranslations
      tags: [Editor API]
      summary: Translation links for one song (#352)
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [get_translations] }
        - name: id
          in: query
          required: true
          description: Source SongId.
          schema: { type: string, example: CP-0202 }
      responses:
        "200":
          description: Translations of the source song, sorted by language
          content:
            application/json:
              schema:
                type: object
                properties:
                  translations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: integer }
                        songId:      { type: string, description: TranslatedSongId. }
                        language:    { type: string }
                        translator:  { type: string, nullable: true }
                        verified:    { type: boolean }
                        title:       { type: string }
                        number:      { type: integer }
        "400":
          description: Missing id

  /manage/editor/api.php?action=add_translation:
    post:
      operationId: editorAddTranslation
      tags: [Editor API]
      summary: Add (or upsert) a translation link
      description: |
        INSERT … ON DUPLICATE KEY UPDATE on the unique
        (`SourceSongId`, `TargetLanguage`) index — re-adding
        for the same source/language updates the
        `TranslatedSongId` + `Translator` in place.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceSongId, translatedSongId, language]
              properties:
                sourceSongId:     { type: string, example: CP-0202 }
                translatedSongId: { type: string, example: ZH-0027 }
                language:         { type: string, description: BCP 47 tag of the translated row. }
                translator:       { type: string, nullable: true }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
        "400":
          description: Missing fields, or sourceSongId == translatedSongId
        "405":
          description: GET issued — POST required

  /manage/editor/api.php?action=remove_translation:
    post:
      operationId: editorRemoveTranslation
      tags: [Editor API]
      summary: Remove one translation-link row by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer, description: tblSongTranslations.Id }
      responses:
        "200":
          description: Removed (or already absent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  deleted: { type: integer, description: Affected rows (0 if id didn't exist). }
        "400":
          description: Missing or non-positive id

  /manage/editor/api.php?action=song_tags:
    get:
      operationId: editorSongTags
      tags: [Editor API]
      summary: Tags currently on one song (#496)
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_tags] }
        - name: id
          in: query
          required: true
          description: SongId.
          schema: { type: string }
      responses:
        "200":
          description: Tag list, alphabetical by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: integer }
                        name:        { type: string }
                        slug:        { type: string }
                        description: { type: string, nullable: true }
        "400":
          description: Missing id

  /manage/editor/api.php?action=tag_search:
    get:
      operationId: editorTagSearch
      tags: [Editor API]
      summary: Tag-name autocomplete (#496)
      description: |
        Empty `q` returns the most-used tags (the empty-state list).
        Otherwise `LIKE %q%` on `tblSongTags.Name`. `usage` is the
        number of songs currently carrying the tag, so popular tags
        sort first and curators don't accidentally coin a
        near-duplicate.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [tag_search] }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Suggestion list, sorted by usage DESC then name ASC
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: integer }
                        name:  { type: string }
                        slug:  { type: string }
                        usage: { type: integer, description: Number of songs currently carrying this tag. }

  /manage/editor/api.php?action=credit_search:
    get:
      operationId: editorCreditSearch
      tags: [Editor API]
      summary: Live-search credit names across the 5 song-credit tables (#545)
      description: |
        UNION ALL across `tblSongWriters` / `tblSongComposers` /
        `tblSongArrangers` / `tblSongAdaptors` / `tblSongTranslators`,
        grouping by name so the same person from multiple roles
        collapses to a single suggestion with combined usage and the
        list of kinds they appear in. When `kind=any` (the default),
        also surfaces names from the `tblCreditPeople` registry that
        no song currently cites — those land with `usage=0` and a
        `kinds=["registry"]` marker.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [credit_search] }
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [any, writer, composer, arranger, adaptor, translator]
            default: any
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Suggestions, sorted by usage DESC then name ASC
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        name:  { type: string }
                        usage: { type: integer }
                        kinds:
                          type: array
                          items:
                            type: string
                            enum: [writer, composer, arranger, adaptor, translator, registry]
        "400":
          description: Unknown kind

  /manage/editor/api.php?action=user_search:
    get:
      operationId: editorUserSearch
      tags: [Editor API]
      summary: Live-search users by display name or username (#498)
      description: |
        `LIKE %q%` against `DisplayName` OR `Username`. Used by the
        `/manage/restrictions` name-first picker to resolve a
        human-friendly label to the canonical `tblUsers.Id` on save.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_search] }
        - name: q
          in: query
          required: false
          description: Empty string → empty suggestions list (no implicit "show all users" fallback).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Suggestion list, alphabetic by display name
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: integer }
                        label: { type: string, description: DisplayName, falling back to Username. }
                        hint:  { type: string, description: "Format: `@<username> · <role>`" }

  /manage/editor/api.php?action=org_search:
    get:
      operationId: editorOrgSearch
      tags: [Editor API]
      summary: Live-search organisations by name or slug (#498)
      description: |
        Active organisations only. Empty `q` returns the alphabetised
        list of every active org (capped at `limit`). Otherwise
        `LIKE %q%` against `Name` OR `Slug`.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [org_search] }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Suggestion list, alphabetic by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: integer }
                        label: { type: string, description: Organisation name. }
                        hint:  { type: string, description: "Format: `licence: <type> · slug: <slug>`" }

  /manage/editor/api.php?action=bulk_import_zip:
    post:
      operationId: editorBulkImportZip
      tags: [Editor API]
      summary: Bulk-load songs and songbooks from a ZIP (#664, #676)
      description: |
        Multipart upload, single field `zip`. The archive is expected
        to mirror the `.SourceSongData/` folder layout: one folder
        per songbook named `<Hymnal Name> [<ABBREV>]/` holding one
        `.txt` file per song named
        `<#> (<ABBREV>) - <Title>.txt` in the established source
        format (title line, blank, alternating section markers +
        lyric blocks).

        Async by default when `tblBulkImportJobs` exists (#676): the
        endpoint returns a `job_id` immediately and the import runs
        in a freed worker; poll `bulk_import_status` for progress.
        Pre-migration deployments fall back to the synchronous path
        and respond with the legacy summary shape.

        **INSERT-ONLY:** the import never overwrites existing
        `tblSongbooks` / `tblSongs`. Pre-flight existence checks +
        three-counter response shape (`songs_created` /
        `songs_skipped_existing` / `songs_failed`).

        Auth: editor+ via the `/manage/` PHP session. Per-user
        quota + 100 MB hard size cap.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [zip]
              properties:
                zip:
                  type: string
                  format: binary
                  description: A `.zip` archive ≤ 100 MB.
      responses:
        "200":
          description: |
            Two possible shapes depending on async readiness.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: AsyncJobAccepted
                    description: Returned when tblBulkImportJobs is migrated.
                    properties:
                      ok:        { type: boolean, example: true }
                      async:     { type: boolean, example: true }
                      job_id:    { type: integer, description: Pass to bulk_import_status to poll. }
                      status:    { type: string, enum: [queued] }
                      poll_url:
                        type: string
                        example: "/manage/editor/api?action=bulk_import_status&job_id=42"
                  - $ref: "#/components/schemas/EditorBulkImportSummary"
        "400":
          description: No file received, or upload error from PHP (`phpError` echoes UPLOAD_ERR_*)
        "405":
          description: GET issued — POST multipart required
        "413":
          description: Uploaded zip exceeds the 100 MB import limit
        "500":
          description: Server is missing the PHP zip extension, or import threw

  /manage/editor/api.php?action=bulk_import_status:
    get:
      operationId: editorBulkImportStatus
      tags: [Editor API]
      summary: Poll one async bulk-import job (#676)
      description: |
        Auth: editor+ AND the row's `UserId` must equal the caller's
        — one curator can only poll their own jobs even though
        `/manage/editor/api.php` is a shared endpoint.

        Pre-migration deployments (no `tblBulkImportJobs`) return
        404 with `migration_needed: true` so the frontend can fall
        back to the synchronous flow without surprising the user.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [bulk_import_status] }
        - name: job_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Job snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:  { type: boolean, example: true }
                  job:
                    $ref: "#/components/schemas/EditorBulkImportJob"
        "400":
          description: Missing job_id
        "404":
          description: |
            Either job not found / not owned by the caller, or
            `tblBulkImportJobs` doesn't exist (response includes
            `migration_needed: true`).

