  /api.php?action=song_detail:
    get:
      operationId: getSongDetail
      tags: [Songs]
      summary: Get full song data (alias of song_data)
      description: |
        Identical to `action=song_data` — same handler in api.php. Retained as
        the name `songs_list` points callers to for fetching a full record
        after a paginated index hit (#1012). Returns the complete song with
        lyrics components, writers, composers and metadata. Subject to the same
        read rate limit and content gating (#1353) as `song_data`.

        PERMALINK REDIRECTS (#1343 / #1679) — documented identically on
        `song_data`, which is the SAME handler, not a different one. If `id`
        names a song that has since been merged, deleted or MOVED to another
        songbook (a move re-keys the SongId to the new book's prefix), this
        endpoint follows the redirect chain instead of 404-ing: it returns the
        CURRENT record plus
        `redirectedFrom` set to the id you asked for. Persist the new
        `song.id` — the old one will keep working, but only via this hop.
        A song removed with no replacement answers **410 Gone** (as opposed to
        404 "never existed"), which is the signal to prune it from a local
        cache. `redirectedFrom` is OMITTED on a normal read, so the happy-path
        shape is unchanged.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_detail] }
        - name: id
          in: query
          required: true
          description: |
            Song ID in BOOK-NUMBER format (e.g. CP-0001), OR — as of **#1860**
            — the song's permanent internal id (`ILS` + up to 10 digits, no
            separator, e.g. `ILS0000012345`). Same handler as `song_data`;
            see that entry's `id` parameter for the full resolution note.
          schema: { type: string, example: CP-0001 }
        - name: include
          in: query
          required: false
          description: |
            (#1099) Opt-in comma-separated enrichment blocks — IDENTICAL to
            `song_data`'s, because this is the same handler (api.php reads
            `$_GET['include']` once, in the shared `case 'song_detail':
            case 'song_data':` body). It was documented only on `song_data`
            until #1679 A13c, which meant the endpoint `songs_list` actually
            points callers at was the one whose enrichment parameter was
            invisible. Omitted = the base payload (back-compatible); unknown
            blocks are ignored; a block appears only when the song has that data.
            Allow-list: `tune`, `media`, `arrangements`, `royaltyIds`,
            `scriptureRefs`, `vocalParts`, `translations`, `annotations`,
            `externalIds` (#1750).
          schema: { type: string, example: "tune,media,vocalParts,scriptureRefs" }
      responses:
        "200":
          description: Full song data (plus any requested + available include blocks)
          content:
            application/json:
              schema:
                type: object
                properties:
                  song:
                    $ref: "#/components/schemas/Song"
                  redirectedFrom:
                    type: string
                    description: >-
                      Present ONLY when the requested id was a dead permalink
                      that resolved to this song (#1343/#1679). Holds the id
                      that was requested; `song.id` is the current one.
                    example: MP-1008
        "400":
          description: Missing song ID
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "410":
          description: >-
            Song removed — the id resolved to a redirect tombstone (merged or
            deleted with no replacement). Prune it locally (#1343/#1679). The
            body carries `gone: true` alongside `error`.
          content: { application/json: { schema: { $ref: "#/components/schemas/SongGone" } } }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api.php?action=songs_list:
    get:
      operationId: songsList
      tags: [Songs]
      summary: Lightweight paginated song index (WS-A #1012)
      description: |
        Paginated, language-filtered slim index — id/number/title/songbook/
        songbookName/language + media flags only (no lyrics, writers or
        components). The language filter is applied in SQL so pagination is
        correct. Fetch a full record via action=song_detail&id=…

        Dormant: undocumented-as-such API-parity spillover — no web/Apple/Android
        client calls this today (orphan inventory §2.5, remediation X7). The PWA
        uses `songs_index` for its lightweight index instead. The endpoint is
        live and correct; it simply has no first-party caller yet.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [songs_list] }
        - name: songbook
          in: query
          required: false
          description: Filter by songbook abbreviation
          schema: { type: string, example: CP }
        - name: limit
          in: query
          required: false
          description: Rows per page (clamped server-side to 1..500)
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: One page of the slim song index
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:            { type: string, example: CP-0202 }
                        number:        { type: integer, nullable: true, example: 202 }
                        title:         { type: string, example: Amazing Grace }
                        songbook:      { type: string, example: CP }
                        songbookName:  { type: string, example: Christian Praise }
                        language:      { type: string, example: en }
                        hasAudio:      { type: boolean }
                        hasSheetMusic: { type: boolean }
                  total:   { type: integer, description: Total rows matching the filter (before paging), example: 650 }
                  offset:  { type: integer, example: 0 }
                  limit:   { type: integer, example: 50 }
                  hasMore: { type: boolean, description: True when (offset + page length) < total, example: true }

