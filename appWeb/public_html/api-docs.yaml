          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password changed successfully.
        "400":
          description: New password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated or wrong current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=auth_forgot_password:
    post:
      operationId: forgotPassword
      tags: [Authentication]
      summary: Request password reset
      description: |
        Request a password reset token. Accepts a username or email. Always
        returns HTTP 200 to prevent user enumeration.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [auth_forgot_password]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: Username or email address
                  example: john.doe
      responses:
        "200":
          description: Reset token generated (always returns 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: If an account exists with that username or email, a reset link has been generated.
        "400":
          description: Missing username/email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=auth_reset_password:
    post:
      operationId: resetPassword
      tags: [Authentication]
      summary: Reset password with token
      description: Reset a user's password using a valid reset token obtained via `auth_forgot_password`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [auth_reset_password]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Password reset token
                password:
                  type: string
                  format: password
                  description: New password (minimum 8 characters)
                  minLength: 8
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Password reset successfully. Please sign in with your new password.
        "400":
          description: Invalid or expired token, or password too short
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===========================================================================
  # EMAIL LOGIN (PASSWORDLESS)
  # ===========================================================================

  /api.php?action=auth_email_login_request:
    post:
      operationId: authEmailLoginRequest
      tags: [Authentication]
      summary: Request an email login link/code
      description: |
        Sends a magic link and 6-digit code to the given email address.
        The code expires after 10 minutes. Always returns 200 to prevent
        email enumeration. Rate-limited to 5 requests per email per hour.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [auth_email_login_request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        "200":
          description: Request accepted (always 200, even if email not found)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "A login code has been sent to your email address. It expires in 10 minutes."
        "400":
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=auth_email_login_verify:
    post:
      operationId: authEmailLoginVerify
      tags: [Authentication]
      summary: Verify an email login token or code
      description: |
        Validates the token (from the magic link URL) or the email + 6-digit code
        and returns a bearer token. If the email doesn't have an existing account,
        a new user account is auto-created.

        Two verification modes:
        - **Magic link**: provide `token` (48-char hex from the email link)
        - **Code entry**: provide `email` + `code` (6-digit number from the email)
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [auth_email_login_verify]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 48-char hex token from the magic link (mode 1)
                  example: "a1b2c3d4e5f6..."
                email:
                  type: string
                  format: email
                  description: Email address the code was sent to (mode 2)
                  example: user@example.com
                code:
                  type: string
                  pattern: "^\\d{6}$"
                  description: 6-digit code from the email (mode 2)
                  example: "482917"
      responses:
        "200":
          description: Login successful — returns bearer token and user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Missing token or email+code combination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid or expired token/code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===========================================================================
  # DEVICE-CODE PAIRING (RFC 8628, #1407) — sign in a limited-input client
  # (tvOS today) that cannot type a username/password: it mints a
  # device_code (kept secret, polled with) + a short user_code (shown
  # on-screen); a human enters that user_code at /link on a device they're
  # already signed into and approves/denies; the limited-input client keeps
  # polling until it gets back a normal iHymns bearer token.
  #
  # `tblAuthDeviceCodes` shipped live-dormant (#1511) — every action below
  # is gated on authDeviceCodesTableExists() and degrades to 503 on an
  # un-migrated install rather than a STRICT-mode mysqli error.
  # ===========================================================================

  /api.php?action=auth_device_code_request:
    post:
      operationId: authDeviceCodeRequest
      tags: [Authentication]
      summary: Start a device-code pairing flow (RFC 8628 §3.1, #1407)
      description: |
        Anonymous — no identity exists yet, that's the whole point of the
        flow. Mints a secret `device_code` (for the limited-input client
        to poll with) and a short, human-typeable `user_code` (shown
        on-screen for a human to enter at `/link`). No request body.
        Rate-limited to 20 mints / hour per IP (necessarily per-IP, since
        there is no caller identity to key on yet).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [auth_device_code_request] }
      responses:
        "200":
          description: Pairing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code:
                    type: string
                    description: Secret — the polling credential. Never shown to the human.
                  user_code:
                    type: string
                    example: ABCD-EFGH
                    description: Short Crockford-base32 code (XXXX-XXXX) for a human to type at `/link`.
                  verification_uri:
                    type: string
                    format: uri
                    example: https://ihymns.app/link
                  verification_uri_complete:
                    type: string
                    format: uri
                    description: verification_uri with `?user_code=` pre-filled, for a QR code / deep link.
                  expires_in:
                    type: integer
                    description: Seconds until the device_code/user_code expire.
                    example: 300
                  interval:
                    type: integer
                    description: Minimum seconds between poll calls.
                    example: 5
        "405":
          description: POST method required
        "503":
          description: Device pairing is not available yet (tblAuthDeviceCodes not migrated), or the mint failed — retry
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=auth_device_code_poll:
    post:
      operationId: authDeviceCodePoll
      tags: [Authentication]
      summary: Poll a device code for approval (RFC 8628 §3.4, #1407)
      description: |
        Anonymous — gated only by knowing the secret `device_code`.
        Rate-limited PER DEVICE-CODE (hashed), never per-IP, since several
        limited-input devices can legitimately share one IP (e.g. a
        church media room) — 120 polls / 60s. Every poll bumps
        `PollCount`/`LastPolledAt` regardless of outcome.

        An unknown device_code and an expired one return the SAME
        `expired_token` error (RFC 8628 §3.5 anti-probe). On success, mints
        the SAME kind of bearer token `auth_login` does and atomically
        marks the code `consumed` — a concurrent second poll for the same
        code, or a replay after success, gets `expired_token` too.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [auth_device_code_poll] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
                  description: 64-char lowercase hex, from `auth_device_code_request`.
      responses:
        "200":
          description: Approved — signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: |
            One of RFC 8628's polling states, all returned as `400` with
            `{error: "<code>"}`: `invalid_request` (malformed device_code),
            `authorization_pending` (still waiting for a human),
            `slow_down` (polled faster than `interval`), `access_denied`
            (human denied it, or the approved account is no longer active),
            `expired_token` (unknown / expired / already-consumed code —
            opaque, same message for all three).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: temporarily_unavailable — tblAuthDeviceCodes not migrated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=auth_device_code_link_lookup:
    get:
      operationId: authDeviceCodeLinkLookup
      tags: [Authentication]
      summary: Look up a pending user_code before approving/denying it (#1407)
      description: |
        Backs the `/link` page — lets the signed-in human confirm the code
        they typed is genuinely pending (and see how long it has left)
        before choosing approve/deny. Requires authentication (any signed-in
        user may look up any pending code — the approve/deny step is what's
        gated to acting on the caller's own account). Rate-limited (shared
        budget with approve/deny) to 10 attempts / 600s per IP, keyed per
        user. Unknown / already-resolved / expired codes all return the
        SAME `not_found` (anti-probe).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [auth_device_code_link_lookup] }
        - name: user_code
          in: query
          required: true
          description: Accepts either XXXXXXXX or XXXX-XXXX; case-insensitive.
          schema: { type: string, example: ABCD-EFGH }
      responses:
        "200":
          description: |
            `{ok: true, userCode, expiresIn}` when pending, or
            `{ok: false, error: "not_found"}` — both are HTTP 200 (the
            client branches on `ok`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  userCode: { type: string }
                  expiresIn: { type: integer, description: Seconds remaining. }
                  error: { type: string }
        "400":
          description: Missing/malformed user_code
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string, example: invalid_code } } } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: Device pairing is not available yet (tblAuthDeviceCodes not migrated)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=auth_device_code_approve:
    post:
      operationId: authDeviceCodeApprove
      tags: [Authentication]
      summary: Approve a pending device-code pairing (#1407)
      description: |
        The human's confirmation step at `/link`: approves the `user_code`
        for the CALLER'S OWN account (the poller then gets a bearer token
        for this account). Requires authentication plus the same-origin
        CSRF check (`validateCsrfRequest()`, rule #29). Shares the
        `auth_device_code_link` rate-limit budget with `_link_lookup` /
        `_deny` (10 / 600s, keyed per authenticated user).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [auth_device_code_approve] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
                  example: ABCD-EFGH
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Missing/malformed user_code
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string, example: invalid_code } } } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "That code isn't active — unknown, already resolved, or expired"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string, example: "That code isn't active. Check the device and try again." }
        "405":
          description: POST method required
        "503":
          description: Device pairing is not available yet (tblAuthDeviceCodes not migrated)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=auth_device_code_deny:
    post:
      operationId: authDeviceCodeDeny
      tags: [Authentication]
      summary: Deny a pending device-code pairing (#1407)
      description: |
        Same request/response contract, auth requirement, CSRF gate, and
        shared rate-limit budget as `auth_device_code_approve` — the ONLY
        difference is the code is marked `denied` instead of `approved`
        (the poller then gets `access_denied`).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [auth_device_code_deny] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
                  example: ABCD-EFGH
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Denied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Missing/malformed user_code
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string, example: invalid_code } } } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: "That code isn't active — unknown, already resolved, or expired"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string, example: "That code isn't active. Check the device and try again." }
        "405":
          description: POST method required
        "503":
          description: Device pairing is not available yet (tblAuthDeviceCodes not migrated)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ===========================================================================
  # DEVICE MANAGEMENT (#1409, Apple Phase-2 PR-12) — list + remote sign-out of
  # a user's OWN signed-in devices. `tblApiTokens.DeviceName/Platform/
  # AppVersion/LastSeenAt` shipped live-dormant (#1511); every action below
  # is apiTokensDeviceMetaColumnsExist()-gated and degrades to a graceful
  # empty list (never an error) on an un-migrated install. The device "id"
  # handed to the client is a truncated hash prefix — NEVER the raw token,
  # NEVER the full stored hash.
  # ===========================================================================

  /api.php?action=devices_list:
    get:
      operationId: devicesList
      tags: [Authentication]
      summary: List the caller's own signed-in devices (#1409)
      description: |
        Returns every non-expired `tblApiTokens` row for the caller,
        newest-active first, with a truncated hash-derived `id` (never the
        raw token) so the client can offer per-device remote sign-out via
        `device_signout`. `isCurrent` flags the token this very request
        authenticated with. Degrades to `{devices: []}` (not an error) on
        an un-migrated install.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [devices_list] }
      responses:
        "200":
          description: The caller's devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: string, description: Truncated hash-derived device id (never the raw token). }
                        deviceName: { type: string, nullable: true }
                        platform:   { type: string, nullable: true }
                        appVersion: { type: string, nullable: true }
                        lastSeenAt: { type: string, format: date-time, nullable: true }
                        createdAt:  { type: string, format: date-time }
                        expiresAt:  { type: string, format: date-time }
                        isCurrent:  { type: boolean, description: True for the token this request itself authenticated with. }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=device_signout:
    post:
      operationId: deviceSignout
      tags: [Authentication]
      summary: Remotely sign out one of the caller's own devices (#1409)
      description: |
        Own-only — the DELETE's `WHERE UserId = ?` clause means this can
        never touch another user's token, regardless of what `id` is
        supplied. Requires authentication plus the same-origin CSRF check
        (`validateCsrfRequest()`, rule #29). Rate-limited to 30 / hour per
        user. Best-effort also clears any APNs push tokens for the caller
        (#1429 F3b — "push tokens deleted on sign-out"), wrapped so that
        cleanup failure never turns a successful sign-out into a 500.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [device_signout] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: The device `id` from `devices_list` (16-char lowercase hex).
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Invalid device id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown device (already signed out, or belongs to a different user)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  # ===========================================================================
  # USER ACCESS
  # ===========================================================================

  /api.php?action=user_access:
    get:
      operationId: getUserAccess
      tags: [User Access]
      summary: Get user access level
      description: |
        Retrieve the authenticated user's group memberships and effective
        access permissions. Access flags control which app versions (alpha,
        beta, RC, RTW) the user can access.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [user_access]
      responses:
        "200":
          description: User access information
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserGroup"
                  effectiveAccess:
                    type: object
                    description: Union of permissions across all user groups
                    properties:
                      alpha:
                        type: boolean
                      beta:
                        type: boolean
                      rc:
                        type: boolean
                      rtw:
                        type: boolean
                    example:
                      alpha: false
                      beta: true
                      rc: true
                      rtw: true
                  role:
                    type: string
                    description: User's role
                    enum: [user, editor, admin, global_admin]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=app_status:
    get:
      operationId: getAppStatus
      tags: [User Access]
      summary: Get app status
      description: |
        Retrieve public application status flags. No authentication required.
        Used by the PWA on startup to check for maintenance mode and
        feature availability.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [app_status]
      responses:
        "200":
          description: App status
          content:
            application/json:
              schema:
                type: object
                properties:
                  maintenance:
                    type: boolean
                    description: Whether the app is in maintenance mode (WS-K #1021). Always returned 200 even during maintenance so the PWA can learn the flag + show a banner.
                    example: false
                  maintenanceMessage:
                    type: string
                    description: Optional admin-set message shown on the maintenance banner/page (empty = default text).
                    example: ""
                  songRequestsEnabled:
                    type: boolean
                    description: Whether song requests are currently accepted
                    example: true
                  registrationMode:
                    type: string
                    description: Account-registration mode (e.g. open / invite / closed).
                    example: open
                  motd:
                    type: string
                    description: Message of the day (empty when unset).
                    example: ""
                  emailLoginEnabled:
                    type: boolean
                    description: True when an email service is configured (email_service != 'none').
                    example: true
                  captchaProvider:
                    type: string
                    description: Active CAPTCHA provider key ('none' when disabled).
                    example: none
                  adsEnabled:
                    type: boolean
                    description: Whether ad slots are enabled.
                    example: false
                  contentGatingEnabled:
                    type: boolean
                    description: >-
                      Whether copyrighted-lyrics gating is active. When true,
                      the song page may serve a "lyrics protected" surface
                      instead of full lyrics; clients use this to decide
                      whether to fetch lyrics.
                    example: false
                  appleWebLoginEnabled:
                    type: boolean
                    description: >-
                      Whether Sign in with Apple for WEB is enabled on THIS
                      channel (#1470 W1) — true only when both a Services ID
                      is configured AND this channel is allow-listed on
                      `manage/configuration.php`. Dormant/false by default;
                      a future web sign-in button gates its own visibility
                      on this flag. Does not affect the native app, which
                      always uses `auth_apple` with `platform: native`
                      (or the omitted default).
                    example: false
                  appleSiwaServicesId:
                    type: string
                    nullable: true
                    description: >-
                      The Apple Services ID for the web
                      `AppleID.auth.init({clientId: ...})` call (#1479
                      W2). Only emitted (non-null) when
                      `appleWebLoginEnabled` is true — null otherwise, so
                      the front end never tries a dangling client id
                      against a disabled/misconfigured deploy. Not a
                      secret: a Services ID is public in the same way the
                      native app's bundle id (used as the SIWA client id)
                      is.
                    example: app.ihymns.web

  /api.php?action=ccli_validate:
    post:
      operationId: ccliValidate
      tags: [User Access]
      summary: Validate and save a CCLI licence number
      description: Validates format (5-8 digit numeric), stores on user profile, auto-upgrades tier from free to ccli.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [ccli_validate]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ccli_number]
              properties:
                ccli_number:
                  type: string
                  example: "1234567"
      responses:
        "200":
          description: CCLI number validated and saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
                  normalized: { type: string }
                  type: { type: string, example: "licence" }
                  tier: { type: string, example: "ccli" }
        "400":
          description: Invalid CCLI format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=tier_check:
    get:
      operationId: tierCheck
      tags: [User Access]
      summary: Check if user's tier allows an action
      description: |
        Resolves the user's effective tier (highest of personal + org tiers)
        and checks if the specified action is permitted.
        Actions: view_lyrics, view_copyrighted, play_audio, download_midi, download_pdf, offline_save, api_access, bulk_export
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [tier_check]
        - name: check
          in: query
          required: true
          schema:
            type: string
            enum: [view_lyrics, view_copyrighted, play_audio, download_midi, download_pdf, offline_save, api_access, bulk_export]
      responses:
        "200":
          description: Access check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed: { type: boolean }
                  reason: { type: string }
                  upgradeTo: { type: string }
                  tier: { type: string }

  /api.php?action=access_tiers:
    get:
      operationId: getAccessTiers
      tags: [User Access]
      summary: List all available content access tiers
      description: |
        The 7 `canXxx`/`requiresCcli` keys below are the frozen native-app
        contract (column-backed on `tblAccessTiers`, #1352). Any capability
        registered in `TIER_CAPS` with `storage: 'json'` (none are today —
        the registry ships with only the 7 originals) is appended to every
        tier object under its own camelCase key with no other change to
        this shape — see `access_tier_validation.php`'s `TIER_CAPS` map and
        rule #28 in the project conventions.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [access_tiers]
      responses:
        "200":
          description: List of tiers with capabilities
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers:
                    type: array
                    items:
                      type: object
                      additionalProperties:
                        type: boolean
                        description: Any additional json-backed capability registered in TIER_CAPS.
                      properties:
                        name: { type: string }
                        displayName: { type: string }
                        level: { type: integer }
                        description: { type: string }
                        canViewLyrics: { type: boolean }
                        canViewCopyrighted: { type: boolean }
                        canPlayAudio: { type: boolean }
                        canDownloadMidi: { type: boolean }
                        canDownloadPdf: { type: boolean }
                        canOfflineSave: { type: boolean }
                        requiresCcli: { type: boolean }

