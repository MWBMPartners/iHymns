  /api.php?action=auth_apple:
    post:
      operationId: authApple
      tags: [Authentication]
      summary: Sign in with Apple (#1402)
      description: |
        Verify an Apple `identityToken` (RS256, checked against Apple's
        published JWKS) and either sign in to the iHymns account already
        linked to that Apple ID, link the Apple ID to the account of the
        CURRENT bearer token (`link: true`), auto-link to an existing
        account whose verified email matches the token's `email` claim, or
        create a brand-new account. Returns the SAME response shape as
        `auth_login` — the native app's `AuthSession` model decodes
        `token` + `user.{id, username, display_name, role,
        avatar_service}` from either endpoint identically.

        `nonce` is the RAW (unhashed) value the client used when building
        the `ASAuthorizationAppleIDRequest` — the client sets
        `request.nonce = sha256Hex(nonce)` and sends the raw `nonce` here;
        the server recomputes the hash and compares it to the token's
        `nonce` claim. Each nonce is single-use (replay is rejected).

        `authorizationCode` and `fullName` are optional and only present
        on Apple's FIRST authorization for a given Apple ID + app pair —
        send them when available so the server can capture a refresh
        token (needed later for `account_delete`'s Apple-side revoke) and
        a display name.

        `platform` (#1470 W1) selects which of the app's two configured
        Apple client ids the identity token's `aud` claim is checked
        against — `native` (the shipped iOS/iPadOS/tvOS app) or `web`.
        Absent/empty defaults to `native` (every existing caller is
        unaffected). `platform: web` is additionally gated on an admin
        having configured a Services ID AND allow-listed this channel
        (`manage/configuration.php`) — until then it returns the SAME
        `503` as an un-migrated `tblUserAuthProviders` table, i.e. Sign
        in with Apple for web is dormant by default.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [auth_apple]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identityToken, nonce]
              properties:
                identityToken:
                  type: string
                  description: Compact JWS from ASAuthorizationAppleIDCredential.identityToken.
                nonce:
                  type: string
                  description: RAW (unhashed) nonce the client used in the SIWA request (16-255 chars).
                platform:
                  type: string
                  enum: [native, web]
                  default: native
                  description: |
                    Which client id to check the identityToken's `aud`
                    against (#1470 W1). Omit for the native app. `web` is
                    dormant (503) until an admin configures + allow-lists
                    it — see this endpoint's description.
                authorizationCode:
                  type: string
                  description: Optional — enables a best-effort Apple refresh-token capture.
                email:
                  type: string
                  format: email
                  description: Optional convenience copy — the verified JWT `email` claim always takes priority.
                fullName:
                  type: object
                  description: Optional — Apple sends this ONLY on the first authorization.
                  properties:
                    givenName: { type: string }
                    familyName: { type: string }
                link:
                  type: boolean
                  description: When true, link this Apple ID to the CURRENT bearer's account instead of signing in. Requires Authorization header.
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Signed in (or linked) successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AuthResponse"
                  - type: object
                    properties:
                      flow:
                        type: string
                        enum: [matched, linked, created]
                        description: |
                          How this sign-in resolved to an account
                          (#1479 W2): `matched` — an already-linked
                          Apple identity; `linked` — attached to the
                          CURRENT bearer's account (`link: true`) or
                          auto-linked to an existing account by verified
                          email; `created` — a brand-new account.
                          Appended to the OUTER response only —
                          `AuthResponse`'s own `{token, user}` shape stays
                          pinned (native's Swift `Codable` decode ignores
                          unknown top-level keys). Never sensitive: the
                          caller already holds the Apple identity token
                          that produced this outcome.
        "400":
          description: Missing/malformed identityToken or nonce, or an invalid platform value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid/expired/replayed Apple identity token, or link mode without a valid bearer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Invalid Apple identity token.
        "403":
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This Apple ID / account is already linked to a different party
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many attempts from this IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Sign in with Apple not yet migrated on this environment, or Apple's key set is temporarily unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=auth_provider_unlink:
    post:
      operationId: authProviderUnlink
      tags: [Authentication]
      summary: Unlink an external-identity provider (#1479 W3)
      description: |
        Provider-generic unlink for the CALLER'S OWN account. Today's
        allow-list is `['apple']` — `tblUserAuthProviders` is already
        provider-generic (#1402), so a future provider grows the
        allow-list, never the schema.

        Requires a bearer/cookie session PLUS the same-origin CSRF check
        (`validateCsrfRequest()`, rule #29): either the custom
        `X-Requested-With: XMLHttpRequest` header (a cross-origin caller
        cannot set it without a CORS preflight this server never grants),
        or a still-valid session `csrf_token` in the body.

        **Lockout guard** — refused with `409` unless a SURVIVING sign-in
        method remains once this provider's row is removed: the
        account's password hash is set; OR its email is verified AND
        email-login is operational AND that email is NOT an Apple
        private-relay alias (`@privaterelay.appleid.com` — unlinking
        Apple deactivates that relay, so mail sent to it would bounce
        forever); OR another, different provider is still linked.
        Evaluated under `SELECT ... FOR UPDATE` on the account's own
        provider rows so two concurrent unlinks (e.g. two open tabs) can
        never each treat the OTHER as the surviving method.

        On success, best-effort revokes the grant with Apple (never
        blocks the already-committed unlink — see `apple_revoke` in the
        audit log) and returns the SAME `providers` shape
        `auth_providers_list` emits, so the Settings "Connected
        accounts" card can redraw itself from this response alone. Does
        NOT invalidate bearer tokens (unlink ≠ logout).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [auth_provider_unlink]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider:
                  type: string
                  enum: [apple]
                  description: The linked provider to remove.
                csrf_token:
                  type: string
                  description: >-
                    Optional same-origin CSRF token. Not required when
                    the request already carries the same-origin
                    `X-Requested-With` header (see description).
      responses:
        "200":
          description: Unlinked — returns the caller's remaining linked providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/LinkedProvider"
        "400":
          description: provider missing, or not one of the allow-listed values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated, or the account row vanished mid-request (a concurrent account_delete won the race)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Cross-origin request rejected (CSRF gate)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: That provider is not linked to the caller's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            Lockout guard — unlinking this provider would leave the
            account with no way to sign in (no password, no operational
            verified non-private-relay email, no other linked provider).
            Set a password or add a verified email address first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Unlinking this provider would leave your account with no way to sign in. Set a password or add a verified email address first.
        "503":
          description: Linked accounts are not yet available on this environment (tblUserAuthProviders not migrated)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=auth_providers_list:
    get:
      operationId: authProvidersList
      tags: [Authentication]
      summary: List the caller's linked external-identity providers (#1479 W3)
      description: |
        Feeds the Settings "Connected accounts" card. Returns ONLY
        `provider` / a masked `email_masked` / `is_private_relay` /
        `linked_at` for each linked row — NEVER the Apple `sub`
        (Subject) or `RefreshToken` (see `_authProviderListForUser()`'s
        docblock). On an environment where the #1402
        `tblUserAuthProviders` migration hasn't run yet, returns an
        empty list rather than an error — a read-only lookup shouldn't
        surface an alarming failure state.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [auth_providers_list]
      responses:
        "200":
          description: The caller's linked providers (empty array if none, or if not yet migrated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/LinkedProvider"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

