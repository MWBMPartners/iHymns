          description: Validation error or missing id
        "403":
          description: Admin access required
        "404":
          description: Tune not found
        "409":
          description: Name or MusicBrainz Work MBID already used by another tune

  /api.php?action=admin_tune_merge:
    post:
      operationId: adminTuneMerge
      tags: [Admin — Tunes]
      summary: Collapse two tune registry rows into one
      description: |
        Every song/work citing `source_id` re-points to `target_id`
        (`TuneId` and the free-text `TuneName` mirror update in the same
        statement); Source's aliases/credits/external links move to
        Target; Source's own name becomes a new alias of Target so old
        `/tune/<source-slug>` links keep resolving; Source is then
        deleted. Transactional.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_tune_merge] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, target_id]
              properties:
                source_id: { type: integer, description: Merged away (deleted). }
                target_id: { type: integer, description: Survives. }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:               { type: boolean, example: true }
                  source_id:        { type: integer }
                  target_id:        { type: integer }
                  songs_repointed:  { type: integer }
                  works_repointed:  { type: integer }
                  aliases_moved:    { type: integer }
                  credits_moved:    { type: integer }
                  links_moved:      { type: integer }
        "400":
          description: Missing or identical source_id/target_id
        "403":
          description: Admin access required
        "404":
          description: Source or target tune not found

  /api.php?action=admin_tune_delete:
    post:
      operationId: adminTuneDelete
      tags: [Admin — Tunes]
      summary: Delete a tune registry row
      description: |
        `tblSongs.TuneId`/`tblWorks.TuneId` are `ON DELETE SET NULL` —
        songs/works keep their free-text `TuneName` and simply revert to
        the un-curated heuristic state, so this needs no `force` flag
        (unlike `admin_musician_delete`'s usage-count block on the
        name-string credit tables).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_tune_delete] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200":
          description: Tune deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:           { type: boolean, example: true }
                  id:           { type: integer }
                  name:         { type: string }
                  usage_count:  { type: integer, description: Songs + works that were citing this tune at delete time. }
        "400":
          description: Missing id
        "403":
          description: Admin access required
        "404":
          description: Tune not found

  # ===========================================================================
  # ADMIN — LICENCE TYPES  (#459 / #1769 P4)
  #
  # CRUD over the licence vocabulary (tblLicenceTypes): the tokens every
  # licence store writes, what each legally covers, and any access tier it
  # confers. The web page /manage/licence-types and these JSON twins share
  # ONE core (includes/licence_type_admin.php). Gated on the
  # manage_licence_types entitlement (default: admin + global_admin).
  # ===========================================================================
  /api.php?action=admin_licence_type_create:
    post:
      operationId: adminLicenceTypeCreate
      tags: [Admin — Licence Types]
      summary: Create a curator-defined licence type
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_licence_type_create] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLicenceTypeInput"
      responses:
        "200":
          description: Licence type created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  id: { type: integer }
        "400":
          description: Validation error (bad/missing key, label, coverage kind, authority)
        "403":
          description: manage_licence_types entitlement required
        "409":
          description: Duplicate key, or the tblLicenceTypes table is not yet migrated on this environment

  /api.php?action=admin_licence_type_update:
    post:
      operationId: adminLicenceTypeUpdate
      tags: [Admin — Licence Types]
      summary: Update a licence type (LicenceKey is immutable)
      description: |
        The `key` is never changed — too many stores reference it — so it is
        ignored on update. Omitting `covers` clears coverage; a ticked kind
        that already carried a qualifier object keeps it verbatim.
        Editing `confers_tier`/`enabled` takes effect on members' resolved
        tiers immediately, even while content gating is off.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_licence_type_update] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/AdminLicenceTypeInput"
                - type: object
                  required: [id]
                  properties:
                    id: { type: integer }
      responses:
        "200":
          description: Licence type updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          description: Validation error or missing id
        "403":
          description: manage_licence_types entitlement required
        "409":
          description: The tblLicenceTypes table is not yet migrated on this environment

  /api.php?action=admin_licence_type_toggle:
    post:
      operationId: adminLicenceTypeToggle
      tags: [Admin — Licence Types]
      summary: Flip a licence type's Enabled flag
      description: |
        A disabled licence type is excluded from pickers + the registry union
        but kept so historical rows keep resolving their label — the
        soft-retire path, distinct from delete.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_licence_type_toggle] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean, example: true }
                  enabled: { type: integer, description: The new Enabled state (0 or 1). }
        "400":
          description: Missing id
        "403":
          description: manage_licence_types entitlement required
        "409":
          description: The tblLicenceTypes table is not yet migrated on this environment

  /api.php?action=admin_licence_type_delete:
    post:
      operationId: adminLicenceTypeDelete
      tags: [Admin — Licence Types]
      summary: Delete a curator licence type (refused for system/referenced rows)
      description: |
        Refused (409) when the row is a shipped system seed — disable it
        instead — or when any store (organisations, org/content licences,
        require_licence restrictions, song rights facts, songbook defaults)
        still references its key. Disable it to retire it safely.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_licence_type_delete] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          description: Missing id
        "403":
          description: manage_licence_types entitlement required
        "409":
          description: Refused — system row, still-referenced key, or table not migrated

  # ===========================================================================
  # ADMIN — ANALYTICS  (#719 PR 2d)
  # ===========================================================================

  /api.php?action=admin_analytics_searches:
    get:
      operationId: adminAnalyticsSearches
      tags: [Admin — Analytics]
      summary: Top + zero-result search queries
      description: |
        Mirrors the search-query panel on `/manage/analytics`. Two
        lists in one response: the most-frequent queries (`top`) and
        the most-frequent zero-result queries (`zero`). Returns
        **503** when `tblSearchQueries` doesn't exist yet (pre-#404
        deployment).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_analytics_searches] }
        - name: range
          in: query
          required: false
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        "200":
          description: Search-query analytics
          content:
            application/json:
              schema:
                type: object
                properties:
                  range_days: { type: integer }
                  since:      { type: string, format: date-time }
                  top:
                    type: array
                    items:
                      type: object
                      properties:
                        query:     { type: string }
                        hits:      { type: integer }
                        top_count: { type: integer, description: Highest ResultCount seen for this query in the window }
                  zero:
                    type: array
                    items:
                      type: object
                      properties:
                        query: { type: string }
                        hits:  { type: integer }
        "403":
          description: Admin access required
        "503":
          description: tblSearchQueries not yet created — run /manage/setup-database

  # ===========================================================================
  # ADMIN — DIAGNOSTICS  (#719 PR 2d)
  # Pure read endpoints designed for tooling clients (CI, monitoring,
  # dashboards). Mirror the payloads /manage/data-health,
  # /manage/schema-audit, and /manage/setup-database render.
  # ===========================================================================

  /api.php?action=admin_data_health:
    get:
      operationId: adminDataHealth
      tags: [Admin — Diagnostics]
      summary: Table-row counts + legacy-fallback state
      description: |
        Mirrors the `/manage/data-health` panel. Returns counts for
        the canonical tables, the SongData JSON-fallback flag, the
        share-directory file count vs DB row count, and whether the
        legacy SQLite database is still on disk.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_data_health] }
      responses:
        "200":
          description: Data-health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDataHealthResponse"
        "403":
          description: Admin access required
        "503":
          description: Database unreachable (response includes detail)

  /api.php?action=admin_schema_audit:
    get:
      operationId: adminSchemaAudit
      tags: [Admin — Diagnostics]
      summary: schema.sql vs live DB drift report
      description: |
        Mirrors `/manage/schema-audit`. Compares schema.sql declarations
        against `INFORMATION_SCHEMA.COLUMNS` and the migration
        coverage discovered by walking every `migrate-*.php` under
        `appWeb/.sql/`. Per-column status enum: `ok` | `missing` |
        `uncovered` | `orphan`.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_schema_audit] }
      responses:
        "200":
          description: Audit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSchemaAuditResponse"
        "403":
          description: Admin access required

  /api.php?action=admin_migrations_status:
    get:
      operationId: adminMigrationsStatus
      tags: [Admin — Diagnostics]
      summary: Per-migration applied/partial/pending status
      description: |
        Walks every `migrate-*.php` under `appWeb/.sql/`, derives the
        set of (table, column) declarations each one is responsible
        for (literal ALTER, CREATE TABLE blocks, `@migration-adds`
        doctags), and reports an `applied|partial|pending` status
        per file by checking each declared column against the live
        `INFORMATION_SCHEMA`. No central registry — state is derived
        from the schema.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_migrations_status] }
      responses:
        "200":
          description: Status report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMigrationsStatusResponse"
        "403":
          description: Admin access required

  /api.php?action=admin_songbook_health:
    get:
      operationId: adminSongbookHealth
      tags: [Admin — Maintenance]
      summary: Integrity check across every songbook
      description: |
        Returns orphan components, songs missing writers, duplicate
        numbers, and NULL-number counts per songbook. Drives the
        "Songbook health" panel on the admin dashboard.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_songbook_health] }
      responses:
        "200":
          description: Health summary per songbook

  # ===========================================================================
  # PAGES  (HTML renderers for SPA page-fragment hydration)
  #
  # All ten pre-existing entries below were documented pre-#1472 as
  # `?action=<name>` with an `action` parameter — factually wrong. The page
  # router (`if ($page !== null)` at api.php:353, switching on `$_GET['page']`
  # set at api.php:329) is a SEPARATE dispatch from the action switch
  # (`if ($action !== null)` at api.php:534). Verified per name against
  # `case '<name>':` inside the page-router switch (api.php:376-510):
  #   home/help/terms/privacy/settings — genuine `case` blocks there, fixed
  #   below to `?page=<name>`.
  #   json/xml/csv/opensong/videopsalm — NOT page-router cases and NOT
  #   top-level actions either; the only occurrence of these five case labels
  #   in api.php is nested inside the single action `admin_export`
  #   (api.php:7243-7401), switching on `$_GET['format']`, not `$_GET['page']`
  #   or `$_GET['action']`. Flipping them to `?page=` would have been a second
  #   wrong fix, so the five entries were removed; the real behaviour (bulk,
  #   editor+-gated, all-songs export) is now documented once under
  #   `?action=admin_export` (Admin — Maintenance tag) instead of five times
  #   under a fictional single-song-by-id public route.
  # ===========================================================================

  /api.php?page=home:
    get:
      operationId: pageHome
      tags: [Pages]
      summary: Rendered home-page HTML fragment
      description: |
        Used by the router when hydrating `/` during offline startup.
        Cacheable fragment (ETag) — `home` is in the same-for-everyone
        cacheable-pages allow-list.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [home] }
      responses:
        "200":
          description: HTML fragment
          content:
            text/html: { schema: { type: string } }

  /api.php?page=help:
    get:
      operationId: pageHelp
      tags: [Pages]
      summary: Rendered in-app help page
      description: Cacheable fragment (ETag) — same-for-everyone content.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [help] }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  /api.php?page=terms:
    get:
      operationId: pageTerms
      tags: [Pages]
      summary: Rendered Terms of Use page
      description: Cacheable fragment (ETag) — same-for-everyone content.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [terms] }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  /api.php?page=privacy:
    get:
      operationId: pagePrivacy
      tags: [Pages]
      summary: Rendered Privacy Policy page
      description: Cacheable fragment (ETag) — same-for-everyone content.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [privacy] }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  /api.php?page=whats-new:
    get:
      operationId: pageWhatsNew
      tags: [Pages]
      summary: Rendered What's New page (#1583)
      description: |
        Renders a deploy-time excerpt of `CHANGELOG.md` (extracted into
        `data/whats-new.md` by `.github/workflows/deploy.yml`, absent on
        a fresh checkout) through the escape-first `markdown_lite.php`
        renderer. No parameters, no database access. A missing/empty/
        unreadable source file, or one that renders to an empty string
        (e.g. a byte-truncated deploy excerpt cut mid-UTF-8-character),
        degrades to a themed "no data yet" fallback card rather than an
        error — this page never fails. Cacheable fragment (ETag) — `whats-new`
        is in the same-for-everyone cacheable-pages allow-list, alongside
        `help`/`terms`/`privacy`.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [whats-new] }
      responses:
        "200":
          description: HTML fragment (fallback alert markup when no excerpt is available)
          content: { text/html: { schema: { type: string } } }

  /api.php?page=settings:
    get:
      operationId: pageSettings
      tags: [Pages]
      summary: Rendered Settings modal HTML
      description: |
        NOT in the cacheable-pages allow-list — renders fresh per request
        since the settings panel reflects user-specific state.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [settings] }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  /api.php?page=person:
    get:
      operationId: pagePerson
      tags: [Pages]
      deprecated: true
      summary: (DEPRECATED — use page=musician) Credit-person public page HTML fragment (#588)
      description: |
        **Deprecated by #1741 P2-B — use `page=musician` instead.** Kept
        indefinitely: `page=person`/`page=people` are normalised to
        `page=musician` right after `$page` is read (`api.php`, before the
        cache-key logic), so there is only ever ONE case label
        (`case 'musician':`) and this alias renders the byte-identical
        fragment as the canonical entry below — years of external links and
        the shipped Apple client's `CanonicalURL.person(slug:)` still emit
        this spelling (rule #33). See `page=musician` for the full
        description, including the slug/IL-id resolution ladder.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [person, people] }
        - name: slug
          in: query
          required: true
          schema: { type: string, example: john-newton }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Missing person slug

  /api.php?page=musician:
    get:
      operationId: pageMusician
      tags: [Pages]
      summary: Musician public page HTML fragment (#588, canonical)
      description: |
        Renders the `/musician/<slug>` page's bio + discography-by-role for
        SPA hydration — the canonical case label (`case 'musician':` in
        `api.php`'s page-router switch); `page=person`/`page=people` (see
        above) and the `writer` route (`page=writer&id=<slug>` — a shipped,
        forever-kept alias, #1741 P4a-3) all resolve to this SAME fragment.
        `slug` is the canonical `tblMusicians.Slug` lookup, falling back to
        a name-based search when the slug migration hasn't been applied yet.

        As of **#1860**, `slug` also accepts the musician's permanent
        internal id (`ILM` + up to 10 digits, no separator) — resolved to
        the real `Slug` BEFORE the legacy-slug ladder / name-based fallback
        run, so every rung after it sees a canonical slug exactly as if the
        curator had typed it. Gated on `tblMusicians.IlId` existing; a miss
        (not an IL id, or the column doesn't exist yet) leaves `slug`
        unchanged. Cacheable fragment (ETag).
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [musician] }
        - name: slug
          in: query
          required: true
          schema: { type: string, example: john-newton }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Missing musician slug

  /api.php?page=work:
    get:
      operationId: pageWork
      tags: [Pages]
      summary: Work public page HTML fragment (#840)
      description: |
        Renders the `/work/<slug>` page — slug-keyed lookup via
        `SongData::getWork()` (the same function backing `?action=work`'s
        JSON twin). 404 body when the Works schema isn't migrated or the
        slug is unknown. Cacheable fragment (ETag).
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [work] }
        - name: slug
          in: query
          required: true
          schema: { type: string, example: amazing-grace }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Missing work slug

  /api.php?page=publisher:
    get:
      operationId: pagePublisher
      tags: [Pages]
      summary: Publisher public page HTML fragment (#93)
      description: |
        Renders `/publisher/<slug>` — the public page for one publisher
        (company / person / imprint), listing every songbook it published
        plus registry metadata (parent, city, industry IDs, aliases).
        Resolution is a three-rung ladder (rule #33): exact `tblPublishers.Slug`
        match, then a name-fold over `tblPublishers.Name`, then the same fold
        over `tblPublisherAliases` (a renamed publisher's old name becomes an
        alias, so old links keep resolving). A friendly empty/404 state when
        the registry isn't migrated or the slug is unknown.

        As of **#1860**, `slug` also accepts the publisher's permanent
        internal id (`ILP` + up to 10 digits, no separator) — resolved to
        the real `Slug` BEFORE the three-rung ladder runs (rung 0), gated on
        `tblPublishers.IlId` existing. A miss (not an IL id, the column
        doesn't exist yet, or no row carries it) leaves `slug` unchanged and
        the ladder proceeds exactly as before.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [publisher] }
        - name: slug
          in: query
          required: true
          schema: { type: string, example: hope-publishing-company }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }
        "400":
          description: Missing publisher slug

  /api.php?page=tune:
    get:
      operationId: pageTune
      tags: [Pages]
      summary: Tune public page HTML fragment (#940)
      description: |
        Renders `/tune/<slug>`, listing every song that uses the named
        tune. An empty/missing slug renders a friendly empty state rather
        than a 400. Cacheable fragment (ETag) — `tune` is NOT in the
        cacheable-pages allow-list, so this always renders fresh per request.

        As of **#1860**, `slug` also accepts the tune's permanent internal
        id (`ILT` + up to 10 digits, no separator) — resolved to the real
        `Slug` before the exact-slug lookup runs, gated on `tblTunes.IlId`
        existing. A miss (not an IL id, the column doesn't exist yet, or no
        row carries it) leaves `slug` unchanged.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [tune] }
        - name: slug
          in: query
          required: false
          schema: { type: string, example: new-britain }
      responses:
        "200":
          description: HTML fragment (empty-state markup when slug is absent/unknown)
          content: { text/html: { schema: { type: string } } }

  /api.php?page=iswc:
    get:
      operationId: pageIswc
      tags: [Pages]
      summary: ISWC public page HTML fragment (#940)
      description: |
        Renders `/iswc/<code>`, listing every song sharing the given ISWC
        (`T-NNN.NNN.NNN-N`). The renderer defensively normalises the code
        (strips non-`T`/digit characters, uppercases the leading `T`). An
        empty/missing/unmatched code renders a friendly empty state rather
        than a 400. `iswc` is NOT in the cacheable-pages allow-list.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [iswc] }
        - name: code
          in: query
          required: false
          schema: { type: string, example: "T-345.246.800-1" }
      responses:
        "200":
          description: HTML fragment (empty-state markup when code is absent/unmatched)
          content: { text/html: { schema: { type: string } } }

  # ---------------------------------------------------------------------------
  # #1741 P3 — iswc's five siblings. All six schemes (iswc + these five) are
  # ONE file (includes/pages/identifier.php) driven by the shared
  # IHYMNS_ID_SCHEMES registry (includes/identifier_normalize.php) — the
  # entity/multiSong shape per scheme is documented once here rather than six
  # times. Each is deliberately NOT in $_cacheablePages (matches the iswc/tune
  # precedent — a cheap, indexed, anonymous read; rule #6, an explicit choice).
  # ---------------------------------------------------------------------------

  /api.php?page=ccli:
    get:
      operationId: pageCcli
      tags: [Pages]
      summary: CCLI (SongSelect) number public page HTML fragment (#1741 P3)
      description: |
        Renders `/ccli/<code>` — same shape as `page=iswc` (entity `work`,
        `multiSong: true`): an optional "Linked Work" header when a
        `tblWorks` row carries this exact code, plus the full song list
        grouped by songbook. The code is canonicalised by stripping every
        non-digit character (`ihymns_canonical_ccli()`). An empty/missing/
        unmatched code renders a friendly empty state rather than a 400.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [ccli] }
        - name: code
          in: query
          required: false
          schema: { type: string, example: "7028268" }
      responses:
