  # ===========================================================================
  # The remaining `?page=` case labels (`song`, `songbook`, `songbooks`,
  # `search`, `favorites`, `setlist`, `setlist-shared`, `stats`, `link`,
  # `writer`, `tag`) render SPA-internal HTML fragments consumed only by
  # router.js's own fetch — never a JSON contract and never linked to from
  # outside the SPA shell. They are deliberately NOT written up as individual
  # paths here (would be presence-only noise with no parameter contract worth
  # publishing); each is covered by the reasoned exemption map in
  # `tests/php/test-openapi-actions-exist.php`'s `?page=` direction check
  # (§6.2 of the docs-swagger plan), which fails the build the moment a
  # page's exemption reason stops being true — so this paragraph cannot go
  # stale silently the way a hand-written list can.
  # ===========================================================================

  /api.php?page=request:
    get:
      operationId: pageRequest
      tags: [Pages]
      summary: Request-a-song / suggest-a-correction form HTML fragment (#658)
      description: |
        Renders the public request form that POSTs to
        `?action=song_request_submit`. `page=request` is canonical;
        `page=request-a-song` is retained as an alias (older bookmarks /
        shared links / offline-queue replays) rendering the identical
        fragment. Cacheable fragment (ETag) EXCEPT when any of
        `submitted`/`id`/`error` are present (the no-JS form-submit
        redirect target — see `song_request_submit`), which carry a
        one-time flash banner and should not be cached.
      parameters:
        - name: page
          in: query
          required: true
          schema: { type: string, enum: [request, request-a-song] }
        - name: songbook
          in: query
          required: false
          description: Prefills the songbook field (deep-link from a songbook page).
          schema: { type: string, example: CP }
        - name: number
          in: query
          required: false
          description: Prefills the song-number field.
          schema: { type: string, example: "42" }
        - name: submitted
          in: query
          required: false
          description: "`1` when arriving via the no-JS form's post-submit redirect."
          schema: { type: string, enum: ["1"] }
        - name: id
          in: query
          required: false
          description: The tracking id from a successful no-JS submission (paired with `submitted=1`).
          schema: { type: string, example: "512" }
        - name: error
          in: query
          required: false
          description: An error message from a failed no-JS submission (paired with a redirect, not `submitted`).
          schema: { type: string }
      responses:
        "200":
          description: HTML fragment
          content: { text/html: { schema: { type: string } } }

  # ===========================================================================
  # ANALYTICS  (#1448 — anonymous, consent-gated client event ingestion)
  # ===========================================================================

  /api.php?action=analytics_ingest:
    post:
      operationId: analyticsIngest
      tags: [Analytics]
      summary: Ingest a batch of first-party, anonymous analytics events
      description: |
        Accepts a consent-gated batch of client analytics events from the
        Apple app's `IHAnalyticsSink` (#189/#1448). Anonymous — no auth, no
        CSRF token — protected by the mandatory `X-Requested-With`
        same-origin header plus a per-IP rate limit (20 calls / 60s; a
        batching client makes few CALLS even with many queued events, so
        this budgets calls, not individual events).

        **PII / retention stance (load-bearing):** `tblAppAnalyticsEvents`
        stores NO user id, NO device/install id, and NO IP address — a row
        can never be traced back to a person or device. The caller's IP is
        read only to key the rate-limit counter, never written to the
        analytics table.

        Every event is validated INDEPENDENTLY against a CLOSED allow-list
        of event names — a malformed/unknown event is dropped and counted
        in `rejected`, never failing the whole batch. `parameters` must be
        a flat `string => string` map (matching the client's Swift shape
        exactly); nested values reject that one event. `clientTimestamp`
        is clamped to a plausible window (1 day ahead .. 30 days behind)
        and silently omitted (not rejected) when implausible.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [analytics_ingest]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                platform:
                  type: string
                  description: Reporting client. Unrecognised/absent is stored as `unknown` (informational only, not a security boundary).
                  enum: [apple, android, web]
                events:
                  type: array
                  maxItems: 50
                  description: Batch of events (max 50 per call).
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        description: Closed allow-list — an unrecognised name rejects that one event.
                        enum: [screen_view, song_opened, search_performed, offline_save]
                      parameters:
                        type: object
                        additionalProperties: { type: string }
                        description: Flat string=>string map, max 10 keys (key <=40 chars, value <=200 chars). Any non-string value rejects the whole event.
                      clientTimestamp:
                        type: string
                        format: date-time
                        description: ISO 8601. Clamped to a plausible window; implausible/malformed values are silently dropped (event still stored, minus its timestamp).
            example:
              platform: apple
              events:
                - name: song_opened
                  parameters: { song_id: "MP-1008" }
                  clientTimestamp: "2026-07-06T12:34:56Z"
      responses:
        "200":
          description: |
            Always 200 for a well-formed request body — per-event
            rejects are reported in `rejected`, never a batch failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  accepted: { type: integer, example: 1 }
                  rejected: { type: integer, example: 0 }
        "400":
          description: Body is not valid JSON, `events` is missing/empty, or the batch exceeds 50 events
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "413":
          description: Request body exceeds the 256 KiB inner cap
        "429":
          description: Rate limit exceeded (20 calls / 60s per IP)
        "500":
          description: Could not record events

  # ===========================================================================
  # TELEMETRY  (#1582 — crash / error surfacing, NOT consent-gated analytics)
  # ===========================================================================

  /api.php?action=client_error_report:
    post:
      operationId: clientErrorReport
      tags: [Telemetry]
      summary: Report an uncaught client-side JS error or unhandled rejection
      description: |
        Fire-and-forget beacon target for `js/modules/error-monitor.js`'s
        `bootErrorMonitor()` — every uncaught `window.onerror` /
        `unhandledrejection` turns into one small JSON POST here.
        Anonymous — no auth, no CSRF token.

        **Transport / same-origin gate.** The primary transport is
        `navigator.sendBeacon()` (survives page unload), falling back to
        `fetch(…, {keepalive:true})`; the Beacon API is defined as a
        "simple request" that can NEVER carry a custom header, so unlike
        every other state-changing POST on this API this action is
        exempted from the mandatory `X-Requested-With` same-origin gate
        and instead allow-listed for an `Origin`/`Referer` host-match
        check (api.php's top-of-file CSRF guard, #1582 note) — the same
        no-JS fallback mechanism `song_request_submit` uses, for a
        different reason.

        **Limits.** Rate-limited to 10 calls / 60s per IP (tight —
        this is a rare "something broke" signal, not a batching
        client). Request body capped at 8 KB (a real report — message
        + up to 3 short capped stack frames — fits well under 1 KB).

        **Validation is independent-per-field**, via
        `clientErrorValidate()` (`includes/client_error_report.php`):
        only `k` (kind — closed allow-list `error` | `rejection`) and
        `m` (message — required, non-empty) can reject the whole
        payload; every other field (`s`/`r` source/current-page paths,
        `l`/`c` line/column, `v`/`c` version/channel labels, `st` stack
        frames) degrades to a safe default (empty string / `null` /
        capped list) rather than failing the report. Every string field
        is independently scrubbed of secret-shaped substrings (a
        `Bearer <token>` value, a 64-hex-char digest, or a
        `?token=`/`&password=`-shaped query-string parameter) before
        it is stored anywhere.

        **A malformed/rejected/invalid-JSON body is silently dropped**
        — `sendBeacon()`'s caller has no way to read a response body
        (especially during page unload), so there is nothing useful an
        error reply could communicate; the handler always answers
        `{ok:true}` for any body that at least parses past the method
        and size checks.

        **Server-side dedupe.** On top of the client's own 10-minute
        `sessionStorage` throttle, the server independently dedupes by
        a 16-hex-char fingerprint (`clientErrorFingerprint()`, hashing
        `{env}|message|source|line`) against `tblActivityLog` for the
        last 15 minutes — a second tab, a different device, or a
        client that cleared `sessionStorage` hitting the same bug
        within the window doesn't double-log. The dedupe check
        **fails open**: if the lookup itself throws, the report is
        logged anyway rather than silently lost.

        **No new table** (rule #19/#20) — writes through the existing
        `logActivity()` path as `Action=client.jserror`,
        `EntityType=client`, `EntityId=<fingerprint>` rows in
        `tblActivityLog`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [client_error_report]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [k, m]
              properties:
                k:
                  type: string
                  description: Kind — closed 2-value allow-list. Anything else rejects the whole report.
                  enum: [error, rejection]
                m:
                  type: string
                  description: Error message. Required, non-empty; scrubbed and capped to 300 chars server-side.
                s:
                  type: string
                  description: Source file path/URL. Query string and fragment are stripped server-side; capped to 255 chars.
                l:
                  type: integer
                  nullable: true
                  description: Source line number. Non-numeric/negative/absurdly large values degrade to null rather than rejecting the report.
                c:
                  type: integer
                  nullable: true
                  description: Source column number. Same clamping as `l`.
                r:
                  type: string
                  description: Current-page path at the time of the error. Same query/fragment stripping and cap as `s`.
                v:
                  type: string
                  description: App/build version label. Capped to 32 chars.
                ch:
                  type: string
                  description: Deploy channel label (e.g. `Alpha`). Capped to 32 chars.
                st:
                  type: array
                  description: Stack frames (`"path:line"` strings). Capped to the top 3, each independently scrubbed and capped to 120 chars.
                  items: { type: string }
            example:
              k: error
              m: "TypeError: x is not a function"
              s: /js/app.js
              l: 1204
              c: 7
              r: /song/MP-1008
              v: 3.4.0
              ch: Alpha
              st: ["/js/app.js:1204"]
      responses:
        "200":
          description: |
            Always `{ok:true}` for any body that passes the method/size
            checks — a rejected/deduped/malformed payload is silently
            dropped rather than surfaced as an error the `sendBeacon()`
            caller has no way to act on.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "405":
          description: POST method required
        "413":
          description: Request body exceeds the 8 KB cap
        "429":
          description: Rate limit exceeded (10 calls / 60s per IP)

  # ===========================================================================
  # LICENCES (#462) — multi-licence, inheritance-aware resolution
  # ===========================================================================

  /api.php?action=user_effective_licences:
    get:
      operationId: getUserEffectiveLicences
      tags: [Licences]
      summary: Resolve a user's effective licence set (admin-only)
      description: |
        Returns every licence the given user holds, either directly on
        their own row, via their CCLI number on `tblUsers`, or inherited
        from any ancestor organisation in the `tblOrganisations.ParentOrgId`
        chain (bounded at 10 levels to defend against cycles).

        Intended for admin debugging — the same resolver also drives the
        evaluator inside `content_access.php::checkContentAccess()`, so
        this endpoint lets a curator understand why a given user is
        passing or failing a `require_licence` rule.

        Requires the `view_licence_audit` entitlement (default:
        `admin`, `global_admin`).
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_effective_licences] }
        - name: user_id
          in: query
          required: true
          description: Target user's numeric ID
          schema: { type: integer, minimum: 1, example: 42 }
      responses:
        "200":
          description: Resolved licence set
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id: { type: integer, example: 42 }
                  licences:
                    type: array
                    items: { $ref: "#/components/schemas/EffectiveLicence" }
        "400":
          description: Missing or invalid user_id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Caller lacks `view_licence_audit` entitlement
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=licence_check:
    get:
      operationId: checkOwnLicence
      tags: [Licences]
      summary: Does the caller hold a licence of the given type?
      description: |
        Convenience boolean check against the caller's own effective
        licence set. Same resolver as `user_effective_licences` but
        scoped to the authenticated user, so any logged-in client can
        ask "do I hold a `ccli` licence?" without being an admin.

        Use this from the frontend to show/hide copyrighted-content
        features without hard-coding role strings.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [licence_check] }
        - name: type
          in: query
          required: true
          description: Licence type key to check (e.g. `ccli`, `ihymns_pro`).
          schema: { type: string, example: ccli }
      responses:
        "200":
          description: Result of the check
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, example: ccli }
                  has:  { type: boolean, example: true }
        "400":
          description: Missing type query parameter
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ===========================================================================
  # NOTIFICATIONS (#289) — in-app delivery surface for tblNotifications
  # ===========================================================================

  /api.php?action=notifications_list:
    get:
      operationId: listNotifications
      tags: [Notifications]
      summary: List notifications for the authenticated user
      description: |
        Returns up to 50 notifications for the caller, ordered unread
        first and then newest-first. Used by the header bell in the
        PWA shell to populate the dropdown panel and the unread-count
        badge.

        Each row carries `action_url` when a notification deep-links
        somewhere specific (e.g. `/song/CP-0001` after a song-request
        resolution). The UI marks rows as read via
        `notifications_mark_read`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [notifications_list] }
      responses:
        "200":
          description: Notification list (empty array when no rows)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Notification" }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=notifications_mark_read:
    post:
      operationId: markNotificationsRead
      tags: [Notifications]
      summary: Mark one or more notifications as read
      description: |
        Accepts either a list of specific IDs or a flag to clear the
        entire unread queue. Scoped to the authenticated user — a
        caller cannot modify another user's notifications even if
        they supply IDs from elsewhere.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [notifications_mark_read] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [ids]
                  properties:
                    ids:
                      type: array
                      description: Notification IDs to mark as read.
                      items: { type: integer, minimum: 1 }
                      example: [101, 102]
                - type: object
                  required: [all]
                  properties:
                    all:
                      type: boolean
                      description: When true, marks every unread row for the caller.
                      example: true
      responses:
        "200":
          description: Mark-read result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean, example: true }
                  affected:
                    type: integer
                    description: Number of rows that changed from unread to read.
                    example: 3
        "400":
          description: "Neither `ids` nor `all: true` supplied"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: Wrong HTTP method (POST required)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ===========================================================================
  # USER PREFERENCES + ACCOUNT
  # ===========================================================================

  /api.php?action=user_settings:
    get:
      operationId: getUserSettings
      tags: [Preferences]
      summary: Get the authenticated user's stored settings blob
      description: |
        Returns the JSON settings object stored on `tblUsers.Settings`
        for the caller — used by the PWA to sync per-user banner state,
        theme preferences, and other client-side flags across devices.
        Empty object when nothing has been stored yet.

        Supply `namespace` to read back one subtree instead of the whole
        blob (#1671 F5). An unknown namespace returns `{}`, not a 404 —
        a client reading its own settings before it has ever written any
        is the normal first-run case.

        This is the **only** user-preference store. `user_preferences` /
        `user_preferences_sync` were an un-namespaced duplicate of it and
        were removed in #1671 F5; both now return `400 Unknown action`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_settings] }
        - name: namespace
          in: query
          required: false
          description: |
            Optional subtree to read. Must match
            `^[a-z][a-z0-9_]{1,31}(\.[a-z][a-z0-9_]{1,31})?$`
            (e.g. `ihymns.web`, `ilyricsdb`, `apple`). Omit for the whole blob.
          schema: { type: string, example: ilyricsdb }
      responses:
        "200":
          description: Settings blob (or the requested subtree)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:         { type: boolean, example: true }
                  namespace:  { type: string, nullable: true, description: Echoed back only when a namespace was requested }
                  settings:   { type: object, description: Free-form preference object }
                  updated_at: { type: string, format: date-time, nullable: true }
        "400":
          description: namespace supplied but malformed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    post:
      operationId: setUserSettings
      tags: [Preferences]
      summary: Store the authenticated user's settings — whole blob, or one namespace
      description: |
        Persists the supplied JSON object to `tblUsers.Settings`.

        **Without `namespace`** (the legacy contract, unchanged): the whole
        blob is REPLACED by `settings`. The PWA writes the whole object on
        every change (small payload, no diff), so subsequent GETs return what
        was last POSTed. Payload cap 16 KB.

        **With `namespace`** (#1671 F5): only that subtree is replaced —
        `settings[namespace] = <body.settings>` — and every sibling namespace
        is left untouched. This is what lets an independent product share this
        store: its clients write their own subtree with no key-collision
        convention to agree and no lockstep releases. Per-namespace cap 16 KB.

        The merge is at the namespace **root** and is deliberately not
        recursive: a deep merge would make deleting a key impossible (send the
        subtree without it and a deep merge keeps the old value, silently). So
        the rule is simply "what you POST is what you GET" for that subtree.

        Over-size payloads are **rejected with 413**, never truncated and
        stored.

        ⚠ A namespace-less POST still replaces the WHOLE blob, so it clears
        every namespace. Isolation between products holds once all writers
        name a namespace.

        Known iHymns-owned namespaces (not an exhaustive/enforced list — any
        name matching the grammar is accepted): `ihymns.push` (notification
        preferences), `list_sorts` (#1786 Option B — the public "Sort ▾"
        control's per-surface spec, `{ "<surface>": [{key,dir},…] }`,
        account-synced across a signed-in user's devices; a device that
        never signs in keeps its own copy in localStorage only).

        A NAMESPACED write additionally requires the request be genuinely
        same-origin (`validateCsrfRequest()`, rule #29): either a valid
        `csrf_token` in the body, or the `X-Requested-With` header with no
        cross-origin `Origin`/`Referer` — which every same-origin
        `apiFetch()` call already sends by default, so this is not an extra
        step for a normal browser client. The legacy whole-blob POST is
        unaffected.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_settings] }
        - name: namespace
          in: query
          required: false
          description: Alternative to the body field; the body field wins if both are given.
          schema: { type: string, example: ilyricsdb }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                namespace:
                  type: string
                  description: |
                    Optional. Must match
                    `^[a-z][a-z0-9_]{1,31}(\.[a-z][a-z0-9_]{1,31})?$`.
                    Omit for the legacy whole-blob replace.
                  example: ilyricsdb
                settings:
                  type: object
                  description: Free-form preference object to persist.
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:        { type: boolean, example: true }
                  namespace: { type: string, nullable: true, description: Echoed back only for a namespaced write }
        "400":
          description: settings object missing or not an object, or namespace malformed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: |
            NAMESPACED write only — validateCsrfRequest() rejected the
            request as not genuinely same-origin (rule #29). Never returned
            for the legacy whole-blob POST.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: |
            Payload too large — the namespace subtree exceeds 16 KB, or the
            resulting whole blob exceeds the per-account backstop. Nothing is
            stored; the previous value is intact.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=auth_change_username:
    post:
      operationId: changeUsername
      tags: [Authentication]
      summary: Change the authenticated user's username
      description: |
        Self-service username change. Requires the caller's current
        password as a re-confirmation step so a stolen session can't
        silently rename the account. Username constraints match
        registration: 3-100 characters, lowercase, `[a-z0-9_.-]` only.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [auth_change_username] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_username, current_password]
              properties:
                new_username:
                  type: string
                  description: Desired new username (3-100 chars, lowercase).
                  example: alice2
                current_password:
                  type: string
                  format: password
                  description: Caller's current password (re-auth).
      responses:
        "200":
          description: Username changed
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400":
          description: Invalid new username or already in use
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated, or current password wrong
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=account_delete:
    post:
      operationId: deleteAccount
      tags: [Authentication]
      summary: Permanently delete the authenticated account (#1403)
      description: |
        Self-service, irreversible account deletion (App Review 5.1.1(v)).
        The account is ALWAYS the current bearer — there is no id/username
        selector, so this can never delete a different account. Requires
        the custom `X-Requested-With` header (a browser cannot set it
        cross-origin without a CORS preflight this server never grants) —
        see the CSRF note below — PLUS exactly one fresh re-authentication
        proof:
          - `password` — accounts with a password set.
          - `identityToken` + `nonce` (+ optional `authorizationCode`) — a
            FRESH Sign-in-with-Apple assertion, for accounts with an Apple
            link. The verified `sub` must match this account's own linked
            Apple identity.
          - `email_code` — a 6-digit code from `auth_email_login_request`,
            for passwordless email accounts.
          - `confirm: "DELETE"` — degenerate accounts only (no password, no
            email, no Apple link).

        Deletes/anonymises every per-user row (favourites, setlists,
        provider links, …), revokes ALL bearer tokens, best-effort revokes
        the Apple grant (never blocks deletion — see `apple_revoke` in the
        audit log), and clears the `ihymns_auth` cookie. A repeat call with
        an already-invalidated token returns 401 (terminal); a narrow
        double-tap race returns the SAME `{"ok":true,"deleted":true}` both
        times (idempotent).

        **Since #1698 this is an anonymised TOMBSTONE, not a row delete.**
        The observable contract above is unchanged — the caller is still
        signed out, still cannot sign back in, and the response shape is
        identical — but `tblUsers` keeps a scrubbed row carrying
        `Status = 'deleted'` and `IsActive = 0`. Every authenticated path
        already filters `IsActive = 1`, so the account is as inaccessible as
        a deleted one. What the tombstone buys is that content this user had
        **shared with other people** (a set-list share link, a published
        set-list template) keeps resolving for those people — visible and
        read-only — instead of vanishing or silently degrading to a
        months-old frozen snapshot. Which referencing rows are deleted,
        NULLed or kept is DERIVED from each foreign key's own `ON DELETE`
        rule rather than a hardcoded table list, so a table added later is
        covered by its own declaration.

        The erasure is also reachable by an administrator via
        `admin_user_delete`, through the same core, so the two funnels cannot
        diverge.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [account_delete] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:          { type: string, format: password }
                identityToken:     { type: string }
                nonce:             { type: string }
                authorizationCode: { type: string }
                email_code:        { type: string, example: "123456" }
                confirm:           { type: string, enum: [DELETE] }
      responses:
        "200":
          description: Account deleted (or already gone — idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  deleted: { type: boolean }
        "400":
          description: No re-authentication proof supplied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated, or the supplied re-auth proof is wrong
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Caller is the last active global_admin — transfer first
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          description: Too many re-auth attempts from this IP
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: |
            The erasure core REFUSED, and the account is completely untouched
            (#1698). This is an operator condition, not a client error and not
            a server fault: either the `tblUsers.Status` migration has not been
            run on this docroot, or the live foreign-key graph contains a rule
            the erasure has no policy for (`RESTRICT` / `NO ACTION` / an empty
            clause). It refuses rather than guessing, and never falls back to a
            hard row delete. Retrying identically will keep returning 503 until
            an administrator acts, so a client should surface "try again later"
            rather than looping.
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ===========================================================================
  # CARD LAYOUT (#516) — admin / user reorder + hide on dashboard surfaces
  # ===========================================================================

  /api.php?action=card_layout_get:
    get:
      operationId: getCardLayout
      tags: [Preferences]
      summary: Resolve card-layout for a dashboard surface
      description: |
        Returns the default card order for a named surface (the system
        baseline), the caller's per-user override (if any), and two
        capability flags the UI consults to decide what to enable:
        `canCustomiseOwn` for personal reorder/hide, `canSetDefault`
        for the admin "save as default" action.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [card_layout_get] }
        - name: surface
          in: query
          required: true
          description: Layout surface key (e.g. `home_admin`, `home_user`).
          schema: { type: string }
      responses:
        "200":
          description: Layout state
          content:
            application/json:
              schema:
                type: object
                properties:
                  surface:  { type: string }
                  default:  { type: object, description: Baseline layout (order + hidden array). }
                  override: { type: object, description: Per-user layout if any (order + hidden array). }
                  canCustomiseOwn: { type: boolean }
                  canSetDefault:   { type: boolean }
        "400":
          description: Invalid surface
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=card_layout_save_user:
    post:
      operationId: saveUserCardLayout
      tags: [Preferences]
      summary: Save the caller's per-user card-layout override
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [card_layout_save_user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surface]
              properties:
                surface: { type: string }
                order:   { type: array, items: { type: string } }
                hidden:  { type: array, items: { type: string } }
      responses:
        "200":
          description: Saved
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid surface, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Customisation not permitted for this account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api.php?action=card_layout_reset_user:
    post:
      operationId: resetUserCardLayout
      tags: [Preferences]
      summary: Discard the caller's per-user card-layout override
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [card_layout_reset_user] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surface]
              properties:
                surface: { type: string }
      responses:
        "200":
          description: Override cleared
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid surface, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api.php?action=card_layout_save_default:
    post:
      operationId: saveDefaultCardLayout
      tags: [Admin]
      summary: Save the system default card layout for a surface (admin)
      description: |
        Updates the baseline `order` + `hidden` arrays for a surface
        so every user without a personal override sees the new layout.
        Requires the `manage_default_card_layout` entitlement.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [card_layout_save_default] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surface]
              properties:
                surface: { type: string }
                order:   { type: array, items: { type: string } }
                hidden:  { type: array, items: { type: string } }
      responses:
        "200":
          description: Default updated
          content: { application/json: { schema: { $ref: "#/components/schemas/SuccessResponse" } } }
        "400": { description: Invalid surface, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "403": { description: Caller lacks `manage_default_card_layout` entitlement, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ===========================================================================
  # LIVE FOLLOW  (#1268 — host-led real-time multi-device follow)
  # See the "Live Follow" tag description above for the shared model.
  # ===========================================================================

  /api.php?action=live_follow_create:
    post:
      operationId: liveFollowCreate
      tags: [Live Follow]
      summary: Start a new Live Follow host session
      description: |
        Supersedes (deactivates) any prior active session for this host —
        one active session per host. Mints a 6-character Crockford-ish
        base32 code (no ambiguous glyphs). Sessions expire 4 hours after
        the last heartbeat/update. Rate-limited to 20 new sessions / hour
        / user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_create] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                setlistId:
                  type: string
                  nullable: true
                  description: Optional setlist context (org scoping deferred to a future version).
                songId:
                  type: string
                  nullable: true
                  example: CP-0202
                componentIndex:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 9999
                state:
                  $ref: "#/components/schemas/LiveSessionState"
                idleTimeoutMins:
                  type: integer
                  nullable: true
                  minimum: 5
                  maximum: 240
                  example: 60
                  description: >-
                    #1798 — declare THIS session's leader-idle auto-close
                    window at "Go Live" time (clamped to [5, 240]; 240 =
                    "until I end it" — the existing 4-hour hard ceiling).
                    Overrides the app->org->user resolved default for this
                    one session only. If the host is subject to an
                    ENFORCING org idle-timeout lock, the chosen value is
                    further capped at that lock — the org's lock always
                    wins for the host, even when they ask for longer.
                    Omit to keep today's resolved-default behaviour.
                    No-op (ignored) on an un-migrated install.
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string, example: "7K3PXM" }
                  revision: { type: integer, example: 0 }
                  sessionId:
                    type: integer
                    description: >-
                      Numeric session id (#1429) — register a native-app Live
                      Activity push token against it.
                  idleTimeoutMins:
                    type: integer
                    nullable: true
                    example: 15
                    description: >-
                      #1770/#1798 — the leader-idle auto-close timeout
                      (minutes) actually STAMPED on this session at create
                      time — the request body's `idleTimeoutMins` when the
                      caller chose one (subject to any enforcing org cap),
                      else the app-default -> org-override -> user-preference
                      precedence chain. `null` on an un-migrated install
                      (additive; absent from every client before this field
                      existed — safe to ignore).
        "400":
          description: Unknown songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Could not allocate a session code after 6 attempts — retry

  /api.php?action=live_follow_update:
    post:
      operationId: liveFollowUpdate
      tags: [Live Follow]
      summary: Broadcast the host's current song/section/state
      description: |
        The host broadcasts its FULL current context on every update
        (not a delta). Bumps `StateRevision` so followers' polls see the
        change. Also refreshes the session's 4-hour expiry. Rate-limited
        to 600 / minute / user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_update] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, songId]
              properties:
                code:
                  type: string
                  description: The session code from `live_follow_create` (4-12 alphanumeric).
                  example: "7K3PXM"
                songId:
                  type: string
                  example: CP-0202
                componentIndex:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 9999
                state:
                  $ref: "#/components/schemas/LiveSessionState"
      responses:
        "200":
          description: Broadcast applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revision: { type: integer, example: 4 }
        "400":
          description: Invalid session code, missing songId, or unknown songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "409":
          description: Session not found, not owned by this user, or ended
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=live_follow_heartbeat:
    post:
      operationId: liveFollowHeartbeat
      tags: [Live Follow]
      summary: Keep a host session alive without changing its broadcast state
      description: |
        Keepalive only — refreshes `LastHeartbeatAt` + the 4-hour expiry
        but does NOT bump `StateRevision` (nothing changed for followers).
        #1770 — when the session has gone leader-idle (no genuine
        interaction within its resolved `idleTimeoutMins`), `ok` answers
        `false` even though the row was touched — the client already treats
        `ok: false` as "session ended" (back-compat: a pre-#1770 client
        never sends `leaderActive` and is therefore never itself the reason
        a session goes idle, but it IS still subject to another leader's
        idle-close the same way it was already subject to a host-side end).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_heartbeat] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "7K3PXM" }
                leaderActive:
                  type: boolean
                  default: false
                  description: >-
                    #1770 — an EXPLICIT "a human genuinely interacted with
                    the app since the last beat" flag (pointerdown/keydown
                    while hosting). The automated 30s beat ALONE must never
                    set this — only a real interaction does, or an abandoned
                    tab would never idle-close. Omitted/false on every
                    client before #1770 (additive; the idle clock simply
                    isn't fed by such a client, matching pre-#1770
                    behaviour where nothing ever idle-closed a session).
      responses:
        "200":
          description: '`ok` reflects whether the session is still active, owned by this user, and not idle-closed (#1770).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: Invalid session code
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  /api.php?action=live_follow_leave:
    post:
      operationId: liveFollowLeave
      tags: [Live Follow]
      summary: End the host's own Live Follow session
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_leave] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "7K3PXM" }
      responses:
        "200":
          description: '`ok: true` regardless of whether a matching session existed (idempotent).'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Invalid session code
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  /api.php?action=live_follow_extend:
    post:
      operationId: liveFollowExtend
      tags: [Live Follow]
      summary: Extend/keep a running Quick session alive mid-service (#1798)
      description: |
        Widens the leader-idle auto-close window on an ALREADY-RUNNING
        session AND resets the idle clock to now, so the full chosen
        window applies from the moment of extending (not whatever fraction
        of the old window remained) — the fix for "the leader's phone died
        during the sermon".

        Authorised for EITHER:
          - the session's own HOST, or
          - an admin/owner of an organisation the HOST belongs to
            (resolved via the host's `tblOrganisationMembers` rows — Quick
            sessions keep `OrgId = NULL`, so this is never read from the
            session itself), or
          - a site admin/global_admin.

        A HOST extending is capped at their own enforcing-org idle-timeout
        lock, exactly as at `live_follow_create`. An org-admin/site-admin
        extending on the host's behalf is capped only at the global
        [5, 240] band — they hold the authority to override that lock.

        Existence-gated on the #1770 idle-timeout migration: returns `409`
        (not `404`/`400`) on an un-migrated install so a client can tell
        "not available here yet" apart from "wrong code" (rule #35).
        Rate-limited to 60 extends / hour / user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_extend] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, idleTimeoutMins]
              properties:
                code:
                  type: string
                  description: The session code from `live_follow_create` (4-12 alphanumeric).
                  example: "7K3PXM"
                idleTimeoutMins:
                  type: integer
                  minimum: 5
                  maximum: 240
                  example: 120
                  description: >-
                    Requested new window in minutes; clamped to [5, 240]
                    (240 = "until I end it"), then further capped per the
                    host-vs-org-admin rule described above. The response's
                    `idleTimeoutMins` is the value actually APPLIED.
      responses:
        "200":
          description: Window extended and the idle clock reset to now
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  idleTimeoutMins:
                    type: integer
                    example: 120
                    description: The idle-timeout window actually applied (after clamping/capping).
        "400":
          description: Invalid session code, or idleTimeoutMins missing/non-numeric
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Neither the host, an admin/owner of an org the host belongs to, nor a site admin
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Session not found or ended
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "409":
          description: >-
            EITHER this install has not run the #1770 idle-timeout migration
            yet, OR the session ended between the resolve and the update
            (race) — the two are distinguished only by the error message,
            never by status (rule #35 applies to the CLIENT's branching,
            not to every message this endpoint can return).
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=live_follow_join:
    get:
      operationId: liveFollowJoin
      tags: [Live Follow]
      summary: Join a Live Follow session by its code (anonymous)
      description: |
        Anonymous — access control is the unguessable session code.
        Mints a STATELESS per-follower token (nothing persisted
        server-side) purely so `live_follow_poll` can bucket its rate
        limiter per follower instead of per shared NAT IP; the session
        CODE remains the real access control. Rate-limited to 120 / 60s
        per IP (generous — a whole congregation joins over a minute or
        two behind one church-wifi IP). Missing/expired/wrong code all
        return the SAME 404 message (anti-probe). Byte-identical for every
        client — see the `post` operation on this SAME path for the #1770
        additive presence-minting mode.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_join] }
        - name: code
          in: query
          required: true
          schema: { type: string, example: "7K3PXM" }
      responses:
        "200":
          description: Joined — includes the host's current broadcast state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string }
                  followToken:
                    type: string
                    description: Stateless per-follower token — pass as `token` to `live_follow_poll`.
                  hostDisplayName: { type: string }
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }
        "400":
          description: Invalid session code
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }
        "404":
          description: Session not found, expired, or the code is wrong (identical message for all three)
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }
    post:
      operationId: liveFollowJoinPresence
      tags: [Live Follow]
      summary: Join a Live Follow session AND mint a CCLI-unlock presence token (#1770 req #3/#6)
      description: |
        Additive presence-minting mode — the session `code` is STILL read
        from the query string (identical to the `get` operation above),
        never the body; only the METHOD changes to POST and the body
        supplies `presenceDeviceId`. On success mints (or re-activates, on
        a re-join) a `tblServicePresence` row and returns `presenceToken`
        in the response, exactly like `service_join` already does for a
        Service-Mode congregant — the client then sets the SAME
        `ihymns_sf_presence_token` cookie the Phase-3 content gate reads,
        which is what lets a Quick host's followers read gated lyrics with
        the CCL notice for the life of the session (bound as narrowly as
        the mechanism allows — see `serviceMode_presenceCcliNumber()`'s
        doc-block for the full licensing-flag reasoning). Table-existence-
        gated: on an install without `tblServicePresence` this degrades to
        the SAME response as the `get` operation, minus `presenceToken`
        (always `null` then). Best-effort: a presence-mint failure never
        fails an otherwise-valid join.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_join] }
        - name: code
          in: query
          required: true
          schema: { type: string, example: "7K3PXM" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presenceDeviceId]
              properties:
                presenceDeviceId:
                  type: string
                  maxLength: 64
                  description: >-
                    A durable, client-minted anonymous device id (NOT a
                    login) — the SAME id `service_join` accepts, so a
                    device shares one identity across both follow paths.
      responses:
        "200":
          description: Joined — same shape as the `get` response, plus `presenceToken`
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string }
                  followToken: { type: string }
                  presenceToken:
                    type: string
                    nullable: true
                    description: >-
                      The CCLI-unlock presence token (43 chars), or `null`
                      when the presence table doesn't exist yet or minting
                      failed — the join itself still succeeds either way.
                  hostDisplayName: { type: string }
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }
        "400":
          description: Invalid session code
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }
        "404":
          description: Session not found, expired, or the code is wrong (identical message for all three)
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }

  /api.php?action=live_follow_poll:
    get:
      operationId: liveFollowPoll
      tags: [Live Follow]
      summary: Short-poll a Live Follow session for changes (anonymous)
      description: |
        Anonymous. Pass `since` (the last seen `revision`) to get a
        near-free `{changed: false}` until the host advances it. A
        session is only "active" while its host has heartbeated/updated
        within the last 180 seconds. When `token` (from `live_follow_join`)
        is supplied, rate limiting buckets PER TOKEN (40 / 60s, ~2.5s
        polling); without it, falls back to a per-IP bucket (600 / 60s) —
        the IP path exists only for old clients and is intentionally
        loose so it isn't a code-existence oracle by itself.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [live_follow_poll] }
        - name: code
          in: query
          required: true
          schema: { type: string, example: "7K3PXM" }
        - name: since
          in: query
          required: false
          description: Last-seen `revision`; omit or send 0 on the first poll.
          schema: { type: integer, default: 0 }
        - name: token
          in: query
          required: false
          description: The `followToken` from `live_follow_join` (up to 40 hex chars). Buckets the rate limiter per follower.
          schema: { type: string }
      responses:
        "200":
          description: |
            `{active: false}` when the session is missing/inactive/stale;
            otherwise `{changed: false, revision}` when nothing is new,
            or `{changed: true, currentSongId, componentIndex, state,
            revision}` when the host has advanced past `since`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  changed: { type: boolean }
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }
        "400":
          description: "Invalid session code (returned as `{active: false}`)"
          content: { application/json: { schema: { type: object, properties: { active: { type: boolean, example: false } } } } }

  # ===========================================================================
  # SERVICE MODE  (#1323 / #1335 — congregation Live-Follow)
  # See the "Service Mode" tag description above for the channel/presence-
  # token model shared by every endpoint below.
  # ===========================================================================

  /api.php?action=service_session_start:
    post:
      operationId: serviceSessionStart
      tags: [Service Mode]
      summary: Start a venue service session (operator)
      description: |
        Operator = `global_admin` / `admin`, or an org-admin/owner of the
        venue's organisation. Supersedes any prior active session for the
        same venue + occurrence date + schedule + channel. Mints the
        first rotating join code. Rate-limited to 30 new sessions / hour
        / user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_session_start] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [venueId, occurrenceDate]
              properties:
                venueId:
                  type: integer
                  description: '`tblOrgVenues.Id`. Must be active.'
                scheduleId:
                  type: integer
                  description: Optional `tblOrgServiceSchedules.Id` (must belong to the venue) — supplies start time/duration/timezone for computing the occurrence's expiry.
                occurrenceDate:
                  type: string
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                  example: "2026-07-12"
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  sessionId: { type: integer }
                  code:
                    type: string
                    description: The current rotating join code (`SVC` + 8 base32 chars).
                    example: "SVC7K3PXM4H"
                  occurrenceEnd:
                    type: string
                    format: date-time
                    description: Resolved UTC end of this occurrence — the session's ExpiresAt / the presence tokens' expiry ceiling.
        "400":
          description: Missing venueId or a malformed occurrenceDate
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised for this organisation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown venue, or unknown schedule for this venue
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Could not start the session (session-code collision after 6 attempts) — retry

  /api.php?action=service_code_rotate:
    post:
      operationId: serviceCodeRotate
      tags: [Service Mode]
      summary: Rotate the current join code (operator)
      description: |
        Mints a fresh rotating code, superseding the previous one. Doubles
        as a heartbeat (refreshes `LastHeartbeatAt`). Operator-gated
        (`global_admin`/`admin`, the session's host, or an org-admin of
        the session's org) and channel-scoped. Rate-limited to 600 / min
        / user (shared `service_operator` bucket with the other operator
        endpoints below).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_code_rotate] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string }
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Session is not active
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=service_code_current:
    get:
      operationId: serviceCodeCurrent
      tags: [Service Mode]
      summary: Resume the current join code after a reload (operator)
      description: |
        For the projection/leader UI to recover its code after a page
        reload or a background-tab wake. Also heartbeats when the
        session is active (#1386 — keeps a backgrounded broadcaster tab's
        session alive on wake). Mints a fresh code if the current one has
        expired (e.g. the tab slept through a rotation) and the session
        is still active. Same operator gate + rate limit as
        `service_code_rotate`.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_code_current] }
        - name: sessionId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Current (or freshly re-minted) code
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  code: { type: string }
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Session is not active (and no current code could be minted)
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }

  /api.php?action=service_session_end:
    post:
      operationId: serviceSessionEnd
      tags: [Service Mode]
      summary: End a service session (operator)
      description: |
        Deactivates the session AND revokes every congregant presence row
        for it (immediate gate revocation — any in-flight CCLI unlock
        ends at once). Same operator gate + rate limit as
        `service_code_rotate`.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_session_end] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
      responses:
        "200":
          description: Ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  /api.php?action=service_broadcast:
    post:
      operationId: serviceBroadcast
      tags: [Service Mode]
      summary: Broadcast the current song/section/state to a service session (operator)
      description: |
        Serves BOTH broadcaster mechanisms — the projection laptop or a
        separate leader device — either just needs the `sessionId` +
        operator auth. Bumps `StateRevision` so congregant polls see the
        change; also refreshes the heartbeat. Rate-limited to 600 / min /
        user.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_broadcast] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
                songId:
                  type: string
                  nullable: true
                  example: CP-0202
                componentIndex:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 9999
                state:
                  $ref: "#/components/schemas/LiveSessionState"
      responses:
        "200":
          description: Broadcast applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revision: { type: integer }
        "400":
          description: Missing sessionId, or an unknown songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown or ended session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  /api.php?action=service_join:
    post:
      operationId: serviceJoin
      tags: [Service Mode]
      summary: Join a service session by its rotating code (anonymous congregant)
      description: |
        Anonymous — gated only by knowing the unguessable rotating code.
        The client mints `presenceDeviceId` (any stable per-device string,
        up to 64 chars); the server mints an opaque 43-char
        `presenceToken` bound to the session, expiring at the venue-local
        occurrence end. Re-joining the same (session, device) pair
        reactivates + re-mints the token rather than duplicating. Missing
        / expired / unknown codes all return the SAME 404 (anti-probe).
        Rate-limited to 300 / min per IP (deliberately generous — a whole
        congregation joins at once behind one church-wifi IP).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_join] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, presenceDeviceId]
              properties:
                code:
                  type: string
                  description: The rotating code shown on the venue screen.
                venueId:
                  type: integer
                  description: Optional — 0/absent resolves by code + channel alone (the congregant typed the code off the screen with no venue context).
                presenceDeviceId:
                  type: string
                  maxLength: 64
                  description: Client-minted stable per-device id.
      responses:
        "200":
          description: Joined — includes the session's current broadcast state for an immediate follow
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  presenceToken:
                    type: string
                    description: Opaque 43-char token — the gate key for `service_poll` / `service_leave` (and, when present as a cookie, the Phase-3 CCLI content unlock).
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }
        "400":
          description: Missing/invalid code or presenceDeviceId
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }
        "404":
          description: Code not active — expired, unknown, or wrong (identical message for all three)
          content: { application/json: { schema: { type: object, properties: { ok: { type: boolean, example: false }, error: { type: string } } } } }
        "405":
          description: POST method required

  /api.php?action=service_poll:
    get:
      operationId: servicePoll
      tags: [Service Mode]
      summary: Short-poll a service session for changes (anonymous congregant)
      description: |
        Anonymous, gated by the opaque `presenceToken` from `service_join`.
        Rate-limited PER TOKEN (40 / 60s, ~2.5s polling) rather than per
        IP, so a whole congregation behind one NAT IP each gets its own
        budget. A session is only "active" while its host/operator has
        heartbeated within the shared live-session freshness window
        (180s). A malformed token returns `{active: false}` rather than
        an error (never an existence oracle).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_poll] }
        - name: presenceToken
          in: query
          required: true
          description: 43-char opaque token from `service_join`.
          schema: { type: string }
        - name: since
          in: query
          required: false
          description: Last-seen `revision`; omit or send 0 on the first poll.
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: |
            `{active: false}` when the token is malformed/expired/inactive
            or the session has gone stale; otherwise `{active: true,
            changed: false, revision}` when nothing is new, or
            `{active: true, changed: true, currentSongId, componentIndex,
            state, revision}` when the operator has advanced past `since`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  active: { type: boolean }
                  changed: { type: boolean }
                  currentSongId: { type: string, nullable: true }
                  componentIndex: { type: integer, nullable: true }
                  state:
                    $ref: "#/components/schemas/LiveSessionState"
                  revision: { type: integer }

  /api.php?action=service_leave:
    post:
      operationId: serviceLeave
      tags: [Service Mode]
      summary: Leave a service session (anonymous congregant)
      description: |
        Revokes the presence token (`IsActive = 0`) — immediate gate
        revocation for any Phase-3 CCLI content unlock riding this
        presence. Idempotent and deliberately silent: a malformed/unknown
        token still returns `{ok: true}` rather than an error (never an
        existence oracle).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_leave] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presenceToken]
              properties:
                presenceToken: { type: string }
      responses:
        "200":
          description: '`ok: true` regardless of whether the token matched anything.'
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "405":
          description: POST method required

  # ---------------------------------------------------------------------------
  # SESSION CONTROL TOKENS (#1408, Apple Phase-2 PR-9) — delegated remote
  # control of ONE live/service session without sharing the operator's login.
  # `tblSessionControlTokens` shipped live-dormant (#1511); every action
  # below is sessionControlTokensTableExists()-gated. `service_broadcast`
  # (above) is the mechanism that CONSUMES a minted token (an operator-auth
  # OR a valid controlToken both authorise a broadcast) — but as of this
  # writing NOTHING in this repository (no web JS, no `appApple/` code) ever
  # calls `service_control_token_mint` to obtain one in the first place.
  #
  # RESERVED: no shipped client uses this yet. The leader-device flow that
  # ships today drives a session with the operator's own bearer token via
  # the `service_code_*` actions plus `service_broadcast` directly; a
  # delegated co-leader device that never signs in (the scenario this pair
  # of endpoints exists for) has no UI anywhere that calls them.
  # ---------------------------------------------------------------------------

  /api.php?action=service_control_token_mint:
    post:
      operationId: serviceControlTokenMint
      tags: [Service Mode]
      summary: Mint a delegated, revocable control token for a service session (#1408)
      description: |
        **Reserved: no shipped client uses this yet** — see this section's
        header note. When used, it would let an operator hand a
        `broadcast`-scoped token to a co-leader's device (e.g. a phone at
        the back of the room) that can then call `service_broadcast`
        without ever signing in, by presenting `controlToken` in that
        call's body instead of a bearer/cookie session.

        Requires an authenticated operator (`serviceMode_userCanOperate()`
        — global/org admin, the session's host, or an org-admin of the
        session's org) plus the same-origin CSRF check
        (`validateCsrfRequest()`, rule #29). Rate-limited to 30 mints /
        hour per user. The minted token's expiry is capped to the
        session's own `ExpiresAt`.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_control_token_mint] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  token:
                    type: string
                    description: The delegated control token — pass as `controlToken` to `service_broadcast`.
                  scope: { type: string, example: broadcast }
                  sessionId: { type: integer }
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate), or not authorised to operate this session
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown or ended `service`-kind session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Session control tokens are not available yet (tblSessionControlTokens not migrated), or the mint failed — retry
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=service_control_token_revoke:
    post:
      operationId: serviceControlTokenRevoke
      tags: [Service Mode]
      summary: Revoke every delegated control token for a service session (#1408)
      description: |
        **Reserved: no shipped client uses this yet** — see the
        `service_control_token_mint` header note above; a co-leader
        control token is never minted in the first place today, so there
        is nothing shipped that would call this either.

        Requires the same operator authorisation and CSRF gate as
        `service_control_token_mint`. Rate-limited to 60 revokes / hour
        per user. Revokes ALL outstanding tokens for the session at once
        (there is no per-token id in the request) — the response reports
        how many rows were revoked.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_control_token_revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: integer }
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revoked:
                    type: integer
                    description: Number of tokens revoked.
        "400":
          description: Missing sessionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate), or not authorised to operate this session
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown `service`-kind session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Session control tokens are not available yet (tblSessionControlTokens not migrated)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # ---------------------------------------------------------------------------
  # EXTERNAL PRESENTATION-APP DRIVER (#1770 C4) — `tblServiceDriverKeys`
  # shipped dormant in #1770 C1; every action below is
  # serviceDriverKeysTableExists()-gated (503 un-migrated). `service_drive`
  # is the stable internal contract an out-of-repo automation (a
  # ProPresenter-class shim, a Companion webhook, a curl loop) drives a
  # church's Service-Mode session through, authenticated by a durable
  # org-scoped driver key rather than a login — its consumer is, by
  # construction, out-of-repo and therefore invisible to any in-repo scan
  # (the same shape as the admin/org JSON API-parity family elsewhere in
  # this document). The three `service_driver_key_*` lifecycle actions are
  # RESERVED: their consumer is the "Presentation-app control" admin card on
  # /manage/service-projection, which is deferred to a later #1770 commit —
  # see tests/php/fixtures/orphan-allowlist.php's matching entries.
  # ---------------------------------------------------------------------------

  /api.php?action=service_drive:
    post:
      operationId: serviceDrive
      tags: [Service Mode]
      summary: Drive a service session's current song/section from an external presentation-app (#1770 C4)
      description: |
        Authenticated by a driver key (`Authorization: Bearer <key>` or
        `X-API-Key: <key>`), NOT a login — this is the endpoint an
        unattended shim/automation calls on every slide change. Every
        session resolution is scoped to the driver key's OWN organisation
        (and, when the key carries one, its own venue) — a key can never
        resolve, let alone drive, another organisation's session.

        Resolve a session either by an explicit `sessionId`, or by
        `venueId` (falling back to the key's own bound venue) — the venue
        path picks the freshest currently-heartbeating `service`-kind
        session there, which is what lets a shim's config stay static
        across every service that venue ever runs.

        `songId` may be omitted to keep the session's CURRENT song and
        only change `sectionIndex`/`sectionRef`. `songRef` (free-text
        title resolution) is explicitly NOT supported yet — a request
        that includes it always answers `422`, so a shim fails loud
        rather than silently. `sectionRef` (a free-text label like
        `"Verse 2"`, `"V2"`, `"Chorus"`, `"C"`, `"Bridge"`) is resolved
        server-side against the song's own arrangement-projected render
        order; an unresolvable reference falls back to a song-level
        broadcast (`sectionResolved: false`) rather than guessing.
        `sectionIndex`, when present, is used as-is and wins over
        `sectionRef`.

        Rate-limited PER KEY (600 / min) — never per-IP. A separate,
        generous per-IP probe cap (300 / min) exists only to bound
        pre-authentication lookups from an unidentified caller.
      security:
        - driverKeyAuth: []
        - driverKeyAuthHeader: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_drive] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: integer
                  description: Explicit target session. Omit to resolve by venueId instead.
                venueId:
                  type: integer
                  description: Resolve the freshest live session at this venue. Falls back to the key's own bound VenueId when omitted.
                songId:
                  type: string
                  nullable: true
                  example: CP-0202
                  description: Omit to keep the session's current song and only change section/state.
                songRef:
                  type: string
                  description: NOT SUPPORTED YET — any non-empty value returns 422.
                sectionIndex:
                  type: integer
                  minimum: 0
                  maximum: 9999
                  description: Explicit render-order component index. Wins over sectionRef when both are sent.
                sectionRef:
                  type: string
                  example: "Verse 2"
                  description: Free-text section label ("Verse 2" / "V2" / "Chorus" / "C" / "Bridge" / a bare number, which defaults to verse), resolved server-side.
                state:
                  $ref: "#/components/schemas/LiveSessionState"
      responses:
        "200":
          description: Broadcast applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  sessionId: { type: integer }
                  revision: { type: integer }
                  sectionResolved:
                    type: boolean
                    nullable: true
                    description: 'true = sectionIndex/sectionRef resolved to a component; false = a sectionRef was given but could not be resolved (fell back to song-level); null = neither was given.'
        "401":
          description: Missing or invalid/revoked driver key
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "400":
          description: Unknown songId, or no venue could be resolved
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Unknown or ended session for this key's organisation/venue/channel (one opaque message)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "422":
          description: songRef was sent — not supported yet
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: Driver keys are not available yet (tblServiceDriverKeys not migrated)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=service_driver_key_mint:
    post:
      operationId: serviceDriverKeyMint
      tags: [Service Mode]
      summary: Mint a durable org-scoped driver key for an external presentation-app (#1770 C4)
      description: |
        **Reserved: no shipped client uses this yet** — its consumer is
        the "Presentation-app control" admin card deferred to a later
        #1770 commit. Requires an authenticated global/site admin, or an
        org-admin of the TARGET organisation, plus the same-origin CSRF
        check (`validateCsrfRequest()`, rule #29). Rate-limited to 10
        mints / hour per user. Returns the RAW key exactly once — only its
        hash is ever stored.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_driver_key_mint] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, label]
              properties:
                orgId: { type: integer }
                label: { type: string, maxLength: 120, example: "Sanctuary ProPresenter" }
                venueId:
                  type: integer
                  description: Optional narrowing to one venue of the organisation.
                protocol:
                  type: string
                  enum: [generic, propresenter, openlp]
                  default: generic
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Key minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  key:
                    type: string
                    description: The RAW driver key — shown exactly once, never recoverable afterwards.
                  id: { type: integer }
                  prefix: { type: string, description: Non-secret leading characters, for admin identification. }
        "400":
          description: Missing organisation/label, or an unknown venue for that organisation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate), or not authorised for this organisation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Driver keys are not available yet (tblServiceDriverKeys not migrated), or the mint failed — retry
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=service_driver_key_revoke:
    post:
      operationId: serviceDriverKeyRevoke
      tags: [Service Mode]
      summary: Revoke a driver key (#1770 C4)
      description: |
        **Reserved: no shipped client uses this yet** — see
        `service_driver_key_mint`'s header note. Same operator
        authorisation + CSRF gate. Retirement is a flag (`RevokedAt` +
        `IsActive = 0`), never a delete — the row survives for audit.
        Scoped to `orgId` so an org-admin cannot revoke another
        organisation's key by guessing/incrementing an id.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_driver_key_revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, orgId]
              properties:
                id: { type: integer }
                orgId: { type: integer }
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: '`ok: true` with `revoked` indicating whether a matching, not-already-revoked key was found.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revoked: { type: boolean }
        "400":
          description: Missing key id or organisation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate), or not authorised for this organisation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Driver keys are not available yet (tblServiceDriverKeys not migrated)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=service_driver_key_list:
    get:
      operationId: serviceDriverKeyList
      tags: [Service Mode]
      summary: List an organisation's driver keys (#1770 C4)
      description: |
        **Reserved: no shipped client uses this yet** — see
        `service_driver_key_mint`'s header note. Requires an
        authenticated global/site admin, or an org-admin of the
        requested organisation. Never returns the key hash or any
        recoverable form of the raw key — only the non-secret prefix.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [service_driver_key_list] }
        - name: orgId
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: 'Empty `keys: []` both when the organisation has none AND when the table is not yet migrated (a read degrades quietly, never a 503).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        venueId: { type: integer, nullable: true }
                        prefix: { type: string }
                        label: { type: string }
                        scope: { type: string, example: broadcast }
                        protocol: { type: string, example: generic }
                        active: { type: boolean }
                        expiresAt: { type: string, nullable: true }
                        revokedAt: { type: string, nullable: true }
                        lastUsedAt: { type: string, nullable: true }
                        createdAt: { type: string }
        "400":
          description: Missing organisation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Not authorised for this organisation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

# =============================================================================
# Editor API v2 (admin) — #1201 per-action breakout
# =============================================================================
# All 50 actions dispatched by manage/editor/api2.php's switch($action). See
# the "Editor API v2" tag description above for the shared auth / CSRF /
# entitlement / wire-format conventions referenced by every entry below.

  /manage/editor/api2.php?action=load_index:
    get:
      operationId: editorLoadIndex
      tags: [Editor API v2]
      summary: Sidebar bootstrap — the slim song index + the full songbook list
      description: |
        GET, editor role only. `songbooks` is the REAL catalogue (every book,
        including ones with zero songs) so a brand-new empty songbook is a
        reachable move target (#1679 A2) — it is NOT derived from the song
        index. `songs` reuses `SongData::getSongsSlimIndex()`, never a
        whole-corpus materialisation (CLAUDE.md rule #17).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [load_index] }
      responses:
        "200":
          description: Sidebar index + songbook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  songs:
                    type: array
                    description: Slim id/number/title/songbook index (SongData::getSongsSlimIndex()).
                    items: { type: object }
                  songbooks:
                    type: array
                    description: Every songbook, including empty ones.
                    items:
                      type: object
                      properties:
                        abbr: { type: string, description: "tblSongbooks.Abbreviation — the value to POST back as `songbook`." }
                        name: { type: string }

  /manage/editor/api2.php?action=easyworship_export:
    get:
      operationId: editorEasyworshipExport
      tags: [Editor API v2]
      summary: Stream an EasyWorship Songs.db for one song or a whole songbook (#1059/#1678)
      description: |
        GET, editor role only. Binary response — streams
        `application/x-sqlite3` and exits rather than returning JSON on
        success. Exactly one of `id` (a single song) or `abbr` (a whole
        songbook) selects the source; `id` wins if both are given.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [easyworship_export] }
        - name: id
          in: query
          schema: { type: string, example: CP-0202 }
          description: A single SongId to export.
        - name: abbr
          in: query
          schema: { type: string, example: MP }
          description: A songbook abbreviation — exports every song in it.
        - name: maxLinesPerSlide
          in: query
          schema: { type: integer, default: 0 }
          description: Optional slide line-wrap cap (0 = no wrap).
      responses:
        "200":
          description: "EasyWorship Songs.db (application/x-sqlite3), Content-Disposition attachment; X-Song-Count header carries the exported count"
        "404":
          description: No songs found for the given id/abbr
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: Export failed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=load_song:
    get:
      operationId: editorLoadSong
      tags: [Editor API v2]
      summary: Load one song's full editable record
      description: |
        GET, editor role only. The purpose-built v2 payload: song scalars +
        components + credits (each carrying its row `id`, plus
        first/surname/suffix once `musicianNamePartsColumnsExist()`) + tags +
        links + media (metadata only, never bytes) + per-line
        `lineTranslations`/`lineAnnotations` (#1235 P3, empty on an
        un-migrated install). The SAME snapshot builder a revision restore
        re-hydrates from, so `load_song` and a restored revision look
        identical.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [load_song] }
        - name: id
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
      responses:
        "200":
          description: Full editable song record
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  song: { type: object }
                  components: { type: array, items: { type: object } }
                  credits: { type: object, description: "Keyed by role (writers/composers/arrangers/adaptors/translators/artists)." }
                  tags: { type: array, items: { type: object } }
                  links: { type: array, items: { type: object } }
                  media: { type: array, items: { type: object } }
                  lineTranslations: { type: array, items: { type: object } }
                  lineAnnotations: { type: array, items: { type: object } }
        "400":
          description: Missing id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=create_song:
    post:
      operationId: editorCreateSong
      tags: [Editor API v2]
      summary: Create a new song with a server-owned canonical SongId
      description: |
        POST, editor role only. `songbook` defaults to `MISC`, `title`
        defaults to `"New Song"` (clamped to 500 chars). Mints the id via
        the shared `<ABBR>-<NNNNNN>` allocator (never a client-supplied id),
        recomputes the songbook's cached `SongCount` best-effort, and writes
        the create revision. As of **#1860** also mints the song's permanent
        internal id (`ILS…`, `ilidStampNewRow()`) — internal bookkeeping
        only; NOT echoed in the response below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                songbook: { type: string, example: MISC, description: "Songbook Abbreviation; defaults to MISC." }
                title: { type: string, example: New Song, description: "Defaults to \"New Song\"; clamped to 500 chars." }
      responses:
        "200":
          description: Song created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  songId: { type: string, example: MISC-000001 }
                  title: { type: string }
                  songbook: { type: string }
        "400":
          description: Unknown songbook abbreviation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=duplicate_song:
    post:
      operationId: editorDuplicateSong
      tags: [Editor API v2]
      summary: Duplicate a song into a hidden staging book as the start of a new songbook entry
      description: |
        POST, `edit_songs` role only. Copies an existing song — lyrics,
        chords, credits, tags, external links, arrangement, key, alternative
        titles and metadata — into the hidden `PENDING` staging songbook
        (`IsOfficial=0`, `IsDisabled=1`) via the shared revision-restore copy
        engine (`ed2_applySongSnapshot`), and returns the new song's id. The
        copy is opened in the editor with the **Songbook and Song number
        fields empty**; assigning a real songbook (the #1679 re-key) turns it
        into a brand-new catalogue song. Reset on the copy: `Number`,
        `Verified`, recording-level `Isrc`, media flags (media is not copied);
        a fresh `PublicId`; a `'duplicate'` revision. (#1783) As of **#1860**
        the copy also mints its OWN permanent internal id (`ILS…`) — never
        copied from the source (a duplicate is a distinct row); not echoed
        in the response below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceId]
              properties:
                sourceId: { type: string, example: MP-1008, description: "SongId of the song to duplicate." }
      responses:
        "200":
          description: Song duplicated into the PENDING staging book
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  songId: { type: string, example: PENDING-000001, description: "The new staging-book SongId." }
                  pendingSongbook: { type: string, example: PENDING }
        "404":
          description: Source song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Source song is soft-deleted
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=delete_song:
    post:
      operationId: editorSoftDeleteSong
      tags: [Editor API v2]
      summary: SOFT-delete one song — hidden and restorable, never destroyed (#1694)
      description: |
        POST, entitlement `delete_songs`. Sets `IsDeleted=1` (+ who/when/why)
        rather than the destructive cascade — restorable at
        `/manage/deleted-songs`; the irreversible purge lives there instead.
        `redirectTo` is accepted-and-ignored (a `notice` says so): a redirect
        is written only at purge time, never at soft delete, so restore stays
        a true no-op. `reason` is optional and validated against
        `songDeleteReasons()`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId]
              properties:
                songId: { type: string, example: CP-0202 }
                reason: { type: string, nullable: true, description: "Optional songDeleteReasons() key; unknown values 422." }
                note: { type: string, description: Optional free-text note. }
                redirectTo: { type: string, description: Accepted and IGNORED — the relink happens at purge (#1694). }
      responses:
        "200":
          description: Song soft-deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer, example: 1 }
                  softDeleted: { type: boolean, example: true }
                  songId: { type: string }
                  redirectTo: { type: "null" }
                  notice: { type: string, description: Present only when a redirectTo was supplied. }
        "400":
          description: songId missing/empty
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: Soft-delete migration not applied, or the song is already deleted
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: Unknown delete reason
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=metadata_field_update:
    post:
      operationId: editorMetadataFieldUpdate
      tags: [Editor API v2]
      summary: Update one scalar tblSongs field
      description: |
        POST, editor role only. `field` is allow-listed against
        `ED2_META_FIELDS` (title, number, songbook, language, copyright,
        ccli, iswc, isrc, tuneName, subtitle, disambiguation,
        firstPublishedYear, copyrightYears, copyrightHolder, originCity,
        originCityId, verified, lyricsPublicDomain, musicPublicDomain,
        hasAudio, hasSheetMusic). Three fields branch to a dedicated write
        path rather than a bare column UPDATE: `field=songbook` RE-KEYS the
        SongId via the shared songbook-move helper (#1679; response carries
        `previousId`); `field=tuneName` is retired-by-alias into the SAME
        lockstep core `song_tune_set` uses (never TuneName without TuneId);
        `field=isrc` canonicalises + shape-validates the value (#1741 P5a)
        and dual-writes the canonical form into `tblSongExternalIds` in the
        same transaction (#1749 P5d). The five #1741 P1 identity columns
        (subtitle/disambiguation/firstPublishedYear/copyrightYears/
        copyrightHolder) answer `409` on an install that hasn't run that
        migration card yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, field]
              properties:
                songId: { type: string, example: CP-0202 }
                field: { type: string, example: title }
                value: {}
      responses:
        "200":
          description: Field updated. `songbook` moves echo `{ok,field,songId,previousId}`; `tuneName` echoes `{ok,field:'tuneName',tuneId}`; everything else echoes `{ok,field,value}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  field: { type: string }
                  value: {}
                  songId: { type: string, description: "Present on a songbook move (may differ from the request's songId)." }
                  previousId: { type: string, description: Present on a songbook move. }
                  tuneId: { type: integer, nullable: true, description: Present on a tuneName write. }
        "400":
          description: Missing songId/field, or (songbook move) an empty target abbreviation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The song-identity-fields migration card has not been run for one of the five #1741 P1 columns
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: Bad ISRC shape, or an invalid/unresolvable target songbook on a move
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=component_upsert:
    post:
      operationId: editorComponentUpsert
      tags: [Editor API v2]
      summary: Create or update one lyric component (verse/chorus/etc.)
      description: |
        POST, editor role only. Read-modify-write through the shared
        drop-safe component writer (#1235 P4/C5) — omitting `chords`/
        `languages` on an update preserves the stored arrays. A new
        component (no `component.id`) is always appended last; reorder via
        `component_reorder`.

        #1860 Phase 5 — `label` is an optional custom DISPLAY name for the
        section (e.g. "Kyrie", "isiZulu"), overriding the derived "Verse 1"
        heading everywhere the sweep in Commit 8 covers; omitting the key
        preserves the stored value (same read-modify-write posture as
        `chords`/`languages`). A label equal to the derived name is folded
        to `null` server-side (rule #27 hide-when-equal) — the response
        `label` is the authoritative post-fold value, so the client should
        read it back rather than assume its own input round-tripped.
        `sourceWorkId` links this ONE section to a `tblWorks` row (medley
        provenance, #1860 §3.6b); an id that doesn't resolve to an existing
        work is silently coerced to `null` (never a 422) and reported back
        via `sourceWorkIdIgnored: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, component]
              properties:
                songId: { type: string, example: CP-0202 }
                component:
                  type: object
                  properties:
                    id: { type: integer, description: Omit to create a new component. }
                    type: { type: string, example: verse }
                    number: { type: integer }
                    sortOrder: { type: integer }
                    lines: { type: array, items: { type: string } }
                    chords: { type: array, items: {}, nullable: true }
                    language: { type: string, nullable: true }
                    languages: { type: array, items: {}, nullable: true }
                    label:
                      type: string
                      nullable: true
                      maxLength: 100
                      description: |
                        Optional custom display name overriding the derived
                        "Verse 1"/"Chorus" heading. Omit the key to preserve
                        the stored value; send `null` (or the derived name)
                        to clear it. #1860 Phase 5.
                      example: Kyrie
                    sourceWorkId:
                      type: integer
                      nullable: true
                      description: |
                        Links this section to a `tblWorks` row (medley
                        constituent provenance). Omit to preserve; an
                        unresolvable id is coerced to `null` rather than
                        rejected. #1860 §3.6b.
      responses:
        "200":
          description: Component saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  componentId: { type: integer }
                  label:
                    type: string
                    nullable: true
                    description: The stored value after the hide-when-equal fold — read this back rather than assuming the request's `label` round-tripped verbatim.
                  sourceWorkId: { type: integer, nullable: true }
                  sourceWorkIdIgnored:
                    type: boolean
                    description: True when the request's `sourceWorkId` did not resolve to an existing work and was coerced to null instead of failing the save.
        "400":
          description: Missing songId/component
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=component_delete:
    post:
      operationId: editorComponentDelete
      tags: [Editor API v2]
      summary: Delete one lyric component
      description: |
        POST, editor role only. Read-modify-write: drops the target
        component and persists the remainder through the shared writer
        (cascade-removes its lines).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, componentId]
              properties:
                songId: { type: string }
                componentId: { type: integer }
      responses:
        "200":
          description: Component removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer, description: 0 or 1. }
        "400":
          description: Missing songId/componentId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=component_reorder:
    post:
      operationId: editorComponentReorder
      tags: [Editor API v2]
      summary: Reorder a song's components
      description: |
        POST, editor role only. Components named in `order` come first (in
        that order); any not named are appended in their current order. The
        shared writer reassigns contiguous SortOrder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, order]
              properties:
                songId: { type: string }
                order: { type: array, items: { type: integer }, description: Component ids in the desired order. }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  count: { type: integer }
        "400":
          description: Missing songId or empty order[]
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=components_replace:
    post:
      operationId: editorComponentsReplace
      tags: [Editor API v2]
      summary: Atomically replace or append a song's whole component set
      description: |
        POST, editor role only. For Paste & Reflow + single-song import
        (both produce a whole section set at once) — one transaction, one
        LyricsText rebuild, one revision row, instead of an N-request
        granular loop. `mode=replace` (default) wipes existing components
        first; `mode=append` adds after the current max SortOrder. On
        replace, a pasted component that omits `chords`/`languages`
        reclaims the position-matched original's values (FIFO by
        type+number+line-count) so structural re-paste never silently drops
        enrichment; a client-sent value always wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, components]
              properties:
                songId: { type: string }
                components: { type: array, items: { type: object } }
                mode: { type: string, enum: [replace, append], default: replace }
      responses:
        "200":
          description: Components persisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  count: { type: integer }
                  components: { type: array, items: { type: object }, description: The persisted set, with real ids. }
        "400":
          description: Missing songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=arrangement_update:
    post:
      operationId: editorArrangementUpdate
      tags: [Editor API v2]
      summary: Save the song's running order (#161/#1627)
      description: |
        POST, editor role only. `arrangement` is an array of section
        (component) indexes, or `null`/`[]` to clear — clearing is always
        allowed. Ordinals are validated against the ASSEMBLED (published)
        component count, not the editable one; while a song has empty
        sections the two counts diverge and a non-null arrangement is
        refused (422) rather than persisting ordinals that mean different
        things to the editor and the renderer. Echoes the STORED value, not
        the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId]
              properties:
                songId: { type: string }
                arrangement: { type: array, items: { type: integer }, nullable: true, description: Section indexes, or null to clear. }
      responses:
        "200":
          description: Arrangement saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  songId: { type: string }
                  arrangement: { type: array, items: { type: integer }, nullable: true }
        "400":
          description: Missing songId, arrangement not an array, or a malformed/out-of-range section index
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The ArrangementJson migration has not been run on this install
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: The song has empty sections, so editor/published section numbering diverges — remove them before setting an arrangement
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=credit_upsert:
    post:
      operationId: editorCreditUpsert
      tags: [Editor API v2]
      summary: Create or update one song credit (writer/composer/arranger/adaptor/translator/artist)
      description: |
        POST, editor role only. Accepts either the legacy flat `{name}`
        shape or the structured `{first,surname,suffix}` shape
        (`creditEntryNormalise()` reassembles/decomposes either way).
        Promotes the name into the `tblMusicians` registry in the SAME
        transaction as the role-table write (#960). The response echoes the
        REGISTRY's parts, never the caller's input — the registry backfill
        never overwrites a curated value, so echoing input would show a
        silent no-op as if it had saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, role, credit]
              properties:
                songId: { type: string }
                role: { type: string, enum: [writers, composers, arrangers, adaptors, translators, artists] }
                credit:
                  type: object
                  properties:
                    id: { type: integer, description: Omit to create a new credit row. }
                    name: { type: string }
                    first: { type: string }
                    surname: { type: string }
                    suffix: { type: string }
      responses:
        "200":
          description: Credit saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  creditId: { type: integer }
                  name: { type: string }
                  first: { type: string }
                  surname: { type: string }
                  suffix: { type: string }
                  registryPersonId: { type: integer }
        "400":
          description: Missing songId / unknown role / credit, or a credit with no usable name
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=credit_delete:
    post:
      operationId: editorCreditDelete
      tags: [Editor API v2]
      summary: Remove one song credit
      description: POST, editor role only. Deletes by (role table, Id, SongId).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, role, creditId]
              properties:
                songId: { type: string }
                role: { type: string, enum: [writers, composers, arrangers, adaptors, translators, artists] }
                creditId: { type: integer }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer, description: 0 or 1. }
        "400":
          description: Missing songId / unknown role / creditId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=credit_search:
    get:
      operationId: editorV2CreditSearch
      tags: [Editor API v2]
      summary: Autocomplete over credited names
      description: |
        GET, editor role only. UNIONs the five song-credit tables (grouped
        by name, with combined usage count + the roles each name appears
        in) plus the `tblMusicians` registry when `kind=any`.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [credit_search] }
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, enum: [any, writer, composer, arranger, adaptor, translator, artist], default: any }
        - name: limit
          in: query
          schema: { type: integer, default: 12, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Suggestions (empty array for an empty q)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        usage: { type: integer }
                        kinds: { type: array, items: { type: string } }
        "400":
          description: Unknown kind
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=user_search:
    get:
      operationId: editorV2UserSearch
      tags: [Editor API v2]
      summary: Live-search users by display name / username (#498)
      description: |
        GET, editor role only. NOT an editor feature — its only consumer is
        the Content Restrictions name-first picker
        (`manage/restrictions.php`); it lives on this file only because it
        needs the same admin/editor+ gate api2.php already enforces (#1629).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_search] }
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Suggestions (empty array for an empty q)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        label: { type: string, description: DisplayName, falling back to Username. }
                        hint: { type: string, example: "@admin · admin" }

  /manage/editor/api2.php?action=org_search:
    get:
      operationId: editorV2OrgSearch
      tags: [Editor API v2]
      summary: Live-search organisations by name/slug (#498)
      description: |
        GET, editor role only. NOT an editor feature — the "organisation"
        source in the Content Restrictions picker (#1629, same reasoning as
        `user_search`). An empty `q` returns a page of active orgs (browse
        mode) instead of nothing.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [org_search] }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Suggestions (active organisations only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        label: { type: string }
                        hint: { type: string, example: "licence: ccli · slug: my-church" }

  /manage/editor/api2.php?action=tag_list:
    get:
      operationId: editorTagList
      tags: [Editor API v2]
      summary: Tags currently attached to one song
      description: GET, editor role only.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [tag_list] }
        - name: id
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
      responses:
        "200":
          description: Attached tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string }
                        description: { type: string }
        "400":
          description: Missing id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=tag_search:
    get:
      operationId: editorV2TagSearch
      tags: [Editor API v2]
      summary: Typeahead over the tag registry
      description: |
        GET, editor role only. Empty `q` browses the top-N tags by usage;
        otherwise a case-insensitive substring match, still ranked by usage.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [tag_search] }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string }
                        usage: { type: integer }

  /manage/editor/api2.php?action=tag_attach:
    post:
      operationId: editorTagAttach
      tags: [Editor API v2]
      summary: Attach a tag to a song, auto-creating the registry row if needed
      description: |
        POST, editor role only. Returns the CANONICAL `{id,name,slug}` so
        the client adopts the server's stored (Title-Cased) form.
        `attached=false` means the (SongId,TagId) pair already existed — a
        no-op, not an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, name]
              properties:
                songId: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Tag attached (or already was)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  tag:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      slug: { type: string }
                  attached: { type: boolean }
        "400":
          description: Missing songId/name, or the name has no usable characters
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=tag_detach:
    post:
      operationId: editorTagDetach
      tags: [Editor API v2]
      summary: Remove a tag from a song
      description: POST, editor role only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, tagId]
              properties:
                songId: { type: string }
                tagId: { type: integer }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  removed: { type: integer, description: 0 or 1. }
        "400":
          description: Missing songId/tagId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=link_save_all:
    post:
      operationId: editorLinkSaveAll
      tags: [Editor API v2]
      summary: Reconcile a song's whole external-links sub-form
      description: |
        POST, editor role only. DELETE-then-INSERT reconcile via the shared
        `saveExternalLinksForRow()` (#833/#845) — the same contract every
        other entity's external-links editor uses. Each row is validated
        (typeId>0, http(s) URL, ≤2048 chars) and an invalid row is skipped
        rather than failing the whole save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId]
              properties:
                songId: { type: string }
                links:
                  type: array
                  items:
                    type: object
                    properties:
                      typeId: { type: integer }
                      url: { type: string }
                      note: { type: string }
                      verified: { type: boolean }
      responses:
        "200":
          description: Links reconciled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  count: { type: integer }
                  links: { type: array, items: { type: object }, description: The canonical persisted rows. }
        "400":
          description: Missing songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_links:
    get:
      operationId: editorSongLinks
      tags: [Editor API v2]
      summary: A song's cross-book counterpart group ("same hymn, different songbook")
      description: |
        GET, editor role only (page view). Port of the legacy `get_song_links`
        (#1608). `groupId=0` means the song isn't grouped yet; `links` lists
        every OTHER member of the group (soft-deleted counterparts excluded).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_links] }
        - name: id
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
      responses:
        "200":
          description: Counterpart group
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  groupId: { type: integer }
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        songId: { type: string }
                        note: { type: string }
                        verified: { type: boolean }
                        title: { type: string }
                        number: { type: integer, nullable: true }
                        songbook: { type: string }
                        songbookName: { type: string }
                        language: { type: string }
        "400":
          description: Missing id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_link_add:
    post:
      operationId: editorSongLinkAdd
      tags: [Editor API v2]
      summary: Link two songs as cross-book counterparts
      description: |
        POST, entitlement `edit_songs`. Port of the legacy `add_song_link`
        (#1608). Group-merge semantics: neither song grouped → mint a new
        group; exactly one grouped → the other joins it; both already in the
        SAME group → no-op (note refreshed if supplied); both in DIFFERENT
        groups → `409` (unlink one side first, or use the Merge tool at
        `/manage/duplicate-songs` — this endpoint never grows a merge).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceSongId, targetSongId]
              properties:
                sourceSongId: { type: string }
                targetSongId: { type: string }
                note: { type: string }
      responses:
        "200":
          description: Linked (created a new group, extended an existing one, or a same-group no-op)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  groupId: { type: integer }
                  created: { type: boolean }
                  extended: { type: boolean }
                  noop: { type: boolean }
        "400":
          description: Missing sourceSongId/targetSongId, or the two ids are identical
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: One or both songs were not found (or not visible)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The two songs are already in different counterpart groups
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_link_remove:
    post:
      operationId: editorSongLinkRemove
      tags: [Editor API v2]
      summary: Drop one song from its counterpart group
      description: |
        POST, entitlement `edit_songs`. Port of the legacy `remove_song_link`
        (#1608). Either `id` (the tblSongLinks row) or `songId` identifies
        the row to drop; a resulting group of fewer than 2 members is
        cleaned up too. Already-gone is a successful no-op
        (`{ok:true,deleted:0}`), not a `404` — a double-click on Unlink must
        not surface an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer }
                songId: { type: string }
      responses:
        "200":
          description: Removed (or already gone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer, description: 0 or 1. }
        "400":
          description: Neither id nor songId supplied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_link_suggestions:
    get:
      operationId: editorSongLinkSuggestions
      tags: [Editor API v2]
      summary: Up to 5 highest-scoring pending counterpart suggestions for a song
      description: |
        GET, editor role only (page view). Port of the legacy
        `suggest_song_links` (#1608). Reads the PRE-SCORED
        `tblSongLinkSuggestions` table the offline batch
        `build-song-link-suggestions.php` fills — the ONE consumer of
        `includes/song_similarity.php`'s scorer (CLAUDE.md rule #22); this
        endpoint never scores live. `tableMissing:true` (empty list, not a
        500) on an install that hasn't run that later migration.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_link_suggestions] }
        - name: id
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
      responses:
        "200":
          description: Up to 5 pending suggestions involving this song
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        score: { type: number }
                        titleScore: { type: number }
                        lyricsScore: { type: number }
                        other:
                          type: object
                          properties:
                            songId: { type: string }
                            title: { type: string }
                            number: { type: integer, nullable: true }
                            songbook: { type: string }
                  tableMissing: { type: boolean, description: True on an un-migrated install. }
        "400":
          description: Missing id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_link_suggestion_dismiss:
    post:
      operationId: editorSongLinkSuggestionDismiss
      tags: [Editor API v2]
      summary: Dismiss a suggested counterpart pair ("no, different hymns")
      description: |
        POST, entitlement `edit_songs`. Port of the legacy
        `dismiss_song_link_suggestion` (#1608). Canonicalises
        (`songIdA < songIdB` lexicographically) server-side and writes
        `tblSongLinkSuggestionsDismissed` — the SAME table
        `/manage/duplicate-songs`'s dismiss action writes, so a dismissal
        from either surface suppresses the pair on both (CLAUDE.md rule
        #22). Drops the matching pending suggestion row too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songIdA, songIdB]
              properties:
                songIdA: { type: string }
                songIdB: { type: string }
                reason: { type: string }
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "400":
          description: Missing songIdA/songIdB, or the two ids are identical
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_external_ids:
    get:
      operationId: editorSongExternalIds
      tags: [Editor API v2]
      summary: A song's external recording/release identifiers (#1741 P5b)
      description: |
        GET, editor role only. `tblSongExternalIds`' first UI read path.
        Row shape carries a friendly `label` and a per-id `url` derived from
        the `RECORDING_EXTERNAL_ID_TYPES` registry — never invented for a
        provider whose registry entry has no URL pattern.
        `tableMissing:true` (empty list, not a 500) on an un-migrated
        install.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_external_ids] }
        - name: id
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
      responses:
        "200":
          description: External ids for the song
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  externalIds:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        idType: { type: string }
                        idValue: { type: string }
                        scope: { type: string }
                        source: { type: string }
                        label: { type: string }
                        url: { type: string, nullable: true }
                  tableMissing: { type: boolean }

  /manage/editor/api2.php?action=song_external_id_add:
    post:
      operationId: editorSongExternalIdAdd
      tags: [Editor API v2]
      summary: Add one manual external recording/release id (#1741 P5b)
      description: |
        POST, editor role only (curation, not `edit_songs` — adding/removing
        an external id is ordinary curation, not a destructive class like
        `delete_song`). `idType='isrc'` is canonicalised via
        `ihymns_canonical_isrc()` first, then shape-validated; `idScope` is
        SERVER-DERIVED from `idType`, never a client param. `INSERT IGNORE`
        on the `(SongId,IdType,IdValue)` unique key — a duplicate re-selects
        the existing row, so the echo is always the canonical stored row;
        `created` tells the client whether a NEW row actually landed. An
        `isrc` add also dual-writes the canonical value back into
        `tblSongs.Isrc` in the same transaction (#1749) — the response then
        carries `isrcDenorm`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, idType, idValue]
              properties:
                songId: { type: string }
                idType: { type: string, example: isrc }
                idValue: { type: string }
      responses:
        "200":
          description: Added (or re-selected an existing matching row)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  externalId:
                    type: object
                    properties:
                      id: { type: integer }
                      idType: { type: string }
                      idValue: { type: string }
                      scope: { type: string }
                      source: { type: string }
                      label: { type: string }
                      url: { type: string, nullable: true }
                  created: { type: boolean }
                  isrcDenorm: { type: string, nullable: true, description: "Present only when idType=isrc." }
        "400":
          description: Missing songId/idType/idValue
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The song external IDs (#1741 D5) migration card has not been applied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: Unrecognised idType, or a value that fails the registry's documented shape
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_external_id_delete:
    post:
      operationId: editorSongExternalIdDelete
      tags: [Editor API v2]
      summary: Remove one external recording/release id row (#1741 P5b)
      description: |
        POST, editor role only (same posture as `song_external_id_add`).
        `songId` is part of the WHERE (cross-song defence-in-depth, not just
        `id`). Already-gone is a successful no-op (`{ok:true,deleted:0}`),
        matching `song_link_remove`'s idempotent-double-click posture.
        Deleting an ISRC row re-syncs `tblSongs.Isrc` from the store's
        remaining primary value in the same transaction — the response then
        carries `isrcDenorm`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, id]
              properties:
                songId: { type: string }
                id: { type: integer }
      responses:
        "200":
          description: Removed (or already gone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer, description: 0 or 1. }
                  isrcDenorm: { type: string, nullable: true, description: Present only when the deleted row was an isrc row. }
        "400":
          description: Missing songId/id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The song external IDs (#1741 D5) migration card has not been applied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_alt_titles:
    get:
      operationId: editorSongAltTitles
      tags: [Editor API v2]
      summary: A song's alternative ("also known as") titles (#1669, epic #832)
      description: |
        GET, editor role only. `tblSongAlternativeTitles`' first UI write
        path (the read half — the public song page, the OG image, and the
        #832 search boost — has been live for a while). Row shape
        `{id, title, language, note, sortOrder}`, ordered
        `SortOrder ASC, Title ASC` — the same ordering the public read path
        uses. `tableMissing:true` (empty list, not a 500) on an un-migrated
        install. Alt titles are per-song FREE TEXT, not a reference to a
        registry entity (CLAUDE.md rule #43 does not apply).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_alt_titles] }
        - name: id
          in: query
          required: true
          schema: { type: string, example: MP-0001 }
      responses:
        "200":
          description: Alternative titles for the song
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  altTitles:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        language: { type: string }
                        note: { type: string }
                        sortOrder: { type: integer }
                  tableMissing: { type: boolean }
        "400":
          description: Missing id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_alt_title_add:
    post:
      operationId: editorSongAltTitleAdd
      tags: [Editor API v2]
      summary: Add one alternative title (#1669, epic #832)
      description: |
        POST, editor role only (curation, not a destructive class like
        `delete_song`). `title` is trimmed, non-empty, <=255 code points;
        `language`, if given, must match a soft BCP-47 grammar (else 422)
        and is capped to 35 code points; `note`, if given, is trimmed and
        <=255 code points. `INSERT IGNORE` on the `(SongId,Title)`
        `uq_song_title` unique key (case-insensitive collation) — a
        duplicate re-selects the existing row, so the echo is always the
        canonical stored row; `created` tells the client whether a NEW row
        actually landed. An alt title identical to the song's own current
        main title (case-insensitive) is refused with 422. Alt titles are
        per-song free text, NOT a registry reference (rule #43 does not
        apply — no find-or-create picker here).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, title]
              properties:
                songId: { type: string }
                title: { type: string, example: "Faith's Review and Expectation" }
                language: { type: string, example: es }
                note: { type: string }
      responses:
        "200":
          description: Added (or re-selected an existing matching row)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  altTitle:
                    type: object
                    properties:
                      id: { type: integer }
                      title: { type: string }
                      language: { type: string }
                      note: { type: string }
                      sortOrder: { type: integer }
                  created: { type: boolean }
        "400":
          description: Missing songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The alternative titles (#832) migration card has not been applied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: Empty/over-length title, an unrecognised language tag, or the title is just the song's own main title again
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_alt_title_delete:
    post:
      operationId: editorSongAltTitleDelete
      tags: [Editor API v2]
      summary: Remove one alternative title row (#1669, epic #832)
      description: |
        POST, editor role only (same posture as `song_alt_title_add`).
        `songId` is part of the WHERE (cross-song defence-in-depth, not
        just `id`). Already-gone is a successful no-op
        (`{ok:true,deleted:0}`), matching `song_external_id_delete`'s
        idempotent-double-click posture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, id]
              properties:
                songId: { type: string }
                id: { type: integer }
      responses:
        "200":
          description: Removed (or already gone)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer, description: 0 or 1. }
        "400":
          description: Missing songId/id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The alternative titles (#832) migration card has not been applied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=tune_search:
    get:
      operationId: editorTuneSearch
      tags: [Editor API v2]
      summary: Typeahead over the tune registry (#1741 P5c)
      description: |
        GET, editor role only. Mirrors `tag_search`'s shape. Alias-JOINed
        (`tblTuneAliases`, when present) so a spelling variant surfaces its
        CANONICAL tune — `matchedAlias` is non-null only when an ALIAS (not
        the tune's own name) matched a non-empty `q`. `meter` folds both
        sides through `ihymns_meter_normalize()` and filters PHP-side
        (MeterCode is free-text, so the fold can't run in SQL).
        `tableMissing:true` (empty list, not a 500) on an install without
        `tblTunes`.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [tune_search] }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
        - name: meter
          in: query
          schema: { type: string, example: "8.6.8.6" }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string }
                        meterCode: { type: string, nullable: true }
                        usage: { type: integer }
                        matchedAlias: { type: string, nullable: true }
                  tableMissing: { type: boolean }

  /manage/editor/api2.php?action=publisher_search:
    get:
      operationId: editorPublisherSearch
      tags: [Editor API v2]
      summary: Typeahead for the Copyright Holder picker (#1862)
      description: |
        GET, editor role only. Delegates entirely to the ONE shared
        publisher typeahead core (`publisherSearchRows()`, #1864) — no
        local SQL of its own, the same core `/manage/publishers`,
        `/manage/songbooks` and `/manage/works` already share. `[]`
        (never a 500) on an install without `tblPublishers`.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [publisher_search] }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string }
                        kind: { type: string, example: company }

  /manage/editor/api2.php?action=work_search:
    get:
      operationId: editorWorkSearch
      tags: [Editor API v2]
      summary: Typeahead over the Works registry (#1860 Phase 3)
      description: |
        GET, editor role only. Mirrors `tune_search`'s shape.
        `tableMissing:true` (empty list, not a 500) on an install without
        `tblWorks`. `ccli` is included only when `tblWorks.Ccli` exists — a
        pre-works-identity install still returns ISWC-based rows rather than
        degrading to `tableMissing`.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [work_search] }
        - name: q
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        slug: { type: string }
                        disambiguation: { type: string }
                        iswc: { type: string, nullable: true }
                        ccli: { type: string, nullable: true }
                        parentWorkId: { type: integer, nullable: true }
                        usage: { type: integer }
                  tableMissing: { type: boolean }

  /manage/editor/api2.php?action=song_work_autolink:
    post:
      operationId: editorSongWorkAutolink
      tags: [Editor API v2]
      summary: Auto find-or-link a song's Work by its stored CCLI/ISWC (#1860 Phase 3)
      description: |
        POST, editor role only. The commit-time hook Editor2 fires after a
        CCLI/ISWC field save lands (design §3.7 — the client wiring itself
        is a tracked follow-up build). Server-authoritative: reads the
        song's STORED `Ccli`/`Iswc` from `tblSongs`, never a client-sent
        identifier value. A work-link CONFLICT is a field on the 200 body,
        never an HTTP failure — a work-link ambiguity must never fail the
        song save.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId]
              properties:
                songId: { type: string }
      responses:
        "200":
          description: Work-link plan applied (or a no-op)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  linked: { type: boolean }
                  workId: { type: integer, nullable: true }
                  workTitle: { type: string, nullable: true }
                  workSlug: { type: string, nullable: true }
                  songCount: { type: integer }
                  created: { type: boolean }
                  createdParent: { type: boolean }
                  rehomed: { type: boolean }
                  refined: { type: boolean }
                  conflict: { type: string, nullable: true }
                  iswcInvalid: { type: boolean }
        "400":
          description: Missing songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The work-identity migration cards have not all been applied yet (run them at /manage/setup-database)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_work_set:
    post:
      operationId: editorSongWorkSet
      tags: [Editor API v2]
      summary: Manual "Part of work" picker — link, create-by-title, or unlink (#1860 Phase 3)
      description: |
        POST, editor role only. Exactly one mode per request: `{songId,
        workId}` links to an existing Work (404 if it doesn't exist);
        `{songId, title}` is the manual picker's find-or-create for
        identifier-less hymns (design §3.7.2), 400 on an empty/whitespace
        title; `{songId, workId, unlink:true}` drops that one membership —
        the ONLY manual-unlink surface (design §3.3.1 reserves unlink to
        humans). An already-gone unlink returns `{ok:true, unlinked:true,
        deleted:0}`, not an error (idempotent double-click).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId]
              properties:
                songId: { type: string }
                workId: { type: integer, description: "Link/unlink mode." }
                title: { type: string, description: "Find-or-create mode." }
                unlink: { type: boolean, description: "With workId, deletes that one membership." }
      responses:
        "200":
          description: Link / create-by-title applied, or unlinked
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      ok: { type: boolean, example: true }
                      linked: { type: boolean, example: true }
                      workId: { type: integer }
                      workTitle: { type: string, nullable: true }
                      workSlug: { type: string, nullable: true }
                      songCount: { type: integer }
                      created: { type: boolean }
                      createdParent: { type: boolean, example: false }
                      rehomed: { type: boolean, example: false }
                      refined: { type: boolean, example: false }
                      conflict: { type: string, nullable: true, example: null }
                      iswcInvalid: { type: boolean, example: false }
                  - type: object
                    properties:
                      ok: { type: boolean, example: true }
                      unlinked: { type: boolean, example: true }
                      deleted: { type: integer }
        "400":
          description: Missing songId, an empty/whitespace title, or neither/both of workId and title supplied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song or Work not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The work-identity migration cards have not all been applied yet (run them at /manage/setup-database)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_tune_set:
    post:
      operationId: editorSongTuneSet
      tags: [Editor API v2]
      summary: The ONE tune write — TuneName + TuneId in lockstep (#1741 P5c)
      description: |
        POST, editor role only. `tuneName` MAY be an empty string — that is
        a legal clear (both TuneName and TuneId → null), distinct from the
        key being absent (a caller mistake, 400). Shares the exact write
        core `metadata_field_update`'s `tuneName` alias branch delegates to,
        so a song's tune has exactly one write path regardless of which
        action a (current or stale-cached) client uses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, tuneName]
              properties:
                songId: { type: string }
                tuneName: { type: string, description: "Empty string clears the tune." }
      responses:
        "200":
          description: Tune saved (or cleared)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  field: { type: string, example: tune }
                  tuneId: { type: integer, nullable: true }
                  tuneName: { type: string, nullable: true }
                  slug: { type: string, nullable: true }
                  meterCode: { type: string, nullable: true }
        "400":
          description: Missing songId, or the tuneName key is absent
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=song_copyright_holder_set:
    post:
      operationId: editorSongCopyrightHolderSet
      tags: [Editor API v2]
      summary: The ONE copyright-holder write — CopyrightHolder + CopyrightHolderId in lockstep (#1862)
      description: |
        POST, editor role only. Activates the dormant #1864
        `tblSongs.CopyrightHolderId` FK. Mirrors `song_tune_set`'s shape
        exactly: `name` MAY be an empty string — a legal clear (both
        `CopyrightHolder` and `CopyrightHolderId` → cleared), distinct
        from the key being absent (a caller mistake, 400). `publisherId`
        is the picker's CLAIMED `tblPublishers.Id` — trusted only after
        server-side verification against `name`
        (`publisherResolvePickedOrCreate()`), never written unverified; a
        stale/forged id degrades to the name find-or-create funnel. Shares
        the exact write core `metadata_field_update`'s `CopyrightHolder`
        alias branch delegates to, so a song's copyright holder has
        exactly one write path regardless of which action a (current or
        stale-cached) client uses. 409 on an install that hasn't run the
        song-identity-fields migration card yet (the column this shares
        with Subtitle/Disambiguation/FirstPublishedYear/CopyrightYears).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, name]
              properties:
                songId: { type: string }
                name: { type: string, description: "Empty string clears the holder." }
                publisherId: { type: integer, nullable: true, description: "The picker's claimed tblPublishers.Id; verified server-side, never trusted blindly." }
      responses:
        "200":
          description: Copyright holder saved (or cleared)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  field: { type: string, example: copyrightHolder }
                  holderName: { type: string }
                  publisherId: { type: integer, nullable: true }
        "400":
          description: Missing songId, or the name key is absent
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The song-identity-fields migration card has not been applied yet (run it at /manage/setup-database)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=media_list:
    get:
      operationId: editorMediaList
      tags: [Editor API v2]
      summary: List a song's media files (metadata only)
      description: |
        GET, editor role only. Never returns file bytes — playback is via
        the gated `/song-media/<id>` stream route (#853); `streamUrl` in
        each row points there.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [media_list] }
        - name: id
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
      responses:
        "200":
          description: Media rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  media:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string }
                        fileName: { type: string }
                        mimeType: { type: string }
                        sizeBytes: { type: integer }
                        annotation: { type: string }
                        sortOrder: { type: integer }
                        storageBackend: { type: string }
                        uploadedAt: { type: string }
                        streamUrl: { type: string }

  /manage/editor/api2.php?action=media_upload:
    post:
      operationId: editorMediaUpload
      tags: [Editor API v2]
      summary: Upload one media file (audio/sheet music/etc.) for a song
      description: |
        POST, `multipart/form-data`, editor role only. Reads `$_POST` +
        `$_FILES`, NOT the JSON body. MIME is SNIFFED on the bytes (never
        the declared content-type); size is capped per `kind`; the file is
        staged FS-or-DB by `SongMediaStorage`. An FS file staged before an
        INSERT that then fails is unlinked so nothing orphans.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [songId, kind, file]
              properties:
                songId: { type: string }
                kind: { type: string, description: "One of SongMediaStorage::allKinds()." }
                annotation: { type: string, description: Clamped to 255 chars. }
                file: { type: string, format: binary }
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  media:
                    type: object
                    properties:
                      id: { type: integer }
                      kind: { type: string }
                      fileName: { type: string }
                      mimeType: { type: string }
                      sizeBytes: { type: integer }
                      annotation: { type: string }
                      sortOrder: { type: integer }
                      storageBackend: { type: string }
                      uploadedAt: { type: string }
                      streamUrl: { type: string }
        "400":
          description: Missing/invalid songId or kind, no file / upload error, or an upload that fails validation (unrecognised MIME, oversize for its kind)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST required
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: Upload failed for a non-user-facing reason
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: The Song Media migration has not been run on this install
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=media_update:
    post:
      operationId: editorMediaUpdate
      tags: [Editor API v2]
      summary: Update a media file's annotation
