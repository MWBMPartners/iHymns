  /api.php?action=admin_tier_delete:
    post:
      operationId: adminTierDelete
      tags: [Admin — Tiers]
      summary: Delete an unused access tier
      description: Refuses with 422 if any user is still on the tier.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
