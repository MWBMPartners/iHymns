      description: |
        Renders `/bowi/<code>` — entity `work`, `multiSong: false`: the Work
        header only (Luminate's BOWI has no song-list concept in this
        catalogue, unlike ISWC/CCLI). The code is canonicalised by
        uppercasing and stripping spaces/hyphens/dots
        (`ihymns_canonical_bowi()`) — BOWI has no publicly documented fixed
        shape, so this cleans without rejecting. An empty/missing/unmatched
