      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_links] }
        - name: id
          in: query
          required: true
          description: "Canonical SongId, e.g. CP-0001"
          schema: { type: string, example: CP-0001 }
      responses:
        "200":
          description: Cross-book counterparts (may be empty)
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: integer
                    description: Link group ID (0 when the song has no counterparts)
                    example: 42
                  songs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:           { type: string, example: MP-0031 }
                        title:        { type: string, example: Amazing Grace }
                        number:       { type: integer, nullable: true, example: 31 }
                        songbook:     { type: string, example: MP }
                        songbookName: { type: string, example: Mission Praise }
                        language:     { type: string, example: en }
                        note:         { type: string, nullable: true }
                        verified:     { type: boolean }
        "400":
          description: Missing song ID
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: Lookup failed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=work:
    get:
      operationId: getWork
      tags: [Songs]
      summary: Get one Work (composition grouping) as JSON
      description: |
        JSON twin of the public `?page=work&slug=…` HTML page — both call
        the SAME `SongData::getWork()`, not a forked read. Returns the Work
        header, its parent/children Work headers (one level each), every
        member song (ordered canonical-first then songbook/number), and any
        Work-level external links. Exposed for the native app's Work detail
        screen (#1443).
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [work]
        - name: slug
          in: query
          required: false
          description: Work slug. Takes priority over `id` when both are sent.
          schema: { type: string, example: amazing-grace }
        - name: id
          in: query
          required: false
          description: Numeric `tblWorks.Id`. Used when `slug` is absent/empty.
          schema: { type: string, example: "17" }
      responses:
        "200":
          description: The Work, with parent/children headers, members, and links
          content:
            application/json:
              schema:
                type: object
                properties:
                  work:
                    $ref: "#/components/schemas/Work"
        "400":
          description: Neither a `slug` nor an `id` was supplied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No matching Work (or the Works schema isn't migrated on this install)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api.php?action=credit_person:
    get:
      operationId: getCreditPerson
      tags: [Songs]
      summary: Get one credit person's bio + discography as JSON
      description: |
        JSON twin of the public `/people/<slug>` HTML page's own query
        logic (#1443/#1444) — both independently query `tblCreditPeople` +
        the per-role credit tables (`tblSongWriters`, `tblSongComposers`,
        `tblSongArrangers`, `tblSongAdaptors`, `tblSongTranslators`, and
        `tblSongArtists` when migrated) because there is no direct FK from
        those tables to `tblCreditPeople` today — a name-string match, same
        as the HTML page.

        Exactly ONE of `slug`, `id`, or `name` should be supplied. When a
        `tblCreditPeople` registry row exists it drives the bio fields;
        when it doesn't (a writer/composer string with no curated record
        yet), `name` alone still returns a "songs by this name" discography
        with `id`/`slug`/bio fields all `null`. `name` exists specifically
        for the native app's "tap a composer name on a song" flow, which
        only has the plain string to look up with, not a person ID.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [credit_person]
        - name: slug
          in: query
          required: false
          schema: { type: string, example: john-newton }
        - name: id
          in: query
          required: false
          description: Numeric `tblCreditPeople.Id`.
          schema: { type: string, example: "42" }
        - name: name
          in: query
          required: false
          description: Exact writer/composer/etc. name (fallback lookup + the discography match key).
          schema: { type: string, example: John Newton }
      responses:
        "200":
          description: The credit person's bio (when registered) and discography grouped by role
          content:
            application/json:
              schema:
                type: object
                properties:
                  person:
                    $ref: "#/components/schemas/CreditPerson"
        "400":
          description: None of `slug`, `id`, or `name` was supplied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No registry row AND no credited song found under that name
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          $ref: "#/components/responses/RateLimited"

  # ===========================================================================
  # LANGUAGES
  # ===========================================================================

  /api.php?action=catalogue_language_subtags:
    get:
      operationId: catalogueLanguageSubtags
      tags: [Languages]
      summary: Distinct primary language subtags present in the catalogue (#776)
      description: |
        The union of primary language subtags actually present across
        tblSongbooks.Language and tblSongs.Language (lowercase, sorted,
        de-duplicated). Lightweight replacement for hitting `songbooks` just to
        derive the language chip set. No authentication; cached 5 min.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [catalogue_language_subtags] }
      responses:
        "200":
          description: Sorted unique primary subtags
          content:
            application/json:
              schema:
                type: object
                properties:
                  subtags:
                    type: array
                    items: { type: string }
                    example: ["en", "es", "fr", "sw"]

  /api.php?action=languages:
    get:
      operationId: listLanguages
      tags: [Languages]
      summary: List available languages
      description: Returns all active languages supported by the song collection.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [languages]
      responses:
        "200":
          description: Language list
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Language"
              example:
                languages:
                  - code: en
                    name: English
                    nativeName: English
                    textDirection: ltr
                  - code: fr
                    name: French
                    nativeName: "Fran\u00E7ais"
                    textDirection: ltr

  /api.php?action=scripts:
    get:
      operationId: listScripts
      tags: [Languages]
      summary: List available IETF BCP 47 scripts (#681 / #682)
      description: |
        Returns all active rows from `tblScripts` (ISO 15924). Used by
        the IETF composite picker on the web admin and by native
        clients that need to resolve a saved tag like `zh-Hans` into a
        human-readable name.

        Pre-migration deployments (where `tblScripts` doesn't exist
        yet) get an empty list and a `note` field rather than a 500.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [scripts]
      responses:
        "200":
          description: Script list
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Script"
                  note:
                    type: string
                    description: Present only when the lookup table has not yet been created.
              example:
                scripts:
                  - code: Latn
                    name: Latin
                    nativeName: Latin
                  - code: Cyrl
                    name: Cyrillic
                    nativeName: "\u041A\u0438\u0440\u0438\u043B\u043B\u0438\u0446\u0430"
                  - code: Hans
                    name: Simplified Chinese
                    nativeName: "\u7B80\u4F53\u5B57"

  /api.php?action=regions:
    get:
      operationId: listRegions
      tags: [Languages]
      summary: List available IETF BCP 47 regions (#681 / #682)
      description: |
        Returns all active rows from `tblRegions` \u2014 ISO 3166-1 alpha-2
        country codes plus M.49 numeric area codes for groupings like
        `419` (Latin America & Caribbean). Same use case as
        `action=scripts`: resolve a saved IETF tag's region subtag to
        a human-readable name.

        Pre-migration deployments get an empty list with a `note`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [regions]
      responses:
        "200":
          description: Region list
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Region"
                  note:
                    type: string
                    description: Present only when the lookup table has not yet been created.
              example:
                regions:
                  - code: GB
                    name: United Kingdom
                  - code: US
                    name: United States
                  - code: BR
                    name: Brazil
                  - code: "419"
                    name: Latin America and the Caribbean

  /api.php?action=variants:
    get:
      operationId: listLanguageVariants
      tags: [Languages]
      summary: List IETF BCP 47 language variants (#738)
      description: |
        Returns all active rows from `tblLanguageVariants` — IANA
        variant subtags (5-8 chars). Examples: `1996` for German
        post-1996 orthography, `fonipa` for IPA phonetics,
        `valencia` for the Valencian variant of Catalan.

        Used as the optional fourth subtag in an IETF BCP 47
        language tag. Most worship-app catalogues won't reference
        variant subtags directly, but the endpoint is provided for
        completeness so a curator hand-tagging an academic edition
        of a hymnal has the full vocabulary available.

        Pre-migration deployments (where `tblLanguageVariants`
        doesn't exist) get an empty list with a `note`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [variants]
      responses:
        "200":
          description: Variant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  variants:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: "1996" }
                        name: { type: string, example: "German orthography of 1996" }
                  note:
                    type: string
                    description: Present only when the lookup table has not yet been created.

  /api.php?action=admin_refresh_iana_cldr:
    post:
      operationId: adminRefreshIanaCldr
      tags: [Admin — Diagnostics]
      summary: Refresh IETF BCP 47 reference data from upstream IANA + CLDR (#738)
      description: |
        Fetches the latest IANA Language Subtag Registry from
        `https://www.iana.org/assignments/language-subtag-registry`
        plus the CLDR English locale-display-names JSON files from
        the unicode-org/cldr-json GitHub mirror, overwrites the
        bundled snapshots in `appWeb/.sql/data/`, and re-runs the
        import migration. Returns the migration's per-table delta
        counts in the response.

        Global-admin only. Requires same-origin POST with
        `X-Requested-With: XMLHttpRequest`. Server-side outbound
        HTTPS connectivity to iana.org and raw.githubusercontent.com
        is required. If any of the 5 source URLs fails, the bundled
        snapshots are NOT touched and the call returns 502 with the
        list of failed files.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_refresh_iana_cldr] }
      responses:
        "200":
          description: Refresh succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  fetched:
                    type: array
                    items: { type: string }
                    description: Per-file size summaries (`filename (12345 bytes)`).
                  migrationLog:
                    type: string
                    description: Captured stdout from the import migration — per-step `[seed]` / `[cldr]` / `[skip]` lines.
        "403":
          description: Global admin access required
        "405":
          description: POST method required
        "500":
          description: Snapshot directory not writable, or migration re-run failed after the fetch
        "502":
          description: |
            One or more source fetches failed. Response includes
            `fetched` (the ones that did succeed) and `failed` (the
            ones that didn't).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:   { type: string }
                  fetched: { type: array, items: { type: string } }
                  failed:  { type: array, items: { type: string } }
                  hint:    { type: string }

  /api.php?action=song_translations:
    get:
      operationId: getSongTranslations
      tags: [Languages]
      summary: Get every related-language version of a song (#281)
      description: |
        Resolves the full set of language versions related to the given
        song, unioning three relationship directions:

          1. **Outward** — translations whose `SourceSongId` is this song.
          2. **Inward** — if this song IS a translation, the original
             it was translated from.
          3. **Sibling** — other translations of that same original,
             so readers can hop between languages without going via
             the source.

        Each entry carries the target language, the translator credit
        (if recorded), a verified flag for curated rows, and the song
        title and number for direct rendering.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [song_translations]
        - name: id
          in: query
          required: true
          description: Source song ID (unchanged for outward, the
            translation's ID for inward/sibling resolution).
          schema:
            type: string
            example: CP-0202
      responses:
        "200":
          description: Song translations
          content:
            application/json:
              schema:
                type: object
                properties:
                  sourceId:
                    type: string
                    description: The song ID that was queried
                    example: CP-0202
                  translations:
                    type: array
                    items:
                      $ref: "#/components/schemas/SongTranslation"
        "400":
          description: Missing `id` query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===========================================================================
  # SETLISTS
  # ===========================================================================

  /api.php?action=setlist_share:
    post:
      operationId: shareSetlist
      tags: [Setlists]
      summary: Create or update a shared setlist
      description: |
        Create a new publicly-shareable setlist or update an existing one.
        When updating, the caller must provide the original `id` and matching
        `owner` UUID. Each shared setlist can contain up to 200 songs with
        optional per-song arrangements.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [setlist_share]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, songs, owner]
              properties:
                name:
                  type: string
                  description: Setlist name
                  maxLength: 200
                  example: Sunday Morning Service
                songs:
                  type: array
                  description: Ordered list of song IDs
                  items:
                    type: string
                    pattern: "^[A-Za-z]+-\\d+$"
                  minItems: 1
                  maxItems: 200
                  example: ["CP-0202", "MP-0042", "CP-0501"]
                owner:
                  type: string
                  description: Owner UUID (client-generated)
                  example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                id:
                  type: string
                  description: Existing setlist ID (for updates only)
                  example: "1a2b3c4d"
                arrangements:
                  type: object
                  description: Optional per-song arrangements mapping song IDs to component index arrays
                  additionalProperties:
                    type: array
                    items:
                      type: integer
                      minimum: 0
                  example:
                    CP-0202: [0, 1, 2, 1, 3]
      responses:
        "200":
          description: Setlist created or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 8-character hex share ID
                    example: "1a2b3c4d"
                  url:
                    type: string
                    description: Shareable URL path
                    example: /setlist/shared/1a2b3c4d
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Ownership verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: You do not own this shared set list.
        "404":
          description: Setlist not found (when updating)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Shared set list not found.
        "405":
          description: Method not allowed (must be POST)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error saving setlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=setlist_get:
    get:
      operationId: getSharedSetlist
      tags: [Setlists]
      summary: Retrieve a shared setlist
      description: |
        Retrieve a shared setlist by its short hex ID. Returns public-safe
        fields only (the owner UUID is excluded).
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [setlist_get]
        - name: id
          in: query
          required: true
          description: 8-character hex setlist ID
          schema:
            type: string
            example: "1a2b3c4d"
      responses:
        "200":
          description: Shared setlist data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedSetlist"
        "400":
          description: Invalid or missing setlist ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Setlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=user_setlists:
    get:
      operationId: getUserSetlists
      tags: [Setlists]
      summary: Get user's setlists
      description: Retrieve all setlists belonging to the authenticated user, ordered by last update.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [user_setlists]
      responses:
        "200":
          description: User setlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  setlists:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSetlist"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Not authenticated.

  /api.php?action=user_setlists_sync:
    post:
      operationId: syncUserSetlists
      tags: [Setlists]
      summary: Sync setlists with server
      description: |
        Reconcile local setlists with server-side storage. Behaviour depends
        on `mode` (WS-F #1018):
          * `replace` (default for per-edit auto-sync) — the client's full
            current list is authoritative: setlists present in the payload are
            upserted, and server setlists ABSENT from the payload are DELETED,
            so a deletion on one device propagates to the others.
          * `merge` (first-login backfill) — union: payload setlists are
            upserted and server-only setlists are preserved (never deleted).
        Maximum 50 setlists per user with up to 200 songs each.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [user_setlists_sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setlists]
              properties:
                mode:
                  type: string
                  enum: [replace, merge]
                  default: merge
                  description: >
                    'replace' deletes server setlists absent from the payload;
                    'merge' only adds/updates. Omitted → 'merge'.
                setlists:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [id, name, songs]
                    properties:
                      id:
                        type: string
                        description: Client-generated setlist ID
                      name:
                        type: string
                        maxLength: 200
                      createdAt:
                        type: string
                        format: date-time
                      songs:
                        type: array
                        maxItems: 200
                        items:
                          $ref: "#/components/schemas/SetlistSongEntry"
      responses:
        "200":
          description: Merged setlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  setlists:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSetlist"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===========================================================================
  # SONG REQUESTS
  # ===========================================================================

  /api.php?action=song_request:
    post:
      operationId: submitSongRequest
      tags: [Song Requests]
      summary: Submit a song request
      description: |
        Submit a community song request. Available to all users (authentication
        is optional but links the request to the user's account if provided).
        Rate-limited by IP address (configurable, default 5 per day).
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [song_request]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  description: Song title
                  maxLength: 500
                  example: How Great Thou Art
                songbook:
                  type: string
                  description: Songbook the song should be added to
                  maxLength: 100
                  example: CP
                song_number:
                  type: string
                  description: Known song number (if applicable)
                  maxLength: 20
                  example: "456"
                language:
                  type: string
                  description: Language code
                  maxLength: 10
                  default: en
                  example: en
                details:
                  type: string
                  description: Additional details or notes
                  maxLength: 2000
                contact_email:
                  type: string
                  format: email
                  description: Contact email for follow-up
                  maxLength: 255
      responses:
        "201":
          description: Song request submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: integer
                    description: ID of the created request
                    example: 42
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Song requests are disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Song requests are currently disabled.
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Rate limit exceeded. Maximum 5 requests per day.

  /api.php?action=my_song_requests:
    get:
      operationId: getMySongRequests
      tags: [Song Requests]
      summary: Get my song requests
      description: Retrieve the authenticated user's submitted song requests.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [my_song_requests]
      responses:
        "200":
          description: User's song requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/SongRequest"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===========================================================================
  # FAVORITES
  # ===========================================================================

  /api.php?action=favorites:
    get:
      operationId: getFavorites
      tags: [Favorites]
      summary: Get user favorites
      description: |
        Retrieve the authenticated user's favorites as `{id, tags}` objects
        (WS-G #1019 — `tags` is the per-favourite tag array, empty if none).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [favorites]
