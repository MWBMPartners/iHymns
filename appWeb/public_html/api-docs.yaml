        POST, editor role only. Only the `Annotation` column is mutable
        post-upload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              properties:
                mediaId: { type: integer }
                annotation: { type: string, description: Clamped to 255 chars. }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  mediaId: { type: integer }
        "400":
          description: Missing mediaId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Media not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: The Song Media migration has not been run on this install
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=media_delete:
    post:
      operationId: editorMediaDelete
      tags: [Editor API v2]
      summary: Delete a media file (row + underlying bytes)
      description: |
        POST, editor role only. The row is deleted first, then the
        underlying bytes — an orphan file is recoverable; an orphan row
        after "delete me" is worse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaId]
              properties:
                mediaId: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer }
                  songId: { type: string }
        "400":
          description: Missing mediaId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Media not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: The Song Media migration has not been run on this install
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=media_reorder:
    post:
      operationId: editorMediaReorder
      tags: [Editor API v2]
      summary: Rewrite SortOrder for one song's media of one kind
      description: |
        POST, editor role only. The scoped WHERE (Id+SongId+Kind) prevents
        cross-song/cross-kind tampering via a forged id list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, kind, ids]
              properties:
                songId: { type: string }
                kind: { type: string, description: "One of SongMediaStorage::allKinds()." }
                ids: { type: array, items: { type: integer }, description: Media ids in the desired order. }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  reordered: { type: integer }
        "400":
          description: Missing/invalid songId or kind
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: The Song Media migration has not been run on this install
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=import_file:
    post:
      operationId: editorImportFile
      tags: [Editor API v2]
      summary: Single-file bulk import (7 legacy song-file formats)
      description: |
        POST, `multipart/form-data`, editor role only. Routes the upload to
        the shared parser + universal saver (INSERT-only, skips existing).
        `format=auto` (default) detects from the file extension; `.json`
        content-sniffs between VideoPsalm and the iHymns interchange format
        (#1633); `.xml`/`.opensong` resolve via the shared auto-router
        (#882), which sniffs OpenLyrics vs OpenSong and retries the other
        parser once on a primary parse failure — the response's `format`
        echoes back whichever actually parsed. Max 25 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                format:
                  type: string
                  default: auto
                  enum: [auto, videopsalm, ihymns, openlp, opensong, pro6, proclaim, freeshow, chordpro, pptx, easyworship]
                dedupeMode: { type: string, enum: [off, skip-title], default: "off" }
      responses:
        "200":
          description: Import parsed and processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  format: { type: string, description: The format actually used to parse. }
                  songs_created: { type: integer }
                  songs_skipped_existing: { type: integer }
                  songs_failed: { type: integer }
        "400":
          description: No file / upload error, file too large, unknown/undetected format, or the file failed to parse (a genuine client error — wrong/bad file)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST required
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: Import failed for a non-user-facing reason
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=import_zip:
    post:
      operationId: editorImportZip
      tags: [Editor API v2]
      summary: Async multi-song ZIP import
      description: |
        POST, `multipart/form-data`, editor role only. Max 100 MB. An
        EasyWorship export zip (contains `Songs.db`) is detected and handled
        SYNCHRONOUSLY. Otherwise: when async job tracking
        (`tblBulkImportJobs`) is available, the upload is persisted, a job
        row is queued, the response returns immediately with `{async:true,
        job_id, poll_url}`, and a background worker processes the zip after
        the HTTP connection is released (`fastcgi_finish_request`). Without
        job tracking, or if persisting the upload fails, falls back to a
        SYNCHRONOUS import that returns the full summary in the same
        response.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: A .zip archive. }
                dedupeMode: { type: string, enum: [off, skip-title], default: "off" }
      responses:
        "200":
          description: Either an async job handle, or a completed synchronous summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  async: { type: boolean, description: True on the queued-job response. }
                  job_id: { type: integer, description: Present when async. }
                  status: { type: string, example: queued }
                  poll_url: { type: string }
                  songs_created: { type: integer, description: Present on a synchronous (non-async) response. }
                  songs_skipped_existing: { type: integer }
                  songs_failed: { type: integer }
        "400":
          description: No file / upload error, or an EasyWorship/synchronous import that failed to parse
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "413":
          description: Uploaded zip exceeds the 100 MB import limit
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: Server missing the PHP zip extension, or the import/job creation failed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=import_zip_status:
    get:
      operationId: editorImportZipStatus
      tags: [Editor API v2]
      summary: Poll an async ZIP import job (own jobs only)
      description: |
        GET, editor role only. Scoped to the calling user's own jobs
        (`UserId` in the WHERE).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [import_zip_status] }
        - name: job_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  job:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string, example: completed }
                      filename: { type: string }
                      size_bytes: { type: integer }
                      total_entries: { type: integer }
                      processed_entries: { type: integer }
                      percent: { type: number }
                      songs_created: { type: integer }
                      songs_skipped_existing: { type: integer }
                      songs_failed: { type: integer }
                      songbooks_created: { type: array, items: {} }
                      songbooks_existing: { type: array, items: {} }
                      errors: { type: array, items: {} }
                      per_songbook: { type: object, nullable: true }
                      skip_reason: { type: string, example: existing-in-db }
                      skipped_csv_url: { type: string }
                      phase_label: { type: string, nullable: true }
                      started_at: { type: string, nullable: true }
                      completed_at: { type: string, nullable: true }
                      created_at: { type: string }
                      updated_at: { type: string }
        "400":
          description: Missing job_id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Bulk-import job tracking not enabled on this deployment, or no job with that id owned by the caller
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=import_zip_skipped_csv:
    get:
      operationId: editorImportZipSkippedCsv
      tags: [Editor API v2]
      summary: CSV of the SongIds an async ZIP import job skipped
      description: |
        GET, editor role only. Own jobs only. Streams `text/csv` (with a
        UTF-8 BOM for Excel), not JSON.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [import_zip_skipped_csv] }
        - name: job_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "CSV: SongId, Title, SongbookAbbr, SongbookName, Reason"
          content:
            text/csv: {}
        "400":
          description: Missing job_id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Job tracking not enabled, no such job owned by the caller, or no skipped SongIds recorded
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The job has not yet completed
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=revision_list:
    get:
      operationId: editorRevisionList
      tags: [Editor API v2]
      summary: A song's revision history (metadata only, newest first)
      description: |
        GET, editor role only. Metadata rows only — the full `NewData`
        snapshot is fetched on `revision_restore`, not here.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [revision_list] }
        - name: songId
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Revision rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        action: { type: string }
                        createdAt: { type: string }
                        userId: { type: integer, nullable: true }
                        username: { type: string, nullable: true }
        "400":
          description: Missing songId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=revision_restore:
    post:
      operationId: editorRevisionRestore
      tags: [Editor API v2]
      summary: Restore a song to a prior revision's full snapshot
      description: |
        POST, editor role only. Restores scalars + components + credits +
        tags + links atomically from the revision's stored `NewData`
        snapshot, then records a forced `restore` revision so the trail
        stays linear. `songId`, if supplied, is a defense-in-depth check
        that the revision belongs to the expected song.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionId]
              properties:
                revisionId: { type: integer }
                songId: { type: string, description: "Optional — must match the revision's own SongId if given." }
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  songId: { type: string }
        "400":
          description: Missing revisionId
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Revision not found, or its song no longer exists
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: "The supplied songId doesn't match the revision's own song, or the revision has no stored snapshot to restore"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=save_song:
    post:
      operationId: editorV2SaveSong
      tags: [Editor API v2]
      summary: Whole-song save — the editor's primary save path
      description: |
        POST, editor role only. Delegates to the SAME shared
        `editorSaveSongCore()` (#1200) the legacy `manage/editor/api.php`
        save uses — one save implementation, no forked logic, no drift
        between v1 and v2 (CLAUDE.md modularity rule). Body is the whole
        song object (scalars + components + credits + …); `id` and `title`
        are the only hard requirements, everything else is optional and
        defaulted (songbook defaults to the song's own book, or `Misc` for
        a brand-new song; language validated as IETF BCP 47 and defaults to
        `en`). A save that promotes a draft id to a canonical one, or moves
        the song to a new songbook (both are re-keys), echoes `assignedId`
        + `previousId` + `number`; both are OMITTED on an ordinary save so
        the wire shape stays byte-identical for the common case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, title]
              properties:
                id: { type: string, example: CP-0202 }
                title: { type: string }
                songbook: { type: string }
                songbookName: { type: string }
                language: { type: string, example: en, description: IETF BCP 47 tag. }
                copyright: { type: string }
                number: { type: integer, nullable: true }
                tuneName: { type: string, nullable: true }
                ccli: { type: string }
                iswc: { type: string }
                originCity: { type: string, nullable: true }
                originCityId: { type: integer, nullable: true }
              description: |
                Additional optional scalar/component/credit fields are accepted
                per the whole-song shape `load_song` returns — not exhaustively
                enumerated here; see `save_song_core.php`.
      responses:
        "200":
          description: Saved; a coalesced revision snapshot is written
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  songId: { type: string }
                  action: { type: string, enum: [create, edit] }
                  assignedId: { type: string, description: Present only on a draft-id promotion or a songbook move. }
                  previousId: { type: string, description: Present alongside assignedId. }
                  number: { type: integer, nullable: true, description: Present alongside assignedId — the authoritative Number after the rename. }
                  translationWarnings: { type: array, items: { type: string }, description: Present only when a staged translation link could not be persisted. }
        "400":
          description: Missing required id/title, or an invalid IETF BCP 47 language tag
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "500":
          description: Save failed; details in server log (admin/global_admin callers get error_detail/error_class)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=line_translation_upsert:
    post:
      operationId: editorLineTranslationUpsert
      tags: [Editor API v2]
      summary: Create or update a per-line translation/transliteration (#1235 P3/#1088)
      description: |
        POST, editor role only. `translation.lineId` anchors to
        `tblLyricLines.Id`, the normalized-line read/write path (CLAUDE.md
        rule #21). Not a component-content change, so no revision row is
        written. `translation` shape:
        `{id?, lineId, kind, targetLanguage, text, translationType?,
        isPrimary?, sortOrder?, status?}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, translation]
              properties:
                songId: { type: string }
                translation:
                  type: object
                  required: [lineId, kind, targetLanguage, text]
                  properties:
                    id: { type: integer, description: Omit to create. }
                    lineId: { type: integer }
                    kind: { type: string }
                    targetLanguage: { type: string, description: Free-text BCP-47-ish tag. }
                    text: { type: string }
                    translationType: { type: string }
                    isPrimary: { type: boolean }
                    sortOrder: { type: integer }
                    status: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  translation: { type: object }
        "400":
          description: Missing songId, or the translation payload fails validation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found, or the referenced lineId does not belong to it
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The line-enrichment tables are not migrated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=line_translation_delete:
    post:
      operationId: editorLineTranslationDelete
      tags: [Editor API v2]
      summary: Delete a per-line translation/transliteration
      description: POST, editor role only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, id]
              properties:
                songId: { type: string }
                id: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer, description: 0 or 1. }
        "400":
          description: Missing songId/id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Row not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The line-enrichment tables are not migrated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=line_annotation_upsert:
    post:
      operationId: editorLineAnnotationUpsert
      tags: [Editor API v2]
      summary: Create or update a per-line/per-span annotation (#1235 P3/#1088)
      description: |
        POST, editor role only. `annotation.startLineId` anchors to
        `tblLyricLines.Id`; `startOffset`/`endOffset` are UTF-8 CODE-POINT
        indices, never byte or UTF-16 offsets (CLAUDE.md rule #21).
        `annotation` shape: `{id?, startLineId, endLineId?, startOffset?,
        endOffset?, annotationType, body, bodyFormat?, languageCode?,
        sortOrder?, status?}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, annotation]
              properties:
                songId: { type: string }
                annotation:
                  type: object
                  required: [startLineId, annotationType, body]
                  properties:
                    id: { type: integer, description: Omit to create. }
                    startLineId: { type: integer }
                    endLineId: { type: integer, nullable: true }
                    startOffset: { type: integer, nullable: true, description: UTF-8 code-point index. }
                    endOffset: { type: integer, nullable: true, description: UTF-8 code-point index. }
                    annotationType: { type: string }
                    body: { type: string }
                    bodyFormat: { type: string }
                    languageCode: { type: string }
                    sortOrder: { type: integer }
                    status: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  annotation: { type: object }
        "400":
          description: Missing songId, or the annotation payload fails validation
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Song not found, or the referenced line(s) do not belong to it
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The line-enrichment tables are not migrated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=line_annotation_delete:
    post:
      operationId: editorLineAnnotationDelete
      tags: [Editor API v2]
      summary: Delete a per-line/per-span annotation
      description: POST, editor role only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, id]
              properties:
                songId: { type: string }
                id: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  deleted: { type: integer, description: 0 or 1. }
        "400":
          description: Missing songId/id
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: Row not found
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: The line-enrichment tables are not migrated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=bulk_verify:
    post:
      operationId: editorBulkVerify
      tags: [Editor API v2]
      summary: Set/clear the Verified flag on many songs in one transaction
      description: |
        POST, entitlement `bulk_edit_songs`. Audited once via the activity
        log (no per-song revision row — a bulk flag flip isn't per-song
        content history).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songIds]
              properties:
                songIds: { type: array, items: { type: string } }
                verified: { type: boolean, default: true }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  count: { type: integer }
                  verified: { type: integer, description: 0 or 1 (the value applied). }
        "400":
          description: songIds missing/empty
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=bulk_tag_attach:
    post:
      operationId: editorBulkTagAttach
      tags: [Editor API v2]
      summary: Attach one tag (auto-created) to many songs in one transaction
      description: |
        POST, entitlement `bulk_edit_songs`. `INSERT IGNORE` skips
        already-tagged or missing songs — no per-id error surfaces from
        those.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songIds, name]
              properties:
                songIds: { type: array, items: { type: string } }
                name: { type: string }
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  tag:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      slug: { type: string }
                  attached: { type: integer, description: Count of songs newly tagged. }
                  count: { type: integer, description: Total songIds submitted. }
        "400":
          description: songIds/name missing, or the name has no usable characters
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /manage/editor/api2.php?action=bulk_tag_detach:
    post:
      operationId: editorBulkTagDetach
      tags: [Editor API v2]
      summary: Remove one tag from many songs in one transaction (#1628 item 3)
      description: |
        POST, entitlement `bulk_edit_songs`. Resolves the tag by SLUG (not
        Id), matching the same human-typed name `bulk_tag_attach` accepts.
        An unknown tag is NOT an error — detaching a tag nothing carries is
        a successful no-op (`{ok:true,detached:0}`), not a 404. Never
        deletes the tag row itself when the last song loses it (a curated
        vocabulary, not garbage-collected).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songIds, name]
              properties:
                songIds: { type: array, items: { type: string } }
                name: { type: string }
      responses:
        "200":
          description: Applied (or a no-op if nothing carried the tag)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  tag:
                    type: object
                    properties:
                      id: { type: integer, nullable: true }
                      name: { type: string }
                      slug: { type: string }
                  detached: { type: integer, description: Count of songs the tag was actually removed from. }
                  count: { type: integer, description: Total songIds submitted. }
        "400":
          description: songIds/name missing, or the name has no usable characters
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

# =============================================================================
# COMPONENTS
# =============================================================================

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        64-character hex token obtained from `auth_register`, `auth_login`,
        or `auth_email_login_verify`. Tokens expire after 30 days with a
        sliding renewal (every authenticated request bumps the expiry by
        one day, at most once per 24h).
    cookieAuth:
      type: apiKey
      in: cookie
      name: ihymns_auth
      description: |
        Cross-subdomain session cookie (`Domain=.ihymns.app; HttpOnly;
        SameSite=Lax; Secure`) carrying the same token as the Bearer
        header. Set on successful login; consumed by
        `getAuthenticatedUser()` when no `Authorization` header is
        present. Either scheme is accepted wherever security is
        declared with both entries.
    ingestApiKey:
      type: http
      scheme: bearer
      description: |
        Machine-to-machine API key (#1064) for external services (e.g.
        MeedyaDL) — NOT a user token. A global admin mints it at
        `/manage/api-keys`; it is stored only as a SHA-256 hash + a short
        prefix (`tblApiKeys`) and carries a space-separated scope. Scopes:
        `lyrics:ingest` (write — the lyrics-ingest endpoint) and
        `catalogue:read` (read — the public catalogue reads at the key's own
        per-key rate limit instead of the anonymous IP limit; it does NOT
        unlock gated/copyrighted content), and `content:gated` (a SEPARATE,
        deliberately-granted scope to read gated/copyrighted content unstripped —
        dormant unless content gating is enabled; issuing it is a per-partner
        licensing decision). Per-key limits + usage are managed at
        `/manage/api-keys`. Send it as `Authorization: Bearer ihk_live_…`
        or, equivalently, the `X-API-Key` header.
    ingestApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Alternative to the Bearer header for the same machine-to-machine
        key — `X-API-Key: ihk_live_…`.
    driverKeyAuth:
      type: http
      scheme: bearer
      description: |
        Durable, org-scoped driver key (#1770 C4) for external
        presentation-app automation (`service_drive`) — a DIFFERENT
        credential family from `ingestApiKey` above (`tblServiceDriverKeys`,
        not `tblApiKeys`): a church's shim may only ever drive its OWN
        organisation's Service-Mode sessions, whereas an ingest key is
        site-admin-minted with no org scoping. An org-admin mints it at
        `service_driver_key_mint`; stored only as a SHA-256 hash + a short
        prefix. Send as `Authorization: Bearer ihdrv_live_…` or,
        equivalently, the `X-API-Key` header.
    driverKeyAuthHeader:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Alternative to the Bearer header for the same #1770 driver key —
        `X-API-Key: ihdrv_live_…`.

  responses:
    RateLimited:
      description: |
        Too Many Requests — the per-window read rate limit was exceeded
        (#1354). See the **Read rate limiting** section in the API
        description for the per-action limits and the bucket key. Limits
        are generous (2–4 req/s sustained per device); a normal client
        never trips them. The limiter is **fail-open** — on an install
        where the backing table hasn't been migrated, or on any DB error,
        no limit applies.
      headers:
        Retry-After:
          description: Seconds to wait before retrying (60 for the minute window).
          schema: { type: integer, example: 60 }
        X-RateLimit-Limit:
          description: The per-window request ceiling that was exceeded.
          schema: { type: integer, example: 120 }
        X-RateLimit-Window:
          description: The window TYPE word (not a number) — `minute` (read endpoints) or `day`.
          schema: { type: string, enum: [minute, day], example: minute }
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Rate limit exceeded (120 per minute). Please slow down and retry shortly."
              retryAfter:
                type: integer
                description: Mirrors the `Retry-After` header.
                example: 60

  schemas:
    # -------------------------------------------------------------------------
    # Core domain models
    # -------------------------------------------------------------------------

    Song:
      type: object
      description: Complete song object with lyrics components
      properties:
        id:
          type: string
          description: "Unique song ID in BOOK-NUMBER format"
          example: CP-0202
        number:
          type: integer
          description: Song number within the songbook
          example: 202
        title:
          type: string
          description: Song title
          example: Amazing Grace
        songbook:
          type: string
          description: Songbook abbreviation
          example: CP
        songbookName:
          type: string
          description: Full songbook name
          example: Christian Praise
        language:
          type: string
          description: Language code
          example: en
        copyright:
          type: string
          nullable: true
          description: Copyright information
        ccli:
          type: string
          nullable: true
          description: CCLI license number
        verified:
          type: boolean
          description: Whether the song lyrics have been verified
        lyricsPublicDomain:
          type: boolean
          description: Whether the lyrics are in the public domain
        musicPublicDomain:
          type: boolean
          description: Whether the music is in the public domain
        hasAudio:
          type: boolean
          description: Whether an audio recording is available
        hasSheetMusic:
          type: boolean
          description: Whether sheet music is available
        writers:
          type: array
          items:
            type: string
          description: Lyricist / writer names
          example: ["John Newton"]
        composers:
          type: array
          items:
            type: string
          description: Composer / tune names
          example: ["Virginia Harmony"]
        artists:
          type: array
          items:
            type: string
          description: Recording / release artist names (#587). Most useful for contemporary worship songs; traditional hymns leave this blank.
          example: ["Hillsong Worship"]
        components:
          type: array
          description: Ordered song components (verses, choruses, etc.)
          items:
            $ref: "#/components/schemas/SongComponent"
        links:
          type: array
          description: |
            External links attached to this song (#833). Categorised,
            with optional curator notes and a verified flag. Empty
            array on pre-migration deployments.
          items:
            $ref: "#/components/schemas/ExternalLink"
        works:
          type: array
          description: |
            Works (#840) this song belongs to. Each entry surfaces its
            sibling members + Work-level external links, so a UI can
            render "Other versions of this work" without an extra
            round-trip. Empty on pre-migration deployments.
          items:
            $ref: "#/components/schemas/Work"
        contentRestricted:
          type: boolean
          description: |
            Content gating (#1353). Present and `true` only when
            `content_gating_enabled='1'` AND the caller's access tier may
            not view this song's lyric body — `components` /
            `translations` / `annotations` / `vocalParts` are then
            stripped from the payload. Absent entirely when gating is off
            (the default) or the caller is allowed to view the lyrics.
        restrictionReason:
          type: string
          nullable: true
          enum: [lyrics_not_available_on_tier, copyrighted_requires_higher_tier]
          description: |
            Present only alongside `contentRestricted: true`. Distinguishes
            "this tier never sees lyrics" from "this song is copyrighted
            and needs a higher tier" so the client can render a tailored
            upgrade prompt.
        offlineAllowed:
          type: boolean
          description: |
            Content gating (#1353). Whether the caller's access tier may
            save this song for offline use — mirrors the `offline_save`
            capability. Only present when `content_gating_enabled='1'`;
            absent when gating is off (the default no-op path).

    SongComponent:
      type: object
      description: A single verse, chorus, or other song section
      properties:
        type:
          type: string
          description: "Component type (e.g., verse, chorus, bridge)"
          example: verse
        number:
          type: integer
          description: Component number (e.g., verse 1, verse 2)
          example: 1
        lines:
          type: array
          items:
            type: string
          description: Lines of text in this component
          example:
            - Amazing grace how sweet the sound
            - That saved a wretch like me
            - I once was lost but now am found
            - Was blind but now I see
        label:
          type: string
          description: |
            Optional custom display name for this section (e.g. "Kyrie",
            "isiZulu"), overriding the derived "Verse 1"/"Chorus" heading
            everywhere the song is rendered. #1860 Phase 5. SPARSE: this key
            is present ONLY when the curator has set a label — omitted
            entirely for every unlabelled component (the pre-existing
            byte-identical response for the whole un-labelled corpus is
            unaffected), so a client must treat an absent key the same as
            deriving the heading from `type`+`number` itself.
          example: Kyrie

    SongSummary:
      type: object
      description: Lightweight song summary for list views (no lyrics)
      properties:
        id:
          type: string
          example: CP-0202
        number:
          type: integer
          example: 202
        title:
          type: string
          example: Amazing Grace
        songbook:
          type: string
          example: CP
        songbookName:
          type: string
          example: Christian Praise
        writers:
          type: array
          items:
            type: string
          example: ["John Newton"]
        hasAudio:
          type: boolean
        hasSheetMusic:
          type: boolean
        lyricsSnippet:
          type: string
          description: |
            First body line containing a query term — present only on
            search hits driven by a lyrics match (lyrics search on).
          example: "Through many dangers, toils and snares"
        matchedVia:
          type: object
          description: |
            Why a curated result was surfaced — present only when the hit
            came from an alternative-title match (#832).
          properties:
            alternativeTitle:
              type: string
              example: "Faith's Review and Expectation"

    Songbook:
      type: object
      description: |
        A songbook / hymnal. The bibliographic + authority-control
        fields (`websiteUrl` … `lcClass`) and `language` were added
        across #672 / #673 / #681. They appear on every read path
        whose backing `tblSongbooks` deployment has run the matching
        migrations (`migrate-songbook-bibliographic` and
        `migrate-songbook-language`); pre-migration deployments
        simply omit the fields rather than returning nulls.
      properties:
        id:
          type: string
          description: Songbook abbreviation
          example: CP
        name:
          type: string
          description: Full songbook name
          example: Christian Praise
        songCount:
          type: integer
          description: Number of songs in the songbook
          example: 650
        colour:
          type: string
          nullable: true
          description: 6-digit hex tile colour (#677). NULL means "use the auto-picked theme tone".
          example: "#264a26"
        isOfficial:
          type: boolean
          description: Whether this songbook is recognised as an official publication of an Adventist organisation (#502 / #670).
          example: true
        publisher:
          type: string
          nullable: true
          description: Issuing publisher (free-text)
          example: Pacific Press Publishing Association
        publicationYear:
          type: integer
          nullable: true
          description: Year of publication (4-digit Gregorian)
          example: 1985
        copyright:
          type: string
          nullable: true
          description: Copyright statement
          example: "© 1985 Review and Herald"
        affiliation:
          type: string
          nullable: true
          description: |
            Issuing organisation, drawn from the curated registry
            `tblSongbookAffiliations` (#670). Free-text fallback if
            the registry doesn't carry the publisher yet.
          example: General Conference of Seventh-day Adventists
        language:
          type: string
          nullable: true
          description: |
            IETF BCP 47 tag for the songbook's primary language (#673
            / #681). Composite — language[-script][-region]. May be
            null if unknown / mixed.
          example: en-GB
        websiteUrl:
          type: string
          nullable: true
          description: Official website (#672)
          example: https://www.adventistmusic.org
        internetArchiveUrl:
          type: string
          nullable: true
          description: Internet Archive landing page for a digitised copy (#672)
        wikipediaUrl:
          type: string
          nullable: true
          description: Wikipedia article URL (#672)
        wikidataId:
          type: string
          nullable: true
          description: Wikidata QID (#672)
          example: Q123456
        oclcNumber:
          type: string
          nullable: true
          description: OCLC WorldCat record number (#672)
        ocnNumber:
          type: string
          nullable: true
          description: OCLC OCN identifier (#672)
        lcpNumber:
          type: string
          nullable: true
          description: Library of Congress Permalink number (#672)
        isbn:
          type: string
          nullable: true
          description: ISBN-10 or ISBN-13 (#672)
        arkId:
          type: string
          nullable: true
          description: Archival Resource Key (ARK) (#672)
        isniId:
          type: string
          nullable: true
          description: International Standard Name Identifier (#672)
        viafId:
          type: string
          nullable: true
          description: Virtual International Authority File ID (#672)
        lccn:
          type: string
          nullable: true
          description: Library of Congress Control Number (#672)
        lcClass:
          type: string
          nullable: true
          description: Library of Congress Classification (#672)
          example: M2117
        openLibraryWorkId:
          type: string
          nullable: true
          description: OpenLibrary Work ID (#1765)
          example: OL102749W
        openLibraryEditionId:
          type: string
          nullable: true
          description: OpenLibrary Edition ID (#1765)
          example: OL7357422M
        isPublicDomain:
          type: boolean
          description: Whether the songbook, as a published work, is in the public domain (#1765). Informational only — it does not itself gate access to any content.
          example: false
        isDisabled:
          type: boolean
          description: >-
            Whether the songbook is disabled (#1765). A disabled songbook is
            hidden from every public surface but stays fully visible and
            editable under /manage. Always false in public API responses —
            disabled books are filtered out server-side — and only ever true
            in admin-mode reads.
          example: false

    SongbookWriteInput:
      type: object
      description: |
        Input shape for `admin_songbook_create` and the metadata half
        of `admin_songbook_update` (#719 PR 2a). Snake_case JSON keys
        map onto the same column set the web admin writes; validators
        live in `includes/songbook_validation.php` and are shared with
        `/manage/songbooks` so a tweak to the grammar lands on both
        surfaces in one go.

        - `abbreviation`: required on create, ignored on update (use
          `new_abbreviation` for renames).
        - `colour`: optional. Empty triggers the auto-pick palette
          (#677); the resolved hex is echoed back on the response.
        - `language`: optional IETF BCP 47 tag (#681). Format:
          `lang[-Script][-Region]`, max 35 chars.
        - All bibliographic identifier fields are nullable; an empty
          string normalises to NULL on the server.
      required: [abbreviation, name]
      properties:
        abbreviation:
          type: string
          maxLength: 10
          pattern: "^[A-Za-z0-9]+$"
          description: ASCII-alphanumeric natural key. Used by tblSongs.SongbookAbbr.
          example: CP
        name:
          type: string
          example: Christian Praise
        display_order:
          type: integer
          default: 0
          description: Sort key used by the songbook list UI.
        colour:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
          nullable: true
          description: 7-char `#RRGGBB` hex. Empty/missing triggers the auto-pick palette (#677).
          example: "#3B82F6"
        is_official:
          type: boolean
          default: false
          description: Recognised as an official Adventist publication (#502 / #670).
        publisher:
          type: string
          nullable: true
          example: Pacific Press Publishing Association
        publication_year:
          type: string
          nullable: true
          description: Year of publication. Stored as VARCHAR so non-numeric strings (e.g. "1985 / 2002 reprint") survive.
          example: "1985"
        copyright:
          type: string
          nullable: true
          example: "© 1985 Review and Herald"
        affiliation:
          type: string
          nullable: true
          description: |
            Issuing organisation. Free-text; the API also INSERT-IGNOREs
            the value into `tblSongbookAffiliations` so the typeahead
            surfaces it on the next save (#670).
        language:
          type: string
          nullable: true
          maxLength: 35
          pattern: "^[a-z]{2,3}(-[A-Z][a-z]{3})?(-[A-Z]{2}|-[0-9]{3})?$"
          description: IETF BCP 47 tag (#681). lang[-Script][-Region].
          example: en-GB
        website_url:
          type: string
          nullable: true
          description: Official website (#672)
        internet_archive_url:
          type: string
          nullable: true
          description: Internet Archive landing page (#672)
        wikipedia_url:
          type: string
          nullable: true
          description: Wikipedia article URL (#672)
        wikidata_id:
          type: string
          nullable: true
          description: Wikidata QID (#672)
        oclc_number:
          type: string
          nullable: true
          description: OCLC WorldCat record number (#672)
        ocn_number:
          type: string
          nullable: true
          description: OCLC OCN identifier (#672)
        lcp_number:
          type: string
          nullable: true
          description: Library of Congress Permalink number (#672)
        isbn:
          type: string
          nullable: true
          description: ISBN-10 or ISBN-13 (#672)
        ark_id:
          type: string
          nullable: true
          description: Archival Resource Key (ARK) (#672)
        isni_id:
          type: string
          nullable: true
          description: International Standard Name Identifier (#672)
        viaf_id:
          type: string
          nullable: true
          description: Virtual International Authority File ID (#672)
        lccn:
          type: string
          nullable: true
          description: Library of Congress Control Number (#672)
        lc_class:
          type: string
          nullable: true
          description: Library of Congress Classification (#672)

    Stats:
      type: object
      description: Aggregate collection statistics
      properties:
        totalSongs:
          type: integer
          example: 4500
        totalSongbooks:
          type: integer
          example: 6
        songbooks:
          type: array
          items:
            $ref: "#/components/schemas/Songbook"

    # -------------------------------------------------------------------------
    # Language & translation models
    # -------------------------------------------------------------------------

    Language:
      type: object
      properties:
        code:
          type: string
          description: ISO language code
          example: en
        name:
          type: string
          description: Language name in English
          example: English
        nativeName:
          type: string
          description: Language name in the native language
          example: English
        textDirection:
          type: string
          description: Text direction
          enum: [ltr, rtl]
          example: ltr

    Script:
      type: object
      description: |
        One row from `tblScripts` (ISO 15924). The `code` is the
        canonical 4-letter Title Case identifier the IETF BCP 47
        spec uses (#681).
      properties:
        code:
          type: string
          description: ISO 15924 script code (Title Case, 4 letters)
          example: Latn
        name:
          type: string
          description: Script name in English
          example: Latin
        nativeName:
          type: string
          description: Script name in its own writing system
          example: Latin

    Region:
      type: object
      description: |
        One row from `tblRegions`. `code` is either the ISO 3166-1
        alpha-2 country code (uppercase, 2 letters — e.g. `GB`) or a
        UN M.49 numeric area code (3 digits — e.g. `419` = Latin
        America & Caribbean). Either form is valid as the region
        subtag of an IETF BCP 47 tag.
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 country code or 3-digit M.49 area code
          example: GB
        name:
          type: string
          description: Region name in English
          example: United Kingdom

    SongTranslation:
      type: object
      description: |
        One related-language version of a song, as returned by
        `song_translations` (#281). Unions outward, inward, and sibling
        relationships, so `songId` may point at the original, a
        translation, or another-language sibling depending on which
        direction it was reached from.
      properties:
        songId:
          type: string
          description: Related song's ID
          example: FR-0202
        title:
          type: string
          description: Title of the related song
          example: "Comme la rosée"
        number:
          type: integer
          description: Song number within its songbook
          example: 202
        language:
          type: string
          description: ISO 639-1 code of the related language
          example: fr
        languageName:
          type: string
          description: English name of the language
          example: French
        languageNativeName:
          type: string
          description: Native name of the language
          example: "Fran\u00E7ais"
        translator:
          type: string
          description: Translator credit; empty for the inward link back to the source.
        verified:
          type: boolean
          description: Whether the translation has been curator-verified

    # -------------------------------------------------------------------------
    # Setlist models
    # -------------------------------------------------------------------------

    SharedSetlist:
      type: object
      description: A publicly shared setlist (owner id/email excluded — a strict allow-list, #1380/#1535/#1791)
      properties:
        id:
          type: string
          description: 8-character hex share ID
          example: "1a2b3c4d"
        shareId:
          type: string
          description: "#1791 — the resolved share id (8-character hex for a view link, or a base64url capability token for an edit link). Echoes the id/token the request was made with."
          example: "1a2b3c4d"
        name:
          type: string
          example: Sunday Morning Service
        songs:
          type: array
          items:
            type: string
          example: ["CP-0202", "MP-0042"]
        live:
          type: boolean
          description: "#1380 — true when this share re-resolves the owner's CURRENT set list at read time; false for a frozen snapshot."
        scope:
          type: string
          enum: [view, edit]
          description: "#1791 — view (read-only, the default) or edit (a collab-by-link capability)."
        canWrite:
          type: boolean
          description: "#1791 — server-stated write capability; the client never re-derives this. Requires scope=edit, a live link, an unlocked owner account (#1698), and — when the link's edit audience is 'authenticated' — a signed-in requester."
        isOwner:
          type: boolean
          description: "#1535 — true only when the CURRENT authenticated viewer is this share's owner. The owner's identity is never otherwise echoed."
        created:
          type: string
          format: date-time
          nullable: true
        updated:
          type: string
          format: date-time
          nullable: true
        arrangements:
          type: object
          description: Optional per-song arrangements (only present if set)
          additionalProperties:
            type: array
            items:
              type: integer
        songsDetailed:
          type: array
          description: "#1791 — the editable object shape ({id, title, songbook, number, arrangement?}), present ONLY when canWrite is true. Same data the view already exposes; no new disclosure."
          items:
            type: object
        lockReason:
          type: string
          nullable: true
          description: |
            #1791 — present only when canWrite is false, explaining why:
            `signin_required` (G4 — the link's edit audience is `authenticated`
            and the requester is not signed in), or one of the pre-existing
            #1698 owner-lock reasons (the owner's account is disabled/deleted).
        sharedByName:
          type: string
          nullable: true
          description: |
            #1791 G3 — the owner's display name, present ONLY when the link's
            `ShowSharerName` flag is set AND a live owner is known. Strictly
            opt-in per link (default off); the owner id/email are never echoed
            regardless of this flag.

    UserSetlist:
      type: object
      description: A user-owned setlist stored server-side
      properties:
        id:
          type: string
          description: Client-generated setlist ID
        name:
          type: string
          example: Evening Worship
        songs:
          type: array
          items:
            $ref: "#/components/schemas/SetlistSongEntry"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          nullable: true
          description: >
            #1661 — optional expiry, UTC 'YYYY-MM-DD HH:MM:SS'. null = never
            expires (the default). Always present in the response shape; null
            both when unset and on an install that has not run the
            `setlist-tombstones` migration.

    SetlistSongEntry:
      type: object
      description: A song entry within a user setlist
      properties:
        id:
          type: string
          description: Song ID
          example: CP-0202
        title:
          type: string
          maxLength: 300
          example: Amazing Grace
        songbook:
          type: string
          maxLength: 20
          example: CP
        number:
          type: integer
          example: 202
        arrangement:
          type: array
          description: Optional custom component arrangement (array of component indices)
          items:
            type: integer
            minimum: 0
          example: [0, 1, 2, 1, 3]

    FavoriteEntry:
      type: object
      description: A user favourite with its per-song tags (WS-G #1019)
      required: [id]
      properties:
        id:
          type: string
          pattern: "^[A-Za-z]+-\\d+$"
          example: CP-0202
        tags:
          type: array
          description: Per-favourite user tags (empty if none)
          items:
            type: string
            maxLength: 50
          example: ["Easter", "Communion"]

    # -------------------------------------------------------------------------
    # Song request models
    # -------------------------------------------------------------------------

    SongRequest:
      type: object
      description: A user's own song request
      properties:
        id:
          type: integer
          example: 42
        title:
          type: string
          example: How Great Thou Art
        songbook:
          type: string
          nullable: true
        songNumber:
          type: string
          nullable: true
        language:
          type: string
          example: en
        details:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, reviewed, added, declined]
          example: pending
        resolvedSongId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    AdminSongRequest:
      type: object
      description: Song request with admin-visible fields
      properties:
        id:
          type: integer
        title:
          type: string
        songbook:
          type: string
          nullable: true
        songNumber:
          type: string
          nullable: true
        language:
          type: string
        details:
          type: string
          nullable: true
        contactEmail:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, reviewed, added, declined]
        adminNotes:
          type: string
          nullable: true
        resolvedSongId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        submittedBy:
          type: string
          nullable: true
          description: Username of the submitter (null if anonymous)

    SongRequestSubmitInput:
      type: object
      description: |
        Shared body shape for `song_request_submit` (#1472), accepted as
        either `application/json` or `application/x-www-form-urlencoded`.
        `website` is a honeypot — hidden from real users via CSS; any
        non-empty value silently short-circuits to a fake success without
        writing a row.
      required: [title]
      properties:
        title:
          type: string
          maxLength: 500
          example: "Great Is Thy Faithfulness"
        songbook:
          type: string
          maxLength: 100
          description: Free-text songbook name/abbreviation the requester typed in
          example: Christian Praise
        details:
          type: string
          maxLength: 2000
          description: Why the user wants this song added, or any identifying detail
        email:
          type: string
          format: email
          maxLength: 255
          description: Optional reply-to address
        website:
          type: string
          description: Honeypot — MUST be left empty by real clients

    # -------------------------------------------------------------------------
    # User & auth models
    # -------------------------------------------------------------------------

    User:
      type: object
      description: Public user profile
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john.doe
        display_name:
          type: string
          example: John Doe
        role:
          type: string
          enum: [user, editor, admin, global_admin]
          example: user

    UserWithEmail:
      type: object
      description: User profile including email (returned after profile update)
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john.doe
        display_name:
          type: string
          example: John Doe
        email:
          type: string
          example: john@example.com
        role:
          type: string
          enum: [user, editor, admin, global_admin]

    AuthResponse:
      type: object
      description: Authentication response with token and user info
      properties:
        token:
          type: string
          description: 64-character hex bearer token (valid for 30 days)
          example: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
        user:
          $ref: "#/components/schemas/User"

    LinkedProvider:
      type: object
      description: >-
        One external-identity provider linked to the caller's account
        (#1479 W3) — returned by `auth_providers_list` and
        `auth_provider_unlink`. NEVER exposes the Apple `sub` (Subject)
        or `RefreshToken` (see `_authProviderListForUser()`'s docblock).
      properties:
        provider:
          type: string
          example: apple
        email_masked:
          type: string
          description: >-
            Masked form of the email captured at link time (e.g.
            `a****@e****.com`); empty string when no email was
            captured.
          example: a****@e****.com
        is_private_relay:
          type: boolean
          description: >-
            True when `email_masked` is derived from an Apple
            private-relay alias (`@privaterelay.appleid.com`).
        linked_at:
          type: string
          format: date-time
          nullable: true
          example: "2026-07-09T12:34:56+00:00"

    # -------------------------------------------------------------------------
    # Access & group models
    # -------------------------------------------------------------------------

    UserGroup:
      type: object
      description: A user group with version access flags
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Beta Testers
        accessAlpha:
          type: boolean
          description: Access to alpha builds
        accessBeta:
          type: boolean
          description: Access to beta builds
        accessRc:
          type: boolean
          description: Access to release candidate builds
        accessRtw:
          type: boolean
          description: Access to release-to-web builds

    # -------------------------------------------------------------------------
    # Admin models
    # -------------------------------------------------------------------------

    AdminUser:
      type: object
      description: User record visible to administrators
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: john.doe
        email:
          type: string
          nullable: true
        display_name:
          type: string
          example: John Doe
        role:
          type: string
          enum: [user, editor, admin, global_admin]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        group_name:
          type: string
          nullable: true
          description: Name of the user's primary group

    AdminGroup:
      type: object
      description: User group record for administration
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        accessAlpha:
          type: boolean
        accessBeta:
          type: boolean
        accessRc:
          type: boolean
        accessRtw:
          type: boolean

    ActivityLogEntry:
      type: object
      description: A single activity log entry
      properties:
        id:
          type: integer
        action:
          type: string
          description: Action type identifier
        entityType:
          type: string
          nullable: true
          description: Type of entity affected
        entityId:
          type: string
          nullable: true
          description: ID of the entity affected
        details:
          type: object
          nullable: true
          description: Additional structured details (JSON)
        ipAddress:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        username:
          type: string
          nullable: true
          description: Username of the actor

    # -------------------------------------------------------------------------
    # Admin write-input shapes (#719 PR 2b)
    # -------------------------------------------------------------------------

    AdminUserCreateInput:
      type: object
      description: |
        Input for `admin_user_create`. The mutation routes through
        `createUser()` in `manage/includes/auth.php`, which hashes
        the password with bcrypt before insert and writes the
        canonical `user.create` activity-log row.
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          description: Case preserved on disk; uniqueness check is case-insensitive (utf8mb4_unicode_ci).
        password:
          type: string
          minLength: 8
          format: password
        display_name:
          type: string
          description: Defaults to `username` when blank.
        role:
          type: string
          enum: [user, editor, admin, global_admin]
          default: editor
          description: |
            Hierarchy gate: can never exceed the acting user's role
            level; only `global_admin` can assign `global_admin`.
        email:
          type: string
          format: email

    AdminUserProfileInput:
      type: object
      description: Input for `admin_user_update` (display name + email only).
      required: [user_id, display_name]
      properties:
        user_id:    { type: integer }
        display_name: { type: string }
        email:      { type: string, format: email }

    AdminGroupWriteInput:
      type: object
      description: |
        Input for `admin_group_create` and the metadata half of
        `admin_group_update`. Add `id` (required) for the latter.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        access_alpha: { type: boolean, default: false }
        access_beta:  { type: boolean, default: false }
        access_rc:    { type: boolean, default: false }
        access_rtw:   { type: boolean, default: false }

    AdminTierCapabilities:
      type: object
      description: |
        Capability flags keyed by exact `tblAccessTiers` column
        name. Unknown keys are ignored; missing keys default to
        false. The list mirrors `TIER_CAPS` in
        `includes/access_tier_validation.php` so a new capability
        is a one-line schema + const change.
      properties:
        CanViewLyrics:      { type: boolean, default: false }
        CanViewCopyrighted: { type: boolean, default: false }
        CanPlayAudio:       { type: boolean, default: false }
        CanDownloadMidi:    { type: boolean, default: false }
        CanDownloadPdf:     { type: boolean, default: false }
        CanOfflineSave:     { type: boolean, default: false }
        RequiresCcli:       { type: boolean, default: false }

    AdminTierCreateInput:
      type: object
      description: Input for `admin_tier_create`.
      required: [name, display_name, level]
      properties:
        name:
          type: string
          maxLength: 30
          pattern: "^[A-Za-z0-9_-]+$"
          description: Machine key. Letters / digits / hyphen / underscore. Case preserved.
          example: mwbm-insiders
        display_name:
          type: string
          example: MWBM Insiders
        level:
          type: integer
          minimum: 0
          maximum: 1000
          description: Higher level = more permissions. Bounded so a typo can't elevate one tier above the rest.
        description:
          type: string
        caps:
          $ref: "#/components/schemas/AdminTierCapabilities"

    AdminTierUpdateInput:
      type: object
      description: |
        Input for `admin_tier_update`. The machine `name` is
        intentionally immutable — too many `tblUsers.AccessTier`
        rows reference it for a casual rename. Use a manual SQL
        migration if a rename is genuinely needed.
      required: [id, display_name, level]
      properties:
        id:
          type: integer
        display_name:
          type: string
        level:
          type: integer
          minimum: 0
          maximum: 1000
        description:
          type: string
        caps:
          $ref: "#/components/schemas/AdminTierCapabilities"

    # -------------------------------------------------------------------------
    # Organisation write-input shapes (#719 PR 2c)
    # -------------------------------------------------------------------------

    AdminOrganisationUpdateInput:
      type: object
      description: |
        Input for `admin_organisation_update`. Mirrors the system
        admin's update form on `/manage/organisations`.
        `additional_licences` REPLACES the current
        `tblOrganisationLicences` set for the org; the primary
        `licence_type` is folded in automatically so the two
        surfaces stay coherent.
      required: [id, name, licence_type]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          description: |
            Optional override. When omitted the API derives one
            from `name` via the same lowercase + non-alphanum-→hyphen
            transform `/manage/organisations` uses.
        parent_org_id:
          type: integer
          nullable: true
          description: Cannot equal `id` (an organisation cannot be its own parent).
        description:
          type: string
        licence_type:
          type: string
          enum: [none, ihymns_basic, ihymns_pro, ccli]
          default: none
        licence_number:
          type: string
        is_active:
          type: boolean
          default: false
        additional_licences:
          type: array
          items:
            type: string
            enum: [ihymns_basic, ihymns_pro, ccli]
          description: |
            Replaces the current `tblOrganisationLicences` set for
            this org. The primary `licence_type` is folded in
            automatically — no need to repeat it here.

    AdminOrgMemberInput:
      type: object
      description: |
        Shared input shape for `admin_organisation_member_add`,
        `admin_organisation_member_role_change`, and
        `org_admin_member_role_change`. The org-admin variant uses
        the same body shape with the row-level
        `userCanActOnOrg()` gate applied at the server.
      required: [org_id, user_id]
      properties:
        org_id:
          type: integer
        user_id:
          type: integer
        member_role:
          type: string
          enum: [member, admin, owner]
          default: member

    OrgAdminLicenceAddInput:
      type: object
      description: |
        Input for `org_admin_licence_add`. Per-row licence shape;
        a separate row is created for each licence type the org
        holds. Distinct from the system-admin update path which
        uses the 4-key primary set with `none` sentinel — the
        per-row surface accepts `mrl` and `custom` but not `none`.
      required: [org_id, licence_type]
      properties:
        org_id:
          type: integer
        licence_type:
          type: string
          enum: [ccli, mrl, ihymns_basic, ihymns_pro, custom]
        licence_number:
          type: string
        expires_at:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
          default: false
        notes:
          type: string
          nullable: true

    OrgAdminLicenceChangeInput:
      type: object
      description: Input for `org_admin_licence_change`. licence_type is immutable on a row — to switch types, remove and re-add.
      required: [org_id, licence_id]
      properties:
        org_id:
          type: integer
        licence_id:
          type: integer
        licence_number:
          type: string
        expires_at:
          type: string
          format: date
          nullable: true
        is_active:
          type: boolean
          default: false
        notes:
          type: string
          nullable: true

    # -------------------------------------------------------------------------
    # Credit-people write-input + diagnostics shapes (#719 PR 2d)
    # -------------------------------------------------------------------------

    MusicianLink:
      type: object
      description: |
        One row of the per-person external-link sub-form. Unknown
        `type` keys are silently coerced to `other` server-side —
        keeps the API forward-compatible with future picker
        categories.
      required: [url]
      properties:
        type:
          type: string
          description: Link type key from MUSICIAN_LINK_TYPE_CATALOGUE (e.g. `wikipedia`, `spotify`, `youtube`). Unknown keys → `other`.
          default: other
        url:
          type: string
        label:
          type: string
          nullable: true
        sort_order:
          type: integer
          default: 0

    MusicianIpi:
      type: object
      description: One row of the per-person IPI Name Number sub-form.
      required: [number]
      properties:
        number:
          type: string
          description: IPI Name Number (CISAC).
        name_used:
          type: string
          nullable: true
          description: Name variant the IPI is registered under, if it differs from the canonical name.
        notes:
          type: string
          nullable: true

    AdminMusicianInput:
      type: object
      description: |
        Shared input for `admin_musician_add` and the metadata
        half of `admin_musician_update`. Add `id` (required)
        for the latter via `allOf` composition.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        notes:
          type: string
          nullable: true
        birth_place:
          type: string
          nullable: true
        birth_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: YYYY-MM-DD if supplied.
        death_place:
          type: string
          nullable: true
        death_date:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}-\d{2}$'
        is_special_case:
          type: boolean
          default: false
          description: Mutually exclusive with `is_group`. If both arrive, `is_special_case` wins.
        is_group:
          type: boolean
          default: false
        links:
          type: array
          items:
            $ref: "#/components/schemas/MusicianLink"
        ipi:
          type: array
          items:
            $ref: "#/components/schemas/MusicianIpi"

    AdminTuneCredit:
      type: object
      description: One row of a tune's composer/arranger/harmoniser/source credit list.
      required: [role, name]
      properties:
        role:
          type: string
          enum: [composer, arranger, harmoniser, source]
          description: Must be a key of IHYMNS_TUNE_CREDIT_ROLES (includes/tune_helpers.php) — an unrecognised role is silently skipped, not rejected.
        name:
          type: string
          maxLength: 255
        musician_id:
          type: integer
          nullable: true
          description: Optional tblMusicians.Id to link this credit to a registry row. Ignored (stored NULL) when it doesn't resolve to a real row.

    AdminTuneInput:
      type: object
      description: |
        Shared input for `admin_tune_add` and `admin_tune_update` (#1748).
        Mirrors `manage/tunes.php`'s POST field names exactly — both
        surfaces validate via the SAME `tuneAdminValidateFields()`
        (`includes/tune_admin.php`).
      required: [name]
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: '^[a-z0-9-]{1,140}$'
          description: Optional — auto-derived from `name` when omitted. A colliding slug is auto-suffixed (`-2`, `-3`, …), never rejected.
        subtitle:
          type: string
          maxLength: 255
          nullable: true
        disambiguation:
          type: string
          maxLength: 255
          nullable: true
        meter_code:
          type: string
          maxLength: 60
          nullable: true
          description: Stored raw as typed (e.g. "87.87 D", "CM") — not normalised on save.
        musicbrainz_work_mbid:
          type: string
          nullable: true
          description: UUID shape (8-4-4-4-12 hex digits), validated via includes/media_identifiers.php's mediaIdentifierWorkValidate('musicbrainz-work', …).
        hymnary_tune_id:
          type: string
          maxLength: 64
          nullable: true
        notes:
          type: string
          nullable: true
        aliases:
          type: array
          items: { type: string }
          description: Full replacement list — an empty array clears all aliases. On admin_tune_update, omitting this key entirely leaves the existing alias list unchanged.
        credits:
          type: array
          items:
            $ref: "#/components/schemas/AdminTuneCredit"
          description: Full replacement list, same omit-to-leave-unchanged posture as `aliases`.

    AdminLicenceTypeInput:
      type: object
      description: |
        Shared input for `admin_licence_type_create` and
        `admin_licence_type_update` (#459 / #1769 P4). Mirrors
        `manage/licence-types.php`'s POST field names exactly — both surfaces
        validate via the SAME `licenceTypeAdminValidate()`
        (`includes/licence_type_admin.php`). On update `key` is ignored
        (LicenceKey is immutable).
      required: [key, label]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,29}$'
          description: Lowercase token, immutable after create — the value every licence store writes. Ignored on update.
        label:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 255
        confers_tier:
          type: string
          nullable: true
          description: A live tblAccessTiers.Name this licence also grants its holders. Blank/omitted = confers no tier. Validated against the live tiers table.
        covers:
          type: array
          items:
            type: string
            enum: [lyrics_display, lyrics_print, music_reproduction, audio_playback]
          description: Coverage kinds this licence legally unlocks. Full replacement list; empty/omitted clears coverage. Unknown kinds are rejected.
        requires_number:
          type: boolean
          description: 1 = recording this licence needs a licence number (drives form validation only, never enforcement).
        authority:
          type: string
          nullable: true
          pattern: '^[a-z][a-z0-9_]{0,29}$'
          description: Optional issuing-body token (e.g. ccli). Blank = unspecified.
        authority_ref:
          type: string
          maxLength: 50
          nullable: true
        enabled:
          type: boolean
          description: 0 = soft-disabled (excluded from pickers/registry union, kept for historical resolution). Defaults to 1 on create.
        sort_order:
          type: integer
          minimum: 0

    AdminDataHealthResponse:
      type: object
      description: Snapshot returned by `admin_data_health`. Mirrors the panel `/manage/data-health` renders.
      properties:
        database_up:
          type: boolean
        table_counts:
          type: object
          description: |
            Map of canonical table name → row count. `null` when the
            table doesn't exist on this deployment (fresh install
            before migrations).
          additionalProperties:
            type: integer
            nullable: true
        share_dir:
          type: object
          properties:
            configured:        { type: boolean, description: True when APP_SETLIST_SHARE_DIR is defined. }
            present:           { type: boolean, description: True when the directory actually exists on disk. }
            file_count:        { type: integer, nullable: true }
            unimported_count:  { type: integer, description: Files on disk that don't have a matching tblSharedSetlists row. }
            unimported_ids:
              type: array
              items: { type: string }
        legacy_sqlite:
          type: object
          properties:
            present:    { type: boolean }
            size_bytes: { type: integer }

    AdminSchemaAuditRow:
      type: object
      properties:
        col:
          type: string
          description: Column name.
        status:
          type: string
          enum: [ok, missing, uncovered, orphan]
          description: |
            - `ok` — declared in schema.sql AND present in DB.
            - `missing` — in schema.sql, not in DB, but a migration would add it.
            - `uncovered` — in schema.sql, not in DB, no migration adds it (latent bomb).
            - `orphan` — in DB, not in schema.sql.
        migration:
          type: string
          nullable: true
          description: Filename(s) of migrate-*.php that would add this column (set on `missing` rows only).

    AdminSchemaAuditResponse:
      type: object
      description: Result of `admin_schema_audit`. Mirrors `/manage/schema-audit`.
      properties:
        summary:
          type: object
          properties:
            ok:        { type: integer }
            missing:   { type: integer }
            uncovered: { type: integer }
            orphan:    { type: integer }
        by_table:
          type: object
          description: Map of table name → list of per-column audit rows.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/AdminSchemaAuditRow"

    AdminMigrationsStatusResponse:
      type: object
      description: Result of `admin_migrations_status`. Per-migration applied / partial / pending status derived from `INFORMATION_SCHEMA`.
      properties:
        summary:
          type: object
          properties:
            pending: { type: integer }
            partial: { type: integer }
            applied: { type: integer }
        migrations:
          type: array
          items:
            type: object
            properties:
              file:
                type: string
                description: Migration script filename (basename only).
              declared_columns:
                type: integer
                description: Total (table, column) pairs this migration is responsible for, derived from ALTER ADD COLUMN statements + CREATE TABLE blocks + `@migration-adds` doctags.
              applied_columns:
                type: integer
                description: How many of those columns currently exist in INFORMATION_SCHEMA.COLUMNS.
              status:
                type: string
                enum: [pending, partial, applied]

    # -------------------------------------------------------------------------
    # Editor-API shared shapes (#719 PR 3)
    # -------------------------------------------------------------------------

    EditorSongInput:
      type: object
      description: |
        One song row in the editor's full-corpus payload (`save`).
        Same shape `save_song` accepts for a single-song UPSERT —
        `save` runs the array straight through. Empty / missing
        `tuneName` and `iswc` (#497) normalise to NULL on the
        server. `language` (#681) accepts the v1 IETF BCP 47 grammar
        (`lang[-Script][-Region]`); malformed tags fall back to `en`
        on the bulk path.
      required: [id, title]
      properties:
        id:
          type: string
          description: SongId, e.g. CP-0202.
        number:
          type: integer
          nullable: true
          description: Null for `Misc` songs or when empty (#392).
        title:        { type: string }
        songbook:     { type: string, description: Songbook abbreviation. }
        songbookName: { type: string }
        language:     { type: string, example: en }
        copyright:    { type: string }
        tuneName:
          type: string
          nullable: true
          description: Optional tune name (#497). Empty / whitespace-only normalises to NULL on the server.
        ccli:         { type: string }
        iswc:
          type: string
          nullable: true
          description: International Standard Musical Work Code (#497).
        verified:           { type: boolean }
        lyricsPublicDomain: { type: boolean }
        musicPublicDomain:  { type: boolean }
        hasAudio:           { type: boolean }
        hasSheetMusic:      { type: boolean }
        writers:     { type: array, items: { type: string } }
        composers:   { type: array, items: { type: string } }
        arrangers:   { type: array, items: { type: string } }
        adaptors:    { type: array, items: { type: string } }
        translators: { type: array, items: { type: string } }
        artists:
          type: array
          items: { type: string }
          description: |
            Performance-recording artists (#587). Silently skipped on
            partly-migrated installs without `tblSongArtists`.
        components:
          type: array
          items:
            type: object
            properties:
              type:  { type: string, example: verse }
              cNum:  { type: integer }
              lines: { type: array, items: { type: string } }
        translations:
          type: array
          description: Translation links for the legacy bulk save path. Each entry adds a tblSongTranslations row.
          items:
            type: object
            properties:
              songId:   { type: string, description: TranslatedSongId. }
              language: { type: string }

    EditorBulkImportSummary:
      type: object
      description: |
        Synchronous-fallback response from `bulk_import_zip` on
        deployments without `tblBulkImportJobs`. Mirrors the same
        counter shape the async job exposes via `bulk_import_status`,
        minus the per-row tracking fields.
      properties:
        songs_created:           { type: integer }
        songs_skipped_existing:  { type: integer, description: Existing rows are NEVER overwritten. }
        songs_failed:            { type: integer }
        songbooks_created:       { type: array, items: { type: string } }
        songbooks_existing:      { type: array, items: { type: string } }
        errors:
          type: array
          items:
            type: object
            properties:
              entry: { type: string }
              error: { type: string }

    EditorBulkImportJob:
      type: object
      description: |
        One row of `tblBulkImportJobs` (#676) as returned by
        `bulk_import_status`. Job rows are scoped per user — a
        curator can only poll their own.
      properties:
        id:                      { type: integer }
        status:
          type: string
          enum: [queued, running, completed, failed]
        filename:                { type: string }
        size_bytes:              { type: integer }
        total_entries:           { type: integer }
        processed_entries:       { type: integer }
        percent:
          type: number
          format: float
          description: Rounded to one decimal place. Zero before the worker starts.
        songs_created:           { type: integer }
        songs_skipped_existing:  { type: integer }
        songs_failed:            { type: integer }
        songbooks_created:       { type: array, items: { type: string } }
        songbooks_existing:      { type: array, items: { type: string } }
        errors:
          type: array
          items:
            type: object
            properties:
              entry: { type: string }
              error: { type: string }
        started_at:    { type: string, nullable: true, format: date-time }
        completed_at:  { type: string, nullable: true, format: date-time }
        created_at:    { type: string, format: date-time }
        updated_at:    { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # Generic response models
    # -------------------------------------------------------------------------

    Error:
      type: object
      description: >-
        Legacy (v1) error response — a bare `{ error }`. When the client sends
        `X-API-Version: 2` this is replaced by `ApiError` (see Response
        versioning in the API description).
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
          example: Something went wrong.

    ApiError:
      type: object
      description: >-
        The uniform v2 error envelope (#1201/#1761). Returned for every
        `sendJson` error when the client sent `X-API-Version: 2`, alongside a
        meaningful HTTP status. Clients branch on the HTTP status and/or the
        stable `error.code` — never the human `error.message` (the #1677
        lesson). Any legacy keys the v1 error carried (`gone`, `request_id`, …)
        are preserved inside `error`.
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >-
                Stable machine-branchable code — the endpoint's own code when it
                sets one, else `http_<status>` (e.g. `http_404`).
              example: http_404
            message:
              type: string
              description: Human-readable message (do not branch on this).
              example: Song not found.

    ApiEnvelope:
      type: object
      description: >-
        The uniform v2 SUCCESS envelope (#1201/#1761). When the client sends
        `X-API-Version: 2`, EVERY documented 2xx payload in this spec is
        returned inside `data` of this envelope — e.g. the `song_data` payload
        below becomes `{ "ok": true, "data": { …that payload… } }`. Without the
        header, the bare payload is returned exactly as documented (legacy v1),
        so already-deployed and offline-cached clients are unaffected. The web
        PWA (`apiFetchJson`) and the Apple client transport send the header and
        unwrap `data` transparently, so call sites see the documented payload
        either way.
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
          example: true
        data:
          description: The endpoint's documented 2xx payload, verbatim.

    SongGone:
      type: object
      description: >-
        410 body for a song id that resolved to a redirect TOMBSTONE — a song
        merged or deleted with no replacement (#1343/#1679). Defined once and
        referenced from both `song_data` and `song_detail`, which are the SAME
        handler in api.php. The `gone` flag was emitted from the start
        (api.php's `sendJson(['error' => …, 'gone' => true], 410)`) and
        undocumented on both paths until #1679 A13c.
        Clients should branch on the STATUS (410 = prune it locally, 404 = we
        have never heard of this id), not on the sentence — the flag is a
        convenience for callers that only see the parsed body.
      required: [error, gone]
      properties:
        error:
          type: string
          example: Song removed.
        gone:
          type: boolean
          description: Always `true` on this response; absent on every other error.
          example: true

    SuccessResponse:
      type: object
      description: Generic success response
      properties:
        ok:
          type: boolean
          example: true

    # -------------------------------------------------------------------------
    # Licences (#462) — inheritance-aware resolution
    # -------------------------------------------------------------------------

    EffectiveLicence:
      type: object
      description: |
        One row in a user's effective licence set. Produced by
        `getUserEffectiveLicences()` in `includes/licences.php`.
        Same shape whether the licence was held directly, inherited
        from a direct org membership, or inherited via an ancestor
        org walked through `tblOrganisations.ParentOrgId`.
      properties:
        type:
          type: string
          description: Licence type key (e.g. `ccli`, `ihymns_pro`).
          example: ccli
        key:
          type: string
          description: Licence number / key on the licence row (CCLI
            number, iHymns subscription key, or empty when the legacy
            column didn't record one).
          example: "1234567"
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Expiry timestamp in UTC; null = evergreen.
        source:
          type: string
          enum: [user, org]
          description: Which table the row came from.
        source_id:
          type: integer
          description: User ID or org ID the row belongs to.
          example: 17
        inherited:
          type: boolean
          description: True if reached via the ancestor-org walk
            rather than a direct membership / user row.

    # -------------------------------------------------------------------------
    # Notifications (#289)
    # -------------------------------------------------------------------------

    Notification:
      type: object
      description: |
        In-app notification for the authenticated user. Rendered in
        the header bell + dropdown by `js/modules/notifications.js`.
      properties:
        id:
          type: integer
          format: int64
          example: 101
        type:
          type: string
          description: Free-form category (e.g. `song_added`,
            `request_update`, `announcement`) set by whichever
            server-side trigger created the row.
          example: request_update
        title:
          type: string
          example: Your song request has been added
        body:
          type: string
          description: Optional longer text; may be empty.
          example: '"Great Is Thy Faithfulness" is now in Mission Praise.'
        action_url:
          type: string
          description: Deep link to open when the row is clicked.
            Empty string means "no navigation".
          example: /song/MP-0100
        is_read:
          type: boolean
          example: false
        created_at:
          type: string
          format: date-time
          example: 2026-04-24T14:37:49Z

    # -------------------------------------------------------------------------
    # External Links (#833) and Works (#840)
    # -------------------------------------------------------------------------

    ExternalLink:
      type: object
      description: |
        One curated external link attached to a song / songbook /
        person / work via the per-entity tblXxxExternalLinks tables.
        Joined to tblExternalLinkTypes for the rendering metadata
        (slug, name, category, iconClass) — IsActive=0 link types
        are silently filtered out.
      properties:
        slug:
          type: string
          description: Stable registry slug (e.g. `wikipedia`, `spotify`,
            `imslp`, `musicbrainz-work`).
          example: wikipedia
        name:
          type: string
          description: Display name shown in the public-page button.
          example: Wikipedia
        category:
          type: string
          enum: [official, information, listen, watch, read, sheet-music, purchase, authority, social, other]
          description: Drives which header the link appears under in
            the "Find this … elsewhere" panel.
          example: information
        iconClass:
          type: string
          description: Bootstrap-icons class for the link's button.
          example: bi-wikipedia
        url:
          type: string
          format: uri
          example: https://en.wikipedia.org/wiki/Amazing_Grace
        note:
          type: string
          nullable: true
          description: Optional curator-supplied context (e.g. "1779
            first edition", "sung by King's College Cambridge").
        verified:
          type: boolean
          description: True when a curator has personally checked the
            URL still resolves to the right resource.
        sortOrder:
          type: integer
          description: Within-category ordering hint.

    WorkMember:
      type: object
      description: One song's membership in a Work (#840).
      properties:
        songId:
          type: string
          example: CP-0202
        title:
          type: string
          example: Amazing Grace
        number:
          type: integer
          nullable: true
          example: 202
        songbook:
          type: string
          example: CP
        songbookName:
          type: string
          example: Christian Praise
        isCanonical:
          type: boolean
          description: Curator-marked "preferred" version of the Work.
            Typically zero or one row per Work has this set.
        memberNote:
          type: string
          nullable: true
          description: Optional context for this specific membership
            (e.g. "1779 original", "Hindi translation").

    Work:
      type: object
      description: |
        A composition grouping (#840). Mirrors the MusicBrainz Work
        entity: one Work groups multiple `tblSongs` rows representing
        the same underlying composition across different songbooks /
        arrangements / translations. Works can be nested without
        limit via `parentId`.
      properties:
        id:
          type: integer
          example: 17
        parentId:
          type: integer
          nullable: true
          description: Self-FK enabling unlimited nesting (parent →
            child → grandchild …). Server enforces no cycles at update
            time.
          example: 4
        title:
          type: string
          example: Amazing Grace
        slug:
          type: string
          description: URL-safe identifier used by `/work/<slug>`.
          example: amazing-grace
        iswc:
          type: string
          nullable: true
          description: International Standard Musical Work Code,
            shape `T-NNN.NNN.NNN-C` (15 chars). Optional — many
            traditional / public-domain hymns have no formal ISWC.
          example: T-345.246.800-1
        notes:
          type: string
          nullable: true
        parent:
          type: object
          nullable: true
          description: Header summary of the parent Work (when set).
          properties:
            id:
              type: integer
            title:
              type: string
            slug:
              type: string
            iswc:
              type: string
              nullable: true
        children:
          type: array
          description: Direct children only (one level). Render
            recursively client-side if a deeper tree is needed.
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              slug:
                type: string
              iswc:
                type: string
                nullable: true
        members:
          type: array
          description: Every song that belongs to this Work, ordered
            by IsCanonical DESC then SongbookAbbr / Number.
          items:
            $ref: "#/components/schemas/WorkMember"
        links:
          type: array
          description: External links attached to this Work — same
            categorisation + verification model as Song / Songbook /
            Person links (#833).
          items:
            $ref: "#/components/schemas/ExternalLink"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Musician:
      type: object
      description: |
        A person/group credited on one or more songs (writer, composer,
        arranger, adaptor, translator, or artist), returned by
        `?action=musician` (#1443/#1444) — the JSON twin of the
        public `/musician/<slug>` page's own query logic. `id`/`slug` and
        the bio fields are `null` when no curated `tblMusicians` row
        exists yet for this name (a plain writer/composer string tapped
        from a song still returns a usable discography).
      properties:
        id:
          type: integer
          nullable: true
          example: 8
        slug:
          type: string
          nullable: true
          description: URL-safe identifier used by `/people/<slug>`.
          example: john-newton
        name:
          type: string
          example: John Newton
        notes:
          type: string
          nullable: true
        birthPlace:
          type: string
          nullable: true
        birthDate:
          type: string
          nullable: true
          description: Free-text (partial dates, e.g. a year only, are stored as given).
        deathPlace:
          type: string
          nullable: true
        deathDate:
          type: string
          nullable: true
        isSpecialCase:
          type: boolean
          description: Curator flag for names needing special display handling (e.g. "Traditional", "Unknown").
        isGroup:
          type: boolean
          description: True when this credit represents a group/ensemble rather than an individual.
        discography:
          type: array
          description: One entry per role this person has ANY credited songs under (roles with zero matches are omitted).
          items:
            $ref: "#/components/schemas/MusicianDiscographyGroup"
        links:
          type: array
          description: External links attached to this person (#833). Empty when no registry row exists, or on a pre-migration deployment.
          items:
            $ref: "#/components/schemas/ExternalLink"
        totalSongs:
          type: integer
          description: Count of distinct songs across every role.
          example: 6
        identifiers:
          type: array
          description: |
            IPI/ISNI-style authority identifiers (#1741 P2 `tblMusicianIdentifiers`,
            added #1752 Slice D). Always present as an array — empty when no
            registry row exists, the table isn't migrated on this install, or
            the row has no identifiers curated yet. Emitted identically on
            BOTH the canonical `musician` envelope and the legacy
            `credit_person`/`person` envelope (an additive key on an existing
            object; the P2-B freeze only promises the legacy envelope's
            EXISTING fields stay byte-identical).
          items:
            $ref: "#/components/schemas/MusicianIdentifierEntry"

    MusicianIdentifierEntry:
      type: object
      description: One authority-registry identifier row for a musician.
      properties:
        type:
          type: string
          description: "Open vocabulary (app-validated, not an enum — rule #20): ipi | isni | cae | ipi-base | <pro-id>."
          example: ipi
        value:
          type: string
          example: "00123456789"

    MusicianDiscographyGroup:
      type: object
      description: One role's worth of songs in a Musician's discography.
      properties:
        role:
          type: string
          enum: [writer, composer, arranger, adaptor, translator, artist]
        label:
          type: string
          description: Display label for the role.
          example: As Writer
        songs:
          type: array
          items:
            type: object
            properties:
              songId: { type: string, example: CP-0202 }
              title: { type: string, example: Amazing Grace }
              number: { type: integer, nullable: true, example: 202 }
              songbook: { type: string, example: CP }
              songbookName: { type: string, example: Christian Praise }

    LiveSessionState:
      type: object
      nullable: true
      description: |
        The whitelisted broadcast state hint shared by `live_follow_create`
        / `live_follow_update` / `service_broadcast` (and echoed back by
        their poll/join counterparts). NEVER raw client JSON — only these
        three keys survive server-side validation, each clamped to a safe
        range; an empty/all-invalid input is stored as `null`.
      properties:
        blank:
          type: boolean
          description: Presenter screen is intentionally blanked.
        scrollPct:
          type: number
          minimum: 0
          maximum: 1
          description: Scroll position within the current song, clamped to [0, 1].
        transposeOffset:
          type: integer
          minimum: -12
          maximum: 12
          description: Semitone transpose offset, clamped to [-12, 12].

