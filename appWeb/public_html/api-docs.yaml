        "404":
          description: No registry row AND no credited song found under that name
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          $ref: "#/components/responses/RateLimited"

  /api.php?action=musician:
    get:
      operationId: getMusician
      tags: [Songs]
      summary: Get one musician's bio + discography as JSON
      description: |
        JSON twin of the public `/musician/<slug>` HTML page's own query
        logic (#1443/#1444) — both independently query `tblMusicians` +
        the per-role credit tables (`tblSongWriters`, `tblSongComposers`,
        `tblSongArrangers`, `tblSongAdaptors`, `tblSongTranslators`, and
        `tblSongArtists` when migrated) because there is no direct FK from
        those tables to `tblMusicians` today — a name-string match, same
        as the HTML page. Canonical name for the endpoint documented above
        as `credit_person` (kept as a deprecated alias — shipped Apple
        client contract, byte-identical old envelope).

        Exactly ONE of `slug`, `id`, or `name` should be supplied. When a
        `tblMusicians` registry row exists it drives the bio fields;
        when it doesn't (a writer/composer string with no curated record
        yet), `name` alone still returns a "songs by this name" discography
        with `id`/`slug`/bio fields all `null`. `name` exists specifically
        for the native app's "tap a composer name on a song" flow, which
        only has the plain string to look up with, not a person ID.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [musician]
        - name: slug
          in: query
          required: false
          schema: { type: string, example: john-newton }
        - name: id
          in: query
          required: false
          description: Numeric `tblMusicians.Id`.
          schema: { type: string, example: "42" }
        - name: name
          in: query
          required: false
          description: Exact writer/composer/etc. name (fallback lookup + the discography match key).
          schema: { type: string, example: John Newton }
      responses:
        "200":
          description: The musician's bio (when registered) and discography grouped by role
          content:
            application/json:
              schema:
                type: object
                properties:
                  musician:
                    $ref: "#/components/schemas/Musician"
        "400":
          description: None of `slug`, `id`, or `name` was supplied
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: No registry row AND no credited song found under that name
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429":
          $ref: "#/components/responses/RateLimited"

  # ===========================================================================
  # LANGUAGES
  # ===========================================================================

  /api.php?action=catalogue_language_subtags:
    get:
      operationId: catalogueLanguageSubtags
      tags: [Languages]
      summary: Distinct primary language subtags present in the catalogue (#776)
      description: |
        The union of primary language subtags actually present across
        tblSongbooks.Language and tblSongs.Language (lowercase, sorted,
        de-duplicated). Lightweight replacement for hitting `songbooks` just to
        derive the language chip set. No authentication; cached 5 min.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [catalogue_language_subtags] }
      responses:
        "200":
          description: Sorted unique primary subtags
          content:
            application/json:
              schema:
                type: object
                properties:
                  subtags:
                    type: array
                    items: { type: string }
                    example: ["en", "es", "fr", "sw"]

  /api.php?action=languages:
    get:
      operationId: listLanguages
      tags: [Languages]
      summary: List available languages
      description: Returns all active languages supported by the song collection.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [languages]
      responses:
        "200":
          description: Language list
          content:
            application/json:
              schema:
                type: object
                properties:
                  languages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Language"
              example:
                languages:
                  - code: en
                    name: English
                    nativeName: English
                    textDirection: ltr
                  - code: fr
                    name: French
                    nativeName: "Fran\u00E7ais"
                    textDirection: ltr

  /api.php?action=scripts:
    get:
      operationId: listScripts
      tags: [Languages]
      summary: List available IETF BCP 47 scripts (#681 / #682)
      description: |
        Returns all active rows from `tblScripts` (ISO 15924). Used by
        the IETF composite picker on the web admin and by native
        clients that need to resolve a saved tag like `zh-Hans` into a
        human-readable name.

        Pre-migration deployments (where `tblScripts` doesn't exist
        yet) get an empty list and a `note` field rather than a 500.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [scripts]
      responses:
        "200":
          description: Script list
          content:
            application/json:
              schema:
                type: object
                properties:
                  scripts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Script"
                  note:
                    type: string
                    description: Present only when the lookup table has not yet been created.
              example:
                scripts:
                  - code: Latn
                    name: Latin
                    nativeName: Latin
                  - code: Cyrl
                    name: Cyrillic
                    nativeName: "\u041A\u0438\u0440\u0438\u043B\u043B\u0438\u0446\u0430"
                  - code: Hans
                    name: Simplified Chinese
                    nativeName: "\u7B80\u4F53\u5B57"

  /api.php?action=regions:
    get:
      operationId: listRegions
      tags: [Languages]
      summary: List available IETF BCP 47 regions (#681 / #682)
      description: |
        Returns all active rows from `tblRegions` \u2014 ISO 3166-1 alpha-2
        country codes plus M.49 numeric area codes for groupings like
        `419` (Latin America & Caribbean). Same use case as
        `action=scripts`: resolve a saved IETF tag's region subtag to
        a human-readable name.

        Pre-migration deployments get an empty list with a `note`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [regions]
      responses:
        "200":
          description: Region list
          content:
            application/json:
              schema:
                type: object
                properties:
                  regions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Region"
                  note:
                    type: string
                    description: Present only when the lookup table has not yet been created.
              example:
                regions:
                  - code: GB
                    name: United Kingdom
                  - code: US
                    name: United States
                  - code: BR
                    name: Brazil
                  - code: "419"
                    name: Latin America and the Caribbean

  /api.php?action=variants:
    get:
      operationId: listLanguageVariants
      tags: [Languages]
      summary: List IETF BCP 47 language variants (#738)
      description: |
        Returns all active rows from `tblLanguageVariants` — IANA
        variant subtags (5-8 chars). Examples: `1996` for German
        post-1996 orthography, `fonipa` for IPA phonetics,
        `valencia` for the Valencian variant of Catalan.

        Used as the optional fourth subtag in an IETF BCP 47
        language tag. Most worship-app catalogues won't reference
        variant subtags directly, but the endpoint is provided for
        completeness so a curator hand-tagging an academic edition
        of a hymnal has the full vocabulary available.

        Pre-migration deployments (where `tblLanguageVariants`
        doesn't exist) get an empty list with a `note`.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [variants]
      responses:
        "200":
          description: Variant list
          content:
            application/json:
              schema:
                type: object
                properties:
                  variants:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, example: "1996" }
                        name: { type: string, example: "German orthography of 1996" }
                  note:
                    type: string
                    description: Present only when the lookup table has not yet been created.

  /api.php?action=admin_refresh_iana_cldr:
    post:
      operationId: adminRefreshIanaCldr
      tags: [Admin — Diagnostics]
      summary: Refresh IETF BCP 47 reference data from upstream IANA + CLDR (#738)
      description: |
        Fetches the latest IANA Language Subtag Registry from
        `https://www.iana.org/assignments/language-subtag-registry`
        plus the CLDR English locale-display-names JSON files from
        the unicode-org/cldr-json GitHub mirror, overwrites the
        bundled snapshots in `appWeb/.sql/data/`, and re-runs the
        import migration. Returns the migration's per-table delta
        counts in the response.

        Global-admin only. Requires same-origin POST with
        `X-Requested-With: XMLHttpRequest`. Server-side outbound
        HTTPS connectivity to iana.org and raw.githubusercontent.com
        is required. If any of the 5 source URLs fails, the bundled
        snapshots are NOT touched and the call returns 502 with the
        list of failed files.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_refresh_iana_cldr] }
      responses:
        "200":
          description: Refresh succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  fetched:
                    type: array
                    items: { type: string }
                    description: Per-file size summaries (`filename (12345 bytes)`).
                  migrationLog:
                    type: string
                    description: Captured stdout from the import migration — per-step `[seed]` / `[cldr]` / `[skip]` lines.
        "403":
          description: Global admin access required
        "405":
          description: POST method required
        "500":
          description: Snapshot directory not writable, or migration re-run failed after the fetch
        "502":
          description: |
            One or more source fetches failed. Response includes
            `fetched` (the ones that did succeed) and `failed` (the
            ones that didn't).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:   { type: string }
                  fetched: { type: array, items: { type: string } }
                  failed:  { type: array, items: { type: string } }
                  hint:    { type: string }

  /api.php?action=song_translations:
    get:
      operationId: getSongTranslations
      tags: [Languages]
      summary: Get every related-language version of a song (#281)
      description: |
        Resolves the full set of language versions related to the given
        song, unioning three relationship directions:

          1. **Outward** — translations whose `SourceSongId` is this song.
          2. **Inward** — if this song IS a translation, the original
             it was translated from.
          3. **Sibling** — other translations of that same original,
             so readers can hop between languages without going via
             the source.

        Each entry carries the target language, the translator credit
        (if recorded), a verified flag for curated rows, and the song
        title and number for direct rendering.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [song_translations]
        - name: id
          in: query
          required: true
          description: Source song ID (unchanged for outward, the
            translation's ID for inward/sibling resolution).
          schema:
            type: string
            example: CP-0202
      responses:
        "200":
          description: Song translations
          content:
            application/json:
              schema:
                type: object
                properties:
                  sourceId:
                    type: string
                    description: The song ID that was queried
                    example: CP-0202
                  translations:
                    type: array
                    items:
                      $ref: "#/components/schemas/SongTranslation"
        "400":
          description: Missing `id` query parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===========================================================================
  # SETLISTS
  # ===========================================================================

  /api.php?action=setlist_share:
    post:
      operationId: shareSetlist
      tags: [Setlists]
      summary: Create or update a shared setlist
      description: |
        Create a new publicly-shareable setlist or update an existing one.
        When updating, the caller must provide the original `id` and matching
        `owner` UUID. Each shared setlist can contain up to 200 songs with
        optional per-song arrangements. #1791 — `scope: "edit"` mints a
        collab-by-link EDIT capability instead of a read-only view link;
        requires a signed-in owner sharing one of their own saved (live-linked)
        set lists, refused 403 otherwise.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [setlist_share]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, songs, owner]
              properties:
                name:
                  type: string
                  description: Setlist name
                  maxLength: 200
                  example: Sunday Morning Service
                songs:
                  type: array
                  description: Ordered list of song IDs
                  items:
                    type: string
                    pattern: "^[A-Za-z]+-\\d+$"
                  minItems: 1
                  maxItems: 200
                  example: ["CP-0202", "MP-0042", "CP-0501"]
                owner:
                  type: string
                  description: Owner UUID (client-generated)
                  example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                id:
                  type: string
                  description: Existing setlist ID (for updates only)
                  example: "1a2b3c4d"
                scope:
                  type: string
                  enum: [view, edit]
                  default: view
                  description: "#1791 — view (default, read-only) or edit (collab-by-link capability, owner-only)."
                label:
                  type: string
                  maxLength: 100
                  nullable: true
                  description: "#1791 — owner-facing name for this link (\"worship team\"), display only."
                expiresAt:
                  type: string
                  nullable: true
                  description: "#1791 G1 — optional link expiry (UTC). Omitted/blank/past = never expires (the default)."
                arrangements:
                  type: object
                  description: Optional per-song arrangements mapping song IDs to component index arrays
                  additionalProperties:
                    type: array
                    items:
                      type: integer
                      minimum: 0
                  example:
                    CP-0202: [0, 1, 2, 1, 3]
                showSharerName:
                  type: boolean
                  description: |
                    #1791 G3 — opt-in "Shared by &lt;owner display name&gt;" byline on
                    the shared page. Accepted for both `view` and `edit` scope links.
                    Defaults to `false` (anonymous, the status-quo posture) when omitted.
                  default: false
                editAudience:
                  type: string
                  enum: [anyone, authenticated]
                  description: |
                    #1791 G4 / G4-org — who may edit via an `edit`-scope link. Only
                    meaningful when `scope` is `"edit"`; ignored for a view link.
                    `anyone` (the column default — no account needed) is the owner's
                    full ask; `authenticated` requires the recipient to be signed in.
                    When omitted, the server resolves the owner's own
                    app-&gt;org-&gt;user default. Whatever the caller requests is
                    CLAMPED to any organisation's enforced mandate — an owner can never
                    mint a link more open than their organisation allows, and the
                    response's `editAudience` reports the value actually stored (which
                    may differ from the request if it was clamped).
      responses:
        "200":
          description: Setlist created or updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: 8-character hex share ID (view links) or a base64url capability token (edit links, #1791)
                    example: "1a2b3c4d"
                  url:
                    type: string
                    description: Shareable URL path
                    example: /setlist/shared/1a2b3c4d
                  scope:
                    type: string
                    enum: [view, edit]
                    description: "#1791 — the scope actually stored for this link."
                  showSharerName:
                    type: boolean
                    description: "#1791 G3 — the ShowSharerName flag actually stored for this link."
                  editAudience:
                    type: string
                    nullable: true
                    enum: [anyone, authenticated, null]
                    description: |
                      #1791 G4/G4-org — the edit audience actually STORED (after any
                      org-mandate clamp), or `null` for a view-scope link.
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Ownership verification failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: You do not own this shared set list.
        "404":
          description: Setlist not found (when updating)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Shared set list not found.
        "405":
          description: Method not allowed (must be POST)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Server error saving setlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=setlist_get:
    get:
      operationId: getSharedSetlist
      tags: [Setlists]
      summary: Retrieve a shared setlist
      description: |
        Retrieve a shared setlist by its share id — a short hex string (view
        links) or a base64url capability token (#1791 edit links). Returns
        public-safe fields only (the owner id/email are never echoed); an
        `edit`-scope id additionally resolves `canWrite`/`lockReason` and, when
        writable, the editable `songsDetailed` shape.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [setlist_get]
        - name: id
          in: query
          required: true
          description: Share id — 8-character hex (view) or a base64url capability token (edit, #1791)
          schema:
            type: string
            example: "1a2b3c4d"
      responses:
        "200":
          description: Shared setlist data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedSetlist"
        "400":
          description: Invalid or missing setlist ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Setlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=user_setlists:
    get:
      operationId: getUserSetlists
      tags: [Setlists]
      summary: Get user's setlists
      description: Retrieve all setlists belonging to the authenticated user, ordered by last update.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [user_setlists]
      responses:
        "200":
          description: User setlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  setlists:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSetlist"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: Not authenticated.

  /api.php?action=user_setlists_sync:
    post:
      operationId: syncUserSetlists
      tags: [Setlists]
      summary: Sync setlists with server
      description: |
        Reconcile local setlists with server-side storage.

        **There are two protocols, and the server picks between them by the
        PRESENCE of the `deleted` key — even when it is an empty array.**

        ### Protocol 2 (#1661) — explicit deletion, no cap
        Send `deleted` (possibly `[]`) and the server stops inferring
        deletions from absence entirely:
          * ids listed in `deleted` are tombstoned (permanently) and removed;
          * a tombstoned id can NEVER be resurrected — re-creating a setlist
            must mint a fresh client id;
          * setlists merely ABSENT from `setlists` are left alone;
          * the response's `tombstones` array lists deletions this client
            should apply locally (from other devices, or from expiry).
        There is **no cap** on the number of setlists. An over-size request
        body is REJECTED with **413** — never silently truncated.

        ### Protocol 1 (legacy) — absence-based, unchanged
        Omit `deleted` entirely (what the native apps do today) and behaviour
        is exactly as before (WS-F #1018, guarded by #1649):
          * `replace` — the client's full current list is authoritative;
            server setlists absent from the payload are DELETED, subject to
            the `since` watermark guard.
          * `merge` (default) — union; server-only setlists are preserved.

        `mode` governs only the absence inference. An explicit `deleted` list
        is honoured in BOTH modes, because it is a statement rather than an
        inference.

        ### Optional expiry (#1661)
        Each setlist may carry `expiresAt` (UTC, `YYYY-MM-DD HH:MM:SS`).
        `null`/absent means **never expires**, which is the default and what
        every pre-existing setlist has. The SERVER converts an expired
        setlist into a tombstone (`reason: "expired"`) lazily, on the next
        read or sync — clients render `expiresAt` for display only and must
        not delete on expiry themselves.

        Requires the `setlist-tombstones` migration; on an install where it
        has not been applied the `deleted`/`expiresAt`/`tombstones` fields
        degrade to no-ops and behaviour is exactly protocol 1.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [user_setlists_sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setlists]
              properties:
                mode:
                  type: string
                  enum: [replace, merge]
                  default: merge
                  description: >
                    Governs ABSENCE-based deletion only (protocol 1).
                    'replace' deletes server setlists absent from the payload;
                    'merge' only adds/updates. Omitted → 'merge'. Ignored for
                    absence purposes when `deleted` is present.
                since:
                  type: string
                  description: >
                    The `syncedAt` watermark from the last successfully
                    absorbed response (#1649). The server will not delete rows
                    written after it. Also filters the `tombstones` response.
                deleted:
                  type: array
                  description: >
                    #1661 — ids this client has deleted. **Sending this key at
                    all (even as `[]`) selects protocol 2** and retires
                    absence-based deletion for this request. Ids are
                    permanently tombstoned; they can never be resurrected.
                  items:
                    type: string
                setlists:
                  type: array
                  description: >
                    #1661 — no maximum. The only limit is a 4 MiB whole-body
                    ceiling, answered with 413.
                  items:
                    type: object
                    required: [id, name, songs]
                    properties:
                      id:
                        type: string
                        description: Client-generated setlist ID
                      name:
                        type: string
                        maxLength: 200
                      createdAt:
                        type: string
                        format: date-time
                      expiresAt:
                        type: string
                        nullable: true
                        description: >
                          #1661 — optional expiry, UTC 'YYYY-MM-DD HH:MM:SS'.
                          null/absent = never expires. Round-trips through
                          this upsert, so sending null CLEARS an expiry.
                      songs:
                        type: array
                        maxItems: 200
                        items:
                          $ref: "#/components/schemas/SetlistSongEntry"
      responses:
        "200":
          description: Merged setlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  setlists:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSetlist"
                  syncedAt:
                    type: string
                    description: >
                      DB-clock watermark to send back as `since` next time
                      (#1649). Store it only after absorbing `setlists`.
                  truncated:
                    type: boolean
                    description: >
                      #1661 — always false for setlists; nothing is ever
                      sliced. Retained because existing clients read it.
                  cap:
                    type: integer
                    nullable: true
                    description: >
                      #1661 — always null: there is no cap. Key retained
                      because native decoders may read it.
                  tombstones:
                    type: array
                    description: >
                      #1661 — deletions this client must apply to its local
                      cache. Filtered to `>= since` when a watermark was sent.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        deletedAt:
                          type: string
                        reason:
                          type: string
                          description: >
                            user | expired | admin. App-validated VARCHAR
                            vocabulary, not an ENUM — new reasons need no
                            schema change.
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: >
            #1661 — request body exceeds the 4 MiB ceiling. NOTHING was
            changed; this replaces the old silent truncation, which lost data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ===========================================================================
  # SONG REQUESTS
  # ===========================================================================

  /api.php?action=song_request:
    post:
      operationId: submitSongRequest
      tags: [Song Requests]
      summary: Submit a song request
      description: |
        Submit a community song request. Available to all users (authentication
