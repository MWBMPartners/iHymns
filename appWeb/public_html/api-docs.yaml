  # ===========================================================================
  # PREFERENCES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # REMOVED (#1671 F5) — action=user_preferences  /  action=user_preferences_sync
  #
  # Both are GONE from the dispatcher and now return `400 Unknown action`.
  #
  # They were an un-namespaced duplicate of `action=user_settings` — the same
  # concept and the same payload shape, stored on a parallel table
  # (`tblUserPreferences`, since dropped) — with no caller anywhere in the
  # first-party tree. Two stores for one concept is a data-integrity trap:
  # whichever a client picked, the other would hold stale truth with nothing to
  # say so.
  #
  # MIGRATION FOR AN EXTERNAL INTEGRATOR:
  #   GET  ?action=user_preferences        →  GET  ?action=user_settings
  #                                              (optionally &namespace=<yours>)
  #   POST ?action=user_preferences_sync   →  POST ?action=user_settings
  #        { "preferences": { … } }              { "namespace": "<yours>",
  #                                                "settings": { … } }
  #
  # Naming a namespace replaces ONLY your subtree, so an independent product
  # can share this store without any key-collision convention. See the
  # `user_settings` path near the end of this file for the full contract.
  #
  # This block is deliberately a comment and not a deprecated path: a path here
  # is rendered as try-it-out-able by /manage/api-docs and is asserted by
  # tests/php/test-openapi-actions-exist.php to have a live dispatcher case, so
  # documenting a removed endpoint as a PATH would put a guaranteed 400 in front
  # of an admin. Recording the removal is documentation; keeping the path would
  # be a lie.
  # ---------------------------------------------------------------------------

  # ===========================================================================
  # USER PREFERRED LANGUAGES  (#736)
  #
  # Per-account persistence of the language-filter selection so a
  # signed-in user's choice syncs across devices. Anonymous users
  # keep using localStorage on the SPA side (the SPA also passes the
  # choice via `X-Preferred-Languages` on every fetch so the server
  # filter applies to anonymous requests too).
  # ===========================================================================

  /api.php?action=user_preferred_languages:
    get:
      operationId: getUserPreferredLanguages
      tags: [Preferences]
      summary: Get the authenticated user's saved language-filter subtag list
      description: |
        Returns the user's saved primary language subtags, or `[]` if
        no filter has been set. On a pre-#736 deployment (the
        `tblUsers.PreferredLanguagesJson` column is absent), the
        response includes `migration_needed: true` and an empty list
        so the client can render the picker without a filter applied.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_preferred_languages] }
      responses:
        "200":
          description: Saved subtag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  subtags:
                    type: array
                    items:
                      type: string
                      pattern: '^[a-z]{2,3}$'
                    example: ["en", "es"]
                  migration_needed:
                    type: boolean
                    description: Present and true on pre-#736 deployments only.
        "401":
          description: Not authenticated

  /api.php?action=user_preferred_languages_save:
    post:
      operationId: saveUserPreferredLanguages
      tags: [Preferences]
      summary: Save the authenticated user's language-filter subtag list
      description: |
        Server-side normalisation: invalid subtags are dropped, the
        list is lowercased, primary-subtag-only, deduplicated, and
        sorted (`parsePreferredLanguageSubtags` in
        `includes/language_filter.php`). An empty array clears the
        filter — the column is set to `NULL` to distinguish "no
        filter set" from "filter set to empty set" (which would
        mean "show nothing").
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_preferred_languages_save] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subtags]
              properties:
                subtags:
                  type: array
                  items:
                    type: string
                    description: Any BCP 47 tag — only the primary subtag is kept after normalisation.
                  example: ["en", "es-MX", "pt-BR"]
      responses:
        "200":
          description: Saved (canonical normalised list returned)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean, example: true }
                  subtags:
                    type: array
                    items: { type: string }
                    example: ["en", "es", "pt"]
        "400":
          description: subtags must be an array
        "401":
          description: Not authenticated
        "503":
          description: |
            Migration not yet applied on this deployment — response
            includes `migration_needed: true`.

  # ===========================================================================
  # SETLISTS — SCHEDULING (#398)
  # ===========================================================================

  /api.php?action=setlist_schedule_set:
    post:
      operationId: setlistScheduleSet
      tags: [Setlists — Scheduling]
      summary: Schedule a setlist for a date
      description: |
        Replaces any existing schedule for the (user, setlistId) pair with a
        new date + optional notes. Ownership is verified against
        `tblUserSetlists`.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_schedule_set] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setlistId, date]
              properties:
                setlistId: { type: string, example: slist-abc123 }
                date:
                  type: string
                  format: date
                  example: "2026-05-03"
                notes:
                  type: string
                  description: Optional free-text notes
                  example: "Sunday 10am — Communion service"
      responses:
        "200":
          description: Scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Missing or malformed fields
        "401":
          description: Unauthorised
        "404":
          description: Setlist not found or not owned by caller

  /api.php?action=setlist_schedule_clear:
    post:
      operationId: setlistScheduleClear
      tags: [Setlists — Scheduling]
      summary: Remove the scheduled date for a setlist
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_schedule_clear] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setlistId]
              properties:
                setlistId: { type: string, example: slist-abc123 }
      responses:
        "200":
          description: Cleared (no-op if nothing was scheduled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }

  /api.php?action=setlist_schedule_current:
    get:
      operationId: setlistScheduleCurrent
      tags: [Setlists — Scheduling]
      summary: Fetch the current schedule for one setlist
      description: Used by the setlist detail view to pre-populate the date input.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_schedule_current] }
        - name: setlistId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Schedule row or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule:
                    oneOf:
                      - type: "null"
                      - type: object
                        properties:
                          ScheduledDate: { type: string, format: date }
                          Notes:         { type: string }

  /api.php?action=setlist_schedule_upcoming:
    get:
      operationId: setlistScheduleUpcoming
      tags: [Setlists — Scheduling]
      summary: Next 25 scheduled setlists from today forward
      description: |
        Powers the "Up next" card on the setlist overview page. Only
        returns the caller's own scheduled setlists (not ones shared
        with them).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_schedule_upcoming] }
      responses:
        "200":
          description: Upcoming schedule list
          content:
            application/json:
              schema:
                type: object
                properties:
                  upcoming:
                    type: array
                    items:
                      type: object
                      properties:
                        SetlistId:     { type: string }
                        ScheduledDate: { type: string, format: date }
                        Notes:         { type: string }
                        name:          { type: string, nullable: true }

  # ===========================================================================
  # SETLISTS — COLLABORATION (#398)
  # ===========================================================================

  /api.php?action=setlist_collab_invite:
    post:
      operationId: setlistCollabInvite
      tags: [Setlists — Collaboration]
      summary: Invite a user by email to collaborate on a setlist
      description: |
        Owner-only. Resolves the invitee by email (must already have an
        iHymns account) and upserts a row in `tblSetlistCollaborators`.
        Re-inviting the same user updates their permission.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_collab_invite] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setlistId, collaboratorEmail]
              properties:
                setlistId:          { type: string }
                collaboratorEmail:  { type: string, format: email }
                permission:
                  type: string
                  enum: [view, edit]
                  default: edit
      responses:
        "200":
          description: Invitation accepted / permission updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  collaborator:
                    type: object
                    properties:
                      id:         { type: integer }
                      username:   { type: string }
                      permission: { type: string, enum: [view, edit] }
        "400":
          description: Missing fields, invalid email, or self-invite
        "404":
          description: Setlist not owned by caller, or no user with that email

  /api.php?action=setlist_token_update:
    post:
      operationId: setlistTokenUpdate
      tags: [Setlists — Collaboration]
      summary: Edit a shared set list through an edit-scope capability link (#1791)
      description: >
        Collab-by-link write. NO account required by default — the edit token in
        the body is the authorisation (the owner's "share an edit link, like
        cloud storage" model) UNLESS the link's edit audience (#1791 G4/G4-org)
        is `authenticated`, in which case a signed-in requester is required
        too. Same-origin only: requires `X-Requested-With:
        XMLHttpRequest` and, if present, an `Origin`/`Referer` host matching the
        server. Rate-limited PER TOKEN (30/min), not per IP (a NAT-shared
        congregation is one IP). Refuses a view-only (403), revoked/expired (410),
        owner-account-locked (403), or sign-in-required (401) link. Writes only
        the owner's one live set list — never inserts or deletes a row. Dormant
        (409) until the `Set-list share links` migration has run.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_token_update] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shareId, songs]
              properties:
                shareId: { type: string, description: The edit-scope capability token }
                songs:
                  type: array
                  items:
                    type: object
                    properties:
                      id:       { type: string }
                      title:    { type: string }
                      songbook: { type: string }
                      number:   { type: integer }
                      arrangement: { type: array, items: { type: integer } }
                name: { type: string, description: Optional rename; omit to leave the title }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  changed: { type: integer }
                  songs:   { type: array, items: { type: object } }
        "401":
          description: |
            #1791 G4 — the link's edit audience is `authenticated` and the
            requester is not signed in. Distinct from 403 (rule #35) so the
            client can branch on STATUS to prompt sign-in rather than showing
            a generic error toast.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:  { type: string, example: "Sign in to edit this set list." }
                  reason: { type: string, enum: [signin_required], example: signin_required }
        "403": { description: View-only link, cross-origin, or owner locked }
        "409": { description: Edit links not migrated on this server }
        "410": { description: Link revoked or expired }
        "413": { description: Request body too large }
        "429": { description: Per-token rate limit exceeded }

  /api.php?action=setlist_share_list:
    get:
      operationId: setlistShareList
      tags: [Setlists — Collaboration]
      summary: List the caller's share links for one of their set lists (#1791)
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_share_list] }
        - name: setlistId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The owner's share links (empty until the migration has run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        shareId:   { type: string }
                        scope:     { type: string, enum: [view, edit] }
                        label:     { type: string, nullable: true }
                        url:       { type: string }
                        created:   { type: string, format: date-time, nullable: true }
                        lastUsed:  { type: string, format: date-time, nullable: true }
                        viewCount: { type: integer }
                        editCount: { type: integer }
                        revoked:   { type: boolean }
                        expiresAt: { type: string, format: date-time, nullable: true }

  /api.php?action=setlist_share_revoke:
    post:
      operationId: setlistShareRevoke
      tags: [Setlists — Collaboration]
      summary: Hard-revoke one of the caller's share links (#1791)
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_share_revoke] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shareId]
              properties:
                shareId: { type: string }
      responses:
        "200":
          description: Revoked (the read path then refuses the link at every scope)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  revoked: { type: boolean }
        "403": { description: Caller does not own this link }
        "404": { description: No such link }
        "409": { description: Edit links not migrated on this server }

  /api.php?action=setlist_collab_list:
    get:
      operationId: setlistCollabList
      tags: [Setlists — Collaboration]
      summary: List collaborators on a setlist the caller owns
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_collab_list] }
        - name: setlistId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collaborator list, newest invite first
          content:
            application/json:
              schema:
                type: object
                properties:
                  collaborators:
                    type: array
                    items:
                      type: object
                      properties:
                        id:         { type: integer }
                        username:   { type: string }
                        email:      { type: string, format: email }
                        permission: { type: string, enum: [view, edit] }
                        invitedAt:  { type: string, format: date-time }

  /api.php?action=setlist_collab_remove:
    post:
      operationId: setlistCollabRemove
      tags: [Setlists — Collaboration]
      summary: Revoke a collaborator's access to a setlist
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_collab_remove] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [setlistId, collaboratorId]
              properties:
                setlistId:      { type: string }
                collaboratorId: { type: integer }
      responses:
        "200":
          description: Removed (reports how many rows were deleted)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  removed: { type: integer, minimum: 0 }

  /api.php?action=setlist_collab_shared_with_me:
    get:
      operationId: setlistCollabSharedWithMe
      tags: [Setlists — Collaboration]
      summary: Setlists the caller has been invited to
      description: |
        The READ half of collaboration. Returns every setlist another user has
        invited the caller to, INCLUDING its songs, so one call is enough to
        render the list — there is no endpoint for fetching a single setlist
        the caller does not own.

        Entries whose `Permission` is not one of `view` / `edit` are omitted
        (fail closed), as are collaborator rows whose underlying setlist has
        since been deleted.

        Clients MUST NOT merge these into the user's own setlist store: the
        collection posted to `user_setlists_sync` is owner-scoped and runs in
        `replace` mode, so a shared list included there would be written back
        as if the caller owned it.

        **Owner-state fields (#1698).** When the owner's account has been
        switched off or closed, the entry is still returned — deliberately
        VISIBLE — but becomes read-only. Branch on **`canWrite`**, which is the
        same question `setlist_collab_update` answers server-side, so the UI
        and the server cannot disagree about which rows are editable. Do NOT
        recompute it from `permission` and `ownerState` yourself.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_collab_shared_with_me] }
      responses:
        "200":
          description: Shared-with-me list
          content:
            application/json:
              schema:
                type: object
                properties:
                  shared:
                    type: array
                    items:
                      type: object
                      properties:
                        ownerId:    { type: integer }
                        ownerName:  { type: string, description: Owner display name, falling back to username }
                        setlistId:  { type: string }
                        permission: { type: string, enum: [view, edit] }
                        name:       { type: string }
                        updatedAt:  { type: string, description: Owner-side last-modified timestamp }
                        ownerState:
                          type: string
                          enum: [active, disabled, deleted]
                          description: >-
                            State of the owner's account (#1698). `disabled` is
                            reversible; `deleted` is an anonymised tombstone. A
                            client that only needs to know whether to grey the
                            row should read `locked` instead.
                        locked:
                          type: boolean
                          description: >-
                            True when the owner's account is not active, i.e.
                            `ownerState !== 'active'`. The entry stays visible;
                            only writing is withdrawn.
                        canWrite:
                          type: boolean
                          description: >-
                            Whether the caller may edit this setlist —
                            `permission === 'edit'` AND the owner is not locked.
                            Authoritative: `setlist_collab_update` enforces
                            exactly this. Branch on it rather than recomputing.
                        lockReason:
                          type: string
                          description: >-
                            Short user-facing sentence explaining the lock, or
                            `""` when unlocked. Deliberately names no username,
                            email or admin action — a shared link is readable by
                            anyone holding the URL.
                        songs:
                          type: array
                          items:
                            type: object
                            properties:
                              id:       { type: string }
                              title:    { type: string }
                              songbook: { type: string }
                              number:   { type: integer }
                              arrangement:
                                type: array
                                items: { type: integer }

  /api.php?action=setlist_collab_update:
    post:
      operationId: setlistCollabUpdate
      tags: [Setlists — Collaboration]
      summary: Edit a setlist shared with the caller (#1638)
      description: |
        The WRITE half of collaboration, and the endpoint that makes
        `Permission` mean something — before #1638 the view/edit choice was
        never read for enforcement.

        The caller's permission is resolved SERVER-side from
        `tblSetlistCollaborators` on every request; a `view` collaborator, an
        uninvited user, and an unrecognised permission value all get 403.

        Deliberately narrow: a single `UPDATE` of one already-existing
        (owner, setlistId) row. It cannot DELETE a setlist and cannot INSERT
        one, which is why collaborative writes do NOT go through
        `user_setlists_sync` — that handler runs in `replace` mode and would
        let a collaborator's device delete the owner's other setlists.

        Conflict handling is last-writer-wins. The owner's own `replace` sync
        can still overwrite a collaborator's edit if the owner's device is
        holding a stale copy.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_collab_update] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerId, setlistId, songs]
              properties:
                ownerId:   { type: integer, description: tblUsers.Id of the setlist owner }
                setlistId: { type: string }
                name:      { type: string, description: Optional rename; omit or send '' to leave the title alone }
                songs:
                  type: array
                  description: Full replacement song list, max 200 entries
                  items:
                    type: object
                    required: [id]
                    properties:
                      id:       { type: string }
                      title:    { type: string }
                      songbook: { type: string }
                      number:   { type: integer }
                      arrangement:
                        type: array
                        items: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Saved; echoes the sanitised song list actually stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  changed: { type: integer, description: affected_rows; 0 also means "no net change" }
                  songs:   { type: array, items: { type: object } }
        "400":
          description: ownerId / setlistId / songs missing or malformed
        "401":
          description: Not authenticated
        "403":
          description: Caller has view-only access, or none at all

  # ===========================================================================
  # SYSTEM
  # ===========================================================================

  /api.php?action=health:
    get:
      operationId: health
      tags: [System]
      summary: Unauthenticated liveness probe (#1022)
      description: |
        Answers "can this node actually serve?" for an uptime monitor or load
        balancer. Answered ABOVE the normal action dispatch — there is
        deliberately no `case 'health':` in the switch — because
        `new SongData()` opens the MySQL connection in its constructor, and
        this app's mysqli runs under `MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT`
        (`includes/db_mysql.php`), so a failed connect THROWS rather than
        returning falsy. A DB-down probe answered inside the normal dispatch
        would therefore land in the global exception handler instead, which
        on Alpha/Beta discloses the exception message/class/file:line — the
        exact disclosure an unauthenticated endpoint must never make.

        Runs `SELECT 1` — the cheapest round-trip that proves the connection
        is usable end-to-end (connect + prepare/execute + read a row back) —
        and returns `200 {"status":"ok"}` on success or `503
        {"status":"unavailable"}` on any failure (connection error,
        unexpected result, or the app's own maintenance-mode intercept, which
        is NOT bypassed here). Deliberately returns no app version, no
        environment name, no hostname, no schema/table names, no row counts,
        no query timings and no exception text — a two-value enum is the
        entire signal, and `SELECT 1` touches no table so the probe can't be
        turned into a data or schema oracle. Rate-limited to 60/min per
        requester (`enforceReadRateLimit('health', 60)`, fail-open) so it
        can't be used as a free "make the origin touch MySQL" amplifier.
        Responses carry `Cache-Control: no-store` so an intermediary can never
        serve a stale "ok" from a node that has since died.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [health] }
      responses:
        "200":
          description: The node is healthy — the database answered `SELECT 1`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
              example:
                status: ok
        "503":
          description: |
            Unhealthy — the database connection failed, answered unexpectedly,
            or the environment is in admin-triggered maintenance mode. A
            `Retry-After` header is included when the failure looks transient
            (connection/availability class) rather than a hard application
            error.
          headers:
            Retry-After:
              description: Present only for a transient (likely-recoverable) failure.
              schema: { type: integer, example: 30 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }
              example:
                status: unavailable
        "405":
          description: Method not allowed — only `GET` and `HEAD` are accepted.
          headers:
            Allow:
              schema: { type: string, example: "GET, HEAD" }
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }

  # ===========================================================================
  # PUSH NOTIFICATIONS
  # ===========================================================================

  # ⚠️ WHAT THIS SECTION USED TO SAY WAS WRONG IN THE ONE WAY THAT MATTERS, and
  # it is the THIRD instance of this in this file (after the song_key pair in
  # #1671 Batch 8 and the setlist_template pair above). It documented the body
  # as `{endpoint, keys: {p256dh, auth}}` — the browser's own PushSubscription
  # shape — while the handler has always read a FLAT `{endpoint, p256dh_key,
  # auth_key}`. Anybody following this page would have got a 400 saying
  # "Required: endpoint, p256dh_key, auth_key" and no idea why. It drifted for
  # the same reason all three did: nothing exercised it. Documentation is not a
  # mechanism (rule #35) — tests/test-push-helpers.js now re-reads api.php and
  # asserts the client sends exactly the fields the handler reads.
  #
  # The "dormant, no caller" note is also gone, and that change is real rather
  # than cosmetic: #1671 F6 built the three missing links (VAPID keypair,
  # RFC 8291 payload encryption in includes/web_push.php, and the service
  # worker's `push` / `notificationclick` handlers), so these two endpoints now
  # have a caller in js/modules/push-notifications.js.

  /api.php?action=push_subscribe:
    post:
      operationId: pushSubscribe
      tags: [Push]
      summary: Register a Web Push subscription for the current user
      description: |
        Stores one browser's Web Push subscription against the caller's account.
        Idempotent per (user, endpoint): re-subscribing replaces the existing
        row rather than duplicating it.

        The three fields come from the browser's `PushSubscription`, but are
        sent FLAT and RENAMED — `subscription.keys.p256dh` becomes `p256dh_key`
        and `subscription.keys.auth` becomes `auth_key`. Sending the browser's
        nested `keys` object is a 400.

        Whether a stored subscription actually RECEIVES anything depends on two
        further things: an operator having generated a VAPID keypair on
        /manage/notifications, and the user having opted in to the notification
        kind being sent (stored in the `ihymns.push` namespace of
        `?action=user_settings`).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [push_subscribe] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, p256dh_key, auth_key]
              properties:
                endpoint:
                  type: string
                  format: uri
                  description: The push service URL from `PushSubscription.endpoint`.
                p256dh_key:
                  type: string
                  description: >
                    base64url of the subscription's public key — the 65-byte
                    uncompressed P-256 point from `subscription.keys.p256dh`.
                auth_key:
                  type: string
                  description: >
                    base64url of the 16-byte auth secret from
                    `subscription.keys.auth` (RFC 8291 §3.2).
      responses:
        "200":
          description: Subscription stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400": { description: A required field is missing, or the endpoint is not a URL }
        "401": { description: Not authenticated }

  /api.php?action=push_unsubscribe:
    post:
      operationId: pushUnsubscribe
      tags: [Push]
      summary: Remove a Web Push subscription
      description: |
        Deletes the caller's own subscription for this endpoint. Idempotent —
        `deleted: 0` means there was nothing to remove, which is a success.

        Note the server ALSO prunes a subscription on its own initiative when a
        push service answers 404 or 410 for it (RFC 8030 — the subscription has
        been permanently revoked). Only those two statuses prune: a prune is
        irreversible, so a 429 or a 5xx never removes a working subscription.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [push_unsubscribe] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "200":
          description: Removed (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  deleted: { type: integer, description: Rows removed (0 or 1) }
        "400": { description: Endpoint is required }
        "401": { description: Not authenticated }

  # ===========================================================================
  # APNs BRIDGE (#1410, Apple Phase-2 PR-13) — push-TOKEN REGISTRATION ONLY.
  # Entirely dormant: nothing in this codebase calls includes/apns.php's
  # apnsSend() yet, and even a future caller gets a guaranteed
  # `not_configured` no-op until an owner provisions a real Apple APNs Auth
  # Key. `tblApnsTokens` shipped live-dormant (#1511); every action below is
  # apnsTokensTableExists()-gated.
  # ===========================================================================

  /api.php?action=apns_register:
    post:
      operationId: apnsRegister
      tags: [Push]
      summary: Register (or refresh) an APNs device/Live-Activity push token (#1410)
      description: |
        Requires authentication plus the same-origin CSRF check
        (`validateCsrfRequest()`, rule #29). Rate-limited to 30 / hour per
        user. Upserts on the token's unique key (`ON DUPLICATE KEY
        UPDATE`), so re-registering the same token just refreshes its
        row.

        `kind: liveActivity` tokens are additionally SESSION-SCOPED: the
        referenced `sessionId` must be an active `SessionKind='service'`
        row in the caller's channel, AND the caller must be authorised to
        OPERATE that session (`serviceMode_userCanOperate()` — global/org
        admin, the session's host, or an org-admin of the session's org)
        — otherwise `403`. This closes a gap where any authenticated user
        could otherwise register a token against any active session by
        guessing its numeric id. Ordinary `kind: device` tokens are not
        session-scoped and skip this check entirely.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [apns_register] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties:
                pushToken:
                  type: string
                  description: Hex-encoded APNs device token, 32-200 chars, even length.
                apnsEnv:
                  type: string
                  enum: [sandbox, production]
                  default: production
                  description: An unrecognised value silently falls back to `production` rather than rejecting the request.
                kind:
                  type: string
                  enum: [device, liveActivity]
                  default: device
                  description: An unrecognised value silently falls back to `device`.
                sessionId:
                  type: integer
                  description: Required (and validated) only when `kind` is `liveActivity`.
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Invalid/missing pushToken, or missing sessionId for kind=liveActivity
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate), or (for kind=liveActivity) not authorised to operate the referenced session
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: kind=liveActivity referenced an unknown or ended session (for this channel)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "503":
          description: Push registration is not available yet (tblApnsTokens not migrated), or the upsert failed — retry
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api.php?action=apns_unregister:
    post:
      operationId: apnsUnregister
      tags: [Push]
      summary: Remove an APNs push token (#1410)
      description: |
        Requires authentication plus the same-origin CSRF check
        (`validateCsrfRequest()`, rule #29). Rate-limited to 30 / hour per
        user. Own-only (`WHERE UserId = ?`). On an un-migrated install
        (no `tblApnsTokens`) returns `{ok: true}` — nothing to unregister
        — rather than a `503`, since this is a cleanup call a client may
        fire during sign-out regardless of migration state.
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [apns_unregister] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pushToken]
              properties:
                pushToken:
                  type: string
                  description: Hex-encoded APNs device token, 32-200 chars, even length.
                csrf_token:
                  type: string
                  description: Optional when the request already carries the same-origin X-Requested-With header.
      responses:
        "200":
          description: Removed (idempotent — `ok:true` whether or not a matching token existed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuccessResponse" }
        "400":
          description: Invalid/missing pushToken
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401":
          description: Not authenticated
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "403":
          description: Cross-origin request rejected (CSRF gate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required

  # ===========================================================================
  # EDITOR API  (separate entry point — /manage/editor/api.php)
  #
  # v1 is live-but-legacy (#1601): the DEFAULT editor is now v2
  # (/manage/editor/api2.php), and v1 is reached only via the v2 shell's
  # `?legacy=1` escape hatch. 14 of v1's ~37 dispatched actions get an
  # individual path item below. The remaining 23 are internal-only surfaces
  # (the legacy editor's own page + its own bulk-import/media/song-link UI
  # calling itself) that are NOT part of the published contract and are
  # deliberately not written up as individual paths — writing 23 more paths
  # for a surface being retired with #1601 is not a good use of the effort
  # (see api-docs-swagger-plan §3.3-2). If the owner wants full completeness
  # anyway, each has a near-identical v2 twin already documented to crib
  # from. The 23: `load_index`, `load_song`, `load_songs`,
  # `easyworship_export`, `song_media_list`/`_upload`/`_update`/`_delete`/
  # `_reorder`, `bulk_import_chordpro`/`_easyworship`/`_freeshow`/`_openlp`/
  # `_pptx`/`_pro6`/`_proclaim`/`_skipped_csv`/`_videopsalm`,
  # `get_song_links`, `add_song_link`, `remove_song_link`,
  # `suggest_song_links`, `dismiss_song_link_suggestion`. Verified against
  # the dispatcher via the same tokenising parser
  # `tests/php/lib/dispatch_parser.php` uses — re-run its
  # `dispatchParserCasesForSwitch()` against `manage/editor/api.php`'s
  # `$action` switch to reproduce this list if it drifts.
  # ===========================================================================

  /manage/editor/api.php?action=songbook_export:
    get:
      operationId: editorSongbookExport
      tags: [Editor API]
      summary: Export one songbook's songs as a JSON bundle (WS-J #1020)
      description: |
        DB-direct per-songbook export used by /manage/songbooks.php. Returns
        only the requested songbook's songs (the full importable shape) plus
        its songbook record for the export filename. Replaces the old
        whole-corpus ?action=load. Auth is the `/manage/` PHP session.
      parameters:
        - name: abbr
          in: query
          required: true
          schema: { type: string, example: CP }
      responses:
        "200":
          description: Songbook bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items: { $ref: "#/components/schemas/Song" }
                  songbook:
                    type: object
                    nullable: true
        "400":
          description: Missing or invalid abbr
        "401":
          description: Not authenticated (redirect the user to /manage/login)
        "403":
          description: Authenticated but not an editor

  /manage/editor/api.php?action=save_song:
    post:
      operationId: editorSaveSong
      tags: [Editor API]
      summary: Transactional UPSERT of one song (#394)
      description: |
        Writes `tblSongs` + children in a transaction and records one row
        in `tblSongRevisions` with `PreviousData` / `NewData` snapshots.
        The editor calls this per modified song — much cheaper than the
        legacy full-corpus `save`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, title]
              properties:
                id:              { type: string, example: CP-0202 }
                title:           { type: string }
                number:
                  type: integer
                  nullable: true
                  description: Null for `Misc` songs or when empty (#392)
                songbook:        { type: string }
                songbookName:    { type: string }
                language:        { type: string, example: en }
                copyright:       { type: string }
                ccli:            { type: string }
                verified:            { type: boolean }
                lyricsPublicDomain:  { type: boolean }
                musicPublicDomain:   { type: boolean }
                hasAudio:            { type: boolean }
                hasSheetMusic:       { type: boolean }
                components:
                  type: array
                  items:
                    type: object
                    properties:
                      type:  { type: string, example: verse }
                      cNum:  { type: integer }
                      lines: { type: array, items: { type: string } }
      responses:
        "200":
          description: Saved; revision logged
        "400":
          description: Missing required id/title
        "500":
          description: Save failed; details in server log

  /manage/editor/api.php?action=delete_song:
    post:
      operationId: editorDeleteSong
      tags: [Editor API]
      summary: SOFT-delete one song — hidden and restorable, never destroyed (#1694)
      description: |
        **Semantics changed in #1694 (stage 2 of #1692).** This action used to
        perform the irreversible cascade `DELETE`; it now sets
        `tblSongs.IsDeleted = 1` (plus who/when/why) and the song disappears
        from every read surface while its components, credits, media, tags and
        full revision history stay intact. An admin restores — or permanently
        purges — it from `/manage/deleted-songs`; purge is reachable **only**
        from the deleted state and requires the separate `purge_songs`
        entitlement.

        `redirectTo` is **accepted and ignored** (kept so older clients do not
        break; the response carries a `notice` naming the fact). No
        `tblSongRedirects` row is written at soft-delete time — a redirect
        repoint cannot be un-written, so writing one would stop restore being a
        no-op. The relink choice is made at purge, where the old redirect dance
        runs unchanged.

        Served identically by the v2 editor API
        (`/manage/editor/api2.php?action=delete_song`, the default editor's
        backend). Requires the `delete_songs` entitlement and the editor CSRF
        gate (`X-CSRF-Token` here; `X-Requested-With` on api2). Clients branch
        on the **HTTP status**, never the error prose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId]
              properties:
                songId:     { type: string, example: CP-0202 }
                reason:
                  type: string
                  nullable: true
                  description: Optional `songDeleteReasons()` key (`duplicate`, `copyright`, `data-error`, `requested`, `other`). Unknown values refuse with 422.
                note:       { type: string, description: Optional free-text note (clamped to 255 chars) }
                redirectTo: { type: string, description: Accepted and IGNORED (#1694) — the relink happens at purge }
      responses:
        "200":
          description: Song moved to Deleted songs (restorable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:          { type: boolean }
                  deleted:     { type: integer, description: Back-compat — 1 song left the catalogue }
                  softDeleted: { type: boolean, description: Always true — the row survives, hidden }
                  songId:      { type: string }
                  redirectTo:  { type: string, nullable: true, description: Always null — no redirect is written at soft-delete time }
                  notice:      { type: string, description: Present only when a redirectTo was supplied, explaining that it was ignored }
        "400":
          description: songId missing/empty
        "403":
          description: CSRF failure, or the delete_songs entitlement is missing
        "404":
          description: No such song
        "409":
          description: The soft-delete migration has not been applied on this install (the endpoint REFUSES rather than falling back to a hard delete), or the song is already deleted
        "422":
          description: Unknown delete reason (not in the allow-list)
        "500":
          description: Delete failed; details in server log (admins get error_detail)

  /manage/editor/api.php?action=bulk_tag:
    post:
      operationId: editorBulkTag
      tags: [Editor API]
      summary: Add and/or remove tags across a list of songs (#399)
      description: |
        Transactional. ADDs upsert `tblSongTags` (with slug) and
        INSERT-IGNORE into `tblSongTagMap`. REMOVEs resolve by tag name
        and delete matching mapping rows. Unknown tag names on remove
        are silently ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songIds]
              properties:
                songIds:
                  type: array
                  items: { type: string, example: CP-0202 }
                add:
                  type: array
                  items: { type: string, example: Easter }
                remove:
                  type: array
                  items: { type: string, example: Funeral }
      responses:
        "200":
          description: Summary of what changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  songsAffected: { type: integer }
                  added:         { type: integer, description: Rows actually inserted }
                  removed:       { type: integer, description: Rows actually deleted }
        "400":
          description: No valid songIds or no tag changes supplied

  /manage/editor/api.php?action=list_revisions:
    get:
      operationId: editorListRevisions
      tags: [Editor API]
      summary: List revisions for one song (#400)
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [list_revisions] }
        - name: songId
          in: query
          required: true
          schema: { type: string, example: CP-0202 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Revision list, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:           { type: integer }
                        action:       { type: string, enum: [create, edit, restore, delete] }
                        createdAt:    { type: string, format: date-time }
                        userId:       { type: integer, nullable: true }
                        username:     { type: string, nullable: true }
                        previousData: { type: object, nullable: true }
                        newData:      { type: object, nullable: true }

  /manage/editor/api.php?action=restore_revision:
    post:
      operationId: editorRestoreRevision
      tags: [Editor API]
      summary: Restore a song to the state BEFORE a given revision (#400)
      description: |
        Rewrites the core `tblSongs` row from the chosen revision's
        `PreviousData` and records a new revision with `Action='restore'`
        whose `PreviousData` captures the state just-overwritten.
        Transactional — rolls back on any failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionId]
              properties:
                revisionId: { type: integer, example: 4712 }
      responses:
        "200":
          description: Restored; new revision row's id is returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:            { type: boolean }
                  songId:        { type: string }
                  newRevisionId: { type: integer }
        "404":
          description: Revision id not found
        "409":
          description: This revision has no prior state (it's the initial create)

  /manage/editor/api.php?action=save:
    post:
      operationId: editorSaveAll
      tags: [Editor API]
      summary: Legacy full-corpus save — TRUNCATE + bulk INSERT
      description: |
        TRUNCATEs `tblSongs` / `tblSongbooks` and the five song-credit
        tables, then re-inserts everything from the posted JSON. Used
        by the bulk-import paths and the editor's "save all" button.
        Per-song validation is soft on this path — a malformed IETF
        BCP 47 tag (#681) falls back to `en` rather than aborting the
        whole corpus save. Use `save_song` for the per-song
        UPSERT-with-revision flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [meta, songbooks, songs]
              properties:
                meta:
                  type: object
                  description: Free-form metadata block (version, generated_at, …).
                songbooks:
                  type: array
                  items:
                    type: object
                    required: [id, name]
                    properties:
                      id:        { type: string, description: Songbook abbreviation. }
                      name:      { type: string }
                      songCount: { type: integer }
                songs:
                  type: array
                  items:
                    $ref: "#/components/schemas/EditorSongInput"
      responses:
        "200":
          description: Save succeeded; counts echoed back
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:   { type: boolean, example: true }
                  songs:     { type: integer }
                  songbooks: { type: integer }
        "400":
          description: Invalid JSON, missing top-level keys, or empty body
        "405":
          description: GET issued — POST required
        "500":
          description: Save failed (transaction rolled back). Details in server log.

  # /manage/editor/api.php?action=get_translations / add_translation / remove_translation
  # removed in remediation X1 (2026-07-30, orphan inventory §2.8): the legacy editor's
  # Translations panel never called them (#1626), so they were dead endpoints
  # documented as live. Per-song translation links are now the public, live
  # `?action=song_translations` (api.php) — see that path below.

  /manage/editor/api.php?action=song_tags:
    get:
      operationId: editorSongTags
      tags: [Editor API]
      summary: Tags currently on one song (#496)
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_tags] }
        - name: id
          in: query
          required: true
          description: SongId.
          schema: { type: string }
      responses:
        "200":
          description: Tag list, alphabetical by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: integer }
                        name:        { type: string }
                        slug:        { type: string }
                        description: { type: string, nullable: true }
        "400":
          description: Missing id

  /manage/editor/api.php?action=tag_search:
    get:
      operationId: editorTagSearch
      tags: [Editor API]
      summary: Tag-name autocomplete (#496)
      description: |
        Empty `q` returns the most-used tags (the empty-state list).
        Otherwise `LIKE %q%` on `tblSongTags.Name`. `usage` is the
        number of songs currently carrying the tag, so popular tags
        sort first and curators don't accidentally coin a
        near-duplicate.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [tag_search] }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Suggestion list, sorted by usage DESC then name ASC
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: integer }
                        name:  { type: string }
                        slug:  { type: string }
                        usage: { type: integer, description: Number of songs currently carrying this tag. }

  /manage/editor/api.php?action=credit_search:
    get:
      operationId: editorCreditSearch
      tags: [Editor API]
      summary: Live-search credit names across the 5 song-credit tables (#545)
      description: |
        UNION ALL across `tblSongWriters` / `tblSongComposers` /
        `tblSongArrangers` / `tblSongAdaptors` / `tblSongTranslators`,
        grouping by name so the same person from multiple roles
        collapses to a single suggestion with combined usage and the
        list of kinds they appear in. When `kind=any` (the default),
        also surfaces names from the `tblMusicians` registry that
        no song currently cites — those land with `usage=0` and a
        `kinds=["registry"]` marker.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [credit_search] }
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [any, writer, composer, arranger, adaptor, translator]
            default: any
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Suggestions, sorted by usage DESC then name ASC
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        name:  { type: string }
                        usage: { type: integer }
                        kinds:
                          type: array
                          items:
                            type: string
                            enum: [writer, composer, arranger, adaptor, translator, registry]
        "400":
          description: Unknown kind

  /manage/editor/api.php?action=user_search:
    get:
      operationId: editorUserSearch
      tags: [Editor API]
      summary: Live-search users by display name or username (#498)
      description: |
        `LIKE %q%` against `DisplayName` OR `Username`. Used by the
        `/manage/restrictions` name-first picker to resolve a
        human-friendly label to the canonical `tblUsers.Id` on save.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [user_search] }
        - name: q
          in: query
          required: false
          description: Empty string → empty suggestions list (no implicit "show all users" fallback).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        "200":
          description: Suggestion list, alphabetic by display name
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: integer }
                        label: { type: string, description: DisplayName, falling back to Username. }
                        hint:  { type: string, description: "Format: `@<username> · <role>`" }

  /manage/editor/api.php?action=org_search:
    get:
      operationId: editorOrgSearch
      tags: [Editor API]
      summary: Live-search organisations by name or slug (#498)
      description: |
        Active organisations only. Empty `q` returns the alphabetised
        list of every active org (capped at `limit`). Otherwise
        `LIKE %q%` against `Name` OR `Slug`.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [org_search] }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Suggestion list, alphabetic by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:    { type: integer }
                        label: { type: string, description: Organisation name. }
                        hint:  { type: string, description: "Format: `licence: <type> · slug: <slug>`" }

  /manage/editor/api.php?action=bulk_import_zip:
    post:
      operationId: editorBulkImportZip
      tags: [Editor API]
      summary: Bulk-load songs and songbooks from a ZIP (#664, #676)
      description: |
        Multipart upload, single field `zip`. The archive is expected
        to mirror the `.SourceSongData/` folder layout: one folder
        per songbook named `<Hymnal Name> [<ABBREV>]/` holding one
        `.txt` file per song named
        `<#> (<ABBREV>) - <Title>.txt` in the established source
        format (title line, blank, alternating section markers +
        lyric blocks).

        Async by default when `tblBulkImportJobs` exists (#676): the
        endpoint returns a `job_id` immediately and the import runs
        in a freed worker; poll `bulk_import_status` for progress.
        Pre-migration deployments fall back to the synchronous path
        and respond with the legacy summary shape.

        **INSERT-ONLY:** the import never overwrites existing
        `tblSongbooks` / `tblSongs`. Pre-flight existence checks +
        three-counter response shape (`songs_created` /
        `songs_skipped_existing` / `songs_failed`).

        Auth: editor+ via the `/manage/` PHP session. Per-user
        quota + 100 MB hard size cap.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [zip]
              properties:
                zip:
                  type: string
                  format: binary
                  description: A `.zip` archive ≤ 100 MB.
      responses:
        "200":
          description: |
            Two possible shapes depending on async readiness.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    title: AsyncJobAccepted
                    description: Returned when tblBulkImportJobs is migrated.
                    properties:
                      ok:        { type: boolean, example: true }
                      async:     { type: boolean, example: true }
                      job_id:    { type: integer, description: Pass to bulk_import_status to poll. }
                      status:    { type: string, enum: [queued] }
                      poll_url:
                        type: string
                        example: "/manage/editor/api?action=bulk_import_status&job_id=42"
                  - $ref: "#/components/schemas/EditorBulkImportSummary"
        "400":
          description: No file received, or upload error from PHP (`phpError` echoes UPLOAD_ERR_*)
        "405":
          description: GET issued — POST multipart required
        "413":
          description: Uploaded zip exceeds the 100 MB import limit
        "500":
          description: Server is missing the PHP zip extension, or import threw

  /manage/editor/api.php?action=bulk_import_status:
    get:
      operationId: editorBulkImportStatus
      tags: [Editor API]
      summary: Poll one async bulk-import job (#676)
      description: |
        Auth: editor+ AND the row's `UserId` must equal the caller's
        — one curator can only poll their own jobs even though
        `/manage/editor/api.php` is a shared endpoint.

        Pre-migration deployments (no `tblBulkImportJobs`) return
        404 with `migration_needed: true` so the frontend can fall
        back to the synchronous flow without surprising the user.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [bulk_import_status] }
        - name: job_id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Job snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:  { type: boolean, example: true }
                  job:
                    $ref: "#/components/schemas/EditorBulkImportJob"
        "400":
          description: Missing job_id
        "404":
          description: |
            Either job not found / not owned by the caller, or
            `tblBulkImportJobs` doesn't exist (response includes
            `migration_needed: true`).

  # ===========================================================================
  # SONG METADATA  (per-song detail surfaces)
  # ===========================================================================

  /api.php?action=song_history:
    get:
      operationId: songHistory
      tags: [Song Metadata]
      summary: Recently viewed songs for the caller
      description: Backed by `tblSongHistory`; gated on analytics consent.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_history] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: History entries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        songId:   { type: string }
                        title:    { type: string }
                        songbook: { type: string }
                        viewedAt: { type: string, format: date-time }

  /api.php?action=song_history_backfill:
    post:
      operationId: songHistoryBackfill
      tags: [Song Metadata]
      summary: One-time push of local recently-viewed into the server (WS-G #1019)
      description: |
        Pushes a signed-in user's pre-existing LOCAL recently-viewed list
        (e.g. songs viewed while anonymous, before this device signed in) into
        `tblSongHistory` so Recently Viewed is consistent across devices. The
        client runs this once per device, guarded by a localStorage flag; the
        read path dedupes, so an occasional duplicate row is invisible.
        Capped at 50 views; ViewedAt preserved (invalid → NOW()).
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_history_backfill] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [views]
              properties:
                views:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [song_id]
                    properties:
                      song_id:   { type: string, pattern: "^[A-Za-z0-9_-]{1,32}$" }
                      viewed_at: { type: string, format: date-time }
      responses:
        "200":
          description: Imported count
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean }
                  imported: { type: integer }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api.php?action=song_history_clear:
    post:
      operationId: songHistoryClear
      tags: [Song Metadata]
      summary: Clear the caller's recently-viewed history (WS-G #1019)
      description: |
        Deletes the authenticated user's own `tblSongHistory` rows so a
        "Clear" propagates across devices instead of repopulating from the
        server on the next pull. Anonymous (UserId NULL) rows — which drive
        aggregate popularity — are untouched.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_history_clear] }
      responses:
        "200":
          description: Cleared count
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  cleared: { type: integer }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # MUSICAL KEY (#298, UI wired #1671 F3)
  #
  # These two entries USED TO DESCRIBE AN API THAT DOES NOT EXIST. Every one of
  # the following was wrong, and had been since #298:
  #   - the GET parameter was documented `songId`; the handler reads `id`;
  #   - the POST body was documented `{songId, key}`; the handler reads
  #     `{song_id, original_key, tempo, time_signature}`;
  #   - the GET response was documented as a bare `{key: "G"}` string; it is an
  #     object of three fields;
  #   - both were described as "the CALLER'S preferred key", implying a per-user
  #     setting. It is one shared per-song value on `tblSongKeys`, and the save
  #     is editor-only.
  # A consumer following this page could not have made a single successful call.
  # It survived because nothing called these endpoints at all — documentation is
  # not a mechanism (rule #35), and a doc nobody exercises drifts silently.
  # Corrected here against the handlers.
  # ---------------------------------------------------------------------------
  /api.php?action=song_key:
    get:
      operationId: songKeyGet
      tags: [Song Metadata]
      summary: Musical key, tempo and time signature for one song
      description: |
        Public read. `tblSongKeys` is sparse — most songs have no row — so
        **404 is the ordinary answer**, not an error, and clients should treat
        it as "no key recorded". Branch on the STATUS, never on the message.

        Consumed by the public song page (`js/modules/song-key.js`), which uses
        the key to feed the transpose controls, and by the v2 editor's Musical
        key panel.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_key] }
        - name: id
          in: query
          required: true
          description: The SongId, e.g. `MP-1008`.
          schema: { type: string, example: MP-1008 }
      responses:
        "200":
          description: The stored key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: object
                    properties:
                      originalKey:
                        type: string
                        description: >-
                          Note A-G, optionally `#` or `b`, optionally `m` for
                          minor. May be the empty string on a legacy row.
                        example: Bb
                      tempo:
                        type: integer
                        nullable: true
                        description: BPM, or null when unspecified.
                        example: 96
                      timeSignature:
                        type: string
                        description: >-
                          `n/n`, or the EMPTY STRING when unspecified — the
                          column is NOT NULL, so "unset" is `''`, never null.
                        example: 4/4
        "400": { description: "`id` was not supplied." }
        "404": { description: "No key recorded for this song. The normal answer for most songs." }

  /api.php?action=song_key_save:
    post:
      operationId: songKeySave
      tags: [Song Metadata]
      summary: Set the musical key, tempo and time signature for one song
      description: |
        Requires the `edit_songs` entitlement (editor / admin / global_admin by
        default, retunable at `/manage/entitlements`). Upsert semantics: the
        payload is the truth for all three fields.

        Responds with the **stored** values, which may differ from what was
        sent — the root note is upper-cased, and an omitted time signature
        comes back as `''`. Clients should write the response into their form
        rather than trusting their own copy.

        Every rejection carries a stable `reason` alongside the human `error`,
        so a client can branch on a code rather than on prose (rule #35).
        There is deliberately no way to CLEAR a key: `original_key` is required
        on every call, and an endpoint that deleted the row on an empty string
        would make an accidental blank field destructive.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_key_save] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [song_id, original_key]
              properties:
                song_id:
                  type: string
                  description: An existing SongId (max 20 chars).
                  example: MP-1008
                original_key:
                  type: string
                  description: >-
                    Note A-G, optional `#` or `b` (lower-case `b` means flat;
                    upper-case `B` is the note, so `BB` is refused), optional
                    `m` for minor.
                  example: Bb
                tempo:
                  type: integer
                  nullable: true
                  minimum: 20
                  maximum: 400
                  description: BPM. Omit, send null, or send "" for unspecified.
                  example: 96
                time_signature:
                  type: string
                  description: >-
                    `n/n` with both parts >= 1. Omit or send "" for
                    unspecified — stored as the empty string, never null.
                  example: 4/4
      responses:
        "200":
          description: Stored. Echoes the values as persisted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  key:
                    type: object
                    properties:
                      originalKey:   { type: string, example: Bb }
                      tempo:         { type: integer, nullable: true, example: 96 }
                      timeSignature: { type: string, example: 4/4 }
        "400":
          description: |
            Validation failure. `reason` is one of `body_invalid`,
            `song_id_required`, `song_id_too_long`, `key_required`,
            `key_invalid`, `tempo_invalid`, `time_signature_invalid`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:  { type: string }
                  reason: { type: string, example: tempo_invalid }
        "401": { description: "Not authenticated." }
        "403": { description: "Authenticated, but the role lacks `edit_songs`." }
        "404":
          description: "`reason: song_not_found` — no such SongId. Checked before the write, because the FK would otherwise raise a 500."
        "405": { description: "POST required." }

  /api.php?action=song_revisions:
    get:
      operationId: songRevisionsPublic
      tags: [Song Metadata]
      summary: Revision timeline for one song (read-only public view)
      description: |
        Lightweight sibling of the editor-only `list_revisions`. Returns
        who/when/action for each revision, without the full before/after
        snapshots (those are editor-only).

        Dormant: undocumented-as-such API-parity spillover — no web/Apple/Android
        client calls this today (orphan inventory §2.5, remediation X7). The
        endpoint is live and correct; it simply has no first-party caller yet.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_revisions] }
        - name: songId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Redacted revision list
          content:
            application/json:
              schema:
                type: object
                properties:
                  revisions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:        { type: integer }
                        action:    { type: string, enum: [create, edit, restore, delete] }
                        createdAt: { type: string, format: date-time }
                        username:  { type: string, nullable: true }

  /api.php?action=songs_exist:
    get:
      operationId: songsExist
      tags: [Songs]
      summary: Batch existence check for a list of SongIds (#1329)
      description: |
        Public — only reveals whether already-public song ids still exist.
        Clients use this to prune deleted songs out of localStorage-backed
        lists (Recently Viewed, etc.) so a stale cached entry never renders
        an unresolvable id. Does NOT resolve PublicIds — callers must send
        canonical SongIds (the web app always does).
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [songs_exist]
        - name: ids
          in: query
          required: true
          description: |
            Comma-separated SongIds (each matching `^[A-Za-z0-9_-]{1,32}$`;
            malformed entries are silently dropped). Capped at 200 —
            extras beyond the first 200 valid ids are silently truncated.
          schema: { type: string, example: "CP-0001,MP-0042" }
      responses:
        "200":
          description: |
            The subset of the requested ids that still exist.
            `exists: null` (with `fallback: true`) on a lookup error, so
            the client leaves its cache intact rather than pruning
            everything.
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: array
                    nullable: true
                    items: { type: string }
                    example: ["CP-0001"]
                  fallback:
                    type: boolean
                    description: "Present (true) only alongside `exists: null`."

  # ===========================================================================
  # SONG REQUESTS  (submission half — admin half is under Admin tag)
  # ===========================================================================

  /api.php?action=song_request_submit:
    post:
      operationId: songRequestSubmit
      tags: [Song Requests]
      summary: Submit a new song-request from the public form
      description: |
        **#1472 correction:** the body fields below (`title` / `songbook` /
        `details` / `email` / `website`) replace a previous, factually
        wrong schema (`writer` / `reason` / `hp_field`) that does not match
        api.php:8515-8631.

        Rate-limited (5 submissions per IP per 24h, checked against
        `tblSongRequests.CreatedAt`) and honey-potted via `website`. Writes
        to `tblSongRequests` with status `pending`. Anonymous submissions
        are allowed; a Bearer/session caller is additionally linked via
        `UserId`.

        Accepts **either** `application/json` (the JS path used by the
        `/request` page's script) **or** `application/x-www-form-urlencoded`
        / `multipart/form-data` (the no-JS `<form action>` fallback, #711,
        for when the page's `<script type="module">` fails to load) — both
        carry the same fields.

        **No-JS fallback response.** When the request was form-encoded,
        the server responds with a **302** redirect instead of a JSON
        body: `Location: /request?submitted=1&id=<trackingId>` on
        success, or `Location: /request?error=<urlencoded message>` on
        failure. See `?page=request`'s `submitted` / `id` / `error`
        params, which render the matching flash banner. The JSON (JS)
        path always gets a JSON body, on every outcome including the
        honeypot and rate-limit cases.
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_request_submit] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SongRequestSubmitInput" }
          application/x-www-form-urlencoded:
            schema: { $ref: "#/components/schemas/SongRequestSubmitInput" }
      responses:
        "200":
          description: |
            JSON (JS) path only. `trackingId: 0` is the honeypot's silent
            fake success — no row is written, so a bot filling `website`
            isn't tipped off that it was caught.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:         { type: boolean, example: true }
                  trackingId: { type: integer, example: 512 }
        "302":
          description: |
            Form-encoded (no-JS) path only — redirects to `/request` with
            a `submitted`/`id` (success) or `error` (failure) query param
            instead of returning a JSON body.
        "400":
          description: Missing `title`, a field over its length cap, or an invalid `email`
        "405":
          description: Non-POST method
        "429":
          description: Rate-limit exceeded — 5 submissions from this IP in the last 24h

  /api.php?action=song_correction_submit:
    post:
      operationId: songCorrectionSubmit
      tags: [Song Requests]
      summary: Submit a structured correction to an existing song (#1092)
      description: |
        Unlike a missing-song request, this captures a reviewable
        `{songId, field, originalValue, proposedValue}` diff. `field` is
        checked against a closed allow-list; for scalar fields the
        `originalValue` is read SERVER-side from the live `tblSongs` row
        (a client-supplied "before" value is never trusted). Stored in
        `tblSongRequests` with `RequestType='correction'`, sharing
        `song_request_submit`'s honeypot + length + email + per-IP
        rate-limit guards (5 submissions / 24h).
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [song_correction_submit] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [songId, field, proposed]
              properties:
                songId:
                  type: string
                  example: CP-0202
                field:
                  type: string
                  enum: [title, copyright, tune, ccli, iswc, language, lyrics, author, composer, other]
                  description: |
                    `title`/`copyright`/`tune`/`ccli`/`iswc`/`language` are
                    scalar `tblSongs` columns (the server fills
                    `originalValue` from the live row); `lyrics`/`author`/
                    `composer`/`other` are free-text fields with no single
                    column to diff (`originalValue` is empty).
                proposed:
                  type: string
                  description: The proposed replacement value (max 5000 chars).
                email:
                  type: string
                  format: email
                  description: Optional reply-to (max 255 chars).
                website:
                  type: string
                  description: Honeypot — MUST be empty. A non-empty value returns a silent fake success.
      responses:
        "200":
          description: |
            Queued for admin triage (or a silent honeypot fake-success —
            `trackingId: 0` — when the honeypot field was filled).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  trackingId: { type: integer, example: 512 }
        "400":
          description: Missing songId/field/proposed, an unknown field, or the proposed value/email is too long/invalid
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "404":
          description: songId does not exist
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "405":
          description: POST method required
        "429":
          description: 5+ submissions from this IP in the last 24h
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  # /api.php?action=setlist_schedule / setlist_schedule_save — the pre-#398
  # legacy date-range pair — were removed in remediation F8 (2026-07-30,
  # orphan inventory §2.3): superseded by the live setlist_schedule_set /
  # _clear / _current / _upcoming family below (same tblSetlistSchedule
  # table), and this doc entry had already drifted from the code it claimed
  # to describe (a setlistId + single-row contract, when the actual
  # endpoints used a from/to date range) — a second, independent doc-vs-code
  # disagreement on top of having no first-party caller.

  # ---------------------------------------------------------------------------
  # SETLIST TEMPLATES (#301; completed + documented #1671 F4)
  #
  # ⚠️ WHAT THIS SECTION USED TO SAY WAS FICTION, and worth recording because it
  # is the second instance of the same failure in this file (the song_key pair
  # was the first, #1671 Batch 8). It documented `songIds: [string]` where the
  # handler reads `slots: [{label, type}]`, an `id: string` where the column is
  # an AUTO_INCREMENT integer, and a summary of "Create or update" for an
  # endpoint that could only ever create. Nobody could have made a successful
  # call from that page. It drifted for exactly the reason both did: nothing
  # exercised it. Documentation is not a mechanism (rule #35) — the guard that
  # actually holds this honest is tests/php/test-openapi-actions-exist.php plus
  # tests/php/test-setlist-templates.php.
  #
  # A template is a SERVICE ORDER — labelled slots — not a list of songs. Songs
  # are chosen per set list, into the plan the template produces.
  # ---------------------------------------------------------------------------

  /api.php?action=setlist_templates:
    get:
      operationId: setlistTemplates
      tags: [Setlists]
      summary: List setlist templates visible to the caller
      description: >
        Returns public templates plus the caller's own plus those belonging to
        organisations the caller is a member of. Callable anonymously, in which
        case only public templates are returned. `slotTypes` is the server's ONE
        slot-type registry — build a picker from it rather than hardcoding a
        copy — and `canEdit` states, per template, whether THIS caller may
        update or delete it (owner-only); never re-derive that from `createdBy`.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_templates] }
      responses:
        "200":
          description: Template list, the slot-type registry and the slot cap
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: integer }
                        name:        { type: string }
                        description: { type: string }
                        slotsJson:
                          type: array
                          description: The ordered service plan.
                          items:
                            type: object
                            properties:
                              id:    { type: string, description: "Stable slot key, [A-Za-z0-9_-]{1,40}" }
                              label: { type: string, maxLength: 100 }
                              type:  { type: string, maxLength: 50, description: A key from slotTypes, or free text }
                        isPublic:    { type: boolean }
                        orgId:       { type: integer, nullable: true }
                        createdBy:   { type: integer, nullable: true }
                        createdAt:   { type: string, format: date-time }
                        ownerState:
                          type: string
                          enum: [active, disabled, deleted, absent]
                          description: >-
                            State of the template author's account (#1698).
                            `absent` means the template names no author at all —
                            an older row whose `createdBy` went NULL under
                            `ON DELETE SET NULL` before erasure became a
                            tombstone. All four states other than `active` lock.
                        ownerLocked:
                          type: boolean
                          description: >-
                            True when the author's account is not active. The
                            template stays listed and stays applicable; only
                            renaming and deleting are withdrawn.
                        canEdit:
                          type: boolean
                          description: >-
                            Whether THIS caller may rename or delete THIS
                            template — true when they authored it, OR when they
                            hold the `manage_setlist_templates` entitlement
                            (admin+, the #1698 override that makes an
                            author-less template manageable again).
                            Authoritative: `setlist_template_update` and
                            `setlist_template_delete` enforce exactly this, so
                            the list can never offer a button the write endpoint
                            refuses. Do not re-derive it from `createdBy`.
                  slotTypes:
                    type: object
                    additionalProperties: { type: string }
                    description: Slot-type key => human label.
                  maxSlots:
                    type: integer
                    description: Slots per template. Exceeding it is a 413, never a silent truncation.

  /api.php?action=setlist_template_save:
    post:
      operationId: setlistTemplateSave
      tags: [Setlists]
      summary: Create a setlist template
      description: >
        Creates only — use `setlist_template_update` to change one. `org_id` may
        only name an organisation the caller is a member of (403 otherwise).
        More than `maxSlots` slots is refused with 413 and nothing is stored;
        the payload is never silently shortened.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_template_save] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                slots:
                  type: array
                  items:
                    type: object
                    required: [label]
                    properties:
                      id:    { type: string }
                      label: { type: string, maxLength: 100 }
                      type:  { type: string, maxLength: 50 }
                org_id:      { type: integer, nullable: true }
                is_public:
                  type: boolean
                  default: false
                  description: >-
                    Makes the template visible to every user of the app.
                    Requires the `publish_public_templates` entitlement
                    (admin+, #1698); without it a `true` here is a 403 and
                    the template is NOT saved. It is deliberately rejected
                    rather than silently demoted to private — a demotion
                    would report success while not doing what was asked.
      responses:
        "201":
          description: Created; returns the new template id
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
        "400": { description: Template name is required }
        "401": { description: Not authenticated }
        "403":
          description: >-
            `org_id` names an organisation the caller does not belong to, OR
            `is_public` was true without the `publish_public_templates`
            entitlement (#1698). Nothing is saved in either case.
        "413": { description: Too many slots — nothing was stored }

  /api.php?action=setlist_template_update:
    post:
      operationId: setlistTemplateUpdate
      tags: [Setlists]
      summary: Update a setlist template you created
      description: >
        Owner-only. Organisation membership grants VISIBILITY of a template, not
        the right to change it. `org_id` is deliberately not re-assignable here —
        moving a template between organisations changes who can see it, which is
        an access decision; delete and re-create instead, so the membership check
        runs again.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_template_update] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name]
              properties:
                id:          { type: integer }
                name:        { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                slots:
                  type: array
                  items:
                    type: object
                    required: [label]
                    properties:
                      id:    { type: string }
                      label: { type: string, maxLength: 100 }
                      type:  { type: string, maxLength: 50 }
                is_public:
                  type: boolean
                  default: false
                  description: >-
                    Requires the `publish_public_templates` entitlement
                    (admin+, #1698); without it a `true` here is a 403 and
                    nothing is updated. Same gate, same rejection shape, as
                    `setlist_template_save`.
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }
        "400": { description: Template id and name are required }
        "401": { description: Not authenticated }
        "403":
          description: >-
            The caller neither created this template nor holds the
            `manage_setlist_templates` entitlement (the #1698 admin override,
            which is what makes a template whose author's account was erased
            manageable again) — or `is_public` was true without
            `publish_public_templates`. Nothing is changed.
        "404": { description: No such template }
        "413": { description: Too many slots — nothing was changed }

  /api.php?action=setlist_template_delete:
    post:
      operationId: setlistTemplateDelete
      tags: [Setlists]
      summary: Delete a setlist template you created
      description: >
        Owner-only. Set lists already built from the template are UNAFFECTED —
        a plan is copied into the set list when it is applied, and the copy keeps
        a snapshot of the template's name, so deleting a template can never empty
        somebody's service.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [setlist_template_delete] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  deleted: { type: integer, description: Rows removed (0 or 1) }
        "400": { description: Template id is required }
        "401": { description: Not authenticated }
        "403":
          description: >-
            The caller neither created this template nor holds the
            `manage_setlist_templates` entitlement (the #1698 admin override,
            which is what makes a template whose author's account was erased
            manageable again) — or `is_public` was true without
            `publish_public_templates`. Nothing is changed.
        "404": { description: No such template }

  # ===========================================================================
  # ORGANISATIONS
  # ===========================================================================

  /api.php?action=organisation:
    get:
      operationId: organisationGet
      tags: [Organisations]
      summary: Fetch one organisation by id
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [organisation] }
        - name: id
          in: query
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Organisation detail (members, licences, parent)

  /api.php?action=organisation_create:
    post:
      operationId: organisationCreate
      tags: [Organisations]
      summary: Create a new organisation (owner becomes the caller)
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [organisation_create] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:        { type: string, example: "First Baptist Church" }
                parentOrgId: { type: integer, nullable: true, description: Parent org for nested hierarchy }
                description: { type: string }
      responses:
        "200":
          description: Created; returns the new org id
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  id: { type: integer }

  /api.php?action=my_organisations:
    get:
      operationId: myOrganisations
      tags: [Organisations]
      summary: Organisations the caller belongs to
      description: |
        Dormant: undocumented-as-such API-parity spillover — no web/Apple/Android
        client calls this today (orphan inventory §2.5, remediation X7). The
        endpoint is live and correct; it simply has no first-party caller yet.

        As of **#1830 §6.3**, each org additionally carries `logos` — an
        array of the org's ACTIVE logo rows (meta only, no image bytes: the
        print `logo` block resolves the actual bytes through
        `/org-logo.php` using `kind` + `v`). Gated dormant on
        `orgLogoTableExists()` (rule #19): the field is simply ABSENT on an
        un-migrated install, never an empty array — never null.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [my_organisations] }
      responses:
        "200":
          description: Caller's orgs with role per org
          content:
            application/json:
              schema:
                type: object
                properties:
                  organisations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:          { type: integer }
                        name:        { type: string }
                        slug:        { type: string }
                        parentOrgId: { type: integer, nullable: true }
                        description: { type: string, nullable: true }
                        licenceType: { type: string, nullable: true }
                        isActive:    { type: boolean }
                        memberRole:  { type: string, enum: [owner, admin, member], description: "The caller's own role in this org." }
                        logos:
                          type: array
                          description: Present only when the org-logo table exists (#1830). Absent, not empty/null, on an un-migrated install.
                          items:
                            type: object
                            properties:
                              kind:   { type: string, description: "One of IHYMNS_ORG_LOGO_KINDS (org_logo_helpers.php), e.g. primary/full/monochrome/favicon." }
                              variant: { type: string, nullable: true }
                              v:      { type: string, description: "Sha256 of the sanitised bytes — the /org-logo.php cache-busting version key." }
                              alt:    { type: string, nullable: true }
                              width:  { type: integer, nullable: true }
                              height: { type: integer, nullable: true }

  # ===========================================================================
