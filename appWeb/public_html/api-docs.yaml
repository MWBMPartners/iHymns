            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id:   { type: integer, example: 3 }
                        name: { type: string, example: "Two-column, no chords" }
                        blocks:
                          type: array
