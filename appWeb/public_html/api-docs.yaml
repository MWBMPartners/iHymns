openapi: 3.0.3

info:
  title: iHymns API
  version: "0.4001.0"
  description: |
    The iHymns API provides programmatic access to the iHymns hymn and song
    database. It powers the iHymns Progressive Web App (PWA), enabling song
    search, songbook browsing, setlist management, user authentication,
    favorites sync, offline PWA caching, and administrative operations.

    Most endpoints are served from a single PHP entry point (`api.php`) and are
    routed via the `action` query parameter. Responses are JSON unless otherwise
    noted. Three further surfaces share the action-query pattern:

    - The legacy admin **Editor API** (`/manage/editor/api.php`) — gated by the
      `/manage/` PHP session.
    - The granular **Editor API v2** (`/manage/editor/api2.php`, #1200) — a
      purpose-built, per-edit atomic editor backend that replaces the
      whole-song `save_song` race (#1178). Requires `isAuthenticated()` AND
      the `editor` role (`401`/`403` otherwise); every POST additionally
      requires the `X-Requested-With: XMLHttpRequest` same-origin header
      (NOT a session-token field — chosen to survive the cross-subdomain
      adopted-token admin session, #1307). `action` travels via query string
      on GET reads or JSON body on POST writes; two endpoints
      (`media_upload`, `import_file`/`import_zip`) are `multipart/form-data`.
      Every response is `{ok: bool, …}`; an unknown `action` is `400`; an
      uncaught error is `500 {ok:false,error,error_detail}` (`error_detail`
      admin-only). **Not yet broken out into individual paths below** (#1472
      — the `Editor API v2` tag was removed from the tag list as
      declared-but-unused; this paragraph is its only documentation until
      the per-action paths are added).
    - **Service Mode** (congregation Live-Follow, #1323/#1335) — the
      `service_*` action family on `api.php`. See the **Service Mode** tag.

    One non-action route exists: the gated media stream `GET /song-media/<id>`
    (#853, `<id>` = `tblSongMedia.Id`). Access is evaluated via **two gates**,
    both `403` on denial: (1) the entity gate, `checkContentAccess('song',
    <parent SongId>, …)` — an anonymous request degrades gracefully (gating
    applies as anonymous, never a hard `401`); and (2) as of **#1388**, a
    tier-capability gate, `contentGatingMediaAllowed($kind, $userId,
    $presenceToken)`, which stops a caller whose tier lacks the matching cap
    (`play_audio` / `download_midi` / `download_pdf`) from fetching the bytes
    directly even if the link were never shown to them. The tier gate's `403`
    body is deliberately generic ("Access restricted: gated content.") so it
    never discloses which tier would be sufficient. Both gates are **no-ops**
    while `content_gating_enabled='0'` (the default on every live env today),
    so this route is byte-identical to its pre-#1388 behaviour until an
    operator flips the flag. Supports HTTP `Range` / `206 Partial Content` for
    seekable audio. Kinds: `audio` (streamed inline), `sheet-music` (PDF),
    `midi`, `musicxml` (the last three served as downloads). **Not yet a
    documented path below** (#1472 — the `Media` tag was removed from the tag
    list as declared-but-unused; this paragraph is its only documentation
    until a path is added).

    ## Authentication

    Endpoints that require authentication accept either a Bearer token or the
    cross-subdomain session cookie:

    ```
    Authorization: Bearer <64-character hex token>
    ```

    or

    ```
    Cookie: ihymns_auth=<64-character hex token>
    ```

    The cookie is `Domain=.ihymns.app; HttpOnly; SameSite=Lax; Secure` so a
    single sign-in persists across `ihymns.app`, `dev.ihymns.app`, and
    `beta.ihymns.app`. Tokens are issued by `auth_login`,
    `auth_email_login_verify`, or `auth_register`, and carry a **sliding
    30-day expiry** — every authenticated request bumps the expiry by one
    day (at most once per 24h per token).

    Magic-link email sign-in (`auth_email_login_request` →
    `auth_email_login_verify`) is the primary path surfaced in the UI;
    username/password (`auth_login`) is the fallback.

    ## Entitlements

    Admin and editor endpoints are gated by **capabilities**, not just roles.
    The default mapping lives in `includes/entitlements.php` and can be
    overridden at runtime via `/manage/entitlements`. The `role` field on a
    user is still returned for compatibility, but authorisation uses the
    capability check internally.

    Separately, **access-tier gating capabilities** (the content caps that
    drive `access_tiers` + content gating) are registered in the `TIER_CAPS`
    map in `includes/access_tier_validation.php` (#1352). The 7 original caps
    (`CanViewLyrics`, `CanViewCopyrighted`, `CanPlayAudio`, `CanDownloadMidi`,
    `CanDownloadPdf`, `CanOfflineSave`, `RequiresCcli`) stay column-backed
    because their camelCase keys are the frozen native-app API contract. Every
    **new** gateable cap is a single line in `TIER_CAPS` with `storage 'json'` —
    stored as a named key inside the one `tblAccessTiers.Capabilities` JSON
    column, with **no schema change / no new column**. (Earlier docs said to
    "add a capability column" — that is now only true of the 7 grandfathered
    caps.)

    ## Rate Limiting

    **Write / auth throttle.** Song-request submissions, login, and the
    Service-Mode operator endpoints are throttled by
    `includes/rate_limit.php::checkRateLimit`, keyed by client IP or
    authenticated user ID. Song requests default to a configurable max per IP
    per day (default 5).

    **Read throttle (#1354).** The heavy public read endpoints are throttled by
    a separate fixed-window limiter, `includes/read_rate_limit.php::enforceReadRateLimit`.
    Each is keyed **per token-or-IP**: a `Bearer`/`ihymns_auth` 64-hex token
    hashes to its own bucket (`tok:<sha256>`), otherwise the bucket is the
    client `REMOTE_ADDR` (`ip:<addr>` — never `X-Forwarded-For`). Limits are
    deliberately generous (≈2–4 req/s sustained per device):

    | Action(s) | Limit |
    | --- | --- |
    | `search` | 120 / minute |
    | `songs_index` | 120 / minute |
    | `song_detail` / `song_data` | 240 / minute |
    | `related_songs` | 240 / minute |
    | `songbook_export` + `bulk_songs` + `bulk_audio` (shared `bulk` bucket) | 60 / minute combined |
    | `work` / `credit_person` | 120 / minute (or a per-key budget with a `catalogue:read` API key) |

    On exceed, the endpoint returns **429** with `Retry-After`,
    `X-RateLimit-Limit`, and `X-RateLimit-Window` headers (see the shared
    `RateLimited` response). The read limiter is **fail-open** — on an
    un-migrated install (no `tblReadRateLimit`) or any DB error, no limit is
    enforced. The token bucket is NOT validated against the sessions table
    (low-overhead, per-device), so a NAT-shared congregation is not collapsed
    to one bucket.

    ## Content gating (#1353)

    Content gating is **dormant by default** (`content_gating_enabled='0'`).
    When an operator turns it on, `song_data` / `song_detail` (and random-song)
    responses are filtered by the caller's access-tier capabilities: when the
    tier may not view the lyric body (or it is copyrighted and the tier lacks
    that capability) the `components` / `translations` / `annotations` /
    `vocalParts` are stripped and the song object gains `contentRestricted: true`
    + a `restrictionReason`. Disallowed `media` rows are dropped and
    `hasAudio` / `hasSheetMusic` forced false; `offlineAllowed` reflects the
    `offline_save` capability. With the flag off, the song object is returned
    byte-identical (no extra fields). See the `Song` schema's gated fields.

    ## Cross-platform consumers

    The API is the single contract for every iHymns client — the web/PWA
    today, plus the planned Apple (iOS / iPadOS / tvOS), Android (incl.
    FireOS), and smart-TV native apps. Native clients should:

    - Treat the schemas in this file as the canonical request / response
      shape; if the docs and the live API disagree, that is a bug — please
      raise it.
    - Send `Accept: application/json` and `Content-Type: application/json`
      on POST bodies. The server is forgiving about both, but explicit is
      cheaper to debug.
    - Carry the Bearer token (`Authorization: Bearer <token>`) rather than
      relying on cookies — cookies require running inside a WebView with
      cross-domain trust which native shells generally don't have.
    - Persist the token returned by `auth_login` /
      `auth_email_login_verify` / `auth_register` and refresh by re-issuing
      a login if it returns 401. The sliding 30-day expiry means an active
      user effectively never has to sign in again.
    - Cache the read-mostly payloads (`songs_json`, `songbooks`,
      `languages`, `tags`, `access_tiers`) and respect their `ETag` /
      `Last-Modified` if present; they change rarely but are large.

    ## Admin / curator surface — current API coverage

    Every read-side admin function (listing users / orgs / requests /
    revisions / restrictions / activity / songbook health) is exposed via
    the `admin_*` endpoints documented below. The mutation-side admin
    flows surface as concrete actions where it makes sense (e.g.
    `admin_song_request_update`, `admin_restriction_create`,
    `admin_set_user_tier`).

    The following **admin CRUD** flows are currently driven directly by
    the `/manage/*.php` PHP pages and are not yet exposed as standalone
    API endpoints — native admin clients that want feature parity with
    the web manage area will need them:

    - Songbook CRUD (create / update / delete / reorder) — driven by
      `manage/songbooks.php`.
    - Credit-people CRUD (add / edit / rename / merge / delete / view
      songs) — driven by `manage/credit-people.php`.
    - Access-tier CRUD (create / update / delete a tier definition) —
      driven by `manage/tiers.php`. (The `access_tiers` read-list and
      `admin_set_user_tier` write-assignment endpoints are exposed.)
    - Entitlement override management — driven by
      `manage/entitlements.php`.
    - User CRUD beyond role / tier assignment (create user, full profile
      edit, delete) — driven by `manage/users.php`.
    - User-group CRUD — driven by `manage/groups.php`.
    - Organisation CRUD beyond create / list — driven by
      `manage/organisations.php`. (`organisation_create`, `organisation`,
      `my_organisations`, `admin_organisations` are exposed.)

    These will be added to the API as native admin clients are built; the
    PHP page handlers are the design reference.
  contact:
    name: iHymns Support
    url: https://ihymns.app
  license:
    name: Proprietary
    url: https://ihymns.app/terms

servers:
  - url: https://ihymns.app
    description: Production
  - url: https://dev.ihymns.app
    description: Alpha channel (gated by `access_alpha` entitlement)
  - url: https://beta.ihymns.app
    description: Beta channel (gated by `access_beta` entitlement)
  # Kept (#1472 audit): still a real, live reference, not dead — the
  # cross-domain storage bridge's origin allow-list actively accepts
  # postMessage from any *.ihymns.net origin (appWeb/public_html/bridge.html
  # ALLOWED_ORIGINS regex `ihymns\.(app|net)`), and storage-bridge.js /
  # subdomain-sync.js both name ihymns.net alongside ihymns.app in their
  # cross-domain-sync comments.
  - url: https://beta.ihymns.net
    description: Legacy beta / dev

tags:
  - name: Songs
    description: Search, retrieve, and browse songs and songbooks
  - name: Languages
    description: Language metadata and song translations
  - name: Setlists
    description: Create, retrieve, and sync personal setlists
  - name: Setlists — Scheduling
    description: Schedule setlists for a date and list upcoming events (#398)
  - name: Setlists — Collaboration
    description: Invite collaborators, manage permissions, list shared setlists (#398)
  - name: Song Requests
    description: Submit and view community song requests
  - name: Favorites
    description: Server-synced user favorites
  - name: Authentication
    description: User registration, login, logout, and profile management
  - name: User Access
    description: Group-based access control and app status
  - name: Preferences
    description: Server-side preference sync across devices
  - name: Offline / PWA
    description: Bulk-fetch endpoints used by the service worker for offline caching
  - name: Discovery
    description: Tags, suggestions, related songs, popular songs
  - name: System
    description: |
      Unauthenticated operational endpoints intended for infrastructure
      (uptime monitors, load balancers) — distinct from the authenticated,
      curator-facing **Admin — Diagnostics** surface below.
  - name: Push
    description: Push-notification subscription endpoints
  - name: Notifications
    description: In-app notification delivery (#289) — list, mark read, header-bell badge count
  - name: Organisations
    description: Multi-tenant organisation membership and administration
  - name: Content Access
    description: Content-licence + restriction evaluation for gated songs / audio / sheet music
  - name: Licences
    description: Multi-licence, inheritance-aware resolution (#462) — effective-licence lookups for admin audit and self-service capability checks
  - name: Song Metadata
    description: Per-song data surfaces — history, key, writers, revisions
  - name: Lyrics
    description: Timed-lyrics (TTML) ingestion into the normalized lyric-line schema, for external pushers such as MeedyaDL
  - name: Pages
    description: |
      Rendered HTML fragments for SPA page-fragment hydration, routed via
      the `?page=<name>` query parameter (a separate dispatch from the
      `?action=<name>` JSON endpoints elsewhere in this file). The
      alternate-format bulk exports (CSV / XML / JSON / OpenSong /
      VideoPsalm) live under `?action=admin_export` (Admin — Maintenance
      tag) — see that tag's #1472 note.
  - name: Admin
    description: Administrative endpoints for user, group, and content management
  - name: Admin — Restrictions
    description: Content-restriction rule engine (tier / org / platform / licence)
  - name: Admin — Songbooks
    description: |
      Songbook curation surface (#719 PR 2a). CRUD parity with
      `/manage/songbooks` so native clients (iOS / iPadOS / tvOS / Android
      / FireOS) can manage hymnals without a webview. Validation is
      shared with the web admin via `includes/songbook_validation.php`,
      so a tweak to the abbreviation / colour / IETF BCP 47 grammar
      lands on both surfaces in one go.
  - name: Admin — Users
    description: |
      User CRUD parity (#719 PR 2b). Mirrors `/manage/users` so native
      clients can create / update / rename / role-change / activate /
      reset-password / delete user accounts. Mutations route through
      the helpers in `manage/includes/auth.php`, which write the
      canonical activity-log rows under `user.create`,
      `auth.role_change`, `auth.username_change`, `user.activate`,
      `user.deactivate`. Hierarchy gates mirror the web admin: an
      admin can never act on a peer or superior unless they're
      `global_admin`, never promote above their own level, never
      delete or deactivate their own account.
  - name: Admin — Groups
    description: |
      User-group CRUD parity (#719 PR 2b). Mirrors `/manage/groups`.
      Each user belongs to at most one group via `tblUsers.GroupId`;
      the `admin_group_member_*` endpoints toggle that FK.
  - name: Admin — Tiers
    description: |
      Access-tier CRUD parity (#719 PR 2b). Mirrors `/manage/tiers`.
      The capability registry (`TIER_CAPS`) lives in
      `includes/access_tier_validation.php` (#1352). A new gateable
      capability is a single `TIER_CAPS` line with `storage 'json'` —
      stored as a named key in the one `tblAccessTiers.Capabilities`
      JSON column, **no schema change / no new column** (the 7
      grandfathered caps remain column-backed as the frozen native-app
      contract). All four surfaces — web admin, `admin_tier_create` /
      `admin_tier_update`, the public `access_tiers` emit, and content
      gating — derive their cap list from `TIER_CAPS`.
  - name: Admin — Organisations
    description: |
      System-admin organisation CRUD parity (#719 PR 2c). Mirrors
      `/manage/organisations`. Existing `organisation_create` covers
      creation from any authenticated user (creator becomes owner);
      these endpoints add update / delete / member curation to
      complete the surface.
  - name: Org-admin
    description: |
      Org-admin endpoints (#719 PR 2c, #707, #726). Authenticated
      users who hold an `admin` or `owner` row in
      `tblOrganisationMembers` can manage their own org's members
      and licences without needing system-admin role. Row-level gate
      via `userCanActOnOrg()` in
      `includes/organisation_validation.php` — every endpoint
      refuses cross-org POSTs at the server side regardless of how
      the caller mounted the request.
  - name: Admin — Credit People
    description: |
      Credit-people CRUD parity (#719 PR 2d, #545). Catalogue-wide
      management of the people credited on songs across
      `tblSongWriters` / `tblSongComposers` / `tblSongArrangers` /
      `tblSongAdaptors` / `tblSongTranslators`. Helpers (link-type
      catalogue, IPI normaliser, flag-columns probe) live in
      `includes/credit_people_helpers.php` and are shared with
      `/manage/credit-people`.
  - name: Analytics
    description: |
      First-party, anonymous, consent-gated client analytics event
      ingestion (#1448, `analytics_ingest`). Distinct from **Admin —
      Analytics** below (which is curator-facing reporting reads) — this
      is the public write side the Apple app's analytics sink posts to.
  - name: Telemetry
    description: |
      Crash / error surfacing (#1582, `client_error_report`) — NOT
      consent-gated analytics. `js/modules/error-monitor.js` beacons a
      small, scrubbed JSON payload for every uncaught client-side
      exception or unhandled promise rejection, unconditionally (no
      opt-in), the same way a native crash reporter would. There is no
      new table and no new PII surface: the endpoint reuses the existing
      `logActivity()` write path and lands as `Action=client.jserror`
      rows in `tblActivityLog`, the same audit trail every other
      server-side action already writes to.
  - name: Admin — Analytics
    description: |
      Read-only analytics endpoints. Two of the three
      `/manage/analytics` panels are already covered by
      `popular_songs` (top_songs + top_books); this surface adds
      the search-query reporting needed for parity.
  - name: Admin — Diagnostics
    description: |
      Operational diagnostic read endpoints (#719 PR 2d). Mirror the
      payloads `/manage/data-health`, `/manage/schema-audit`, and
      `/manage/setup-database` render. Designed for tooling clients
      (CI, monitoring, dashboards) — pure read paths with no
      mutations. Schema-audit + migrations-status reuse the parser
      / scanner / comparer in `includes/schema_audit.php`.
  - name: Admin — Revisions
    description: Review pending song revisions
  - name: Admin — Maintenance
    description: Cleanup, export, and songbook-health utilities
  - name: Editor API
    description: |
      Admin-only endpoints under `/manage/editor/api.php`, protected by the
      /manage/ PHP session rather than a Bearer token. Used by the song
      editor SPA for per-song save, bulk tag, and revision history.
  - name: Live Follow
    description: |
      Host-led real-time multi-device follow (#1268) — the `live_follow_*`
      action family on `api.php`. A signed-in host starts a session and
      gets a short, human-typeable code; anonymous followers join with
      that code and short-poll for the host's current song/section/state.
      DB-relayed (`tblLiveFollowSessions`, `SessionKind='host'` implicitly
      — no `Channel`/venue scoping, unlike Service Mode below), short-poll
      over `StateRevision` rather than SSE/WebSockets (shared hosting
      can't hold a worker per follower). Host endpoints
      (`live_follow_create`, `_update`, `_heartbeat`, `_leave`) require
      auth + ownership (`HostUserId` match); `live_follow_join` /
      `live_follow_poll` are anonymous, gated only by the unguessable
      session code. Sessions auto-expire 4 hours after the last host
      heartbeat/update. Shares its `tblLiveFollowSessions` spine table
      with Service Mode, but is a separate, non-venue, non-anonymous-host
      feature — a native worship-leader "follow me" flow rather than a
      congregation-wide venue broadcast.
  - name: Service Mode
    description: |
      Congregation Live-Follow (#1323 / #1335) — congregants join a live
      service via a venue-displayed **rotating code** and follow the broadcast
      song in sync. The `service_*` action family on `api.php`.

      **Two audiences.** Operator endpoints (`service_session_start`,
      `service_code_rotate`, `service_code_current`, `service_session_end`,
      `service_broadcast`) require an authenticated org-operator
      (`global_admin` / `admin` / the session host / an org-admin of the
      session's org) — else `401` / `403`. Congregant endpoints
      (`service_join`, `service_poll`, `service_leave`) are **anonymous** —
      gated only by knowing the unguessable rotating code (join) or holding
      the opaque presence token (poll/leave).

      **Presence-token model.** The client mints a `presenceDeviceId`; on
      `service_join` the server mints an opaque 43-char `PresenceToken` (the
      hard-revocable gate key, hashed for rate-limit bucketing) bound to the
      session and expiring at the venue-local occurrence end (UTC). Anonymous
      polling is rate-limited **per presence token** (`tok:<hash>`, 40/min),
      not per IP, so a whole congregation behind one church-wifi IP each gets
      their own budget. Every query filters the `Channel` env discriminator
      (`alpha`/`beta`/`production`).

      **Dormancy.** The endpoints are always live, but the Phase-3 CCLI
      content-unlock they exist to drive has **no effect** until both
      `content_gating_enabled='1'` AND `require_licence:ccli` restriction rows
      exist — so the family is effectively dormant by default. (The older
      host-led `live_follow_*` family shares the spine tables but is a
      separate, non-anonymous, non-venue feature — #1268.)

paths:
  # ===========================================================================
  # SONGS
  # ===========================================================================

  /api.php?action=search:
    get:
      operationId: searchSongs
      tags: [Songs]
      summary: Search songs
      description: |
        Live MySQL full-text search across song titles, lyrics, writers, and
        composers. Queries of 3+ characters use FULLTEXT BOOLEAN mode with each
        term prefix-matched and required (e.g. `+amaz* +grac*`), broadening to
        ANY-term then writer/composer LIKE then SOUNDEX when a pass is empty;
        shorter queries use a LIKE scan. Curator-priority matches (alternative
        titles, scripture-reference tags) are prepended on the first page.
        Results are lightweight summaries; pass `offset` to page with the
        returned `hasMore` flag.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [search]
        - name: q
          in: query
          required: true
          description: Search query string
          schema:
            type: string
            minLength: 1
            example: amazing grace
        - name: songbook
          in: query
          required: false
          description: Filter results to a specific songbook abbreviation
          schema:
            type: string
            example: CP
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return per page
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Pagination offset; combine with the returned hasMore flag
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: lyrics
          in: query
          required: false
          description: |
            Search (and snippet) song bodies as well as titles — mirrors the
            public "search within lyrics" toggle. Defaults ON for direct API
            callers. Accepts 1/true/yes (on) or 0/false (off).
          schema:
            type: string
            enum: ["1", "0", "true", "false", "yes"]
            default: "1"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SongSummary"
                  total:
                    type: integer
                    description: Number of results on this page
                    example: 3
                  hasMore:
                    type: boolean
                    description: True when another page is available (use offset)
                    example: false
                  offset:
                    type: integer
                    description: The offset this page was served from
                    example: 0
                  query:
                    type: string
                    description: The search query that was executed
                    example: amazing grace
              example:
                results:
                  - id: CP-0202
                    number: 202
                    title: Amazing Grace
                    songbook: CP
                    songbookName: Christian Praise
                    writers: ["John Newton"]
                    hasAudio: false
                    hasSheetMusic: true
                total: 1
                hasMore: false
                offset: 0
                query: amazing grace
        "429":
          $ref: "#/components/responses/RateLimited"

  /api.php?action=search_num:
    get:
      operationId: searchByNumber
      tags: [Songs]
      summary: Search songs by number
      description: Search for songs by their number within a specific songbook.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [search_num]
        - name: songbook
          in: query
          required: true
          description: Songbook abbreviation
          schema:
            type: string
            example: MP
        - name: number
          in: query
          required: true
          description: Song number to search for
          schema:
            type: string
            example: "42"
      responses:
        "200":
          description: Matching songs
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SongSummary"
                  total:
                    type: integer

  /api.php?action=song_data:
    get:
      operationId: getSongData
      tags: [Songs]
      summary: Get full song data
      description: |
        Retrieve the complete data for a single song by its ID. Includes
        lyrics components (verses, choruses), writers, composers, and metadata.
        Supports flexible ID formats: `MP-1`, `MP-01`, `MP-001`, and `MP-0001`
        all resolve to the same song.

        **Content gating (#1353).** When `content_gating_enabled='1'` and the
        caller's access tier lacks the relevant capability, the returned `song`
        is filtered: `components` / `translations` / `annotations` /
        `vocalParts` stripped, `contentRestricted: true` + `restrictionReason`
        added, disallowed media dropped, `hasAudio` / `hasSheetMusic` forced
        false. With the flag off (default) the payload is unchanged. See the
        `Song` schema's gated fields.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [song_data]
        - name: id
          in: query
          required: true
          description: "Song ID in BOOK-NUMBER format (e.g., CP-0001)"
          schema:
            type: string
            example: CP-0001
        - name: include
          in: query
          required: false
          description: |
            (#1099) Opt-in comma-separated enrichment blocks for native/casting
            clients. Omitted = the base payload (back-compatible). Unknown blocks
            are ignored; a block is present only when the song actually has that
            data. Allow-list: `tune`, `media`, `arrangements`, `royaltyIds`,
            `scriptureRefs`, `vocalParts`, `translations`, `annotations`.
          schema:
            type: string
            example: tune,media,vocalParts,scriptureRefs
      responses:
        "200":
          description: Full song data (plus any requested + available include blocks)
          content:
            application/json:
              schema:
