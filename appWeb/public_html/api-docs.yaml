  /api.php?action=favorites_sync:
    post:
      operationId: syncFavorites
      tags: [Favorites]
      summary: Sync favorites
      description: |
        Reconcile local favorites with server-side storage (WS-G #1019).
        Behaviour depends on `mode`:
          * `replace` (default for per-edit auto-sync) — the client's list is
            authoritative: favourites absent from the payload are DELETED, so a
            removal on one device propagates; per-song tags are upserted.
          * `merge` (first-login backfill) — union: nothing is deleted.
        The payload accepts BOTH the legacy bare-id array and the tagged
        `{id, tags}` object form. A bare id leaves any existing server tags
        intact; a `{id, tags}` entry sets them. Maximum 500 favorites.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum: [favorites_sync]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorites]
              properties:
                mode:
                  type: string
                  enum: [replace, merge]
                  default: merge
                  description: >
                    'replace' deletes favourites absent from the payload;
                    'merge' only adds. Omitted → 'merge'.
                favorites:
                  type: array
                  description: >
                    Song IDs (legacy) or {id, tags} objects (preferred).
                  maxItems: 500
                  items:
                    oneOf:
                      - type: string
                        pattern: "^[A-Za-z]+-\\d+$"
                      - $ref: "#/components/schemas/FavoriteEntry"
                  example: [{ "id": "CP-0202", "tags": ["Easter"] }, "MP-0042"]
      responses:
        "200":
          description: Stored favorites as {id, tags} objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorites:
                    type: array
                    items:
                      $ref: "#/components/schemas/FavoriteEntry"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

