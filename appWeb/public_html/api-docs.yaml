        list only (ISRC identifies a specific RECORDING, which has no Work
        concept here). The code is canonicalised to the bare 12-character
        `CCXXXYYNNNNN` form with separators stripped, uppercased
        (`ihymns_canonical_isrc()`). An empty/missing/unmatched code renders
