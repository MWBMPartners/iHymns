  /api.php?action=admin_cleanup:
    post:
      operationId: adminCleanup
      tags: [Admin — Maintenance]
      summary: Run the token / activity-log cleanup sweep
      description: |
        Same routine as `appWeb/.sql/cleanup.php` — expires magic-link
        tokens, trims old `tblLoginAttempts`, and prunes the activity
        log. Safe to run from cron.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_cleanup] }
      responses:
        "200":
          description: Cleanup summary (counts per table)

  /api.php?action=admin_export:
    get:
      operationId: adminExport
      tags: [Admin — Maintenance]
      summary: Bulk-export every song in one of five formats (#314)
      description: |
        **#1472 correction:** this entry previously documented a `table`
        parameter and a "table CSV audit" export that does not exist
        anywhere in api.php. The real handler (api.php:7243-7401) exports
        **every** song (`tblSongs` joined with writers/composers) in the
        format named by `format`; there is no per-table selection.

        Requires `editor`, `admin`, or `global_admin` role. Streams the
        result as a download (`Content-Disposition: attachment`); the
        response content type and file shape depend on `format`:
        - `json` — `{songs: [...]}`, one object per song (id, number,
          title, songbook, songbookName, writers[], composers[],
          copyright, language, ccli, verified, hasAudio, hasSheetMusic).
        - `csv` — columns id, number, title, songbook, writers, composers,
          copyright, language (writers/composers `; `-joined).
        - `xml` — `<songs><song id="…">…</song></songs>`.
        - `opensong` — a `.zip` containing one OpenSong-format XML file
          per song (`<SongId>.xml`: title/author/copyright/ccli/lyrics).
        - `videopsalm` — `{Songs: [{Text, Author, Copyright, CCLI,
          Verses: [{Text}]}]}`, one entry per song.

        This is the single place these five formats are exposed — see
        the **Pages** tag's #1472 note for the five now-removed
        `?action=<format>` entries that used to fictionally document
        them as separate single-song-by-id public routes.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_export] }
        - name: format
          in: query
          required: false
          description: Export format. Defaults to `json` when omitted.
          schema:
            type: string
            enum: [json, csv, xml, opensong, videopsalm]
            default: json
      responses:
        "200":
          description: File download; shape/content-type depends on `format` (see above)
          content:
            application/json:
              schema: { type: object }
            text/csv:
              schema: { type: string }
            application/xml:
              schema: { type: string }
            application/zip:
              schema: { type: string, format: binary }
        "400":
          description: "Invalid format (not one of: json, csv, xml, opensong, videopsalm)"
        "403":
          description: Editor access required

  /api.php?action=admin_organisations:
    get:
      operationId: adminOrganisations
      tags: [Admin]
      summary: List every organisation (admin view)
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_organisations] }
      responses:
        "200":
          description: Org list with member counts + licence tier

  # ===========================================================================
  # ADMIN — ORGANISATIONS  (#719 PR 2c)
  # System-admin CRUD parity with /manage/organisations. The existing
  # organisation_create endpoint covers the create case; these complete
  # the update / delete / member curation surface.
  # ===========================================================================

  /api.php?action=admin_organisation_update:
    post:
      operationId: adminOrganisationUpdate
      tags: [Admin — Organisations]
      summary: Update an organisation (system-admin)
      description: |
        Mirrors the multi-licence sync from `/manage/organisations`:
        the submitted `additional_licences` set REPLACES
        `tblOrganisationLicences` for the org, with `licence_type`
        folded in so the primary + per-row views stay coherent.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_organisation_update] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrganisationUpdateInput"
      responses:
        "200":
          description: Organisation updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:             { type: boolean, example: true }
                  id:             { type: integer }
                  slug:           { type: string }
                  fields_changed:
                    type: array
                    items: { type: string }
        "400":
          description: Validation error (missing id/name/slug, parent loop, unknown licence_type)
        "403":
          description: Admin access required
        "404":
          description: Organisation not found
        "409":
          description: Slug already in use

  /api.php?action=admin_organisation_delete:
    post:
      operationId: adminOrganisationDelete
      tags: [Admin — Organisations]
      summary: Delete an organisation (system-admin)
      description: Refuses with 422 if any member is still listed OR any sub-org references it as parent.
      security:
        - bearerAuth: []
      parameters:
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [admin_organisation_delete] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
      responses:
        "200":
          description: Organisation deleted
        "400":
          description: Missing id
        "403":
          description: Admin access required
        "404":
          description: Organisation not found
        "422":
          description: |
            Refused — members or sub-orgs remain. Response includes
            either `member_count` or `child_count`, plus `name` and
            `hint`.

  /api.php?action=admin_organisation_member_add:
    post:
