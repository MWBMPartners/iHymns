# project.yml
#
# ELI5: The recipe XcodeGen reads to bake `iHymns.xcodeproj` from scratch
# every time. We never hand-edit the generated `.xcodeproj` (it's
# gitignored, see `.gitignore`) — we edit THIS file and re-run
# `Scripts/bootstrap.sh` (or `xcodegen generate` directly).
#
# DETAILED: Implements strategy §1.1's project topology: one Xcode project,
# three thin app shells (`iHymns` multiplatform, `iHymnsTV`, `iHymnsWatch`)
# plus a widgets extension, with ~90% of real code living in the local
# Swift package `Packages/iHymnsKit` instead of inside any Xcode target.
# XcodeGen was chosen over Tuist (heavier) and a hand-maintained `.pbxproj`
# (binary/plist-ish format, merge-hostile for an AI coding agent) precisely
# because this YAML is diffable and reviewable like any other source file
# (strategy §1.1). See https://github.com/yonaskolb/XcodeGen for the full
# spec this file is written against (XcodeGen 2.45.x, `ProjectSpec.md`).
name: iHymns

options:
  # Every target's group in the project navigator mirrors its folder
  # structure on disk (e.g. `Apps/iHymns/Sources/...`) instead of one flat
  # bucket — makes the generated project navigable without needing to
  # cross-reference this file.
  createIntermediateGroups: true
  # Keep Xcode's own "helpful" auto-settings scoped to what we explicitly
  # ask for — every build setting that matters is spelled out in
  # `Config/*.xcconfig` or below, not left to product/platform preset
  # guesswork.
  settingPresets: all

# One `.xcconfig` per configuration, shared by every target below (unless a
# target overrides a specific key in its own `settings:` block). See
# `Config/Shared.xcconfig`'s header comment for why `Versioning.xcconfig` is
# pulled in via an xcconfig `#include` rather than a second `configFiles`
# entry (XcodeGen only allows one xcconfig path per config here).
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

# The one local Swift package holding ~90% of the app's real code (strategy
# §1.2). `path` is relative to this file.
packages:
  iHymnsKit:
    path: Packages/iHymnsKit

targets:
  # MARK: - iHymns (iOS / iPadOS / macOS / visionOS)
  #
  # ELI5: One target, THREE platforms — Xcode's "multiplatform app" model
  # (Xcode 14+), not three copy-pasted targets. iPadOS isn't listed
  # separately: it's part of the `iOS` destination (the task brief's own
  # framing — "iPadOS is part of iOS").
  iHymns:
    type: application
    supportedDestinations: [iOS, macOS, visionOS]
    # `Apps/iHymns/Sources/PrivacyInfo.xcprivacy` (#1449, App Store privacy
    # manifest) lives INSIDE this `sources:` path — XcodeGen 2.45.x
    # auto-classifies a `.xcprivacy` file as a resource (verified: it lands
    # in this target's "Copy Bundle Resources" build phase, never
    # "Compile Sources") purely from its file extension, so no separate
    # `resources:` list entry is needed here. See that file's own header
    # for the full audit backing its declarations.
    sources:
      - path: Apps/iHymns/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ihymns
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iHymns
        # SwiftUI apps need no storyboard; this tells Xcode to synthesize
        # an empty `UILaunchScreen` entry so iOS doesn't refuse to launch
        # for want of a launch screen declaration.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # #184 (audio & sheet music) — `AVFoundationAudioPlaybackEngine`
        # (`IHFeatures/SongAudioPlaybackEngine.swift`) configures an
        # `AVAudioSession` `.playback` category, but that alone only keeps
        # audio alive while the app is FOREGROUND; surviving a screen
        # lock/backgrounding also needs this `UIBackgroundModes` capability
        # declared in Info.plist (Apple's own requirement — see "Enabling
        # Background Audio":
        # https://developer.apple.com/documentation/avfaudio/configuring-your-app-for-media-playback).
        # `INFOPLIST_KEY_<key>` build settings accept a space-separated list
        # for array-typed Info.plist keys (Xcode 13+), so a single value here
        # still produces the required one-element array. Harmless on the
        # macOS/visionOS destinations this same multiplatform target also
        # builds for — `UIBackgroundModes` is simply unused there.
        INFOPLIST_KEY_UIBackgroundModes: audio
    # #186 (Apple Phase 1, "Sharing & social") — claims Universal Links for
    # every host `DeepLinkRouter.allowedHosts` (`IHAppSupport`) resolves a
    # `DeepLink` from, so a tapped `https://ihymns.app/song/...`-shaped link
    # opens straight into this app instead of Safari when it's installed
    # (the AASA the OS checks before honouring this is already served
    # server-side, `.well-known/apple-app-site-association.php`, #1401 —
    # this entitlement is the missing app-side half). `activitycontinuation:`
    # mirrors the SAME hosts in the AASA's own `activitycontinuation` key —
    # Apple's documented requirement for "Handing off to your app from
    # Safari" (`.onContinueUserActivity(NSUserActivityTypeBrowsingWeb)`,
    # `IHymnsApp.swift`), the browsing-web half of this task's Handoff scope
    # (`SongDetailView.swift`'s `.userActivity` modifier advertises the
    # OTHER half — device-to-device continuation, which needs no entitlement
    # at all beyond both devices sharing an iCloud account).
    #
    # Deliberately NOT included: `webcredentials:` — the AASA already
    # advertises it (AutoFill offering the PWA's saved sign-in on this app's
    # login form), but wiring the entitlement is `LoginView`/native-auth's
    # concern (#182), not this sharing/deep-link task's; left for a future
    # pass rather than bundled in here unreviewed.
    #
    # Generated into the SAME gitignored `Apps/**/Generated/` location
    # `iHymnsWidgets`' own `info:` block below already establishes — never
    # hand-maintain a checked-in `.entitlements` file, edit THIS block.
    entitlements:
      path: Apps/iHymns/Generated/iHymns.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:ihymns.app
          - applinks:www.ihymns.app
          - applinks:beta.ihymns.app
          - applinks:dev.ihymns.app
          - activitycontinuation:ihymns.app
          - activitycontinuation:www.ihymns.app
          - activitycontinuation:beta.ihymns.app
          - activitycontinuation:dev.ihymns.app
    dependencies:
      # Every shell imports IHFeatures (shared screens/view models) and
      # IHDesign (tokens/glass wrappers) directly — both declared explicitly
      # even though IHFeatures already depends on IHDesign transitively, so
      # this target's own `import IHDesign` resolves without relying on
      # re-export behaviour. `IHAPI` is listed too (#1399) — `IHymnsApp.swift`
      # imports it directly for `APIEnvironment.dev` when building the real
      # `AppRootViewModel` via `AppRootViewModel.makeLive(environment:)`.
      # `IHAppSupport` is listed for the SAME reason (#186) — `IHymnsApp.swift`
      # calls `DeepLinkRouter.resolve(_:)` directly from its `.onOpenURL`/
      # `.onContinueUserActivity` handlers, which needs `IHAppSupport` as a
      # DIRECT product dependency of this target (SPM doesn't let a target
      # `import` a module it only pulls in transitively through another
      # product).
      - package: iHymnsKit
        products: [IHFeatures, IHDesign, IHAPI, IHAppSupport]
      # The watch companion and the widgets extension both embed into the
      # iOS binary specifically (Apple's own convention for a watch
      # companion / widget host) — `destinationFilters: [iOS]` keeps them
      # OUT of the macOS/visionOS variants of this multiplatform target,
      # which have no watch companion or widget host concept.
      - target: iHymnsWatch
        embed: true
        destinationFilters: [iOS]
      - target: iHymnsWidgets
        embed: true
        destinationFilters: [iOS]

  # MARK: - iHymnsTV (tvOS)
  #
  # Deliberately the SAME bundle id as `iHymns` — that's what makes this one
  # universal-purchase App Store listing rather than a second app (strategy
  # §1.1/§3.1).
  iHymnsTV:
    type: application
    platform: tvOS
    # `Apps/iHymnsTV/Sources/PrivacyInfo.xcprivacy` (#1449) — same
    # auto-bundled-as-a-resource mechanism the `iHymns` target's own
    # comment above documents; this shell's manifest is currently EMPTY
    # (see that file's header for why).
    sources:
      - path: Apps/iHymnsTV/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ihymns
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iHymns
        # #1442 — tvOS's own background-audio capability, the SAME
        # `UIBackgroundModes` key (not a tvOS-specific spelling) the
        # `iHymns` multiplatform target already declares for iOS/macOS/
        # visionOS above (#184). Apple documents tvOS as a supported
        # platform for this exact key/value pair ("Configuring your app
        # for media playback" —
        # https://developer.apple.com/documentation/avfaudio/configuring-your-app-for-media-playback
        # lists iOS/iPadOS/tvOS/visionOS together) precisely for the
        # "audio keeps playing after the user presses the TV/Home button to
        # switch away" case tvOS's Music/podcast-style apps rely on — a real
        # capability, not a no-op on this platform, so `SongAudioPlaybackEngine`'s
        # `.playback`-category `AVAudioSession` configuration (already
        # `#if os(tvOS)`-included, `SongAudioPlaybackEngine.swift`) now has
        # the matching Info.plist declaration it needs to actually survive
        # backgrounding here too, once a tvOS shell screen wires up
        # `SongMediaSection`/audio playback (still `PhaseZeroSkeletonView`
        # today — see `IHymnsTVApp.swift`).
        INFOPLIST_KEY_UIBackgroundModes: audio
    dependencies:
      - package: iHymnsKit
        products: [IHFeatures, IHDesign]

  # MARK: - iHymnsWatch (watchOS — embedded companion)
  #
  # Modern single-target watchOS app (no separate WatchKit Extension
  # target needed) — `WKApplication` marks it as launchable standalone.
  iHymnsWatch:
    type: application
    platform: watchOS
    # `Apps/iHymnsWatch/Sources/PrivacyInfo.xcprivacy` (#1449) — same
    # auto-bundled-as-a-resource mechanism the `iHymns` target's own
    # comment above documents; this shell's manifest is currently EMPTY
    # (see that file's header for why).
    sources:
      - path: Apps/iHymnsWatch/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ihymns.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iHymns
        INFOPLIST_KEY_WKApplication: YES
        # #1442 — watchOS's OWN background-modes key: `WKBackgroundModes`,
        # NOT `UIBackgroundModes` (the `iHymns`/`iHymnsTV` targets' key
        # above) — the two platforms use genuinely different Info.plist
        # keys for the same concept, which is exactly why #184 left this
        # target without ANY capability declared rather than guessing.
        # Apple's WatchKit "Preparing your WatchKit app to run in the
        # background" reference documents `audio` as a valid
        # `WKBackgroundModes` array value (alongside `location`/
        # `self-care`/`workout-processing`/…) specifically for a watch app
        # that keeps `AVAudioSession`-based playback going once the user
        # switches away from it — the SAME real, documented capability
        # `SongAudioPlaybackEngine.swift`'s already-`#if os(watchOS)`-included
        # `.playback` category configuration needs. `INFOPLIST_KEY_<key>`
        # (Xcode 13+) accepts a bare scalar for an array-typed key exactly
        # as the `iHymns` target's own `INFOPLIST_KEY_UIBackgroundModes: audio`
        # already relies on, producing the one-element `["audio"]` array
        # watchOS expects. No separate entitlement/capability is needed
        # beyond this Info.plist key — unlike, say, background location,
        # background audio on watchOS does not require a paired
        # `.entitlements` grant.
        INFOPLIST_KEY_WKBackgroundModes: audio
    dependencies:
      - package: iHymnsKit
        products: [IHFeatures, IHDesign]

  # MARK: - iHymnsWidgets (WidgetKit extension)
  #
  # A widget extension's `NSExtension` Info.plist entry is a NESTED
  # dictionary (`NSExtensionPointIdentifier`), which the simple
  # `INFOPLIST_KEY_*` flat build-setting mechanism can't express — so this
  # target uses XcodeGen's `info:` property to write a real (generated,
  # gitignored) `Info.plist` instead of `GENERATE_INFOPLIST_FILE`.
  iHymnsWidgets:
    type: app-extension
    platform: iOS
    # `Apps/iHymnsWidgets/Sources/PrivacyInfo.xcprivacy` (#1449) — same
    # auto-bundled-as-a-resource mechanism the `iHymns` target's own
    # comment above documents; a widget EXTENSION is its own bundle
    # (`.appex`), so it needs — and gets — its own manifest, not a copy of
    # the host app's. Currently EMPTY (see that file's header for why).
    sources:
      - path: Apps/iHymnsWidgets/Sources
    info:
      path: Apps/iHymnsWidgets/Generated/Info.plist
      properties:
        CFBundleDisplayName: iHymns Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ihymns.widgets
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      # The Phase-0 placeholder widget only needs design tokens; real
      # widgets (SOTD/favourites/resume, strategy §2.3) will add IHModels/
      # IHAPI/IHPersistence once they read real data in Phase 1.5.
      - package: iHymnsKit
        products: [IHDesign]
