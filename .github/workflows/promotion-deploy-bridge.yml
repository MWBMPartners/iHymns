#
# PURPOSE:
# Fire the SFTP deploy when a promotion PR is *merged* into `beta` or `main`.
# That is the WHOLE job again, as of #1963 — see "RELEASE TAGGING" below for
# where its other half went.
#
# WHY THIS EXISTS (#1007):
# deploy.yml triggers on `push` to main/beta/alpha. But the push produced by
# merging a promotion PR is suppressed by GitHub's GITHUB_TOKEN
# anti-recursion rule — the same trap documented in auto-merge-alpha.yml — so
# the promotion lands the code but the environment never deploys. PR #913
# (promote alpha → beta) hit exactly this: 0 workflow runs on beta after the
# merge, beta env left on the old build.
#
# auto-merge-alpha.yml already bridges this for `alpha` (its wait-and-dispatch
# step), but it explicitly covers ONLY alpha PRs — "PRs targeting main, beta,
# etc. are unaffected." This workflow is that missing bridge for beta/main.
#
# RELEASE TAGGING — RETIRED FROM THIS FILE (#1963, extending #1899):
# #1899 originally cut the `v<MAJOR>.<RELEASE>.0` release tag HERE, on every
# beta→main promotion, unconditionally — a promotion of nothing but a typo fix
# still minted a new MINOR, because nothing here ever looked at WHAT was being
# promoted. #1963 moves tag minting to deploy.yml, running on ALPHA, gated on
# a Conventional-Commits classifier (`classify-bump.sh`) that reads the
# commits since the last tag and only mints a new one when they actually
# contain a `feat` or a breaking change. The GitHub Release dispatch and the
# CHANGELOG "unreleased -> released" rollover moved with it — deploy.yml's own
# "Dispatch release.yml" and "Roll released changelog entries on alpha" steps
# are their new home. This file therefore no longer touches CHANGELOG.md,
# pushes a tag, or dispatches release.yml — it goes back to being exactly the
# #1007 deploy bridge it started as, for BOTH beta and main promotions alike
# (no more `base.ref == 'main'`-only branch in its own steps; deploy.yml on
# main still resolves + injects whatever the latest tag is, same as before).
#
# ⚠️ OPERATIONAL INVARIANT — promotion PRs MUST stay ancestry-preserving
# (merged with a real merge commit, NEVER squashed or rebased) or beta/main
# silently lose `v*` tag reachability. deploy.yml's "Resolve release anchor"
# step (the tag scheme's ONE anchor resolution, #1963) filters on
# `git tag -l --merged HEAD` — a tag stays visible to a branch only while it
# is an actual ancestor of that branch's tip. A SQUASH merge of a promotion PR
# rewrites the promoted commits onto a brand-new SHA that is not a descendant
# of alpha's tagged history, so every tag alpha ever minted stops being
# `--merged` beta/main's new HEAD — the anchor resolves to empty, and
# deploy.yml's injection step falls back to the dormant path (the committed
# Version.Number in infoAppVer.php, unchanged since the last hand-edit). The
# symptom is quiet, not a failure: the deploy still goes green, the site still
# serves, and the footer/settings page just shows a STALE version number
# indefinitely. This is exactly the "identity ≠ content" trap
# .claude/CLAUDE.md's commit/PR section already warns about for judging a
# squash-merged branch as absorbed — the same squash that makes `git cherry`
# lie about a branch's history makes `--merged` lie about a tag's reachability
# from a promoted branch. Promotion PRs already merge this way by convention;
# this note exists so a future change to that convention doesn't silently
# break versioning on beta/main with no red anywhere to catch it.
#
# HOW:
# On a *merged* PR into beta/main, dispatch deploy.yml for the base branch via
# `gh workflow run`. workflow_dispatch is one of the events a workflow IS
# allowed to trigger under GITHUB_TOKEN, so the dispatched deploy run executes
# normally (and still honours deploy.yml's own `vars.SFTP_ENABLED` kill
# switch + change detection, plus its own tag-anchor resolution described
# above).
#
# ACTIVATION NOTE:
# For `pull_request` events GitHub reads the workflow file from the PR's BASE
# branch. So this file must exist on `beta` and on `main` to fire for PRs
# merged into them. Per repo convention this lands on `alpha` first and
# reaches beta/main on the next promotion.
# =============================================================================

name: Promotion Deploy Bridge

on:
  pull_request:
    # `closed` fires after the merge button is clicked; the `merged` flag
    # (checked in the job `if`) distinguishes a real merge from a
    # closed-without-merge. `branches` here filters on the PR's BASE branch.
    types: [closed]
    branches:
      - beta
      - main

# `contents: read` (#1963 — was `write`): this workflow no longer pushes
# anything (the tag push, the rollover commit, both moved to deploy.yml on
# alpha) so it never needs write access to the repo contents. `actions: write`
# stays — the one remaining step still dispatches deploy.yml via
# `gh workflow run`, which requires it.
permissions:
  actions: write
  contents: read

# One dispatch in flight per target branch; don't cancel a running dispatch.
concurrency:
  group: promotion-deploy-bridge-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  dispatch-deploy:
    name: Dispatch deploy for merged promotion
    runs-on: ubuntu-latest
    # Only when the PR actually merged — a closed-without-merge is a no-op.
    if: github.event.pull_request.merged == true
    steps:
      # -----------------------------------------------------------------------
      # Dispatch deploy.yml for the base branch (#1007).
      #
      # This is now the ONLY step in this file (#1963 — see the header for
      # where the tag/release/rollover steps that used to sit here went). No
      # checkout is needed: dispatching by branch name doesn't require this
      # job to have the repo content locally at all, and deploy.yml's own
      # checkout (triggered by this dispatch) resolves its own release anchor
      # from ITS checkout, not from anything this job could have prepared.
      # -----------------------------------------------------------------------
      - name: Dispatch deploy.yml for the base branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "PR #${PR_NUMBER} merged into ${BASE_REF} — dispatching deploy.yml on ${BASE_REF}."
          gh workflow run deploy.yml --repo "$REPO" --ref "$BASE_REF"
          echo "::notice::Dispatched deploy.yml on ${BASE_REF} (promotion deploy bridge, #1007)."
