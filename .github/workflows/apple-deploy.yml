# Apple Deploy — TestFlight / App Store (#1400)
#
# Branch -> destination, per the owner's instruction (strategy §3.4/§4.4,
# owner runbook §G): push to `alpha` builds + uploads to TestFlight
# INTERNAL, push to `beta` uploads to TestFlight EXTERNAL, push to `main`
# uploads to the App Store. Pull requests only build + test (no signing, no
# upload) via the SAME `fastlane test` lane `.github/workflows/apple.yml`
# (#1395) already runs on the `feat/apple-universal` branch — this workflow
# is deliberately narrower: it exists ONLY to run the three signed/uploading
# lanes, on the three branches that matter for distribution.
#
# Uses the org's EXISTING GitHub Actions secrets — direct certificate import
# (`APPLE_CERTIFICATE` + `APPLE_CERTIFICATE_PASSWORD`) via
# `appApple/fastlane/Fastfile`, NOT `match` (owner instruction, #1400: no
# separate certificates repo). ASC upload auth is an App Store Connect API
# key built from `ASC_KEY_ID` / `ASC_ISSUER_ID` / `ASC_API_KEY`.
#
# VARIABLES:
#   vars.APPLE_DEPLOY_ENABLED — kill-switch (load-bearing; mirrors
#   deploy.yml's `vars.SFTP_ENABLED` idiom exactly). Must be the literal
#   string 'true' to let the "Build + upload (Fastlane)" job run fastlane
#   at all. Unset (the default — nothing in this repo sets it) means the
#   job is SKIPPED entirely on every branch: no archive, no TestFlight
#   upload, no App Store upload. This matters because an unguarded
#   `alpha`/`beta`/`main` push would otherwise upload to TestFlight-internal,
#   TestFlight-external, or the App Store respectively as a SIDE EFFECT of
#   an unrelated backend promotion once the SDK-install step below makes
#   the build actually succeed on the runner. The owner sets this via the
#   GitHub web UI — Settings → Secrets and variables → Actions → Variables
#   tab → New repository variable — only once ready for real
#   TestFlight/App Store traffic; this file never sets it itself. The
#   always-on `guard` job below posts a `::notice::` stating whether
#   uploads are enabled/disabled on every single run, so a skipped upload
#   is never mistaken for a completed one just because the workflow's
#   overall run still shows green (the `guard` job succeeding is enough to
#   make the run conclusion "success" even while `deploy` is skipped).
#
# NOTE (expected, not a bug): this workflow stays DORMANT — it has nothing
# to build — until the `feat/apple-universal` branch's work actually reaches
# `alpha` / `beta` / `main` (this native-app branch carries NO PRs yet, per
# strategy §0/§3.4). It lands now, in Phase 0, alongside the Fastlane lanes
# it calls, so the pipeline exists and is reviewable before it ever fires.
# It is ALSO gated OFF by `APPLE_DEPLOY_ENABLED` above regardless of branch
# reach, until the owner deliberately turns uploads on.
name: Apple Deploy

on:
  push:
    branches: [alpha, beta, main]
    paths:
      - 'appApple/**'
      # Doc-only commits must never fire a signed build (red-X noise on
      # every doc push) — negations MUST come after the positive
      # 'appApple/**' include in this list; GitHub Actions path filters
      # apply patterns in order and a negation before its positive would
      # have no effect.
      - '!appApple/dev-docs/**'
      - '!appApple/**/*.md'
      - '.github/workflows/apple-deploy.yml'
  workflow_dispatch:
    inputs:
      lane:
        description: "Fastlane lane to run — use 'auto' to follow the branch->lane mapping below"
        required: false
        type: choice
        options:
          - auto
          - alpha
          - beta
          - release

permissions:
  contents: read

# Only one deploy per branch at a time — a second push landing mid-upload
# should wait, not race the in-flight TestFlight/App Store submission.
concurrency:
  group: apple-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # GUARD — always runs, never fails the workflow. Posts a loud ::notice::
  # stating whether Apple Deploy uploads are enabled so a SKIPPED upload
  # (because APPLE_DEPLOY_ENABLED isn't 'true') can never be mistaken for a
  # completed one — the overall workflow run still shows green even when
  # `deploy` below is skipped, because this job succeeding is enough on its
  # own to make the run conclusion "success".
  # ===========================================================================
  guard:
    name: Deploy status guard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report Apple Deploy kill-switch status
        run: |
          if [ "${{ vars.APPLE_DEPLOY_ENABLED }}" = "true" ]; then
            echo "::notice::Apple Deploy uploads are ENABLED (repo Variable APPLE_DEPLOY_ENABLED=true) — the Build + upload (Fastlane) job WILL run for this push/dispatch and may upload to TestFlight or the App Store."
          else
            echo "::notice::Apple Deploy uploads are DISABLED — set repo Variable APPLE_DEPLOY_ENABLED=true (Settings -> Secrets and variables -> Actions -> Variables) to enable TestFlight/App Store uploads. The Build + upload (Fastlane) job will be SKIPPED for this push/dispatch — no build, no upload."
          fi

  deploy:
    name: Build + upload (Fastlane)
    runs-on: macos-26
    timeout-minutes: 60
    # Kill-switch (load-bearing — see the header comment's VARIABLES
    # section). Unset/anything other than the literal string 'true' means
    # this job is SKIPPED — no fastlane invocation, no build, no upload —
    # regardless of which of alpha/beta/main triggered the push. Mirrors
    # deploy.yml's `if: vars.SFTP_ENABLED == 'true'` idiom exactly.
    if: vars.APPLE_DEPLOY_ENABLED == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Pinned to the same OS-26 toolchain as apple.yml's CI build
          # (#1395) — Liquid Glass APIs require the OS 26 SDKs.
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | head -1)"
          xcodebuild -version

      # -- Install the platform runtimes this workflow actually archives --
      # This job (unlike apple.yml's CI, which only builds a macOS
      # destination) archives `generic/platform=iOS` (Fastfile's
      # `archive_scheme`, embedding Watch/Widgets) and `iHymnsTV` (tvOS) —
      # destinations whose SDKs are NOT preinstalled on the GitHub-hosted
      # macos-26 runner ("iOS 26.0 is not installed"). watchOS/visionOS are
      # included too: the Watch app embeds into the iOS archive and a
      # visionOS destination is one of the `iHymns` target's
      # `supportedDestinations` (project.yml), so all four keep this
      # workflow resilient to the same missing-SDK failure across every
      # destination it (or a near-future lane) might resolve.
      - name: Install required platform SDKs
        run: |
          sudo xcodebuild -downloadPlatform iOS
          sudo xcodebuild -downloadPlatform tvOS
          sudo xcodebuild -downloadPlatform watchOS
          sudo xcodebuild -downloadPlatform visionOS

      - name: Install tooling
        run: |
          brew install xcodegen
          gem install fastlane --no-document

      - name: Determine Fastlane lane
        id: lane
        run: |
          if [ -n "${{ github.event.inputs.lane }}" ] && [ "${{ github.event.inputs.lane }}" != "auto" ]; then
            echo "lane=${{ github.event.inputs.lane }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/alpha" ]; then
            echo "lane=alpha" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/beta" ]; then
            echo "lane=beta" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "lane=release" >> "$GITHUB_OUTPUT"
          else
            echo "error: no lane mapping for ${{ github.ref }} and no manual lane supplied" >&2
            exit 1
          fi

      - name: fastlane ${{ steps.lane.outputs.lane }}
        working-directory: appApple
        env:
          # Signing (direct cert import — see Fastfile header comment).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # App Store Connect API key (TestFlight/App Store upload auth).
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: fastlane ${{ steps.lane.outputs.lane }}

      - name: Upload build artifacts (.ipa)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-${{ steps.lane.outputs.lane }}-${{ github.sha }}
          path: appApple/fastlane/builds/
          retention-days: 30
          if-no-files-found: ignore
