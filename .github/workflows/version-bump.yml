#
# PURPOSE:
# Automatically bumps the semantic version number in infoAppVer.php
# when code is pushed to the `alpha` or `beta` branches.
#
# ALPHA WAS ADDED IN #1596. Before that this ran on `beta` only, and since
# nearly all work targets `alpha` the version stood still for long stretches —
# the consolidated batch (PR #1585) shipped 98 commits and 228 files under an
# unchanged 0.4000.0 and had to be bumped by hand (bad5ca4f, PR #1592).
#
# BUMP RULES (based on commit message):
#   - Contains "BREAKING CHANGE" or "!:" -> MAJOR bump (X.0.0)
#   - Starts with "feat("                -> MINOR bump (x.Y.0)
#   - Everything else                    -> PATCH bump (x.y.Z)
#
# The new version is written back to infoAppVer.php and committed with
# [skip ci] to prevent infinite workflow loops.
# =============================================================================

name: Version Bump

on:
  push:
    branches:
      - alpha
      - beta
    paths:
      - 'appWeb/**'
      - 'appApple/**'
      - 'appAndroid/**'
      - 'tools/**'
      - 'data/**'

# Cancel any in-progress version bump on the same branch
concurrency:
  group: version-bump-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  # Needed to dispatch deploy.yml after the bump (#1596). The bump commit
  # carries [skip ci], so nothing re-triggers a deploy on its own.
  actions: write

jobs:
  bump:
    name: Bump Semantic Version
    runs-on: ubuntu-latest

    # Skip if the triggering commit was itself a version bump (prevents loops)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout the repository
      # Uses GITHUB_TOKEN for push access; replace with a PAT if branch
      # protection rules require it
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Read the current version from infoAppVer.php
      # Parses the line: $app["Application"]["Version"]["Number"] = "X.Y.Z";
      # Also handles pre-release suffixes like '0.1.0-beta.1'
      # -----------------------------------------------------------------------
      - name: Read current version
        id: current
        run: |
          VERSION_FILE="appWeb/public_html/includes/infoAppVer.php"

          # Extract the version string from the PHP file
          # Matches: $app["Application"]["Version"]["Number"] = "X.Y.Z";
          CURRENT=$(grep -oP '\["Version"\]\["Number"\]\s*=\s*"\K[^"]+' "$VERSION_FILE")

          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read version from $VERSION_FILE"
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      # -----------------------------------------------------------------------
      # Step 3: Determine the bump type from the commit message
      # Uses Conventional Commits conventions:
      #   BREAKING CHANGE / !: -> major
      #   feat(              -> minor
      #   anything else      -> patch
      # -----------------------------------------------------------------------
      - name: Determine bump type
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -qiE 'BREAKING CHANGE|!\:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
            echo "Bump type: MAJOR"
          elif echo "$COMMIT_MSG" | grep -qE '^feat\('; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
            echo "Bump type: MINOR"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
            echo "Bump type: PATCH"
          fi

      # -----------------------------------------------------------------------
      # Step 4: Calculate the new version number
      # Strips any pre-release suffix (e.g., -alpha.1) before bumping,
      # then applies the appropriate increment
      # -----------------------------------------------------------------------
      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current.outputs.current }}"
          BUMP_TYPE="${{ steps.bump.outputs.type }}"

          # Strip pre-release suffix (everything after the first hyphen)
          BASE_VERSION=$(echo "$CURRENT" | sed 's/-.*//')

          # Split into major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION (was $CURRENT)"

      # -----------------------------------------------------------------------
      # Step 5: Write the new version back to infoAppVer.php
      # Uses sed to replace the version string in place
      # -----------------------------------------------------------------------
      - name: Update version in infoAppVer.php
        run: |
          VERSION_FILE="appWeb/public_html/includes/infoAppVer.php"
          OLD_VERSION="${{ steps.current.outputs.current }}"
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          echo "Updating $VERSION_FILE: $OLD_VERSION -> $NEW_VERSION"

          # Replace version in double-quoted PHP format:
          # $app["Application"]["Version"]["Number"] = "X.Y.Z";
          sed -i "s|\(\"Version\"\]\[\"Number\"\]\s*=\s*\"\)${OLD_VERSION}\"|\1${NEW_VERSION}\"|" "$VERSION_FILE"

          # Verify the update was applied
          grep 'Version.*Number' "$VERSION_FILE"

      # -----------------------------------------------------------------------
      # Step 6: Roll CHANGELOG.md's unreleased section into the new version
      #         (#1589)
      #
      # ELI5: everything that piled up under "unreleased" now belongs to the
      # version we just cut, so give it that version's name and start a fresh
      # empty "unreleased" heading above it for the next batch of work.
      #
      # WHY: `## [unreleased] — alpha` is append-only, and nothing ever closed
      # it. It grew to 70,627 bytes — larger, on its own, than the 48 KB budget
      # deploy.yml has for the whole What's New excerpt — so the public page
      # showed one enormous blob truncated mid-sentence and never reached a
      # second release (#1589). deploy.yml's extractor was reshaped to survive
      # that, but the real fix is upstream: bound the section. Every bump now
      # closes the open section, so no section can ever again accumulate more
      # than one release's worth of entries. That makes the page self-healing
      # — it gets tidier on its own, with no further intervention.
      #
      # The transform is a single, surgical line rewrite:
      #
      #     ## [unreleased] — alpha        ## [unreleased] — alpha
      #                              -->
      #     - entry                        ## [0.401.0] — 2026-07-29
      #     - entry
      #                                    - entry
      #                                    - entry
      #
      # deploy.yml keys on `^## ` — ANY two-hash heading — so this is safe by
      # construction: both the preserved heading and the inserted one match it.
      # The heading text is passed through the ENVIRONMENT rather than awk's
      # `-v` so the em dash (U+2014, —) travels as opaque bytes with no
      # escape-sequence processing; `-v` runs its value through awk's escape
      # parser, which is a needless risk for a string this load-bearing.
      # LC_ALL=C keeps the comparison byte-exact under gawk as well as mawk.
      # https://pubs.opengroup.org/onlinepubs/9699919799/utilities/awk.html
      #
      # IDEMPOTENCE — four guards, any of which SKIPS (never fails) the job:
      #   1. CHANGELOG.md must exist.
      #   2. Exactly ONE line must equal `## [unreleased] — alpha` verbatim.
      #      Matched case-sensitively with `grep -xF`: the file also contains
      #      historical `## [Unreleased]` and `## [Unreleased] - 2026-04-05`
      #      headings that a loose or case-insensitive match would hit.
      #   3. That section must contain at least one top-level `- ` entry.
      #      THIS is what makes a second run a no-op: the first run leaves the
      #      unreleased section empty, so a bump with nothing new under it
      #      rolls nothing and cannot emit a second, empty version heading.
      #   4. `## [<newversion>]` must not already exist (belt and braces
      #      against a re-run at the same version number).
      # The rewrite lands in a temp file and is only moved into place after
      # post-conditions are re-verified on that temp file: non-empty, exactly
      # one unreleased heading, exactly one new-version heading, and exactly
      # one more `## ` heading than before. A failed post-condition discards
      # the temp file and leaves CHANGELOG.md untouched — the version bump
      # itself must still land, so this step warns rather than fails.
      #
      # ALPHA ONLY, deliberately. On `beta`, changelog.yml regenerates and
      # pushes CHANGELOG.md in the same window (see the retry loop below), so
      # rolling here too would mean two workflows rewriting the top of the same
      # file concurrently — a rebase conflict, and a second heading for the
      # same release. The unreleased section is where alpha work accumulates
      # (the heading says so); beta inherits the rolled sections when alpha is
      # promoted, so nothing is lost by staying out of beta's way.
      # -----------------------------------------------------------------------
      - name: Roll unreleased changelog section into the new version
        id: changelog
        if: github.ref_name == 'alpha'
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          CHANGELOG_FILE="CHANGELOG.md"
          UNRELEASED_HEADING='## [unreleased] — alpha'
          RELEASE_HEADING="## [${NEW_VERSION}] — $(date -u +%Y-%m-%d)"
          export UNRELEASED_HEADING RELEASE_HEADING

          skip() {
            echo "$1"
            echo "rolled=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # -- Guard 1: the file exists ---------------------------------------
          [ -f "$CHANGELOG_FILE" ] || skip "No ${CHANGELOG_FILE} — nothing to roll."

          HEADINGS_BEFORE=$(grep -c '^## ' "$CHANGELOG_FILE" || true)

          # -- Guard 2: exactly one verbatim unreleased heading ---------------
          UNRELEASED_COUNT=$(grep -cxF "$UNRELEASED_HEADING" "$CHANGELOG_FILE" || true)
          if [ "$UNRELEASED_COUNT" != "1" ]; then
            skip "::warning::Expected exactly 1 '${UNRELEASED_HEADING}' heading, found ${UNRELEASED_COUNT} — leaving ${CHANGELOG_FILE} untouched."
          fi

          # -- Guard 3: the section has entries (the idempotence guard) -------
          ENTRY_COUNT=$(LC_ALL=C awk '
            $0 == ENVIRON["UNRELEASED_HEADING"] { inSection = 1; next }
            /^## / { if (inSection) exit }
            inSection && /^- / { n++ }
            END { print n + 0 }
          ' "$CHANGELOG_FILE")
          if [ "$ENTRY_COUNT" -eq 0 ]; then
            skip "Unreleased section is empty — nothing to roll into ${NEW_VERSION} (this is the expected no-op on a re-run)."
          fi

          # -- Guard 4: this version has not already been cut -----------------
          if grep -qF "## [${NEW_VERSION}]" "$CHANGELOG_FILE"; then
            skip "::warning::'## [${NEW_VERSION}]' already exists in ${CHANGELOG_FILE} — leaving it untouched."
          fi

          # -- The rewrite, into a temp file ----------------------------------
          TMP_CHANGELOG=$(mktemp)
          LC_ALL=C awk '
            !rolled && $0 == ENVIRON["UNRELEASED_HEADING"] {
              print $0                            # keep the open heading...
              print ""                            # ...blank line under it...
              print ENVIRON["RELEASE_HEADING"]    # ...then close the old batch
              rolled = 1
              next
            }
            { print }
          ' "$CHANGELOG_FILE" > "$TMP_CHANGELOG"

          # -- Post-conditions, verified on the temp file ---------------------
          HEADINGS_AFTER=$(grep -c '^## ' "$TMP_CHANGELOG" || true)
          NEW_UNRELEASED=$(grep -cxF "$UNRELEASED_HEADING" "$TMP_CHANGELOG" || true)
          NEW_RELEASE=$(grep -cxF "$RELEASE_HEADING" "$TMP_CHANGELOG" || true)

          if [ ! -s "$TMP_CHANGELOG" ] \
            || [ "$NEW_UNRELEASED" != "1" ] \
            || [ "$NEW_RELEASE" != "1" ] \
            || [ "$HEADINGS_AFTER" != "$((HEADINGS_BEFORE + 1))" ]; then
            rm -f "$TMP_CHANGELOG"
            skip "::warning::Changelog rollover failed its post-conditions (unreleased=${NEW_UNRELEASED}, release=${NEW_RELEASE}, headings ${HEADINGS_BEFORE}->${HEADINGS_AFTER}) — ${CHANGELOG_FILE} left untouched."
          fi

          mv "$TMP_CHANGELOG" "$CHANGELOG_FILE"
          echo "rolled=true" >> "$GITHUB_OUTPUT"
          echo "Rolled ${ENTRY_COUNT} unreleased entries into '${RELEASE_HEADING}' and reopened '${UNRELEASED_HEADING}'."

      # -----------------------------------------------------------------------
      # Step 7: Commit and push the version bump
      # Uses [skip ci] in the commit message to prevent triggering another run
      #
      # The changelog rollover from step 6 is staged in the SAME commit, not a
      # follow-up one (#1589/#1596): step 8 dispatches a deploy for THIS commit,
      # so a rollover left uncommitted here would never reach the server, and a
      # rollover committed afterwards would need a second deploy to ship. The
      # `chore: bump version` prefix is preserved because changelog.yml's
      # FILTER_OUT regex keys on it to keep these commits out of generated
      # changelogs.
      # -----------------------------------------------------------------------
      - name: Commit version bump
        env:
          BRANCH: ${{ github.ref_name }}
          ROLLED: ${{ steps.changelog.outputs.rolled }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add appWeb/public_html/includes/infoAppVer.php

          COMMIT_MSG="chore: bump version to ${NEW_VERSION} [skip ci]"
          if [ "$ROLLED" = "true" ]; then
            git add CHANGELOG.md
            COMMIT_MSG="chore: bump version to ${NEW_VERSION} and roll changelog [skip ci]"
          fi

          git commit -m "$COMMIT_MSG"

          # Retry on non-fast-forward rejection — the changelog workflow runs
          # in parallel and may push to the same branch first.
          #
          # A failed rebase leaves the worktree mid-rebase, where every
          # subsequent push in this loop is meaningless — so abort it and fail
          # loudly instead of burning the remaining attempts against a
          # conflicted tree. (Relevant since #1589: this commit can now touch
          # CHANGELOG.md, which other workflows also write.)
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing on origin/${BRANCH} and retrying"
            git fetch origin "${BRANCH}"
            if ! git rebase "origin/${BRANCH}"; then
              git rebase --abort || true
              echo "::error::Rebase onto origin/${BRANCH} conflicted — version bump not pushed."
              exit 1
            fi
            sleep $((attempt * 2))
          done

          echo "::error::Failed to push version bump after 5 attempts"
          exit 1

      # -----------------------------------------------------------------------
      # Step 8: Deploy the bumped version (#1596)
      #
      # ELI5: the bump has to actually reach the server, or the site keeps
      # showing the old number.
      #
      # The commit above carries [skip ci], which GitHub honours by skipping
      # EVERY workflow for that commit — deploy.yml included. That is what we
      # want for lint / tests / actionlint / changelog (there is no value in
      # re-running them for a one-line version string), but it means the bump
      # would otherwise never ship: the repo would say N+1 while the server
      # served N, permanently one merge behind. That gap is not cosmetic —
      # infoAppVer.php drives the service-worker cache version (#81) and every
      # ?v= cache-buster, so a bump that never deploys never invalidates a
      # stale client cache, which is the main reason to bump at all.
      #
      # So we dispatch the deploy explicitly. deploy.yml gained a per-branch
      # concurrency group with cancel-in-progress: false in #1595, so this
      # QUEUES behind the merge-triggered deploy rather than running a second
      # `lftp --delete` mirror against the same docroot at the same time.
      # #1595 is a hard prerequisite for this step, not a nicety.
      #
      # Non-fatal on failure: a missed deploy is recoverable (the next push
      # carries the version), whereas failing the job here would leave a
      # successful bump reported as a red run.
      # https://cli.github.com/manual/gh_workflow_run
      - name: Deploy the bumped version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          echo "Dispatching deploy.yml for ${BRANCH} at ${NEW_VERSION}"

          if gh workflow run deploy.yml --ref "${BRANCH}"; then
            echo "Deploy dispatched."
          else
            echo "::warning::Could not dispatch deploy.yml — ${BRANCH} is bumped to ${NEW_VERSION} in git but the server still serves the previous version until the next push."
          fi
