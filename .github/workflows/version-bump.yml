#
# PURPOSE:
# Automatically bumps the semantic version number in infoAppVer.php
# when code is pushed to the `alpha` or `beta` branches.
#
# ALPHA WAS ADDED IN #1596. Before that this ran on `beta` only, and since
# nearly all work targets `alpha` the version stood still for long stretches —
# the consolidated batch (PR #1585) shipped 98 commits and 228 files under an
# unchanged 0.4000.0 and had to be bumped by hand (bad5ca4f, PR #1592).
#
# BUMP RULES (based on commit message):
#   - Contains "BREAKING CHANGE" or "!:" -> MAJOR bump (X.0.0)
#   - Starts with "feat("                -> MINOR bump (x.Y.0)
#   - Everything else                    -> PATCH bump (x.y.Z)
#
# The new version is written back to infoAppVer.php and committed with
# [skip ci] to prevent infinite workflow loops.
# =============================================================================

name: Version Bump

on:
  push:
    branches:
      - alpha
      - beta
    paths:
      - 'appWeb/**'
      - 'appApple/**'
      - 'appAndroid/**'
      - 'tools/**'
      - 'data/**'

# Cancel any in-progress version bump on the same branch
concurrency:
  group: version-bump-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  # Needed to dispatch deploy.yml after the bump (#1596). The bump commit
  # carries [skip ci], so nothing re-triggers a deploy on its own.
  actions: write

jobs:
  bump:
    name: Bump Semantic Version
    runs-on: ubuntu-latest

    # Skip if the triggering commit was itself a version bump (prevents loops)
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout the repository
      # Uses GITHUB_TOKEN for push access; replace with a PAT if branch
      # protection rules require it
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Read the current version from infoAppVer.php
      # Parses the line: $app["Application"]["Version"]["Number"] = "X.Y.Z";
      # Also handles pre-release suffixes like '0.1.0-beta.1'
      # -----------------------------------------------------------------------
      - name: Read current version
        id: current
        run: |
          VERSION_FILE="appWeb/public_html/includes/infoAppVer.php"

          # Extract the version string from the PHP file
          # Matches: $app["Application"]["Version"]["Number"] = "X.Y.Z";
          CURRENT=$(grep -oP '\["Version"\]\["Number"\]\s*=\s*"\K[^"]+' "$VERSION_FILE")

          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read version from $VERSION_FILE"
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT"

      # -----------------------------------------------------------------------
      # Step 3: Determine the bump type from the commit message
      # Uses Conventional Commits conventions:
      #   BREAKING CHANGE / !: -> major
      #   feat(              -> minor
      #   anything else      -> patch
      # -----------------------------------------------------------------------
      - name: Determine bump type
        id: bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -qiE 'BREAKING CHANGE|!\:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
            echo "Bump type: MAJOR"
          elif echo "$COMMIT_MSG" | grep -qE '^feat\('; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
            echo "Bump type: MINOR"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
            echo "Bump type: PATCH"
          fi

      # -----------------------------------------------------------------------
      # Step 4: Calculate the new version number
      # Strips any pre-release suffix (e.g., -alpha.1) before bumping,
      # then applies the appropriate increment
      # -----------------------------------------------------------------------
      - name: Calculate new version
        id: new_version
        run: |
          CURRENT="${{ steps.current.outputs.current }}"
          BUMP_TYPE="${{ steps.bump.outputs.type }}"

          # Strip pre-release suffix (everything after the first hyphen)
          BASE_VERSION=$(echo "$CURRENT" | sed 's/-.*//')

          # Split into major.minor.patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION (was $CURRENT)"

      # -----------------------------------------------------------------------
      # Step 5: Write the new version back to infoAppVer.php
      # Uses sed to replace the version string in place
      # -----------------------------------------------------------------------
      - name: Update version in infoAppVer.php
        run: |
          VERSION_FILE="appWeb/public_html/includes/infoAppVer.php"
          OLD_VERSION="${{ steps.current.outputs.current }}"
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          echo "Updating $VERSION_FILE: $OLD_VERSION -> $NEW_VERSION"

          # Replace version in double-quoted PHP format:
          # $app["Application"]["Version"]["Number"] = "X.Y.Z";
          sed -i "s|\(\"Version\"\]\[\"Number\"\]\s*=\s*\"\)${OLD_VERSION}\"|\1${NEW_VERSION}\"|" "$VERSION_FILE"

          # Verify the update was applied
          grep 'Version.*Number' "$VERSION_FILE"

      # -----------------------------------------------------------------------
      # Step 6: Commit and push the version bump
      # Uses [skip ci] in the commit message to prevent triggering another run
      # -----------------------------------------------------------------------
      - name: Commit version bump
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add appWeb/public_html/includes/infoAppVer.php
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"

          # Retry on non-fast-forward rejection — the changelog workflow runs
          # in parallel and may push to the same branch first.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${BRANCH}"; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing on origin/${BRANCH} and retrying"
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
            sleep $((attempt * 2))
          done

          echo "::error::Failed to push version bump after 5 attempts"
          exit 1

      # -----------------------------------------------------------------------
      # Step 7: Deploy the bumped version (#1596)
      #
      # ELI5: the bump has to actually reach the server, or the site keeps
      # showing the old number.
      #
      # The commit above carries [skip ci], which GitHub honours by skipping
      # EVERY workflow for that commit — deploy.yml included. That is what we
      # want for lint / tests / actionlint / changelog (there is no value in
      # re-running them for a one-line version string), but it means the bump
      # would otherwise never ship: the repo would say N+1 while the server
      # served N, permanently one merge behind. That gap is not cosmetic —
      # infoAppVer.php drives the service-worker cache version (#81) and every
      # ?v= cache-buster, so a bump that never deploys never invalidates a
      # stale client cache, which is the main reason to bump at all.
      #
      # So we dispatch the deploy explicitly. deploy.yml gained a per-branch
      # concurrency group with cancel-in-progress: false in #1595, so this
      # QUEUES behind the merge-triggered deploy rather than running a second
      # `lftp --delete` mirror against the same docroot at the same time.
      # #1595 is a hard prerequisite for this step, not a nicety.
      #
      # Non-fatal on failure: a missed deploy is recoverable (the next push
      # carries the version), whereas failing the job here would leave a
      # successful bump reported as a red run.
      # https://cli.github.com/manual/gh_workflow_run
      - name: Deploy the bumped version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.version }}"
          echo "Dispatching deploy.yml for ${BRANCH} at ${NEW_VERSION}"

          if gh workflow run deploy.yml --ref "${BRANCH}"; then
            echo "Deploy dispatched."
          else
            echo "::warning::Could not dispatch deploy.yml — ${BRANCH} is bumped to ${NEW_VERSION} in git but the server still serves the previous version until the next push."
          fi
