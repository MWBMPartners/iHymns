# Apple CI — native app build + quality gates (#1395)
#
# Runs on the Apple branch + PRs that touch appApple/. Proves the skeleton
# stays green: quality gates -> SwiftLint -> package tests -> generate + build.
# No signing (build only). Deploy to TestFlight/App Store is a SEPARATE workflow
# (apple-deploy.yml, #1400) triggered on alpha/beta/main.
name: Apple CI

on:
  push:
    branches: [feat/apple-universal]
    paths:
      - 'appApple/**'
      # Doc-only commits must not fire this CI build either — negations
      # MUST come after the positive 'appApple/**' include (GitHub Actions
      # path filters apply patterns in order; see apple-deploy.yml's own
      # copy of this comment for the full rationale).
      - '!appApple/dev-docs/**'
      - '!appApple/**/*.md'
      - '.github/workflows/apple.yml'
  pull_request:
    paths:
      - 'appApple/**'
      - '!appApple/dev-docs/**'
      - '!appApple/**/*.md'
  workflow_dispatch:

concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          # Pin to an installed Xcode 26 toolchain (OS 26 SDKs = Liquid Glass).
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | head -1)" || true
          xcodebuild -version
          swift --version

      - name: Install tooling
        run: brew install xcodegen swiftlint

      - name: Quality gates (LOC budget + no-secrets + privacy manifest)
        run: |
          bash appApple/Scripts/loc-budget.sh
          bash appApple/Scripts/no-secrets-grep.sh
          # #1451 — fails if a required-reason API (UserDefaults, file
          # timestamp, disk space, system boot time, active keyboard) is
          # used without a matching PrivacyInfo.xcprivacy declaration.
          bash appApple/Scripts/privacy-manifest-guard.sh

      - name: SwiftLint
        run: swiftlint --config appApple/.swiftlint.yml appApple

      # `--no-parallel` is LOAD-BEARING on CI (#1558). Swift Testing runs
      # different `@Suite` types CONCURRENTLY by default, and several suites
      # (`KeychainLANRemotePairingAuthority`, `KeychainPairedTVStore`,
      # `IHRPFrameOrderingTests`) all drive the real macOS Keychain via
      # `LANRemoteIdentityFactory`. Under concurrent load the Keychain daemon
      # intermittently returns `errSecItemNotFound` (-25300) —
      # `keychainBridgeFailed(status: -25300)` — on an entitlement-less,
      # unsigned `swift test` binary that has no unlocked login keychain.
      #
      # This is an ENVIRONMENT artifact, not a logic defect: each suite passes
      # in isolation, and the real signed app builds its identity fine. The
      # per-suite `.serialized` traits those suites already carry only stop a
      # suite's own tests overlapping EACH OTHER — not another suite's, which
      # is exactly what #1558 documents.
      #
      # It had become the dominant CI failure — 2 of 3 runs on PR #1585 —
      # blocking otherwise-green PRs and training reviewers to ignore a red
      # Apple build, which is the more expensive problem. Serial execution
      # trades ~40s of wall-clock for a deterministic result.
      #
      # This does NOT address #1559's `ProjectionViewModelTests` "latest-wins"
      # race, which that issue records as failing serially too; that one needs
      # a real fix in the test's own ordering guard.
      # https://developer.apple.com/documentation/swift-testing/parallelization
      - name: iHymnsKit package tests
        working-directory: appApple/Packages/iHymnsKit
        run: swift test --no-parallel

      - name: Generate Xcode project
        working-directory: appApple
        run: xcodegen generate

      - name: Build (macOS destination — proves the skeleton)
        working-directory: appApple
        run: |
          xcodebuild \
            -project iHymns.xcodeproj \
            -scheme iHymns \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # #1422 (PR-7) shipped the first `#if os(iOS)`-only IHFeatures UI
      # (`PairingScanView.swift`), and #1549 made the whole IHFeatures target
      # compile for watchOS too (the embedded `iHymnsWatch` app links it).
      # We verify BOTH with fast PACKAGE cross-compiles against the iOS- and
      # watchOS-Simulator SDKs — deliberately NOT the full `iHymns` app scheme.
      # That scheme embeds `iHymnsWatch` (`project.yml` `embed: true,
      # destinationFilters: [iOS]`), so an iOS-Simulator app build REQUIRES the
      # watchOS *platform runtime* installed on the runner (not just the SDK) —
      # "watchOS 26.0 must be installed in order to run the scheme" — i.e. a
      # ~15 GB `xcodebuild -downloadPlatform` on top of iOS's, for a check that
      # isn't required (#1526). (#1549 originally re-enabled the app-scheme iOS
      # build here and it went red on every appApple PR for exactly this reason
      # — fixed forward to package cross-compiles.) A `swift build`
      # cross-compile needs only the SDK (always present on the macos-26
      # runner), covers the exact iOS-only + watchOS code paths, and runs in
      # seconds. The macOS app-scheme build above proves the app links; the
      # iOS/watch embed is a stable project-config concern (verified locally +
      # on the deploy pipeline).
      - name: Build iHymnsKit for iOS Simulator (proves the iOS-only UI, #1422/#1549)
        working-directory: appApple/Packages/iHymnsKit
        run: |
          swift build \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -Xswiftc -target -Xswiftc arm64-apple-ios26.0-simulator

      - name: Build iHymnsKit for watchOS Simulator (proves the watch compiles, #1549)
        working-directory: appApple/Packages/iHymnsKit
        run: |
          swift build \
            --sdk "$(xcrun --sdk watchsimulator --show-sdk-path)" \
            -Xswiftc -target -Xswiftc arm64-apple-watchos26.0-simulator

      # The generic tvOS-Simulator destination below needs the tvOS 26.0
      # platform, which is NOT preinstalled on the GitHub-hosted macos-26
      # runner ("tvOS 26.0 is not installed. Please download and install the
      # platform from Xcode > Settings > Components") — the macOS build above
      # works because the macOS SDK is always present. Same fix apple-deploy.yml
      # applies for the platforms IT archives; here only tvOS is needed (#1504).
      - name: Install tvOS platform (runner ships without it, #1504)
        run: sudo xcodebuild -downloadPlatform tvOS

      - name: Build (tvOS Simulator destination — proves the projection shell, #1504)
        working-directory: appApple
        run: |
          xcodebuild \
            -project iHymns.xcodeproj \
            -scheme iHymnsTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
