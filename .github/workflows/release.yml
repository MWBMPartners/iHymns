#
# PURPOSE:
# Creates a GitHub Release for a version tag (v*). TWO triggers (#1899):
#   - `on: push: tags: v*` — a HUMAN-pushed tag fires this directly.
#   - `workflow_dispatch` — promotion-deploy-bridge.yml (the tag MINTER at every
#     beta→main promotion) dispatches this ON THE TAG REF, because a
#     GITHUB_TOKEN-pushed tag does NOT fire `on: push` (anti-recursion, the same
#     trap the bridge itself exists for). On a `--ref v1.2.0` dispatch,
#     github.ref_name IS the tag, so every step below works unchanged.
# - Extracts the release notes from CHANGELOG.md for the tagged version, falling
#   back to the `## [unreleased] — alpha` section (which at the tagged main
#   commit holds exactly this release's entries — the rollover commit lands on
#   ALPHA, not main).
# - Marks tags containing "-beta" or "-rc" as pre-releases.
#
# ⚠️ KNOWN ONE-TIME (baseline (a) v1.0.0, #1899 §2): CHANGELOG.md carries a
# DEAD-scheme `## [1.0.0] — 2026-04-06` section, so for the FIRST release only,
# the version-specific match below finds those historical notes instead of
# falling through to the unreleased section. The Release is still created; its
# notes just need a one-time manual edit (or paste from the run log). Every
# later release (v1.1.0, v1.2.0, …) has no such collision and needs no edit.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'          # a HUMAN-pushed tag still fires this directly
  workflow_dispatch: {} # promotion-deploy-bridge dispatches on the tag ref —
                        # a GITHUB_TOKEN tag push cannot fire `on: push` (#1899)

# Cancel any in-progress release for the same tag
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository to access CHANGELOG.md and assets
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Extract the version number from the tag
      # Strips the leading 'v' prefix (e.g., v1.2.3 -> 1.2.3)
      # -----------------------------------------------------------------------
      - name: Extract version from tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, Version: $VERSION"

      # -----------------------------------------------------------------------
      # Step 3: Determine if this is a pre-release
      # Tags containing "-beta" or "-rc" are marked as pre-releases
      # -----------------------------------------------------------------------
      - name: Check for pre-release
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if echo "$TAG" | grep -qiE '\-beta|\-rc'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "This is a pre-release."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "This is a stable release."
          fi

      # -----------------------------------------------------------------------
      # Step 4: Extract release notes from CHANGELOG.md
      # Finds the section matching this version and extracts all content until
      # the next version heading. If no `## [<version>]` section exists yet
      # (the normal case for a fresh bridge-cut tag — the rollover commit lands
      # on ALPHA, not on the tagged main commit), fall back to the
      # `## [unreleased] — alpha` section, which at the tagged commit holds
      # exactly this release's entries. The fallback matches LOWERCASE
      # `[unreleased]` only, so historical `## [Unreleased]` headings never
      # match (#1899).
      # -----------------------------------------------------------------------
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          CHANGELOG="CHANGELOG.md"
          NOTES_FILE="/tmp/release_notes.md"

          if [ ! -f "$CHANGELOG" ]; then
            echo "No CHANGELOG.md found. Using default release notes."
            echo "Release ${VERSION}" > "$NOTES_FILE"
          else
            # Extract the section for this version
            # Matches from "## [VERSION]" to the next "## [" or end of file
            python3 -c "
          import re, sys

          version = '${VERSION}'
          with open('${CHANGELOG}', 'r') as f:
              content = f.read()

          # Escape dots in version for regex
          escaped = re.escape(version)
          pattern = rf'## \[{escaped}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)

          if not match:
              # Fallback: the unreleased section (which at the tagged main commit
              # holds exactly this release's entries — the rollover lands on
              # alpha, not main). Lowercase '[unreleased]' ONLY — a historical
              # '## [Unreleased]' (capital U) must not match (#1899).
              pattern = r'## \[unreleased\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)

          if match:
              notes = match.group(1).strip()
              print(notes)
          else:
              print(f'Release {version}')
          " > "$NOTES_FILE"
          fi

          echo "Release notes:"
          cat "$NOTES_FILE"

          # Store the path for the next step
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Step 5: Create the GitHub Release
      # Uses the gh CLI to create the release with extracted notes.
      # #1630 — this used to also attach data/songs.json as a release asset,
      # republishing the stale corpus publicly on every tag. Removed with
      # the file itself (#1617); MySQL is the only source of truth now.
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PRERELEASE="${{ steps.prerelease.outputs.is_prerelease }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"

          # Build the gh release command
          GH_ARGS=(
            "release" "create" "$TAG"
            "--title" "iHymns $TAG"
            "--notes-file" "$NOTES_FILE"
          )

          # Mark as pre-release if applicable
          if [ "$PRERELEASE" = "true" ]; then
            GH_ARGS+=("--prerelease")
          fi

          echo "Creating release: gh ${GH_ARGS[*]}"
          gh "${GH_ARGS[@]}"

          echo "Release $TAG created successfully."
