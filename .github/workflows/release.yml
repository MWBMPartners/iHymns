#
# STATUS (#1965, owner directive): iHymns deploys DIRECT VIA SFTP. There is
# no GitHub Releases-driven rollout anywhere in this project's toolchain, and
# the tag-free committed-anchor versioning scheme deploy.yml now runs
# (replacing #1963's git-tag scheme — see deploy.yml's own "COMMITTED-ANCHOR
# VERSIONING" header) cuts NO git tags and dispatches this workflow NOWHERE.
# This file is therefore DORMANT in normal operation: nothing in CI ever
# triggers it. It fires ONLY if a human deliberately pushes a `v*` tag by
# hand, or runs it via `workflow_dispatch` from the Actions UI — both left
# wired below purely as a manual escape hatch (e.g. cutting one ad-hoc GitHub
# Release for an external announcement), never as part of the automated
# pipeline. Do NOT reintroduce a dispatch of this file from deploy.yml or
# promotion-deploy-bridge.yml — that would be re-adding the retired #1963
# minter tests/test-versioning-pipeline.js now asserts is gone.
#
# PURPOSE (when manually invoked):
# Creates a GitHub Release for a version tag (v*). TWO triggers:
#   - `on: push: tags: v*` — a HUMAN-pushed tag fires this directly.
#   - `workflow_dispatch` — lets a human re-run it by hand (e.g. `--ref
#     v1.2.0`) without having to push/re-push a tag; every step below works
#     unchanged either way since `github.ref_name` is the tag in both cases.
# - Extracts the release notes from CHANGELOG.md for the tagged version, falling
#   back to the `## [unreleased] — alpha` section (which, for a tag cut at the
#   moment CHANGELOG.md had no dated heading yet for that version, holds
#   exactly the right entries).
# - Marks tags containing "-beta" or "-rc" as pre-releases.
#
# HISTORY: this file automated a real pipeline stage under #1899 (unconditional
# tag-per-promotion) and #1963 (Conventional-Commits-gated tag-per-alpha-bump,
# dispatched by deploy.yml). Both are retired — #1965 replaced the tag anchor
# with the committed MAJOR.MINOR in infoAppVer.php, which needs no Release and
# no tag to exist. v1.0.0 (2026-08-24) was and remains the only tag this
# project's automation ever cut; the dead-scheme `## [1.0.0] — 2026-04-06`
# CHANGELOG.md heading this step's version-specific match still has to coexist
# with is a historical artefact, not something new automation will collide
# with again — there is no more automation cutting tags at all.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'          # a HUMAN-pushed tag still fires this directly
  workflow_dispatch: {} # promotion-deploy-bridge dispatches on the tag ref —
                        # a GITHUB_TOKEN tag push cannot fire `on: push` (#1899)

# Cancel any in-progress release for the same tag
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository to access CHANGELOG.md and assets
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Step 2: Extract the version number from the tag
      # Strips the leading 'v' prefix (e.g., v1.2.3 -> 1.2.3)
      # -----------------------------------------------------------------------
      - name: Extract version from tag
        id: tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, Version: $VERSION"

      # -----------------------------------------------------------------------
      # Step 3: Determine if this is a pre-release
      # Tags containing "-beta" or "-rc" are marked as pre-releases
      # -----------------------------------------------------------------------
      - name: Check for pre-release
        id: prerelease
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if echo "$TAG" | grep -qiE '\-beta|\-rc'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "This is a pre-release."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "This is a stable release."
          fi

      # -----------------------------------------------------------------------
      # Step 4: Extract release notes from CHANGELOG.md
      # Finds the section matching this version and extracts all content until
      # the next version heading. If no `## [<version>]` section exists yet
      # (the normal case for a fresh auto-cut tag — #1963 mints the tag on ALPHA
      # inside deploy.yml and rolls the `## [<version>]` heading in a SEPARATE
      # `[skip ci]` commit AFTER the tag, so the tagged commit itself still holds
      # the entries under unreleased), fall back to the
      # `## [unreleased] — alpha` section, which at the tagged commit holds
      # exactly this release's entries. The fallback matches LOWERCASE
      # `[unreleased]` only, so historical `## [Unreleased]` headings never
      # match (#1899).
      # -----------------------------------------------------------------------
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          CHANGELOG="CHANGELOG.md"
          NOTES_FILE="/tmp/release_notes.md"

          if [ ! -f "$CHANGELOG" ]; then
            echo "No CHANGELOG.md found. Using default release notes."
            echo "Release ${VERSION}" > "$NOTES_FILE"
          else
            # Extract the section for this version
            # Matches from "## [VERSION]" to the next "## [" or end of file
            python3 -c "
          import re, sys

          version = '${VERSION}'
          with open('${CHANGELOG}', 'r') as f:
              content = f.read()

          # Escape dots in version for regex
          escaped = re.escape(version)
          pattern = rf'## \[{escaped}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)

          if not match:
              # Fallback: the unreleased section (which at the tagged ALPHA commit
              # holds exactly this release's entries — deploy.yml rolls the
              # released heading on alpha in a separate commit AFTER the tag, #1963).
              # Lowercase '[unreleased]' ONLY — a historical
              # '## [Unreleased]' (capital U) must not match (#1899).
              pattern = r'## \[unreleased\][^\n]*\n(.*?)(?=\n## \[|\Z)'
              match = re.search(pattern, content, re.DOTALL)

          if match:
              notes = match.group(1).strip()
              print(notes)
          else:
              print(f'Release {version}')
          " > "$NOTES_FILE"
          fi

          echo "Release notes:"
          cat "$NOTES_FILE"

          # Store the path for the next step
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Step 5: Create the GitHub Release
      # Uses the gh CLI to create the release with extracted notes.
      # #1630 — this used to also attach data/songs.json as a release asset,
      # republishing the stale corpus publicly on every tag. Removed with
      # the file itself (#1617); MySQL is the only source of truth now.
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          PRERELEASE="${{ steps.prerelease.outputs.is_prerelease }}"
          NOTES_FILE="${{ steps.notes.outputs.notes_file }}"

          # Build the gh release command
          GH_ARGS=(
            "release" "create" "$TAG"
            "--title" "iHymns $TAG"
            "--notes-file" "$NOTES_FILE"
          )

          # Mark as pre-release if applicable
          if [ "$PRERELEASE" = "true" ]; then
            GH_ARGS+=("--prerelease")
          fi

          echo "Creating release: gh ${GH_ARGS[*]}"
          gh "${GH_ARGS[@]}"

          echo "Release $TAG created successfully."
