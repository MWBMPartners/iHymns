#
# PURPOSE:
# Runs linting and validation checks on every push and pull request.
# - ESLint for JavaScript files
# - PHP syntax checking (php -l) for PHP files
# - JSON validation for data/songs.json and manifest.json
# - HTMLHint for HTML files
#
# Only runs when relevant files are changed (JS, CSS, PHP, HTML).
# =============================================================================

name: CI Lint & Validation

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'appWeb/**/*.js'
      - 'appWeb/**/*.css'
      - 'appWeb/**/*.php'
      - 'appWeb/**/*.html'
      - 'package.json'
      - 'package-lock.json'
      - '.eslintrc*'
      - 'eslint.config.*'

  # PRs intentionally have NO paths filter — see #851. Branch protection
  # on `alpha` requires this workflow as a status check; skipping the
  # workflow on workflow-only / docs-only PRs leaves the required check
  # in a permanent "not satisfied" state and deadlocks auto-merge. Each
  # lint step internally early-exits with "skipping" when its target file
  # set is empty, so running unconditionally here is cheap and keeps the
  # required check satisfiable on every PR shape.
  pull_request: {}

# Cancel any in-progress CI run on the same branch / PR
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest

    # Skip CI automation commits
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      # -----------------------------------------------------------------------
      # Step 1: Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2: Setup Node.js 22 for JavaScript linting tools
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # -----------------------------------------------------------------------
      # Step 3: Install npm dependencies
      # Only runs if package.json exists. Uses `npm ci` for reproducible builds
      # when a lock file is present, otherwise falls back to `npm install`.
      # -----------------------------------------------------------------------
      - name: Install npm dependencies
        run: |
          if [ -f "package.json" ]; then
            if [ -f "package-lock.json" ]; then
              echo "Installing dependencies with npm ci (lock file found)."
              npm ci
            else
              echo "Installing dependencies with npm install (no lock file)."
              npm install
            fi
          else
            echo "No package.json found. Skipping npm install."
          fi

      # -----------------------------------------------------------------------
      # Step 4: Run ESLint on JavaScript files
      # Checks for a local ESLint config first. If none exists, runs ESLint
      # with a sensible default configuration via npx.
      # -----------------------------------------------------------------------
      - name: Lint JavaScript (ESLint)
        run: |
          JS_DIR="appWeb/public_html/js"

          # Check if there are any JS files to lint
          JS_FILES=$(find "$JS_DIR" -name '*.js' -type f 2>/dev/null || true)
          if [ -z "$JS_FILES" ]; then
            echo "No JavaScript files found in $JS_DIR. Skipping ESLint."
            exit 0
          fi

          # Check for local ESLint configuration
          HAS_CONFIG=false
          for config in .eslintrc .eslintrc.js .eslintrc.cjs .eslintrc.json .eslintrc.yml eslint.config.js eslint.config.mjs eslint.config.cjs; do
            if [ -f "$config" ]; then
              HAS_CONFIG=true
              break
            fi
          done

          if [ "$HAS_CONFIG" = true ]; then
            echo "ESLint config found. Running ESLint with project config."
            npx eslint "$JS_DIR" --no-error-on-unmatched-pattern
          else
            echo "No ESLint config found. Running ESLint with default config via npx."
            npx eslint@latest "$JS_DIR" --no-error-on-unmatched-pattern || {
              echo "::warning::ESLint exited with errors. Review the output above."
              # Don't fail the build if there's no config — this is advisory
              exit 0
            }
          fi

      # -----------------------------------------------------------------------
      # Step 5a: Detect literal PHP open tags inside HTML comments / backticks
      #
      # PHP doesn't respect HTML-comment boundaries — it parses every `<?`
      # open-tag it finds. A documentation comment like `<?= json_encode(...) ?>`
      # is therefore evaluated as live PHP at request time. On PHP 8.1+ the
      # `(...)` is first-class callable syntax, so `json_encode(...)` returns
      # a Closure and the `<?=` then fatals trying to echo it, halting output
      # mid-stream and leaving the browser with a truncated HTML response.
      # This took down alpha in PR #536 (commit 96cd14a) — see
      # `.claude/project-rules.md` §9 for the full incident note.
      # -----------------------------------------------------------------------
      - name: Detect embedded PHP open tags in HTML comments / backticks
        run: |
          echo "Scanning .php files for literal '<?' inside backticks or HTML comments..."
          MATCHES=$(grep -rnP '`[^`]*<\?|<!--[^>]*<\?' appWeb --include='*.php' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Found literal PHP open tags inside HTML comments or backticks. PHP will parse and execute these at runtime — see .claude/project-rules.md §9."
            echo "$MATCHES" | while IFS= read -r line; do
              # Re-emit each match as a GitHub annotation pinned to the file:line
              FILE=$(echo "$line" | cut -d: -f1)
              LINE=$(echo "$line" | cut -d: -f2)
              echo "::error file=$FILE,line=$LINE::Literal PHP open tag in comment/backtick — will be parsed at runtime"
            done
            exit 1
          fi
          echo "OK: no embedded PHP tags inside HTML comments or backticks."

      # -----------------------------------------------------------------------
      # Step 5: Run PHP syntax check on all PHP files
      # Uses `php -l` (lint mode) to check for parse errors
      # -----------------------------------------------------------------------
      - name: Lint PHP (syntax check)
        run: |
          echo "Running PHP syntax checks..."
          ERRORS=0

          # Find all PHP files in both beta and production directories
          PHP_FILES=$(find appWeb/ -name '*.php' -type f 2>/dev/null || true)

          if [ -z "$PHP_FILES" ]; then
            echo "No PHP files found. Skipping PHP lint."
            exit 0
          fi

          while IFS= read -r file; do
            if ! php -l "$file" 2>&1 | grep -q "No syntax errors"; then
              echo "::error file=$file::PHP syntax error in $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done <<< "$PHP_FILES"

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS PHP file(s) have syntax errors."
            exit 1
          else
            echo "All PHP files passed syntax check."
          fi

      # -----------------------------------------------------------------------
      # Step 5b: Migration registry sanity
      # Asserts (1) every entry in $migrationOrder has a matching
      # $migrationProbes entry, and (2) no probe is hardcoded to
      # `=> true`. Both regressions are silent at runtime — the
      # symptom only surfaces as "Apply all pending migrations" never
      # reaching 0 on the Database Setup page.
      # -----------------------------------------------------------------------
      - name: Migration registry sanity
        run: |
          echo "Running migration-registry sanity test..."
          php tests/php/test-migration-registry.php

      # -----------------------------------------------------------------------
      # Step 5c: Schema-coverage drift guard
      # Asserts every table / column created by an appWeb/.sql/migrate-*.php
      # script is also declared in appWeb/.sql/schema.sql. Catches the
      # "migration adds it but schema.sql never picks it up" class of
      # drift that the Schema Audit page (#518) surfaces at runtime as
      # "Orphan in DB".
      # -----------------------------------------------------------------------
      - name: Schema-coverage drift guard
        run: |
          echo "Running schema-coverage drift guard..."
          php tests/php/test-schema-coverage.php

      # -----------------------------------------------------------------------
      # Step 5d: Id-preserving lyric-line diff (#1235 P2b)
      # Asserts the pure matching logic in includes/lyric_lines_sync.php keeps a
      # line's Id (and its FK'd timing / translations / annotations) across an
      # edit. A regression here silently orphans per-line enrichment on the next
      # save, which is invisible until enrichment data exists — so guard it now.
      # -----------------------------------------------------------------------
      - name: Lyric-line diff (Id preservation)
        run: |
          echo "Running lyric-line Id-preserving diff test..."
          php tests/php/test-lyric-lines-diff.php

      # -----------------------------------------------------------------------
      # Step 5e: Per-line enrichment validators (#1235 P3 / #1088)
      # Guards the shared translation/annotation write layer's pure validators
      # (vocab allow-lists, code-point offset bounds, BCP47) the editor + native
      # API both rely on.
      # -----------------------------------------------------------------------
      - name: Line enrichment validators
        run: |
          echo "Running per-line enrichment validator test..."
          php tests/php/test-line-enrichment.php

      # -----------------------------------------------------------------------
      # Step 5f: Line-first assembler (#1235 P4 / C1)
      # Pins the pure component-assembly core that rebuilds a song from the
      # authoritative tblLyricLines. Its output must match SongData::_getComponents()
      # byte-for-byte — the read switch (P4b) is a clean delegation only if it does.
      # -----------------------------------------------------------------------
      - name: Line-first assembler (P4 C1)
        run: |
          echo "Running line-first assembler test..."
          php tests/php/test-lyric-lines-read.php

      # -----------------------------------------------------------------------
      # tblSongComponents JSON-payload column guard (#1235 P4 / C5). Fails when a
      # raw LinesJson / NotesJson / LanguagesJson reference on tblSongComponents
      # appears outside a column-existence-gated or `lines-json-fallback`-marked
      # site — those columns are retired in P4d/C6 and a surviving raw reference
      # throws under MYSQLI_REPORT_STRICT.
      # -----------------------------------------------------------------------
      - name: Component JSON-payload column guard (P4 C5)
        run: |
          echo "Running tblSongComponents JSON-column guard..."
          php tests/php/test-component-json-guard.php

      - name: Hard-key counterpart auto-promoter planner (#1125)
        run: |
          echo "Running auto-link hard-id planner test..."
          php tests/php/test-auto-link-hard-id.php

      - name: ChordPro importer (incl. #1126 chord retention)
        run: |
          echo "Running ChordPro importer test..."
          php tests/php/test-chordpro-parser.php

      - name: Per-action content-gating matcher (#1120)
        run: |
          echo "Running content-access action-matcher test..."
          php tests/php/test-content-access-action.php

      - name: OpenLyrics importer enrichment (#1130)
        run: |
          echo "Running OpenLyrics importer enrichment test..."
          php tests/php/test-openlyrics-parser.php

      # -----------------------------------------------------------------------
      # Step 6: Validate JSON files
      # Checks that critical JSON files are valid using Node.js
      # Validates: data/songs.json, manifest.json (in both beta and production)
      # -----------------------------------------------------------------------
      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          ERRORS=0

          # List of JSON files to validate
          JSON_FILES=(
            "data/songs.json"
            "appWeb/public_html/manifest.json"
            "appWeb/public_html/manifest.json"
          )

          for file in "${JSON_FILES[@]}"; do
            if [ -f "$file" ]; then
              if node -e "JSON.parse(require('fs').readFileSync('$file', 'utf8'))" 2>/dev/null; then
                echo "  PASS: $file"
              else
                echo "::error file=$file::Invalid JSON in $file"
                echo "  FAIL: $file"
                ERRORS=$((ERRORS + 1))
              fi
            else
              echo "  SKIP: $file (not found)"
            fi
          done

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS JSON file(s) are invalid."
            exit 1
          else
            echo "All JSON files are valid."
          fi

      # -----------------------------------------------------------------------
      # Step 7: Run HTMLHint on HTML files
      # Uses HTMLHint to check for common HTML issues
      # Only runs if HTML files exist in the web directories
      # -----------------------------------------------------------------------
      - name: Lint HTML (HTMLHint)
        run: |
          HTML_FILES=$(find appWeb/public_html/ -name '*.html' -type f 2>/dev/null || true)

          if [ -z "$HTML_FILES" ]; then
            echo "No HTML files found. Skipping HTMLHint."
            exit 0
          fi

          echo "Running HTMLHint on HTML files..."

          # Check if htmlhint is available locally, otherwise use npx
          if command -v htmlhint &>/dev/null || npx htmlhint --version &>/dev/null; then
            npx htmlhint appWeb/public_html/**/*.html || {
              echo "::warning::HTMLHint found issues. Review the output above."
              # Non-blocking — HTML lint issues are advisory
              exit 0
            }
          else
            echo "::warning::HTMLHint not available. Skipping HTML lint."
          fi

  # ===========================================================================
  # PHP forward-compat matrix (#1200) — actually runs the PHP lint + the PHP
  # test suite on the SUPPORTED interpreter versions: 8.4 (backward-compat
  # floor) and 8.5 (project target, per ProjectBrief). Catches syntax that only
  # breaks on a newer PHP, on every push/PR (this workflow's existing triggers).
  #
  # Deliberately a SEPARATE job from `lint` (not a matrix ON `lint`): the `lint`
  # job's name "Lint & Validate" is a REQUIRED status check on alpha branch
  # protection. Adding a matrix would rename it to "Lint & Validate (8.4)" /
  # "(8.5)", orphaning the required check and soft-locking auto-merge (see
  # .claude/CLAUDE.md CI lesson #1). This job is additive + non-blocking until
  # someone adds "PHP 8.4" / "PHP 8.5" to alpha's required checks in repo Settings.
  # ===========================================================================
  php-compat:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # Same embedded-PHP-tag guard as the lint job — re-run per interpreter so
      # a tag that only fatals on a newer PHP is still caught (#536 incident).
      - name: Detect embedded PHP open tags in HTML comments / backticks
        run: |
          echo "Scanning .php files for literal '<?' inside backticks or HTML comments..."
          MATCHES=$(grep -rnP '`[^`]*<\?|<!--[^>]*<\?' appWeb --include='*.php' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Found literal PHP open tags inside HTML comments or backticks (see .claude/project-rules.md §9)."
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no embedded PHP tags inside HTML comments or backticks."

      - name: Lint PHP (php -l) on PHP ${{ matrix.php }}
        run: |
          echo "Running php -l on all appWeb PHP under $(php -r 'echo PHP_VERSION;')..."
          ERRORS=0
          PHP_FILES=$(find appWeb/ -name '*.php' -type f 2>/dev/null || true)
          if [ -z "$PHP_FILES" ]; then echo "No PHP files found."; exit 0; fi
          while IFS= read -r file; do
            if ! php -l "$file" 2>&1 | grep -q "No syntax errors"; then
              echo "::error file=$file::PHP syntax error in $file"
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done <<< "$PHP_FILES"
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::$ERRORS PHP file(s) failed php -l on this interpreter."
            exit 1
          fi
          echo "All PHP files parse cleanly on $(php -r 'echo PHP_VERSION;')."

      - name: Migration registry sanity
        run: php tests/php/test-migration-registry.php

      - name: Schema-coverage drift guard
        run: php tests/php/test-schema-coverage.php

      - name: Lyric-line diff (Id preservation)
        run: php tests/php/test-lyric-lines-diff.php

      - name: Line enrichment validators
        run: php tests/php/test-line-enrichment.php

      - name: Line-first assembler (P4 C1)
        run: php tests/php/test-lyric-lines-read.php

      - name: Component JSON-payload column guard (P4 C5)
        run: php tests/php/test-component-json-guard.php

      - name: Hard-key counterpart auto-promoter planner (#1125)
        run: php tests/php/test-auto-link-hard-id.php

      - name: ChordPro importer (incl. #1126 chord retention)
        run: php tests/php/test-chordpro-parser.php

      - name: Per-action content-gating matcher (#1120)
        run: php tests/php/test-content-access-action.php

      - name: OpenLyrics importer enrichment (#1130)
        run: php tests/php/test-openlyrics-parser.php
