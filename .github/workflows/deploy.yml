# =============================================================================
# iHymns — Deploy via SFTP
#
# Copyright © 2026 MWBM Partners Ltd. All rights reserved.
# This software is proprietary.
#
# PURPOSE:
# Deploys the iHymns web PWA via SFTP, modelled on the phpWhoIs/DomainCheckr
# deployment pipeline.
#
# SINGLE SOURCE DIRECTORY:
# All branches deploy from appWeb/public_html/ — the branch determines
# which SFTP remote path the files are uploaded to:
#   main   → appWeb/public_html/ → SFTP_LIVE_PATH  (production)
#   beta   → appWeb/public_html/ → SFTP_BETA_PATH  (beta)
#   alpha  → appWeb/public_html/ → SFTP_DEV_PATH   (alpha/dev)
#
# Shared data directory scaffolding (.htaccess guards) is deployed from
# appWeb/data_share/ → remote data_share/ (sibling to public_html). The
# songs.json corpus cache was decommissioned in WS-J #1020 (all reads are
# live MySQL), so no song data is staged here any more.
#
# FLOW:
#   1. Inject build metadata and channel into deploy source
#   2. Minify JS/CSS/HTML before upload
#   3. Upload via lftp (SSH key or password auth)
#   4. Upload data_share/ scaffolding alongside public_html
#
# SECRETS REQUIRED:
#   SFTP_HOST, SFTP_PORT, SFTP_USER, SFTP_KEY (or SFTP_PASSWORD)
#   SFTP_LIVE_PATH, SFTP_BETA_PATH, SFTP_DEV_PATH
#
# VARIABLES:
#   vars.SFTP_ENABLED — set to 'true' to enable deployment (kill switch)
#
# SPECIAL COMMIT FLAGS:
#   [deploy all]  — force full deploy regardless of change detection
#   [skip ci]     — skip this workflow entirely
# =============================================================================

name: Deploy via SFTP

on:
  push:
    branches:
      - main
      - beta
      - alpha
    paths:
      - 'appWeb/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Serialise deploys PER BRANCH (#1595).
#
# ELI5: only one upload to a given site at a time — the next one waits its turn.
#
# The deploy step runs `lftp ... mirror --reverse --delete`. Two concurrent
# delete-mode mirrors against the same docroot can interleave destructively:
# run A enumerates the remote, run B uploads a file, then A's --delete pass —
# working from its now-stale listing — removes it. The symptom is a file that
# silently "didn't deploy", with both runs reporting success.
#
# Alpha is where this is most likely, because it auto-merges: two PRs going
# green minutes apart is routine and the mirror takes longer than that. #1596
# makes it certain rather than likely, by dispatching a second deploy after
# each version bump.
#
# `cancel-in-progress: false` is LOAD-BEARING and is the opposite of the right
# setting for apple.yml. Cancelling a superseded *build* is free; cancelling a
# half-finished --delete *mirror* can leave the docroot with files deleted and
# their replacements never uploaded. Deploys must QUEUE, never cancel.
#
# Grouped by ref_name, not globally: alpha / beta / main target different hosts
# and have no reason to block one another.
# https://docs.github.com/actions/using-jobs/using-concurrency
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ===========================================================================
  # DEPLOY — Upload appWeb/public_html/ to the appropriate SFTP destination
  # All branches deploy from the same source directory; the branch determines
  # which remote path the files are uploaded to.
  # ===========================================================================
  deploy:
    runs-on: ubuntu-latest
    # Hard cap so a stalled SFTP mirror cannot hang for the full 6h Actions
    # ceiling (two runs hung at "Making directory .well-known" until cancelled).
    timeout-minutes: 20
    if: vars.SFTP_ENABLED == 'true'

    # Shared lftp exclude flags — available to all steps via $LFTP_EXCLUDES.
    #
    # ⚠️ `^data/audio/` + `^data/music/` are LOAD-BEARING (#1584). The docroot
    # mirror runs `--reverse --delete`, and the song audio (`/data/audio/<SongId>.mp3`,
    # api.php) and sheet music (`/data/music/`) live on the SERVER only — git tracks
    # zero files under `appWeb/public_html/data/`. Without these two excludes the
    # mirror deletes the entire media library on every deploy.
    #
    # This became sharper with #1583: the What's New step now GENERATES
    # `public_html/data/whats-new.md` before the mirror runs, so `data/` exists
    # locally and lftp descends into it — turning a whole-directory removal into a
    # surgical delete of audio/ and music/ while keeping whats-new.md. Both excludes
    # are therefore scoped to the two media subdirectories, NOT a blanket `^data/`,
    # which would stop What's New deploying at all.
    #
    # Verified with real lftp 4.9.2 against a local file:/ mirror using this exact
    # flag set. Do not remove without re-running that check.
    #
    # IMPORTANT: patterns with wildcards MUST be single-quoted here in YAML
    # so they are passed as literal strings to the shell env, and then
    # referenced inside double-quoted heredocs/commands where bash won't
    # glob-expand them (variable expansion within double quotes is safe).
    env:
      LFTP_EXCLUDES: >-
        --exclude ^\.DS_Store$
        --exclude ^Thumbs\.db$
        --exclude ^\.git/
        --exclude ^\.github/
        --exclude ^\.gitkeep$
        --exclude ^\.gitignore$
        --exclude ^\.gitattributes$
        --exclude ^README\.md$
        --exclude ^DEV_NOTES\.md$
        --exclude ^CLAUDE\.md$
        --exclude ^\.htpasswd
        --exclude ^\.vscode/
        --exclude ^\.idea/
        --exclude \.xcodeproj$
        --exclude \.xcworkspace$
        --exclude ^\.xcuserdata/
        --exclude \.sublime-project$
        --exclude \.sublime-workspace$
        --exclude ^\.editorconfig$
        --exclude \.swp$
        --exclude \.swo$
        --exclude ~$
        --exclude ^data/audio/
        --exclude ^data/music/

    steps:
      # -- Checkout code --
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      # -- lftp connection timeouts (global ~/.lftprc, inherited by every lftp
      #    call below) so a stalled SFTP op retries/fails fast instead of hanging.
      #    Two prior runs hung 6h at "Making directory .well-known"; this plus the
      #    job timeout-minutes prevent that recurring. --
      - name: Configure lftp timeouts
        run: |
          {
            echo "set net:timeout 20"
            echo "set net:max-retries 3"
            echo "set net:reconnect-interval-base 5"
            echo "set net:reconnect-interval-multiplier 1"
            echo "set mirror:no-empty-dirs yes"
          } >> "$HOME/.lftprc"

      # -- Determine which directory to deploy based on branch --
      - name: Determine deployment target
        id: target
        run: |
          # All branches deploy from the same source directory
          echo "source_dir=appWeb/public_html/" >> $GITHUB_OUTPUT
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "remote_path=${{ secrets.SFTP_LIVE_PATH }}" >> $GITHUB_OUTPUT
            echo "channel=live" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "beta" ]]; then
            echo "remote_path=${{ secrets.SFTP_BETA_PATH }}" >> $GITHUB_OUTPUT
            echo "channel=beta" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "alpha" ]]; then
            echo "remote_path=${{ secrets.SFTP_DEV_PATH }}" >> $GITHUB_OUTPUT
            echo "channel=alpha" >> $GITHUB_OUTPUT
          fi

      # -- Check if deployable files changed in the last 5 commits --
      - name: Get changed files
        id: changes
        run: |
          SOURCE_DIR="${{ steps.target.outputs.source_dir }}"
          EXCLUDES="README\.md|DEV_NOTES\.md|CLAUDE\.md|\.DS_Store|Thumbs\.db|\.gitkeep|\.gitignore|\.gitattributes|\.vscode|\.idea|\.xcodeproj|\.xcworkspace|\.xcuserdata|\.editorconfig|\.sublime-"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")

          # Force full deploy if commit message contains [deploy all]
          if echo "$COMMIT_MSG" | grep -q "\[deploy all\]"; then
            echo "Full deploy requested via [deploy all]"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "full_deploy=true" >> $GITHUB_OUTPUT
            # Drop --only-newer so lftp mirror compares size+content
            # rather than mtime — mtime alone is unreliable in CI
            # because actions/checkout sets every file's mtime to the
            # checkout time, which can be EARLIER than the remote's
            # prior-deploy mtime if the previous deploy ran later
            # than this one's checkout step. That's the failure mode
            # that left #919's setup-database.php diff stranded on
            # the runner during deploy 280 even though the diff
            # itself was real (the file got [deploy all]'d in #920
            # and STILL didn't upload because that flag was being
            # ignored). With --only-newer dropped, lftp re-uploads
            # any file whose size or content differs.
            echo "mirror_newer_flag=" >> $GITHUB_OUTPUT
          else
            # Check last 5 commits for changes in the source directory OR
            # the sibling directories we also deploy (.sql, .auth).
            CHANGED=$(git diff --name-only HEAD~5 HEAD -- "$SOURCE_DIR" "appWeb/.sql/" "appWeb/.auth/" 2>/dev/null \
              | grep -vE "$EXCLUDES" | sort -u || true)

            if [[ -z "$CHANGED" ]]; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "full_deploy=false" >> $GITHUB_OUTPUT
              echo "mirror_newer_flag=" >> $GITHUB_OUTPUT
              echo "No deployable files changed in $SOURCE_DIR"
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "full_deploy=false" >> $GITHUB_OUTPUT
              # NEVER --only-newer: actions/checkout stamps every file with the
              # checkout mtime, so --only-newer wrongly SKIPS a file whose remote
              # copy carries a later (prior-deploy) mtime — that silently stranded
              # lyric_lines_sync.php (#1235), and setup-database.php before it
              # (#919/#920). Empty flag => lftp mirror compares size+content and
              # uploads anything new OR changed. Slower (~2.5m) but correct.
              echo "mirror_newer_flag=" >> $GITHUB_OUTPUT
              echo "Changed files:"
              echo "$CHANGED"
            fi
          fi

      # WS-J #1020: the songs.json corpus file cache was decommissioned — every
      # read is live MySQL now (slim songs_index for the PWA, load_index /
      # load_song / songbook_export for the editor + songbook bundles), so there
      # is no songs.json to stage into data_share/song_data/ on deploy.

      # -- Inject .env-channel file for server-side environment detection --
      # Since all branches deploy from the same source directory, the PHP code
      # uses this file as a fallback to detect the deployment channel.
      - name: Inject .env-channel
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "${{ steps.target.outputs.channel }}" > appWeb/public_html/.env-channel
          echo "Injected .env-channel: ${{ steps.target.outputs.channel }}"

      # -- Extract What's New excerpt from CHANGELOG.md (#1583, reshaped #1589) --
      #
      # ELI5: copy the newest handful of changelog bullets — a few from each
      # of the last few releases — into a small file the website shows on its
      # "What's New" page.
      #
      # includes/pages/whats-new.php reads appWeb/public_html/data/whats-new.md
      # (via markdown_lite.php's escape-first renderer) and falls back to a
      # themed "no data yet" card when the file is absent — so this step is
      # deliberately best-effort: a missing CHANGELOG.md (or an empty extract)
      # must never fail the deploy, it just means visitors see the fallback
      # card until the next deploy that does have one.
      #
      # #1589 — WHY THIS IS ENTRY-BASED AND NO LONGER SECTION-BASED.
      # The original implementation took the first THREE top-level `## `
      # sections and hard-capped the result at 48 KB. That silently stopped
      # working once the changelog grew: `## [unreleased] — alpha` alone
      # reached 70,627 bytes, so the 48 KB byte-cap landed *inside section
      # one* — testers saw a single giant blob, truncated mid-sentence, that
      # never reached a second release at all. A section-count budget cannot
      # bound output size, because a section has no bounded size.
      #
      # So the unit of extraction is now the ENTRY (a top-level `- ` bullet
      # plus its indented continuation lines), with three independent caps:
      #
      #   PER_SECTION  — at most N entries per release heading. This is the
      #                  cap that GUARANTEES more than one release appears,
      #                  however lopsided the changelog is. Without it a
      #                  single fat section eats the whole budget again.
      #   MAX_SECTIONS — at most N release headings, counted on headings
      #                  actually EMITTED (an empty `## [unreleased] — alpha`,
      #                  which is exactly what version-bump.yml's rollover
      #                  leaves behind, must not burn a slot).
      #   MAX_BYTES    — the same 48 KB budget, but now enforced BEFORE an
      #                  entry is written rather than by cutting bytes after
      #                  the fact, so output always ends on an entry boundary.
      #
      # `^## ` only matches a TWO-hash heading — a `### ` sub-heading's 3rd
      # character is `#`, not a space — so sub-headings are never miscounted
      # as a new release, same as before. A heading is buffered and printed
      # LAZILY, only when one of its entries is actually emitted, so a
      # release with nothing under it never leaves an orphan heading on the
      # page. The one deliberate escape hatch: the very first entry is
      # emitted even if it alone exceeds MAX_BYTES (`total > 0 &&`), because
      # an over-cap excerpt that `head -c` then trims is strictly better than
      # an empty file and the fallback card.
      #
      # LC_ALL=C is load-bearing, not decoration: awk's length() counts
      # CHARACTERS in a UTF-8 locale and BYTES in the C locale, and the
      # budget being enforced is a byte budget (whats-new.md is full of
      # em-dashes and emoji). Ubuntu runners ship mawk as /usr/bin/awk, which
      # is byte-based anyway, but pinning the locale means the arithmetic is
      # identical under gawk too — and under the local test harness.
      # https://www.gnu.org/software/gawk/manual/html_node/String-Functions.html
      #
      # H1 (adversarial-review finding, still applies): `head -c` cuts on a
      # BYTE boundary, which can land mid-way through a multi-byte UTF-8
      # character. It is now a BACKSTOP rather than the primary trim — the
      # awk budget above should mean it never fires — but it is kept because
      # the escape hatch and any future changelog shape can still overshoot.
      # `iconv -f UTF-8 -t UTF-8 -c` re-validates the cut output and drops
      # (`-c`) any incomplete trailing sequence the byte-cap left behind, so
      # the file this step writes is always well-formed UTF-8 — belt-and-
      # braces on top of markdown_lite.php's own ENT_SUBSTITUTE fix (H1's
      # other half) and whats-new.php's empty-render fallback, not a
      # replacement for either. ENT_SUBSTITUTE depends on never being handed
      # invalid UTF-8, so this pipe stage must not be removed.
      # iconv exits non-zero specifically when the LAST bytes of its input
      # are an incomplete sequence (exactly the case a byte-cap produces)
      # even though it still writes the trimmed-clean output — `|| true`
      # keeps that expected, already-handled condition from failing the
      # deploy step, consistent with "must never fail the deploy" above;
      # stderr is left unsuppressed so the (harmless) warning is still
      # visible in the run log for debugging.
      # https://www.gnu.org/software/libiconv/documentation/libiconv/iconv.1.html
      #
      # Covered by tests/test-whats-new-extraction.js, which lifts THIS awk
      # program out of THIS file and runs it against the real CHANGELOG.md —
      # so the test cannot drift from the deployed logic by copying it.
      - name: Extract What's New from CHANGELOG.md
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          SOURCE_DIR="${{ steps.target.outputs.source_dir }}"
          WHATS_NEW_DIR="${SOURCE_DIR}data"
          WHATS_NEW_FILE="${WHATS_NEW_DIR}/whats-new.md"
          WHATS_NEW_MAX_BYTES=49152
          WHATS_NEW_MAX_SECTIONS=5
          WHATS_NEW_PER_SECTION=10
          WHATS_NEW_MAX_ENTRIES=50

          if [[ ! -f "CHANGELOG.md" ]]; then
            echo "CHANGELOG.md not found — skipping What's New extraction (whats-new.php renders its fallback card)"
          else
            mkdir -p "$WHATS_NEW_DIR"
            LC_ALL=C awk \
              -v MAX_BYTES="$WHATS_NEW_MAX_BYTES" \
              -v MAX_SECTIONS="$WHATS_NEW_MAX_SECTIONS" \
              -v PER_SECTION="$WHATS_NEW_PER_SECTION" \
              -v MAX_ENTRIES="$WHATS_NEW_MAX_ENTRIES" '
              # Emit the buffered entry (and, lazily, its heading) if every
              # budget still allows it. Locals are declared as extra params —
              # the portable awk idiom for function-scoped variables.
              function flush(   h, need) {
                if (pending == "") return
                # Trailing blank lines belong to the gap BEFORE the next
                # entry/heading, not to this entry: collapse them so the
                # byte accounting matches what is actually printed.
                sub(/\n+$/, "\n", pending)
                pendingBytes = length(pending)
                # Per-section and overall entry caps: drop, but keep reading —
                # a later section is still allowed to contribute.
                if (total >= MAX_ENTRIES || secEntries >= PER_SECTION) { pending = ""; return }
                # Heading cap counts headings EMITTED, so an empty section
                # (e.g. a freshly rolled-over `## [unreleased] — alpha`)
                # costs nothing. Nothing older can qualify: stop.
                if (!headingEmitted && heading != "" && emitted >= MAX_SECTIONS) { pending = ""; exit }
                h = (headingEmitted || heading == "") ? "" : ((bytes > 0 ? "\n" : "") heading)
                need = length(h) + pendingBytes
                # Byte budget, checked BEFORE writing so the file always ends
                # on an entry boundary. `total > 0` is the escape hatch: never
                # emit an empty file just because entry #1 is oversized.
                if (total > 0 && bytes + need > MAX_BYTES) { pending = ""; exit }
                if (h != "") { printf "%s", h; bytes += length(h); headingEmitted = 1; emitted++ }
                printf "%s", pending
                bytes += pendingBytes
                total++; secEntries++
                pending = ""
              }
              # A release heading. Buffered, not printed — see flush().
              /^## / { flush(); heading = $0 "\n\n"; headingEmitted = 0; secEntries = 0; next }
              # A top-level entry starts here; the previous one is complete.
              /^- /  { flush(); pending = $0 "\n"; next }
              # Anything else (indented sub-bullets, wrapped prose, blank
              # lines) is a continuation of the entry in hand. Lines before
              # the first entry are dropped, as in the original.
                     { if (pending != "") pending = pending $0 "\n" }
              END    { flush() }
            ' "CHANGELOG.md" | head -c "$WHATS_NEW_MAX_BYTES" \
              | iconv -f UTF-8 -t UTF-8 -c > "$WHATS_NEW_FILE" || true
            echo "Extracted What's New excerpt: $(wc -c < "$WHATS_NEW_FILE") bytes, $(grep -c '^## ' "$WHATS_NEW_FILE" || true) releases, $(grep -c '^- ' "$WHATS_NEW_FILE" || true) entries -> $WHATS_NEW_FILE"
          fi

      # -- Populate vendor/ for PWA offline-fallback (#354 / #526) --
      # The local vendor/ files are referenced by the onerror fallback
      # handlers in index.php for every CDN-loaded library (Bootstrap,
      # FontAwesome, jQuery, Animate.css). If a CDN fails (or the user
      # is offline before the CDN ever cached), the SW serves these
      # local copies. The directory is generated, not committed —
      # tools/download-vendor.sh is the source of truth.
      - name: Populate vendor libraries for offline fallback
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          bash tools/download-vendor.sh

      - name: Install minification tools
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          npm install -g terser clean-css-cli html-minifier-terser

      # -- Minify JS, CSS, HTML, XML before upload --
      - name: Minify files before upload
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          SOURCE_DIR="${{ steps.target.outputs.source_dir }}"

          # Minify JavaScript files
          find "$SOURCE_DIR" -name "*.js" -type f 2>/dev/null | while read -r file; do
            echo "Minifying JS: $file"
            terser "$file" --compress --mangle --output "$file" || echo "  Warning: failed to minify $file"
          done

          # Minify CSS files
          find "$SOURCE_DIR" -name "*.css" -type f 2>/dev/null | while read -r file; do
            echo "Minifying CSS: $file"
            cleancss -o "$file" "$file" || echo "  Warning: failed to minify $file"
          done

          # Minify HTML files
          find "$SOURCE_DIR" \( -name "*.html" -o -name "*.htm" \) -type f 2>/dev/null | while read -r file; do
            echo "Minifying HTML: $file"
            html-minifier-terser --collapse-whitespace --remove-comments --minify-css true --minify-js true -o "$file" "$file" || echo "  Warning: failed to minify $file"
          done

          # Minify XML files (strip whitespace between tags)
          find "$SOURCE_DIR" -name "*.xml" -type f 2>/dev/null | while read -r file; do
            echo "Minifying XML: $file"
            sed -i 's/>[[:space:]]*</></g' "$file" || echo "  Warning: failed to minify $file"
          done

      # -- For production: clear the Development Status to NULL --
      - name: Set production dev status to NULL
        if: steps.changes.outputs.has_changes == 'true' && github.ref_name == 'main'
        run: |
          VERFILE="${{ steps.target.outputs.source_dir }}includes/infoAppVer.php"
          if [[ -f "$VERFILE" ]]; then
            sed -i 's/\["Development"\]\["Status"\] = ".*"/["Development"]["Status"] = NULL/' "$VERFILE"
            echo "Set Development Status to NULL in $VERFILE"
          fi

      # -- Inject git commit info into infoAppVer.php --
      - name: Inject build info into infoAppVer.php
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          SOURCE_DIR="${{ steps.target.outputs.source_dir }}"
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
          COMMIT_DATE=$(git log -1 --format="%cd" --date=format:"%Y-%m-%d %H:%M:%S")
          REPO_URL="https://github.com/${{ github.repository }}"
          VERFILE="${SOURCE_DIR}includes/infoAppVer.php"
          if [[ -f "$VERFILE" ]]; then
            sed -i "s|\[\"Commit\"\]\[\"SHA\"\]\[\"Full\"\] = NULL|\[\"Commit\"\]\[\"SHA\"\]\[\"Full\"\] = \"${COMMIT_SHA}\"|" "$VERFILE"
            sed -i "s|\[\"Commit\"\]\[\"SHA\"\]\[\"Short\"\] = NULL|\[\"Commit\"\]\[\"SHA\"\]\[\"Short\"\] = \"${SHORT_SHA}\"|" "$VERFILE"
            sed -i "s|\[\"Commit\"\]\[\"Date\"\] = NULL|\[\"Commit\"\]\[\"Date\"\] = \"${COMMIT_DATE}\"|" "$VERFILE"
            sed -i "s|\[\"Commit\"\]\[\"URL\"\] = NULL|\[\"Commit\"\]\[\"URL\"\] = \"${REPO_URL}/commit/${COMMIT_SHA}\"|" "$VERFILE"
            echo "Injected build info into infoAppVer.php - ${SHORT_SHA} @ ${COMMIT_DATE}"
          fi

      # -- Sync manifest.json name/description from infoAppVer.php --
      - name: Sync manifest.json from infoAppVer.php
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          SOURCE_DIR="${{ steps.target.outputs.source_dir }}"
          VERFILE="${SOURCE_DIR}includes/infoAppVer.php"
          MANIFEST="${SOURCE_DIR}manifest.json"
          if [[ -f "$VERFILE" && -f "$MANIFEST" ]]; then
            APP_NAME=$(grep -oP '\["Name"\] = "\K[^"]+' "$VERFILE" | head -1)
            APP_DESC=$(grep -oP '\["Synopsis"\] = "\K[^"]+' "$VERFILE")
            if [[ -n "$APP_NAME" ]]; then
              sed -i "s|\"name\": \"[^\"]*\"|\"name\": \"${APP_NAME}\"|" "$MANIFEST"
              sed -i "s|\"short_name\": \"[^\"]*\"|\"short_name\": \"${APP_NAME}\"|" "$MANIFEST"
              echo "Manifest name set to: ${APP_NAME}"
            fi
            if [[ -n "$APP_DESC" ]]; then
              sed -i "s|\"description\": \"[^\"]*\"|\"description\": \"${APP_DESC}\"|" "$MANIFEST"
              echo "Manifest description synced from infoAppVer.php"
            fi
          fi

      # -- Install lftp for SFTP mirroring --
      - name: Install lftp
        if: steps.changes.outputs.has_changes == 'true'
        run: sudo apt-get install -y lftp

      # -- Resolve SFTP port (default to 22 if empty, blank, or non-numeric) --
      - name: Resolve SFTP port
        if: steps.changes.outputs.has_changes == 'true'
        id: port
        env:
          RAW_PORT: ${{ secrets.SFTP_PORT }}
        run: |
          # Strip whitespace from the raw port value
          TRIMMED_PORT=$(echo "$RAW_PORT" | tr -d '[:space:]')

          # Check if the trimmed value is a valid numeric port (1-65535)
          if [[ "$TRIMMED_PORT" =~ ^[0-9]+$ ]] && [[ "$TRIMMED_PORT" -ge 1 ]] && [[ "$TRIMMED_PORT" -le 65535 ]]; then
            echo "port=$TRIMMED_PORT" >> $GITHUB_OUTPUT
            echo "Using SFTP port: $TRIMMED_PORT"
          else
            echo "port=22" >> $GITHUB_OUTPUT
            echo "SFTP_PORT is empty, blank, or non-numeric — defaulting to port 22"
          fi

      # -- Determine auth method (SSH key preferred, password fallback) --
      - name: Check auth method
        if: steps.changes.outputs.has_changes == 'true'
        id: auth
        run: |
          if [[ -n "${{ secrets.SFTP_KEY }}" ]]; then
            echo "method=key" >> $GITHUB_OUTPUT
          else
            echo "method=password" >> $GITHUB_OUTPUT
          fi

      # -- Deploy via SFTP using SSH key authentication --
      - name: Deploy via SFTP (SSH key)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'key'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SOURCE_DIR: ${{ steps.target.outputs.source_dir }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
        run: |
          mkdir -p ~/.ssh
          echo "$SFTP_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > /tmp/lftp_script.txt <<LFTP_EOF
          set sftp:connect-program "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key -p ${SFTP_PORT}"
          open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}
          mirror --reverse --delete --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs $LFTP_EXCLUDES ${SOURCE_DIR} ${REMOTE_PATH}
          bye
          LFTP_EOF
          lftp -f /tmp/lftp_script.txt

      # -- Deploy via SFTP using password authentication (fallback) --
      - name: Deploy via SFTP (password)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'password'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          SOURCE_DIR: ${{ steps.target.outputs.source_dir }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
        run: |
          lftp -u "${SFTP_USER},${SFTP_PASS}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; \
            mirror --reverse --delete --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs \
            $LFTP_EXCLUDES \
            ${SOURCE_DIR} ${REMOTE_PATH}; bye" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}"

      # ================================================================
      # PRIVATE_HTML DEPLOYMENT
      # Uploads appWeb/private_html/ to its own SFTP directory.
      # Runs alongside the public deployment when private files changed.
      # ================================================================

      # WS-J #1020: the legacy private_html editor's songs.json copy is gone —
      # the Song Editor is DB-direct (load_index / load_song / load_songs).

      # -- Check if private_html/ files changed --
      - name: Check private_html changes
        id: private_changes
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          if echo "$COMMIT_MSG" | grep -q "\[deploy all\]"; then
            echo "has_private_changes=true" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff --name-only HEAD~5 HEAD -- "appWeb/private_html/" 2>/dev/null \
              | grep -vE '\.DS_Store|\.gitkeep|\.gitignore|\.htpasswd' | sort -u || true)
            if [[ -z "$CHANGED" ]]; then
              echo "has_private_changes=false" >> $GITHUB_OUTPUT
            else
              echo "has_private_changes=true" >> $GITHUB_OUTPUT
              echo "Private files changed:"
              echo "$CHANGED"
            fi
          fi

      # -- Deploy private_html/ via SFTP (SSH key) --
      - name: Deploy private_html via SFTP (SSH key)
        if: >-
          steps.private_changes.outputs.has_private_changes == 'true'
          && steps.auth.outputs.method == 'key'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_PATH: ${{ secrets.SFTP_PRIVATE_PATH }}
        run: |
          # Skip if SFTP_PRIVATE_PATH is not configured
          if [[ -z "$REMOTE_PATH" ]]; then
            echo "SFTP_PRIVATE_PATH not set — skipping private_html deployment"
            exit 0
          fi
          cat > /tmp/lftp_private.txt <<LFTP_EOF
          set sftp:connect-program "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key -p ${SFTP_PORT}"
          open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}
          mirror --reverse --delete --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs $LFTP_EXCLUDES appWeb/private_html/ ${REMOTE_PATH}
          bye
          LFTP_EOF
          lftp -f /tmp/lftp_private.txt
          echo "Private HTML deployed to ${REMOTE_PATH}"

      # -- Deploy private_html/ via SFTP (password) --
      - name: Deploy private_html via SFTP (password)
        if: >-
          steps.private_changes.outputs.has_private_changes == 'true'
          && steps.auth.outputs.method == 'password'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          REMOTE_PATH: ${{ secrets.SFTP_PRIVATE_PATH }}
        run: |
          # Skip if SFTP_PRIVATE_PATH is not configured
          if [[ -z "$REMOTE_PATH" ]]; then
            echo "SFTP_PRIVATE_PATH not set — skipping private_html deployment"
            exit 0
          fi
          lftp -u "${SFTP_USER},${SFTP_PASS}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; \
            mirror --reverse --delete --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs \
            $LFTP_EXCLUDES \
            appWeb/private_html/ ${REMOTE_PATH}; bye" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}"
          echo "Private HTML deployed to ${REMOTE_PATH}"

      # ================================================================
      # DATA_SHARE DEPLOYMENT (#154)
      # Uploads appWeb/data_share/ (songs.json + shared setlists) to the
      # server. The remote path is derived from the main deploy path
      # (sibling directory). Uses --no-delete to preserve server-side
      # shared setlist JSON files that are not in the repository.
      # ================================================================

      # -- Deploy data_share/ via SFTP (SSH key) --
      - name: Deploy data_share via SFTP (SSH key)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'key'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
        run: |
          # Derive data_share remote path from the deploy target path
          # e.g., /home/user/public_html/ → /home/user/data_share/
          DATA_SHARE_PATH=$(dirname "$REMOTE_PATH")/data_share/
          echo "Deploying data_share to: $DATA_SHARE_PATH"
          cat > /tmp/lftp_datashare.txt <<LFTP_EOF
          set sftp:connect-program "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key -p ${SFTP_PORT}"
          open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}
          mirror --reverse --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs $LFTP_EXCLUDES appWeb/data_share/ ${DATA_SHARE_PATH}
          bye
          LFTP_EOF
          lftp -f /tmp/lftp_datashare.txt
          echo "Data share deployed to ${DATA_SHARE_PATH}"

      # -- Deploy data_share/ via SFTP (password) --
      - name: Deploy data_share via SFTP (password)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'password'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
        run: |
          DATA_SHARE_PATH=$(dirname "$REMOTE_PATH")/data_share/
          echo "Deploying data_share to: $DATA_SHARE_PATH"
          lftp -u "${SFTP_USER},${SFTP_PASS}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; \
            mirror --reverse --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs \
            $LFTP_EXCLUDES \
            appWeb/data_share/ ${DATA_SHARE_PATH}; bye" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}"
          echo "Data share deployed to ${DATA_SHARE_PATH}"

      # ================================================================
      # .sql/ DEPLOYMENT (#272)
      # Uploads appWeb/.sql/ (installer, migrators, schema.sql) to the
      # server as a sibling of public_html/. This allows the web-based
      # setup dashboard at /manage/setup-database.php to find and
      # require the scripts without exposing them to the public web.
      # ================================================================

      # -- Deploy .sql/ via SFTP (SSH key) --
      - name: Deploy .sql via SFTP (SSH key)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'key'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
        run: |
          SQL_PATH=$(dirname "$REMOTE_PATH")/.sql/
          echo "Deploying .sql to: $SQL_PATH"
          cat > /tmp/lftp_sql.txt <<LFTP_EOF
          set sftp:connect-program "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key -p ${SFTP_PORT}"
          open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}
          mirror --reverse --delete --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs $LFTP_EXCLUDES appWeb/.sql/ ${SQL_PATH}
          bye
          LFTP_EOF
          lftp -f /tmp/lftp_sql.txt
          echo ".sql deployed to ${SQL_PATH}"

      # -- Deploy .sql/ via SFTP (password) --
      - name: Deploy .sql via SFTP (password)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'password'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
        run: |
          SQL_PATH=$(dirname "$REMOTE_PATH")/.sql/
          echo "Deploying .sql to: $SQL_PATH"
          lftp -u "${SFTP_USER},${SFTP_PASS}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; \
            mirror --reverse --delete --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs \
            $LFTP_EXCLUDES \
            appWeb/.sql/ ${SQL_PATH}; bye" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}"
          echo ".sql deployed to ${SQL_PATH}"

      # ================================================================
      # POST-DEPLOY: bust PHP OPcache (#1290)
      # On this shared FPM host, OPcache can serve STALE bytecode across a
      # deploy even with opcache.validate_timestamps=on, so freshly-uploaded
      # PHP doesn't run until the cache is reset (this caused the songs_json
      # 's.SongbookName' flood + the editor CSRF mismatch). Curl the token-
      # guarded /opcache-bust.php so new code goes live immediately.
      # No-op (logs a notice, never fails the deploy) until OPCACHE_BUST_KEY
      # is set AND the matching ../.auth/opcache_bust_key.php exists on the host.
      # ================================================================
      - name: Bust PHP OPcache (post-deploy)
        if: steps.changes.outputs.has_changes == 'true'
        env:
          OPCACHE_KEY: ${{ secrets.OPCACHE_BUST_KEY }}
          CHANNEL: ${{ steps.target.outputs.channel }}
        run: |
          if [[ -z "$OPCACHE_KEY" ]]; then
            echo "::notice::OPCACHE_BUST_KEY secret not set — skipping OPcache bust. Set it (and ../.auth/opcache_bust_key.php on the host) to enable automatic post-deploy cache busting (#1290)."
            exit 0
          fi
          case "$CHANNEL" in
            alpha) BASE="https://dev.ihymns.app" ;;
            beta)  BASE="https://beta.ihymns.app" ;;
            live)  BASE="https://ihymns.app" ;;
            *)     echo "::notice::Unknown channel '$CHANNEL' — skipping OPcache bust."; exit 0 ;;
          esac
          echo "Busting OPcache at ${BASE}/opcache-bust.php"
          HTTP=$(curl -fsS -o /tmp/opcache_resp.json -w '%{http_code}' \
            -H "X-OPcache-Key: ${OPCACHE_KEY}" \
            --max-time 30 "${BASE}/opcache-bust.php" || true)
          echo "HTTP ${HTTP}"
          cat /tmp/opcache_resp.json 2>/dev/null || true
          echo
          if [[ "$HTTP" != "200" ]]; then
            echo "::warning::OPcache bust returned HTTP ${HTTP} (deploy still succeeded; new code may lag until the cache evicts). 503=key not configured on host; 403=key mismatch."
          fi

      # ================================================================
      # .auth/ DEPLOYMENT (#272)
      # Uploads appWeb/.auth/ (.htaccess, db_credentials.example.php)
      # as a sibling of public_html/. The real db_credentials.php is
      # written by the Setup dashboard at runtime and MUST be preserved,
      # so we use --no-delete and exclude db_credentials.php from the
      # mirror. This ensures the directory exists and is writable by
      # the web user, without clobbering real credentials.
      #
      # Also excludes secrets_master_key.php (#1466) — the secret-
      # encryption master key. It is seeded separately (see the two
      # "Seed secret-encryption master key" steps below) and must never
      # be overwritten by this mirror, so a manual key rotation via SFTP
      # always survives the next deploy.
      # ================================================================

      # -- Deploy .auth/ via SFTP (SSH key) --
      - name: Deploy .auth via SFTP (SSH key)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'key'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
        run: |
          AUTH_PATH=$(dirname "$REMOTE_PATH")/.auth/
          echo "Deploying .auth to: $AUTH_PATH (excluding db_credentials.php, secrets_master_key.php)"
          cat > /tmp/lftp_auth.txt <<LFTP_EOF
          set sftp:connect-program "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key -p ${SFTP_PORT}"
          open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}
          mirror --reverse --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs --exclude ^db_credentials\.php$ --exclude ^secrets_master_key\.php$ $LFTP_EXCLUDES appWeb/.auth/ ${AUTH_PATH}
          bye
          LFTP_EOF
          lftp -f /tmp/lftp_auth.txt
          echo ".auth deployed to ${AUTH_PATH}"

      # -- Deploy .auth/ via SFTP (password) --
      - name: Deploy .auth via SFTP (password)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'password'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
        run: |
          AUTH_PATH=$(dirname "$REMOTE_PATH")/.auth/
          echo "Deploying .auth to: $AUTH_PATH (excluding db_credentials.php, secrets_master_key.php)"
          lftp -u "${SFTP_USER},${SFTP_PASS}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; \
            mirror --reverse --verbose ${{ steps.changes.outputs.mirror_newer_flag }} --no-empty-dirs \
            --exclude ^db_credentials\.php$ --exclude ^secrets_master_key\.php$ $LFTP_EXCLUDES \
            appWeb/.auth/ ${AUTH_PATH}; bye" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}"
          echo ".auth deployed to ${AUTH_PATH}"

      # ================================================================
      # SEED SECRET-ENCRYPTION MASTER KEY IF ABSENT (#1466)
      # Writes appWeb/.auth/secrets_master_key.php from the
      # SECRETS_MASTER_KEY GitHub Secret — but ONLY when the file does
      # not already exist on the remote host. This guarantees all 3
      # docroots seed byte-identically on first provision (the shared
      # DB requires the same key everywhere), while a manual SFTP
      # rotation of the file is NEVER overwritten (idempotent
      # seed-if-absent; see .claude/secret-encryption-strategy.md §8).
      # Optional + fail-safe: no-ops (never fails the deploy) until the
      # SECRETS_MASTER_KEY secret is set, and skips (rather than risks
      # clobbering) if remote presence can't be confirmed.
      # ================================================================

      # -- Seed secret-encryption master key if absent (SSH key) --
      - name: Seed secret-encryption master key if absent (SSH key)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'key'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
          MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
        run: |
          if [[ -z "$MASTER_KEY" ]]; then
            echo "::notice::SECRETS_MASTER_KEY not set — skipping master-key seed (values stay legacy-plaintext / feature dormant)."
            exit 0
          fi
          if [[ ! "$MASTER_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::SECRETS_MASTER_KEY must be exactly 64 hex chars (openssl rand -hex 32) — got a different shape; refusing to seed."
            exit 1
          fi
          AUTH_PATH=$(dirname "$REMOTE_PATH")/.auth/
          # Residual check-then-put TOCTOU window is benign: every branch seeds
          # the SAME value from the one SECRETS_MASTER_KEY secret, so even a
          # concurrent double-seed writes byte-identical content, and a manual
          # rotation is protected by the .auth mirror-exclude above — the
          # window cannot corrupt or diverge a key.
          cat > /tmp/lftp_check_key.txt <<LFTP_EOF
          set sftp:connect-program "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key -p ${SFTP_PORT}"
          open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}
          cls -1 ${AUTH_PATH}secrets_master_key.php
          bye
          LFTP_EOF
          set +e
          REMOTE_LISTING=$(lftp -f /tmp/lftp_check_key.txt 2>&1)
          LFTP_STATUS=$?
          set -e
          if [[ "$REMOTE_LISTING" == *"No such file"* ]]; then
            echo "No existing master key found on remote — will seed."
          elif [[ $LFTP_STATUS -eq 0 && -n "$REMOTE_LISTING" ]]; then
            echo "Master key already present — leaving manual/existing key untouched."
            exit 0
          elif [[ $LFTP_STATUS -eq 0 && -z "$REMOTE_LISTING" ]]; then
            echo "No existing master key found (empty listing) — will seed."
          else
            echo "::warning::could not verify remote key presence — skipping seed to avoid clobbering an existing key"
            exit 0
          fi
          cat > /tmp/secrets_master_key.php <<PHP_EOF
          <?php return ['active' => 'k1', 'keys' => ['k1' => '${MASTER_KEY}']];
          PHP_EOF
          cat > /tmp/lftp_seed_key.txt <<LFTP_EOF
          set sftp:connect-program "ssh -o StrictHostKeyChecking=no -i $HOME/.ssh/deploy_key -p ${SFTP_PORT}"
          open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT}
          put /tmp/secrets_master_key.php -o ${AUTH_PATH}secrets_master_key.php
          bye
          LFTP_EOF
          lftp -f /tmp/lftp_seed_key.txt || { echo "::warning::master-key seed PUT failed — file still absent, will retry on next deploy"; rm -f /tmp/secrets_master_key.php; exit 0; }
          rm -f /tmp/secrets_master_key.php
          echo "Seeded secrets_master_key.php to ${AUTH_PATH} (was absent)"

      # -- Seed secret-encryption master key if absent (password) --
      - name: Seed secret-encryption master key if absent (password)
        if: steps.changes.outputs.has_changes == 'true' && steps.auth.outputs.method == 'password'
        env:
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ steps.port.outputs.port }}
          REMOTE_PATH: ${{ steps.target.outputs.remote_path }}
          MASTER_KEY: ${{ secrets.SECRETS_MASTER_KEY }}
        run: |
          if [[ -z "$MASTER_KEY" ]]; then
            echo "::notice::SECRETS_MASTER_KEY not set — skipping master-key seed (values stay legacy-plaintext / feature dormant)."
            exit 0
          fi
          if [[ ! "$MASTER_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::SECRETS_MASTER_KEY must be exactly 64 hex chars (openssl rand -hex 32) — got a different shape; refusing to seed."
            exit 1
          fi
          AUTH_PATH=$(dirname "$REMOTE_PATH")/.auth/
          # Residual check-then-put TOCTOU window is benign: every branch seeds
          # the SAME value from the one SECRETS_MASTER_KEY secret, so even a
          # concurrent double-seed writes byte-identical content, and a manual
          # rotation is protected by the .auth mirror-exclude above — the
          # window cannot corrupt or diverge a key.
          set +e
          REMOTE_LISTING=$(lftp -u "${SFTP_USER},${SFTP_PASS}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; cls -1 ${AUTH_PATH}secrets_master_key.php; bye" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}" 2>&1)
          LFTP_STATUS=$?
          set -e
          if [[ "$REMOTE_LISTING" == *"No such file"* ]]; then
            echo "No existing master key found on remote — will seed."
          elif [[ $LFTP_STATUS -eq 0 && -n "$REMOTE_LISTING" ]]; then
            echo "Master key already present — leaving manual/existing key untouched."
            exit 0
          elif [[ $LFTP_STATUS -eq 0 && -z "$REMOTE_LISTING" ]]; then
            echo "No existing master key found (empty listing) — will seed."
          else
            echo "::warning::could not verify remote key presence — skipping seed to avoid clobbering an existing key"
            exit 0
          fi
          cat > /tmp/secrets_master_key.php <<PHP_EOF
          <?php return ['active' => 'k1', 'keys' => ['k1' => '${MASTER_KEY}']];
          PHP_EOF
          lftp -u "${SFTP_USER},${SFTP_PASS}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; put /tmp/secrets_master_key.php -o ${AUTH_PATH}secrets_master_key.php; bye" \
            "sftp://${SFTP_HOST}:${SFTP_PORT}" || { echo "::warning::master-key seed PUT failed — file still absent, will retry on next deploy"; rm -f /tmp/secrets_master_key.php; exit 0; }
          rm -f /tmp/secrets_master_key.php
          echo "Seeded secrets_master_key.php to ${AUTH_PATH} (was absent)"

      # ================================================================
      # DEPLOYMENT SUMMARY
      # ================================================================

      # -- Deployment summary in GitHub Actions UI --
      - name: Deployment summary
        if: steps.changes.outputs.has_changes == 'true' || steps.private_changes.outputs.has_private_changes == 'true'
        run: |
          echo "### ✅ Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.changes.outputs.has_changes }}" == "true" ]]; then
            echo "- **Public:** ${{ steps.target.outputs.source_dir }} → ${{ steps.target.outputs.channel }}" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "${{ steps.private_changes.outputs.has_private_changes }}" == "true" ]]; then
            echo "- **Private:** appWeb/private_html/ → private server path" >> $GITHUB_STEP_SUMMARY
          fi

      # -- No-deploy summary --
      - name: Skip summary
        if: steps.changes.outputs.has_changes == 'false' && steps.private_changes.outputs.has_private_changes == 'false'
        run: |
          echo "### ⏭️ No deployment needed" >> $GITHUB_STEP_SUMMARY
          echo "No deployable files changed." >> $GITHUB_STEP_SUMMARY
