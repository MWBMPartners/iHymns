; iHymns — PHP settings for the test container
; ============================================
;
; Dropped into the image by the Dockerfile next to this file. The official PHP
; image reads every .ini file in its conf.d folder at startup, so ANY php
; process started inside this container picks these up — see
; https://hub.docker.com/_/php ("Configuration").

; ---------------------------------------------------------------------------
; How much memory one PHP process may use.
;
; WHY THIS IS RAISED — do not trim it back
; ----------------------------------------
; The stock php:8.3-cli image allows 128 MB. A couple of this project's test
; files read large SQL files into memory (tests/php/test-ccli-resolver.php
; reads appWeb/.sql/, and it is the biggest offender), and 128 MB is simply
; not enough for them. When it runs out, the suite does not fail with a
; readable assertion — PHP kills the whole process with
;
;     Fatal error: Allowed memory size of 134217728 bytes exhausted
;
; and an exit status of 255, which reads like a broken test rather than a
; container that was never given enough room. Someone then spends an hour
; looking for a bug in the test.
;
; This has to be set HERE, in the image, rather than as a `-d memory_limit=1G`
; flag on the `php` command in tools/test-env/php. The reason is that
; tools/run-php-tests.php runs each of the ~279 suites as its OWN fresh
; process (proc_open([$php, $file], ...) — deliberately, so that suites
; declaring same-named helper functions do not collide). A command-line flag
; applies only to the process it was typed at; each child starts clean and
; re-reads its configuration from here. So a flag on the shim would raise the
; limit for the runner and leave every actual test back at 128 MB — measured,
; not assumed: the parent reported 1G and its child reported 128M.
;
; 1 GB is comfortably above what the heaviest suite needs and well under the
; container's own 2 GB cap (the `-m 2g` in tools/test-env/php), so a genuinely
; runaway test still hits a wall instead of taking the machine with it.
; https://www.php.net/manual/en/ini.core.php#ini.memory-limit
memory_limit = 1G
